<meta charset="utf-8">
<title>Transport Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument with five views. The map is a tower read bottom to top
   (foundations at the base), its subject columns grouped by side; a reading
   panel sits right and stacks below on phones. The other views are documents. */
:root {
  --bg: #eef1f3; --panel: #f8fafb; --ink: #15202a; --muted: #5c6b78; --rule: #d3dae0;
  --edge: #9aa8b4; --accent: #2d4fd6; --past: #c46a12; --future: #0c7f86;
  --proved: #2d4fd6; --imported: #8a6bd1; --postulate: #c43d5a; --conj: #c49512;
  --refuted: #7a7f86; --object: #4c8a5a; --good: #2f8a4c; --warn: #b7791f; --bad: #c43d3d;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --panel: #141b23; --ink: #dce5ec; --muted: #8b9aa8; --rule: #26313c;
  --edge: #3d4a57; --accent: #7d97ff; --past: #f0a052; --future: #3fc5cc;
  --proved: #7d97ff; --imported: #b39cf0; --postulate: #ff7d97; --conj: #e6c04f;
  --refuted: #8a9099; --object: #79c28a; --good: #5cc17f; --warn: #e3a948; --bad: #ff7b7b;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1319; --panel: #141b23; --ink: #dce5ec; --muted: #8b9aa8; --rule: #26313c;
  --edge: #3d4a57; --accent: #7d97ff; --past: #f0a052; --future: #3fc5cc;
  --proved: #7d97ff; --imported: #b39cf0; --postulate: #ff7d97; --conj: #e6c04f;
  --refuted: #8a9099; --object: #79c28a; --good: #5cc17f; --warn: #e3a948; --bad: #ff7b7b;
  color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); margin: 0;
  display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--panel); }
h1 { font: 400 26px/1 var(--display); margin: 0; white-space: nowrap; }
h1 em { color: var(--accent); }
nav.views { display: flex; gap: 2px; flex-wrap: wrap; }
nav.views a { font: 500 13px var(--body); color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; }
nav.views a[aria-current="page"] { background: var(--ink); color: var(--panel); }
nav.views a:focus-visible, .lens button:focus-visible, input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stats { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
main { flex: 1; min-height: 0; display: flex; }
section.view { flex: 1; min-height: 0; display: none; }
section.view.on { display: flex; }
/* map view */
#mapview { flex-direction: row; }
#mapcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.maptools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
.lens { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.lens button { font: 500 12px var(--body); border: 0; background: transparent; color: var(--muted); padding: 5px 9px; cursor: pointer; }
.lens button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
#search { font: 13px var(--body); padding: 5px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); width: 220px; max-width: 100%; }
.hist { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted); }
.hist input { width: 160px; }
#mapwrap { flex: 1; position: relative; min-height: 0; }
svg#map { width: 100%; height: 100%; display: block; cursor: grab; }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 6px 10px; font: 11.5px var(--body); color: var(--muted); max-width: calc(100% - 24px); }
.legend summary { cursor: pointer; font: 600 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.lg { display: grid; grid-template-columns: auto auto; gap: 3px 14px; margin-top: 6px; }
.lg .wide { grid-column: 1 / -1; white-space: normal; max-width: 46ch; }
.legend span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
aside { width: 400px; max-width: 42%; border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto;
  padding-block: 18px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); min-width: 0; }
aside h2, .doc h2 { font: 400 25px/1.15 var(--display); margin: 4px 0 10px; text-wrap: balance; }
.eyebrow { font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.chip { font: 500 11.5px var(--body); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--bg); }
.chip.good { border-color: var(--good); color: var(--good); } .chip.warn { border-color: var(--warn); color: var(--warn); }
.chip.bad { border-color: var(--bad); color: var(--bad); } .chip.muted { color: var(--muted); }
.sec { border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 12px; }
.sec h3 { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; }
.prose { max-width: 66ch; overflow-x: auto; } .prose p { margin: 0 0 8px; }
.formal { font-size: 13px; background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; }
.pending { color: var(--muted); font-style: italic; }
ul.links { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
a.ref, ul.links a { color: var(--accent); text-decoration: none; cursor: pointer; }
a.ref:hover, ul.links a:hover { text-decoration: underline; }
.k { font: 11px var(--mono); color: var(--muted); margin-right: 6px; }
.note { font-size: 12.5px; color: var(--muted); }
.flag { color: var(--warn); }
text.region { font: italic 400 18px var(--display); fill: var(--muted); }
text.side { font: 600 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; fill: var(--ink); }
text.depth { font: 10px var(--mono); fill: var(--muted); }
text.lbl { font: 9.5px var(--body); fill: var(--ink); pointer-events: none; }
/* document views */
.doc { flex: 1; overflow-y: auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.doc .inner { max-width: 980px; margin: 0 auto; }
.doc .lead { font-size: 15px; max-width: 70ch; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h3 { font: 400 20px/1.2 var(--display); margin: 0; text-wrap: balance; }
.card .row { font-size: 13px; } .card .row b { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: block; }
.tally { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.tally .t { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 14px; font-variant-numeric: tabular-nums; }
.tally .t b { font: 400 26px var(--display); display: block; }
ol.refs { counter-reset: none; padding: 0; list-style: none; display: grid; gap: 12px; margin-top: 18px; }
ol.refs li { display: grid; grid-template-columns: 3.2rem 1fr; gap: 0 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
ol.refs .n { font: 400 30px/1 var(--display); color: var(--refuted); }
ol.refs .was { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--muted); }
ol.refs .now { margin-top: 6px; }
.tl { display: grid; gap: 14px; margin-top: 18px; }
.entry { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0 16px; }
.entry .date { font: 12px var(--mono); color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; }
/* ascent machine */
.ascent { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.controls label { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.controls input[type=number] { width: 4.2em; font: 14px var(--mono); padding: 4px 6px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); }
.controls select, .btn { font: 13px var(--body); padding: 5px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.step { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
.step h3 { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 6px; color: var(--muted); }
.step.hot { border-color: var(--bad); } .step.ok { border-color: var(--good); }
.mathline { font: 14px var(--mono); overflow-x: auto; white-space: nowrap; padding: 4px 0; }
.caption { font-size: 13px; color: var(--muted); border-left: 2px solid var(--rule); padding-left: 10px; margin-top: 8px; }
@media (max-width: 800px) {
  main { flex-direction: column; } #mapview { flex-direction: column; }
  aside { width: auto; max-width: none; border-left: 0; border-top: 1px solid var(--rule); max-height: 46%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .ascent { grid-template-columns: minmax(0, 1fr); } .stats { display: none; } #search { width: 100%; }
  .entry, ol.refs li { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.nbfilter{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.nbfilter button{cursor:pointer;font:inherit;border:1px solid var(--line, #8884);background:transparent;color:inherit}
.nbfilter button.on{outline:2px solid var(--accent, #6af)}
.doclist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
#docreader{margin-top:28px}
#docreader .abstract{font-style:italic}
.docclaim{border-left:3px solid var(--accent);padding:6px 12px;margin:12px 0;overflow-wrap:anywhere}
</style>

<header>
  <h1>Transport <em>Lab</em></h1>
  <nav class="views" aria-label="Views">
    <a href="#map" data-view="map">Map</a>
    <a href="#predictions" data-view="predictions">Predictions</a>
    <a href="#refutations" data-view="refutations">Refutations</a>
    <a href="#ascent" data-view="ascent">Ascent machine</a>
    <a href="#documents" data-view="documents">Documents</a>
    <a href="#notebook" data-view="notebook">Lab notebook</a>
  </nav>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="view" id="mapview">
    <div id="mapcol">
      <div class="maptools">
        <input id="search" type="search" placeholder="Search, e.g. Hawking temperature" aria-label="Search claims">
        <div class="lens" role="group" aria-label="Colour by">
          <button id="lens-status" data-lens="status" aria-pressed="true">Status</button>
          <button id="lens-ledger" data-lens="ledger" aria-pressed="false">Ledger</button>
          <button id="lens-check" data-lens="check" aria-pressed="false">Evidence</button>
          <button id="lens-review" data-lens="review" aria-pressed="false">Review</button>
        </div>
        <label class="hist">Series up to <input id="hist" type="range" min="0" value="0" aria-label="Show the series up to this paper"> <span id="histlabel"></span></label>
      </div>
      <div id="mapwrap">
        <svg id="map" role="img" aria-label="Dependency map of the Transport Papers by subject"></svg>
        <details class="legend" id="legendbox" open><summary>Key</summary><div id="legend" class="lg"></div></details>
      </div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </section>
  <section class="view doc" id="predictionsview"><div class="inner" id="predictions"></div></section>
  <section class="view doc" id="refutationsview"><div class="inner" id="refutations"></div></section>
  <section class="view doc" id="ascentview"><div class="inner" id="ascent"></div></section>
  <section class="view doc" id="documentsview"><div class="inner" id="documents"></div></section>
  <section class="view doc" id="notebookview"><div class="inner" id="notebook"></div></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
(function () {
  const mac = {};
  for (const [k, v] of Object.entries(DATA.notation || {})) {
    const n = (v.match(/#(\d)/g) || []).map(s => +s[1]);
    mac[k] = n.length ? [v, Math.max(...n)] : v;
  }
  // ui/safe strips javascript: links and unsafe attributes from typeset maths
  window.MathJax = { loader: { load: ["ui/safe"] },
    tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["\\[", "\\]"]], macros: mac,
           packages: { "[-]": ["require", "html"] } },
    options: { safeOptions: { allow: { URLs: "none", classes: "safe", cssIDs: "safe", styles: "safe" } } },
    svg: { fontCache: "global" }, startup: { typeset: false } };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<script>
"use strict";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const typeset = el => { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {}); };
const nodes = DATA.nodes, byId = new Map(nodes.map(n => [n.id, n]));
const SUBJ = new Map(DATA.subjects.map(s => [s.key, s]));
const subjTitle = k => (SUBJ.get(k) || { title: "Unplaced" }).title;
function tex(s) {
  if (!s || String(s).trim() === "pending") return `<p class="pending">Not written yet.</p>`;
  let t = esc(s)
    .replace(/\\claimref\{([^}]+)\}/g, (m, id) => `<a class="ref" data-id="${id}">${esc((byId.get(id) || { title: id }).title)}</a>`)
    .replace(/\\(?:emph|textit)\{([^{}]*)\}/g, "<em>$1</em>").replace(/\\textbf\{([^{}]*)\}/g, "<b>$1</b>")
    .replace(/\\cite[pt]?(\[[^\]]*\])?\{([^}]+)\}/g, (m, l, k) => `<span class="note">[${k}${l ? ", " + l.slice(1, -1) : ""}]</span>`)
    .replace(/\\(?:eqref|ref)\{([^}]+)\}/g, '<span class="note">($1)</span>')
    .replace(/\\begin\{(enumerate|itemize)\}|\\end\{(enumerate|itemize)\}/g, "").replace(/\\item(\[[^\]]*\])?\s*/g, "<br>• ").replace(/~/g, " ");
  return t.split(/\n\s*\n/).map(p => `<p>${p}</p>`).join("");
}
function go(id) { location.hash = "#" + id; }
document.addEventListener("click", ev => {
  const a = ev.target.closest("[data-id]");
  if (a && byId.has(a.dataset.id)) { ev.preventDefault(); showView("map"); select(a.dataset.id, true); }
});

// ============================ MAP =====================================
const LOGICAL = new Set(["uses", "assumes", "specialises"]);
const edges = DATA.edges.filter(e => byId.has(e.src) && byId.has(e.dst));
const prem = new Map(), dept = new Map();
nodes.forEach(n => { prem.set(n.id, []); dept.set(n.id, []); });
edges.forEach(e => { if (LOGICAL.has(e.kind)) { prem.get(e.src).push(e); dept.get(e.dst).push(e); } });
const depth = new Map();
function dd(id, stack = new Set()) {
  if (depth.has(id)) return depth.get(id);
  if (stack.has(id)) return 0;
  stack.add(id); let v = 0;
  for (const e of prem.get(id)) v = Math.max(v, dd(e.dst, stack) + 1);
  stack.delete(id); depth.set(id, v); return v;
}
nodes.forEach(n => dd(n.id));
const PAPERS = DATA.papers, paperIx = new Map(PAPERS.map((p, i) => [p.code, i]));
nodes.forEach(n => { n.pix = paperIx.has((n.locators || {}).paper) ? paperIx.get(n.locators.paper) : PAPERS.length - 1; });

// layout: each side is a row of subject columns; rows stack downward
const PER = 5, GAPX = 25, SUB = 25, BAND_GAP = 26, PADC = 54, ROW_GAP = 120;
const rowsOf = {}; DATA.sides.forEach(s => { (rowsOf[s.row] = rowsOf[s.row] || []).push(s.key); });
const cell = new Map();
nodes.forEach(n => { const k = (n.subject || "none") + "|" + depth.get(n.id); (cell.get(k) || cell.set(k, []).get(k)).push(n); });
const colW = {}, layout = { rows: [] };
let yTop = 0, totalW = 0;
Object.keys(rowsOf).sort().forEach(r => {
  const sides = rowsOf[r], cols = DATA.subjects.filter(s => sides.includes(s.side));
  let maxD = 0; cols.forEach(c => nodes.forEach(n => { if (n.subject === c.key) maxD = Math.max(maxD, depth.get(n.id)); }));
  const bandRows = Array(maxD + 1).fill(1);
  cols.forEach(c => { let w = 2; for (let k = 0; k <= maxD; k++) { const m = (cell.get(c.key + "|" + k) || []).length; w = Math.max(w, Math.min(m, PER)); bandRows[k] = Math.max(bandRows[k], Math.ceil(m / PER)); } colW[c.key] = w; });
  const bandY = []; let acc = 0; for (let k = 0; k <= maxD; k++) { bandY[k] = acc; acc += bandRows[k] * SUB + BAND_GAP; }
  const h = acc; let x = 0; const colX = {};
  cols.forEach((c, i) => { if (i && cols[i - 1].side !== c.side) x += 34; colX[c.key] = x; x += colW[c.key] * GAPX + PADC; });
  totalW = Math.max(totalW, x);
  const levelY = k => yTop + h - bandY[k] - BAND_GAP / 2;
  cols.forEach(c => { for (let k = 0; k <= maxD; k++) { const list = cell.get(c.key + "|" + k) || [];
    list.sort((a, b) => (a.kind === "object") - (b.kind === "object") || a.id.localeCompare(b.id));
    const w = colW[c.key] * GAPX;
    list.forEach((n, i) => { const row = Math.floor(i / PER), inRow = Math.min(PER, list.length - row * PER), col = i % PER;
      n.x = colX[c.key] + (w - (inRow - 1) * GAPX) / 2 + col * GAPX; n.y = levelY(k) - row * SUB - SUB / 2; }); } });
  layout.rows.push({ r, cols, colX, top: yTop, h, maxD, levelY });
  yTop += h + ROW_GAP;
});
const totalH = yTop - ROW_GAP;

const LENSES = {
  status: { field: n => n.kind === "object" ? "object" : n.kind === "prediction" ? "prediction" : n.status,
    keys: [["proved", "--proved", "Proved"], ["imported", "--imported", "Imported"], ["postulate", "--postulate", "Postulate"],
      ["conjectured", "--conj", "Conjectured"], ["refuted", "--refuted", "Refuted"], ["prediction", "--future", "Prediction"],
      ["object", "--object", "Definition"], ["open", "--muted", "Open question"]] },
  ledger: { note: "Transport-essential: every recorded derivation runs through the transport principle or algorithm. Convenient: a standard route is also recorded. Absent: none does.",
    field: n => n.ledger, keys: [["essential", "--postulate", "Transport-essential"], ["convenient", "--conj", "Transport-convenient"], ["absent", "--edge", "Transport-absent"]] },
  check: { field: n => n.check, keys: [["pass-legacy", "--good", "Verify-script checks pass"], ["pass", "--good", "Own check passes"],
      ["proof-only", "--conj", "Proof text only"], ["fail", "--bad", "Check fails"], ["none", "--edge", "No evidence needed or none"]] },
  review: { field: n => n.review || "none", keys: [["typed", "--accent", "Typed"], ["draft", "--edge", "Draft"], ["reviewed", "--good", "Reviewed"]] },
};
let lens = "status", selected = null, histMax = PAPERS.length - 1, zoomK = 1;
const svg = d3.select("#map"), root = svg.append("g");
const gR = root.append("g"), gE = root.append("g"), gN = root.append("g"), gL = root.append("g");
layout.rows.forEach(R => {
  R.cols.forEach(c => {
    gR.append("rect").attr("x", R.colX[c.key] - 18).attr("y", R.top - 8).attr("width", colW[c.key] * GAPX + 36).attr("height", R.h + 16).attr("rx", 10).attr("fill", "var(--panel)").attr("stroke", "var(--rule)");
    const words = c.title.split(" "), lines = []; let cur = "";
    for (const w of words) { if ((cur + " " + w).trim().length > 14 && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
    if (cur) lines.push(cur);
    const t = gR.append("text").attr("class", "region").attr("x", R.colX[c.key] - 10).attr("y", R.top + R.h + 30);

    if (!a.some(x => !x.isZ())) html += `<p>Choose a nonzero vector.</p></div>`;
    else if (!isNull) { const inv = mvScale(v, new Q(Qv.d, Qv.n));
      html += `<p>Q(v) is not zero, so v divides: v⁻¹ = v / Q(v).</p><div class="mathline">v⁻¹ = ${mvStr(inv)}</div><div class="mathline">v v⁻¹ = ${mvStr(mvMul(v, inv, sig))}</div></div>`; }
    else html += `<p>Q(v) = 0, so v is null: a zero divisor, since v times v is zero. No algebra containing this one can invert it: if u v = 1 then v = u v v = 0.</p>${caption("transport.noinverse")}</div>`;
    if (isNull) {
      // a Witt partner w: Q(w) = 0 and B(v, w) = 1/2, so vw + wv = 1
      // w = t e + s v with B(v, w) = 1/2 and Q(w) = 0:  t = 1 / (2 B(v, e)),  s = -t Q(e) / (2 B(v, e))
      let w = null;
      for (let i = 0; i < n && !w; i++) {
        const e = [...Array(n)].map((_, j) => j === i ? ONE : ZERO), be = dot(a, e, sig);
        if (be.isZ()) continue;
        const t = new Q(be.d, 2n * be.n), Qe = dot(e, e, sig), sv = t.mul(Qe).neg().mul(new Q(be.d, 2n * be.n));
        w = e.map((x, j) => x.mul(t).add(a[j].mul(sv)));
      }
      const wv = vec(w), anti = mvAdd(mvMul(v, wv, sig), mvMul(wv, v, sig));
      html += `<div class="step"><h3>2. Diagnose and pair</h3><p>The obstruction is type N: a null vector. In mixed signature it has partners w, also null, with v w + w v = 1: together they are one fermionic mode.</p>
        <div class="mathline">w = ${mvStr(wv)}</div><div class="mathline">w w = ${mvStr(mvMul(wv, wv, sig))}</div><div class="mathline">v w + w v = ${mvStr(anti)}</div>${caption("transport.existence-locus-type-n", "one_liner")}</div>`;
      // a null rotation fixing v moves w: R = 1 + t (b v) / 2 with b orthogonal to v
      if (n >= 3) {
        // b orthogonal to v and not along it; the rotor 1 + (b v)/2 then fixes v and moves w
        let b = null;
        const notAlong = c => a.some((ai, i) => c.some((cj, j) => !ai.mul(cj).add(a[j].mul(c[i]).neg()).isZ()));
        for (let i = 0; i < n && !b; i++) for (let j = i + 1; j < n && !b; j++) {
          const c = [...Array(n)].map(() => ZERO); c[i] = a[j].mul(new Q(sig[j])); c[j] = a[i].mul(new Q(-sig[i]));
          if (c.some(x => !x.isZ()) && dot(a, c, sig).isZ() && notAlong(c)) {
            const bv = mvMul(vec(c), v, sig);
            const moved = mvAdd(mvMul(mvMul(mvAdd(new Map([[0, ONE]]), mvScale(bv, new Q(1, 2))), vec(w), sig), mvAdd(new Map([[0, ONE]]), mvScale(mvMul(v, vec(c), sig), new Q(1, 2))), sig), mvScale(vec(w), new Q(-1)));
            if (moved.size) b = c;
          } }
        if (b) {
          const bv = mvMul(vec(b), v, sig), R = mvAdd(new Map([[0, ONE]]), mvScale(bv, new Q(1, 2))), Rr = mvAdd(new Map([[0, ONE]]), mvScale(mvMul(v, vec(b), sig), new Q(1, 2)));
          const w2 = mvMul(mvMul(R, wv, sig), Rr, sig), vR = mvMul(mvMul(R, v, sig), Rr, sig);
          const anti2 = mvAdd(mvMul(v, w2, sig), mvMul(w2, v, sig));
          html += `<div class="step hot"><h3>3. No element-level repair</h3><p>A null rotation R that fixes v moves the partner to another partner. Partners form an affine family that these rotations translate, with no fixed point, so no partner can be chosen consistently with the symmetry.</p>
            <div class="mathline">R v R̃ = ${mvStr(vR)}</div><div class="mathline">R w R̃ = ${mvStr(w2)}</div><div class="mathline">v (R w R̃) + (R w R̃) v = ${mvStr(anti2)}</div>${caption("transport.no-go-level-elements")}</div>`;
        }
      } else html += `<div class="step"><h3>3. The exception</h3><p>In two dimensions the partner is unique once v is fixed, so the plane is already complete. From three dimensions on there is a whole family of partners, and no consistent choice among them.</p></div>`;
      const wi = Math.min(p, q);
      html += `<div class="step ok"><h3>4. Ascend</h3><p>The transport adds one hyperbolic plane, a direction of each sign: Cl(${p},${q}) becomes Cl(${p + 1},${q + 1}), dimension ${2 ** n} becomes ${2 ** (n + 2)}. The repair is delivered on the space of points, and the Witt index, the number of fermionic modes the algebra can hold, rises from ${wi} to ${wi + 1}.</p>${caption("transport.minimality")}${caption("tower.witt-index-quantum-capacity", "one_liner")}</div>`;
    }
    el.querySelector("#steps").innerHTML = html; typeset(el.querySelector("#steps"));
  }
  coefInputs();
}

// ============================ DOCUMENTS ================================
const DOC_LABEL = { theorem: "Theorem", fact: "Fact (imported)", postulate: "Postulate",
  conjecture: "Conjecture", refutation: "Refutation", prediction: "Prediction", definition: "Definition" };
function renderDocuments() {
  const docs = DATA.documents || [];
  document.getElementById("documents").innerHTML = `<div class="eyebrow">Generated from the store</div>
    <h2>Documents</h2>
    <p class="lead">Each document is assembled from a recipe: a spine of results, a level, and where to stop. It is stored, and when the claims under it change it is regenerated against the stored version, so unchanged passages stay word for word and every change is logged.</p>
    <div class="doclist">${docs.map(d => `<article class="card doccard"><div class="eyebrow">${esc(d.level || "")} level · version ${d.version}</div>
      <h3><a class="ref" href="#doc:${esc(d.id)}">${esc(d.title)}</a></h3>
      <div class="row"><b>Contents</b>${d.claims} results from the store, ${d.spine.length} on the spine</div>
      <div class="row"><b>History</b>${d.history.map(h => `v${h.v} <span class="note">${esc(h.bump)}, ${esc(h.date)}</span>`).join(" · ") || "v1"}</div>
      <div class="row"><b>Audit</b>${Object.entries(d.audit).map(([c, n]) => `${esc(c)} ×${n}`).join(", ") || "clean"}</div></article>`).join("")}</div>
    <div id="docreader"></div>`;
}
function openDoc(id) {
  if (!rendered.documents) { rendered.documents = true; renderDocuments(); }
  const d = (DATA.documents || []).find(x => x.id === id); if (!d) return;
  const tex = t => esc(String(t || "").replace(/\s*\[\[(?:c:[^\]]+|t)\]\]/g, ""))
    .replace(/\\claimref\{([^}]+)\}/g, (m, id) => `<a class="ref" data-id="${id}">${esc(byId.has(id) ? byId.get(id).title : id)}</a>`)
    .replace(/\\(?:emph|textit)\{([^{}]*)\}/g, "<em>$1</em>")
    .replace(/\\textbf\{([^{}]*)\}/g, "<b>$1</b>")
    .replace(/\\cite[pt]?(?:\[([^\]]*)\])?\{([^}]+)\}/g, (m, loc, k) => `<span class="note">[${k.replace(/,/g, ", ")}${loc ? ", " + loc.replace(/~/g, " ") : ""}]</span>`)
    .replace(/\\(?:label|ref|eqref)\{[^}]*\}/g, "")
    .replace(/~/g, " ");
  const strip = tex;
  const html = d.blocks.map(b => {
    if (b.type === "abstract") return `<p class="abstract"><b>Abstract.</b> ${strip(b.text)}</p>`;
    if (b.type === "section") return `<h3>${esc(b.title)}</h3>`;
    if (b.type === "framing" || b.type === "transition") return `<p>${strip(b.text)}</p>`;
    const cid = (b.claim || "").split("@")[0];
    return `<div class="docclaim"><b>${esc(b.label || DOC_LABEL[b.type] || b.type)} ${esc(b.number || "")}</b> <a class="ref" data-id="${esc(cid)}">${esc(b.title)}</a>. ${tex(b.text)}${b.provenance ? `<div class="note">Provenance: ${tex(b.provenance)}</div>` : ""}</div>`;
  }).join("");
  const r = document.getElementById("docreader");
  r.innerHTML = `<div class="eyebrow">Reading</div><h2>${esc(d.title)}</h2>${html}`;
  r.querySelectorAll("a.ref[data-id]").forEach(a => a.onclick = () => { location.hash = a.dataset.id; });
  typeset(r); r.scrollIntoView({ behavior: "smooth" });
}

// ============================ VIEWS ====================================
const rendered = {};
function showView(v) {
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.id === v + "view"));
  document.querySelectorAll("nav.views a").forEach(a => a.setAttribute("aria-current", a.dataset.view === v ? "page" : "false"));
  if (v === "map") { fit(); }
  if (!rendered[v]) { rendered[v] = true; ({ predictions: renderPredictions, refutations: renderRefutations, notebook: renderNotebook, ascent: renderAscent, documents: renderDocuments })[v]?.(); }
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (byId.has(h)) { showView("map"); select(h, true); return; }
  if (h.startsWith("doc:")) { showView("documents"); openDoc(h.slice(4)); return; }
  showView(["predictions", "refutations", "ascent", "notebook", "documents"].includes(h) ? h : "map");
}
window.addEventListener("hashchange", route);
document.getElementById("stats").textContent = DATA.summary.short;
try { const l = localStorage.getItem("tl-lens"); if (l && LENSES[l]) document.querySelector(`[data-lens="${l}"]`).click(); } catch (e) {}
if (window.innerWidth < 800) document.getElementById("legendbox").open = false;
window.addEventListener("resize", () => { if (document.getElementById("mapview").classList.contains("on")) fit(); });
select(null, false); route();
</script>
