functions:
  check_no_order_parameter_in_a_sector:
    kind: sampled
    clauses: ["(i)", "(iv)(c)"]
    omits: "n_b = 2, 3: <x, P x> = <x, P* x> = 0 for one rational vector x in every sector (N_a, N_c); the degenerate couplings (n_b, n) = (2, 0), (3, 1), (4, 1): E(n) = E(n+1) strictly below the other band levels and <P> = (n+1)(n_b - n)|psi_n|^2 on psi_n + psi_{n+1}; the orthogonality argument and general n_b are the proof"
  check_variational_bounds_on_every_sector:
    kind: sampled
    clauses: ["(ii)", "(iii)"]
    omits: "n_b = 2, 3 at four (K, G) and four H_0 = K N + L(N_a - N_c)^2 + R D commuting with P, every sector: the lowest level certified exactly (shifted sector matrix positive semidefinite and singular), one lowest vector from the kernel, both Rayleigh quotients equal to +-(2K + G c) and bounding the neighbouring sector energies, 208 quotients in all, second difference at most 2G; general H_0, X and sectors are the proof"
  check_single_shell_rotor_and_uniform_channel:
    kind: sampled
    clauses: ["(iv)", "(iv)(a)", "(iv)(b)"]
    omits: "eleven (n_b, K, G) with n_b = 2, 3, 4 (condensed, symmetric, at the threshold, K = 0): E(n) = G(n - gamma)^2 - G gamma^2, the band minimum is the ground energy on the whole Fock space (every shifted sector matrix positive semidefinite), psi_{n*} is an eigenvector, the rotor values G(1 +- 2(n* - gamma)) in [0, 2G], (P + P*) psi_{n*} in the span of the two neighbours with the quasi-spin weights, ratio to G n_b at most 2/n_b; symmetric phase: bound pair at 2K - G n_b below the level 2K, every other sector positive; general n_b is the proof"
  check_collective_limit_at_fixed_gap:
    kind: sampled
    clauses: ["(iv)(a)"]
    omits: "closed-form band at E = 5, K = 3, G = 2E/n_b for n_b = 4..60: n* interior and within 1/2 of gamma, rotor at most 4E/n_b with the two differences summing to 4E/n_b, decreasing, 1/3 at n_b = 60; the limit statement is the proof"
