functions:
  check_identities_hold_for_every_lambda:
    kind: sampled
    clauses: ["(i) Q(I) = B^2 = -Q(W) = d, <W, I> = 0, sigma = 1 - Lambda Q(x)/12, the basis of I-perp and its squares, half ad_B on the plane and its kernel, omega central with omega^2 = d and omega'^2 = -d"]
    omits: "eleven values of Lambda of both signs and five square classes, three points x; general Lambda is the proof's polynomial identities"
  check_with_h_every_construction_is_over_the_base_field:
    kind: sampled
    clauses: ["(iii) the witnesses for Lambda = 3H^2: v, v*, u = B/H, e_W = W/H, eigenvalues -H and H, R_h = 1/H, kappa = H, the slice point (2/H) e1 with sigma = 2 and areal radius R_h, the orthonormal basis of I-perp, the central idempotents and the mirror's unit"]
    omits: "five rational H; general H is the proof's computation"
  check_lambda_over_three_must_be_a_square:
    kind: sampled
    clauses: ["(ii) b to j imply a: the reductions Q(a e0 + b W) = a^2 - d b^2, (cB)^2 = c^2 d, Q(cW) = -c^2 d, R^2 = 1/d, r^2 = 4/d, the characteristic polynomial t^2 - d, and the two-dimensional centre"]
    omits: "eight values of Lambda with d not a rational square, squareness decided exactly; the centre computed at Lambda = 6 and 7/3"
  check_the_quadratic_extension_supplies_what_is_missing:
    kind: sampled
    clauses: ["(ii) a implies b to g over a quadratic extension span{1, u} containing a square root of d"]
    omits: "four values of Lambda with the extension of discriminant class 2, 7, 3, 2"
  check_lambda_seven_thirds_sphere_has_no_rational_point:
    kind: complete
    clauses: ["(iv) the bifurcation sphere of Lambda = 7/3 has no rational point: the reduction to A^2 + B^2 + C^2 = 7 D^2 and the descent modulo 8 and 4; the rational point e1 + e2 of the sphere at Lambda = 6"]
    omits: "the residue tables modulo 8 and 4 are complete; the direct search (D <= 15) is supporting only"
  check_lambda_six_centres_are_other_quadratic_fields:
    kind: complete
    clauses: ["(iv) at Lambda = 6 the centres span{1, omega} (omega^2 = 2) and span{1, omega'} (omega'^2 = -2) are fields, and the second is not the centre of Cl(4,1)"]
    omits: "the isomorphism equation is checked as a polynomial identity on a grid; the impossibility is the exact squareness test of -1 and 1/2"
  check_similar_to_the_standard_form_iff_sum_of_two_squares:
    kind: sampled
    clauses: ["(v)(b) the similarity T for d = a^2 + b^2, its determinant through the pseudoscalar, the discriminant step, the one-dimensional cancellation by a reflection versor, and the failure for d = 3 by descent modulo 3"]
    omits: "six sums of two squares, three pairs of vectors for the reflection; the residue table modulo 3 is complete, the search (c <= 24) supporting"
  check_the_mirror_needs_minus_one_not_a_square:
    kind: sampled
    clauses: ["(v)(c) over span{1, u}, u^2 = -1, with H rational, (1 + u omega'/H)/2 is a central idempotent of the mirror's algebra"]
    omits: "two values of H"
  check_rescaling_by_root_lambda_needs_root_three:
    kind: sampled
    clauses: ["(v)(d) W/sqrt|Lambda| has square -sgn(Lambda)/3 and the central squares differ from those of Cl(2,3) and Cl(1,4) by the factor 1/3; over span{1, u}, u^2 = 3, the form becomes standard; W/H has square -1 or +1 with no root of 3"]
    omits: "five Lambda with |Lambda| a square and five Lambda = 3H^2 or -3H'^2"
  check_anti_de_sitter_datum:
    kind: sampled
    clauses: ["(v)(e) for Lambda = -3H'^2: u = B/H' with u^2 = -1, Q(W/H') = 1, omega^2 = -1 on the normalised basis, and the plane definite"]
    omits: "two values of H' and a grid of plane vectors; Lambda = -1 as the failing case"
  check_operator_join_scale_needs_root_two:
    kind: sampled
    clauses: ["(v)(f) lambda = H^2/2 is not a rational square, s^2 = u/H solves lambda s^4 = 1 over span{1, u}, u^2 = 2, and the stored sample points have sqrt(lambda) rational and Lambda/3 not a square"]
    omits: "three rational H and the two stored sample points"
