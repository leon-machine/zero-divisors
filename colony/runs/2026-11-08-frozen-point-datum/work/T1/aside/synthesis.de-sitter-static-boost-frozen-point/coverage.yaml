functions:
  check_stabiliser_and_square:
    kind: sampled
    clauses: [(i)]
    omits: 'Exact Cl(2,4) arithmetic at eight values of Lambda (both signs and zero): Q(I) = Lambda/3, <W,I> = 0, Q(W) = -Lambda/3, W = V/Q(V) at x = 0, [B, I] = 0 and B^2 = Lambda/3; the identities are polynomial of low degree in Lambda, so the eight values determine them, but this is not argued in the check.'
  check_killing_field_norm_and_chart_velocity:
    kind: exact
    clauses: [(ii)]
    omits: The grid (three Lambda, five values of each coordinate) exceeds the degrees of Q(xi) and dx, as the docstring argues, so Q(xi) = (1 + Lambda Q(x)/12)^2 - (Lambda/3) x_0^2 = Q(dx) and the stated velocity dx are established as identities; the physical-norm statement on x = r e_1 is in the next function.
  check_static_slice_norm:
    kind: sampled
    clauses: [(ii)]
    omits: 'On x = r e_1: sigma = 1 + Lambda r^2/12 and g(xi,xi) = 1 - (Lambda/3) R^2 with R = r/sigma at six radii and four Lambda; the cleared identity is a polynomial of degree at most 4 in r and 2 in Lambda, so the samples would determine it, but the check does not argue this; the one sample with sigma = 0 is skipped as stated.'
  check_horizon_surface_gravity_and_bifurcation_sphere:
    kind: sampled
    clauses: [(iii)]
    omits: 'H = 1, 2, 1/3: kappa = |f''(R_h)|/2 = H (f typed in), kappa^2 = B^2 = Q(I), u^2 = +1, B = H u, dx = 0 and sigma = 2 on the sphere Q(x) = -12/Lambda in three directions, the Jacobian [[0,H],[H,0]] on the normal plane and zero along the sphere, and sigma = 0 at x = +-(2/H) e_0; that these are the only fixed points where sigma != 0, and the Euclidean-section period 2 pi/kappa (smoothness iff), are not computed (the docstring says the latter is the premise''s analytic argument).'
  check_zero_and_negative_lambda:
    kind: sampled
    clauses: [(iv)]
    omits: 'Lambda = 0: B = e_0 n_inf nonzero with B^2 = 0, the rotor 1 - (t/2) B sends X(x) to X(x - t e_0) at three t and two points, dx = -e_0 on 81 grid points; Lambda < 0 at two values: B^2 = -H''^2 < 0, u^2 = -1, f = 1 + H''^2 R^2 >= 1 at six radii and dx nonzero on 50 sample points; "no horizon" and the rotation period 2 pi/sqrt(-Lambda/3) are not computed.'
  check_reversal_of_the_ambient_form:
    kind: sampled
    clauses: [(v)]
    omits: 'At eight Lambda: under squares negated Q(I) = -Lambda/3, Q(e_0) = -1, Q(W) = +Lambda/3 and B^2 = Lambda/3 unchanged; linear in Lambda, so the samples would determine it, but only samples are taken.'
untouched_premises: {singularity.euclidean-section-period: 'cited only for the Euclidean-section period clause of (iii), which the module docstring records as the premise''s analytic argument and does not check'}
judge: {by: coverage-judge-2026-10-23, date: '2026-10-23', verdict: agrees, note: 'Clauses (i), (ii), (iv), (v) are reproduced by exact Clifford arithmetic; (iii)''s Euclidean-period statement is not checked (stated in the module docstring). 2026-10-23 weak-checks: check_zero_and_negative_lambda now pins B^2 = -H''^2 and f(R) = 1 + H''^2 R^2 exactly in place of sign tests, and counts the 81 Lambda = 0 grid points.'}
