  check_lift_and_sign_data_in_geometric_algebra:
    kind: sampled
    clauses: ["(iv) in Cl(1,3), I_4 B = J, J^2 = -1, J commutes with B; the transverse rotor fixes n and B and turns the transverse frame; the transverse reflection fixes n and B and reverses J and I_4", "(iv) reflections about two cuts compose to a translation; the collapse-type inversions compose to dilations"]
    omits: "one Pythagorean rotor; affine identities at sample points"
