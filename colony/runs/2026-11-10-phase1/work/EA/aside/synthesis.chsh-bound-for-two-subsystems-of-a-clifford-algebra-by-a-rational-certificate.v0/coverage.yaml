functions:
  check_square_of_the_chsh_element_and_the_rational_certificate:
    kind: sampled
    clauses: ["(i)"]
    omits: "the two identities on all 625 quadruples from five rational directions of each party in two modes, and on three configurations of three modes in which one anticommutator is 1 + p_2 and not a scalar; the identities for every configuration are the proof's (an expansion using only the squares and the commutation between the parties)"
  check_scalar_part_is_positive_and_every_sample_state_obeys_the_bound:
    kind: sampled
    clauses: ["(ii)"]
    omits: "the blade inverse on all sixteen blades, the sum of squares on one element, the anti-automorphism on one product, and for three settings and six rational states the equality of the value of C^2 with 8 minus half the three certificate values, their signs and the two inequalities, with the largest squared value met pinned at 78400/9801; the bound for every state is the proof's; the second inequality of the clause and the strictness over the rationals are the proof's and are not checked"
  check_klein_twisted_directions_commute_and_the_square_is_four_plus_four_wedges_k:
    kind: partial
    clauses: ["(iv)"]
    omits: "the adjoint and square of K, the anticommutation of the untwisted directions and the failure of e_1 e_2 to be an observable, and the formula for the square and the scalar anticommutator on the 625 quadruples of five rational directions; the bilinearity that extends the formula to all directions, the list of observables of a mode and the inequality are the proof's"
  check_saturating_state_is_a_pure_state_over_the_field_with_root_two:
    kind: partial
    clauses: ["(v)"]
    omits: "with coefficients a + b sqrt 2 as exact pairs: P idempotent and self-adjoint, C P = 2 sqrt 2 P, scalar part 1/4, value 2 sqrt 2, the rank-one identity on all sixteen blades, the projections onto the blades of each mode, and the commutation with the total parity; uniqueness on self-adjoint elements is the proof's"
  check_square_one_element_that_is_not_self_adjoint_exceeds_four:
    kind: exact
    clauses: ["(iii)"]
    omits: "nothing: the element, its square, its adjoint, the commutation, the state and the value 17/4 are computed"
