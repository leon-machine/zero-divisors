functions:
  check_colour_block_su3_and_the_finite_group_inside_it:
    kind: complete
    clauses:
    - "(i) the bivectors of the e3..e8 block commuting with J and Re Omega: eight, closed, orthogonal to J; the closure of the four generators has 96 elements, each the action of a rational even versor fixing J, Re Omega and Im Omega; diag(j, 1, 1) turns Re Omega into Im Omega; no J-scalar but 1 in the group; no rational cube root of 1 but 1 among sampled J-scalars"
    omits: "the identification of the rotation group with SU(3) (connectedness, the determinant reading) is the standard argument of Step 1; the irrationality of the centre of SU(3) is sampled over denominators up to 6"
  check_finite_group_averages_equal_haar_through_degree_three:
    kind: complete
    clauses:
    - "(ii) G-invariant dimensions 0, 2, 2 in degrees 1, 2, 3, all annihilated by su(3); the metric and the form of J span degree 2; the Re and Im Omega tensors span degree 3; the G-average of U^(x)k equals the projector on sampled index pairs"
    omits: "the average-equals-projector lemma and the Fubini factorisation are the arguments of Steps 3 and 4"
  check_degree_four_separates_them_by_a_centre_violating_moment:
    kind: complete
    clauses:
    - "(iii) degree 4: 20 G-invariants against 12 su(3)-annihilated; the J-derivation vanishes on the 12 and has an 18-dimensional kernel and a 2-dimensional D^2 = -16 eigenspace on the 20; E_G[(tr U)^4] = 20, E_G[t^4] = 1, E_G[|t|^4] = 3"
    omits: "the vanishing of the Haar average of t^4 is the centre argument of Step 5"
  check_gluing_rule_and_leading_loop_coefficients_agree:
    kind: sampled
    clauses:
    - "(iv) on the 18 J-linear basis maps: the mean link term vanishes and the gluing value is (1/3) tr(XY) over G (complete by bilinearity); the 1x1 and 2x1 loops in a tree gauge give 1/18 and 1/324 over G"
    omits: "larger rectangles and the tube terms; the general case is the tree-gauge induction of Step 6 with the moment equality of (ii)"
  check_plaquette_series_agrees_through_beta_squared_and_differs_at_beta_cubed:
    kind: complete
    clauses:
    - "(v) moments of chi from invariant dimensions (SU(3): 1/18, 1/108, 1/108; G: 1/18, 1/108, 5/324), also by summing over G; cumulant series beta/18 + beta^2/216 + 0 beta^3 against + beta^3/972; the single-plaquette ratio over G expanded directly"
    omits: "the lattice statement (the first closed surface is an elementary cube) is the standard character-expansion argument of Step 7"
  check_finite_plaquette_weight_has_a_gap_and_colour_has_none:
    kind: sampled
    clauses:
    - "(vi) the maximum of chi over the 95 non-identity elements of G is 1/3; for n = 2, 3, 7, 30 the rational SU(3) elements diag(z, conj z, 1) have 1 - chi = 4/(3(n^2 + 1))"
    omits: "the family is proved in general in Step 8; four values sampled"
