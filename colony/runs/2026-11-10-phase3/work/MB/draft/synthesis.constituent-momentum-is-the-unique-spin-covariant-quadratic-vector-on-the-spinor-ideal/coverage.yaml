functions:
  check_one_spin_covariant_quadratic_vector_in_each_causal_tower:
    kind: complete
    clauses:
    - "(i) in each of the six causal towers: dim S = 2, 4, 8; the covariance system for symmetric bilinear maps S x S -> V has a solution space of dimension 1 (exact rank over Q); the polarisation of j is a nonzero solution"
    omits: "none within the six towers; the equivalence of the bivector equations with covariance under the rotor group is in the proof"
  check_vector_projection_is_vacuous_in_three_and_four_dimensions_and_not_in_five:
    kind: complete
    clauses:
    - "(ii) with psi symbolic on a basis of S: psi e_t rev(psi) has grade 1 only for n = 3, 4 and grades 1 and 5 for n = 5; the vector part is not zero"
    omits: "the count of invariant quadratic forms, in its own function"
  check_five_dimensional_mass_is_the_square_of_the_dropped_central_part:
    kind: complete
    clauses:
    - "(iii) in (4,1) and (1,4), as polynomial identities in the coordinates of psi: y^2 = 2 s I y, Q(e_t) Q(j) = s^2, <x x^dag>_0 = 2 s^2 for x = rev(psi) psi; I commutes with the generators and Q(e_t) I^2 = 1"
    omits: "none"
  check_invariant_quadratic_scalars_none_in_three_and_four_dimensions_one_in_five:
    kind: complete
    clauses:
    - "(ii) the scalar-valued covariance system has solution space of dimension 0 for n = 3, 4 and 1 for n = 5, where the polarisation of s is a nonzero solution"
    omits: "none within the six towers"
  check_two_constituents_admit_cross_terms_so_additivity_is_not_forced:
    kind: complete
    clauses:
    - "(iv) on S + S the covariance system has solution space of dimension 3 in (2,1), (1,2) and 4 in (1,3), (3,1); the sum of the two single momenta is a nonzero solution"
    omits: "n = 5, not computed; clause (v) is argued and has no check"
