    kind: exact
    clauses: ["(i) invariants of three vector slots 0, of four 4 (2 symmetric and 2 antisymmetric in the derivative pair), of two 1", "(i) invariant bilinear forms linear in a map of bivectors: 6, 3 on symmetric maps, 2 under the protraction identity, 0 on Weyl type", "(i) a.M(b) and (a.b) M independent on a map of Ricci type"]
    omits: "exact ranks under three generators of the Lorentz algebra of Cl(1,3); that the coefficients are invariant tensors of this kind is the imported Fact's form and the proof's reading of it, not computed"
