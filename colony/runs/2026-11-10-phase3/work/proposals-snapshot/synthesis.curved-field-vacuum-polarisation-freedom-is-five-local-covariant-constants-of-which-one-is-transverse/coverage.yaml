    clauses: ["(ii) the conditions K(D chi) = 0 on one torsion-free field, two scalars and two masses have rank 4 with solutions the multiples of (1, -1, 0, 0, 1)"]
    omits: "complete as an upper bound (conditions from one field are necessary for constants common to all fields); that the solution is transverse on every field is the proof's"
