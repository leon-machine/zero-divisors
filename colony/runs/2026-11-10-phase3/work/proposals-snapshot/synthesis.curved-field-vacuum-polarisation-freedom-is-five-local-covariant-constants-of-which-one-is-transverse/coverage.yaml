    kind: sampled
    clauses: ["(ii) D.(D ^ A) = Lap A - D(D.A) + calR(A) on one torsion-free polynomial field and one generic vector field; the opposite sign of the Ricci term fails", "(ii) D ^ D chi = 0 without torsion and not with it"]
    omits: "one field at one point; the identity for every torsion-free field is the proof's"
  check_ward_identity_leaves_one_constant_times_the_divergence_of_the_field_strength:
