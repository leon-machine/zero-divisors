  synthesis.imported-dimock-dirac-car-algebra-on-a-gravitational-field: "used only in the survey (S), a reading of its text"
  synthesis.interacting-fields-of-causal-perturbation-theory-keep-the-spin-statistics-connection-at-even-ghost-number: "used only in the survey (S), a reading of its text"
