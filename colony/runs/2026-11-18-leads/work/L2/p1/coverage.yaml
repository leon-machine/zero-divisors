functions:
  check_two_modes_are_the_rational_matrices_of_size_four_and_the_adjoint_is_the_transpose:
    kind: complete
    clauses: ["(i) the relations of the s_i, the map m on all 16 blades: rank 16, multiplicative on generator times blade, m of the adjoint is the transpose", "(i) m of the atom is r r^T / (r.r) for five rays"]
    omits: "that symmetric idempotent matrices are sums of orthogonal rank-one projections on rational vectors, and the passage from weights to frame functions, are the proof's"
  check_frames_are_cosets_of_the_klein_groups_of_half_turns:
    kind: sampled
    clauses: ["(ii) the component formula of the rotor product against the product of Cl(3,0) on 25 pairs, and <x y~>_0 = r.r'", "(ii) for the 34 frames of the certificate the quotients by the first member are three anticommuting orthogonal bivectors, the third a multiple of the product of the first two", "(ii) for six orthogonal triples of bivectors and five rotors the coset is a frame"]
    omits: "the general statement is two lines of algebra in the proof"
  check_octahedral_rays_span_a_copy_of_the_three_by_three_matrices:
    kind: complete
    clauses: ["(iii) step 1: the 24 rays are closed under product and inverse up to scale; nine bivectors, four orthogonal triples, 24 frames inside the 24 rays, rank 15; the rotation matrices of the 24 span the nine-dimensional matrix space and satisfy the 24 relations"]
    omits: "nothing of step 1"
  check_certificate_puts_the_rotor_two_plus_b1_in_the_octahedral_span:
    kind: complete
    clauses: ["(iii) step 2: the 34 listed sets are frames of primitive vectors; the rational combination of their indicators is the indicator of (2,1,0,0) plus a combination of 18 octahedral rays, coefficients summing to 2/5; the identity agrees with the quadratic value on a basis of the ten quadratic forms"]
    omits: "how the frames were found (a linear programme) is not part of the check and is not needed"
  check_integer_rotors_of_norm_a_power_of_five_factor_into_six_rotors_and_a_unit:
    kind: complete
    clauses: ["(iii) step 3: the division table for all 145 classes modulo 5 of norm 0", "(iii) step 2: the conjugates of 2 + B_1 by the 24 octahedral rotors are the six rotors 2 +- B_k", "(iii) step 3: all 248 integer rotors of norm 25 and all 1248 of norm 125 factor and the factors multiply back"]
    omits: "the induction on the exponent is the proof's"
  check_conjugate_of_a_power_by_a_half_turn_is_an_integer_rotor_of_norm_a_power_of_five:
    kind: sampled
    clauses: ["(iii) step 4: both components of (2 + B_1)^s are prime to 5 for s up to 60", "(iii) step 4 on ten bivectors, for B_1 and B_2: the exponent s, the conjugate n g n^-1 as a primitive integer rotor of norm a power of 5, its factorisation, its rotation matrix, and rank 9 of the algebra generated by the two rotations"]
    omits: "existence of s for every n and the commutant argument are the proof's; ten bivectors are sampled, two of them of norm divisible by 5"
  check_half_turn_relation_forces_the_central_factor_to_be_one:
    kind: sampled
    clauses: ["(iii) step 5: for six orthogonal triples R(a)R(b) = R(ab), R(a)^2 = 1 and 1 + R(a) + R(b) + R(ab) = 0", "(iii) step 5: the three scalar equations have the single solution (1,1) on a rational grid of 169 points"]
    omits: "the proof solves the three equations for commuting or non-commuting central factors; the grid only illustrates it"
  check_linear_functionals_give_the_weights_and_non_negative_weights_are_states:
    kind: sampled
    clauses: ["(iii) for one symmetric rho: 4 <rho Pi_r>_0 is the quadratic value on six rays, frame sums equal the trace on the 34 frames, L(x^dagger) = L(x) on the blades", "(iv) rho positive definite (leading minors 3, 5, 17, 62) gives L(x x^dagger) > 0 on three elements", "(iv) the functional <(1 + C) x>_0: symmetric matrix of trace 1, value -1/4 on the atom of (1,0,0,1) and -9/20 on that of (2,1,-1,2)"]
    omits: "the equivalence with the states of (P) is the proof's; one rho is sampled"
  check_atoms_of_rational_unit_vectors_admit_an_additive_weight_that_is_not_linear:
    kind: sampled
    clauses: ["(v) every ray with entries up to 4 and square norm has one odd coordinate or four; orthogonal pairs among them are of one kind and, with one odd coordinate each, in different places; every frame among them has weight sum 1 for alpha = (1,0,0,0)", "(v) the four rays (1, +-2, +-2, 0) have quadratic values summing to (4/9)(rho_00 + 4 rho_11 + 4 rho_22) for each of the ten basis forms, against the weight sum 4"]
    omits: "the parity argument for all unit atoms is the proof's (squares modulo 8)"
outside_ga:
  kind: other
  why: "The statement is about Cl(2,2) and the even subalgebra of Cl(3,0), and those parts are computed with the Clifford product. Three steps are outside the algebra and are elementary arithmetic or linear algebra: the quotient of a group algebra by the frame relations (a rational vector space), ranks of rational matrices, and congruences modulo 5 and modulo 8."
