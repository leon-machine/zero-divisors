functions:
  check_multiplet_scalar_flow_commutes_with_su2:
    kind: partial
    clauses:
    - (i) the modular flow acts as a scalar on each multiplet and centralises su(2), so the sphere's symmetry commutes with the clock
    omits: 'only the computable core: h = sum omega_l 1_(2l+1) commutes with J_z, J_+, J_- for l = 1/2, 1, 3/2 (control: an m-dependent h fails); that the near-horizon reduction delivers m-independent dynamics is not computed'
  check_bilinears_gl_n_and_matrix_units:
    kind: sampled
    clauses:
    - (ii) the mixed bilinears of the cited Proposition are ordinary gauge-invariant CAR bilinears of the observable algebra
    omits: n = 4 modes only; gauge invariance is the commutation with the number operator; "no operator outside the algebra of the boundary modes is invoked" is structural (E_ij is a product of mode operators), not computed
  check_quasi_free_symbol_g_of_h_invariant:
    kind: sampled
    clauses:
    - (iii) the I-state with multiplet-degenerate frequencies is invariant under every gauge Bogoliubov transformation commuting with the one-particle Hamiltonian, in particular all embedded SU(2) actions
    omits: three modes with one degenerate doublet; two sample unitaries (one SU(2) element, one phase) conjugated by a rational orthogonal O; the symbolic argument U g(h) U* = g(h) in the statement is not what is computed; control with non-degenerate occupancies is moved
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: Each level is checked at small instances matching its stated scope; level (i) is the algebraic core only, as the docstring says.
