functions:
  check_no_equivariant_pseudo_inverse_in_any_extension:
    kind: sampled
    clauses:
    - No extension of Cl(1,3) carries a Spin^0-equivariant element-level inverse of the null vectors
    omits: four algebras only (Cl(1,3), Cl(1,4), Cl(2,3), Cl(2,4)) and two null momenta; equivariance is tested through two stabiliser null rotors (enough for non-existence); pseudo-inverse p s p = p, not every notion of inverse
  check_one_rung_for_all_momenta:
    kind: partial
    clauses:
    - the minimal completion that the transport principle prescribes is the single rung Cl(2,4), unique up to isometry and independent of n
    omits: tests only that the lifts of six null momenta and of 0 stay in a 5-dimensional span of R^(2,4) (6 after adding one non-null point) and that the adjoined plane is hyperbolic; minimality and uniqueness up to isometry are not tested (imported)
  check_reciprocal_total_on_quadric:
    kind: sampled
    clauses:
    - on that completion's quadric the transported reciprocal is total, sending every p^i to its ideal point [p^i + n_inf/2] at once
    omits: six momenta and three non-null points; iota is entered by its formula rather than derived as the transport of the reciprocal; totality on the whole quadric is not tested
judge:
  by: fix-round-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "docstring (2) reworded: six null lifts plus the lift of 0 span 5 dimensions, all 6 only with one non-null point; minimality and uniqueness stated as imported, not tested (kind stays partial)"
