functions:
  check_scheme_constants_differ:
    kind: sampled
    clauses:
    - any dependence on r_c through r_c^a, a != 0, carries the scheme constant c_0^a, which differs between the three schemes for every real a != 0
    omits: rational a = k/d with 1 <= d <= 12 and |k| <= 24 only; constants 2^(1/3), 2^(2/3) 3^(1/6), 2^(-1/3) 3^(2/3) obtained by solving the three cutoff conditions
  check_kretschmann_rationality:
    kind: sampled
    clauses:
    - for rational a, the Kretschmann constant to the power a is irrational whenever a is not in 6Z
    omits: the same rational grid of a (plus a = 0); the value at a = 3/2 is 2 3^(1/4)
  check_two_cutoff_free_scales:
    kind: exact
    clauses:
    - the horizon r_h = 2M carries A = 4 S_BH cells with residue 1/4; r_* = M = r_h/2 carries 4 pi M^2 = S_BH cells with residue 1; both fixed without a cutoff
    omits: the residue conventions are taken from the cited entity; "which of the two a principle should mean is not decided" is not testable
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The scheme-constant claims are tested on a rational grid of exponents rather than for all real a; the cutoff-free scales are exact.
