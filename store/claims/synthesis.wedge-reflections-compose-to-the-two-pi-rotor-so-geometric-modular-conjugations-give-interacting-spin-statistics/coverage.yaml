functions:
  check_wedge_reflection_is_conjugation_by_the_boost_bivector:
    kind: exact
    clauses: ["(i) Ad(B) is the wedge reflection and equals the PT inversion after the dual-plane turn by pi (the half-period reading is the stored result, cited)"]
    omits: "the identities are checked as multivector identities; the action is checked on three vectors, the rest by linearity"
  check_reflection_reverses_the_edge_translations_and_the_boost_dilates_them:
    kind: sampled
    clauses: ["(ii) geometric part: j_W reverses the edge null translations and fixes the transverse ones; the boosts dilate them"]
    omits: "one boost rotor and one point of the wedge; Borchers' theorem is cited, not checked"
  check_reflections_of_turned_wedges_compose_to_the_spin_rotor_of_twice_the_turn:
    kind: sampled
    clauses: ["(iii) B_theta B = cos theta + sin theta g1g2, the rotor of the turn by 2 theta; (B_{pi/2} B)^2 = -1 for all four sign choices; -1 at the causal complement along the lift by continuity"]
    omits: "five Pythagorean half-angles, theta = pi/2 with all sign choices, and theta = pi; the continuity of the lift is the argument in the proof"
  check_the_klein_twist_with_unit_i4_squares_to_the_grading:
    kind: sampled
    clauses: ["(iv) V = (1 + I4 k)(1 + I4)^{-1} has V V* = 1, V^2 = k and V J V* J = k"]
    omits: "the standard Klein-twist identity; three even involutions k of Cl(1,3) commuting with I4 stand in for the grading; the conjugate-linear J is represented by the reversal of I4"
untouched_premises:
  synthesis.imported-kuckert-modular-pct-spin-statistics-and-borchers-theorem: "the imported theorem is applied in the proof to the geometric identities the check computes; nothing in the check computes from its hypotheses"
