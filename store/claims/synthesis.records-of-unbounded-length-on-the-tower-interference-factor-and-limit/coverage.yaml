functions:
  check_fock_module_is_the_clifford_algebra_of_the_ladder_pairs:
    kind: complete
    clauses:
    - setting
    omits: 'Three rungs: the Clifford relations of all six generators, v_j and w_j as creation and annihilation, the adjoint, and the vector-level operators against the matrices on every basis vector; larger floors are the same construction, not rechecked'
  check_interference_factor_on_a_full_basis_for_three_pairs:
    kind: complete
    clauses:
    - (i)
    omits: 'Complete for N = 3 and c in {3/5, 0}: every proper subset K and every element of a linear basis of the algebra on the system and the pairs of K; general N and c are the proof; the amplitudes 3/5, 4/5 are fixed; for odd elements the identity is 0 = 0 (both branches hold the same number of quanta), so the check tests nothing there'
  check_interference_is_full_for_an_element_touching_every_pair:
    kind: sampled
    clauses:
    - (ii)
    omits: 'N = 1, 2, 3 and c in {3/5, 0}; the two counterexamples at c = 0, N = 1 to a looser statement of clause (iii); self-adjointness is tested on a subset of pairs of basis vectors, evenness and the idempotent on all; general N is the proof'
  check_record_modes_differ_by_a_fixed_hilbert_schmidt_amount_per_pair:
    kind: sampled
    clauses:
    - (iv)
    omits: 'The one-particle operators of both branch vectors computed from the vectors for N = 1, 2, 3 at three values of c: projections, and squared Hilbert-Schmidt difference 2 + 2 s^2 N; that the branch states are quasi-free (Wick rule) is not checked here; the divergence of the sum and the disjointness are the proof and the imported Fact; clause (iii), a limit, is the proof and is not computed'
untouched_premises:
  tower.algebraic-limit-even-charge: "supplies the fact that every element of the algebraic tower involves finitely many generators, used in the proof of clause (iii), a limit that no finite computation touches"
