functions:
  check_entropy_map_and_kernel:
    kind: exact
    clauses: ["(i) the matrix of v -> (S_Q, S_m) from the definitions", "(i) rank 2, kernel spanned by (1, 3, 0)", "(i) along the kernel all zetas are equal", "(i) control grid: every other direction is non-adiabatic"]
  check_deposit_law_consistency:
    kind: exact
    clauses: ["(i) d ln Y_B = S_Q and d ln xi^4 = (4/3) S_m, the differentiated deposit law"]
  check_single_modulations:
    kind: exact
    clauses: ["(ii)(a) S_Q = -3 zeta, S_m = -(9/4) zeta", "(ii)(b) epsilon alone gives photons and charge carriers no curvature perturbation of their own", "(ii)(c) charge alone"]
  check_sachs_wolfe_share:
    kind: partial
    clauses: ["(iv) f_Q > 0.31 from the cited densities, non-adiabatic amplitude above 1.88 zeta, share magnitude above 0.27 for either sign"]
    omits: "the Sachs-Wolfe combination and the full-spectrum Planck bound are cited, not derived"
  check_mirror_radiation_share:
    kind: exact
    clauses: ["(ii)(b) mirror radiation share below 0.0388 at the cap and below 1.7e-7 for a helium mirror"]
