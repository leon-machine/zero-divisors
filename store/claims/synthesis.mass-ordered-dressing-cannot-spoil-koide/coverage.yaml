    kind: sampled
    clauses: ["(ii) dQ/ds_j = 2 (S1 s_j - S2)/S1^3", "(ii) 3 s_j <= s_3 gives S1 s_j < S2; the heaviest raises Q", "(ii) raising the lighter masses lowers Q"]
