functions:
  check_phi_line_generator_constant:
    kind: sampled
    clauses: ["the Hubble-normalised generator is constant along a phi-line", "Omega(e_3) has exactly the entries -sigma_3 on B_3 and cot(theta)/r on R_23"]
    omits: "two sample points; phi-independence is read from zero phi-gradient of the jets, the single-exponential transport follows by argument"
  check_delta_epsilon_series:
    kind: exact
    clauses: ["delta(r) = -(2/15) r - (8/105) r^2 - (16/315) r^3 - ...", "epsilon(r) = (2/3) cot(theta) r^(1/2) (1 + (3/10) r + (9/56) r^2 + ...)"]
    omits: "series through r^8 only; delta is evaluated from the closed form (2/3) S(r) sqrt(1 - r) - 2/3 rather than from the field's sigma_3, and epsilon is checked at cot(theta) = 3/4 (linear in cot)"
  check_exponential_comparison:
    kind: partial
    clauses: ["the norm bound |exp(lambda G) - exp(-(2/3) lambda B_3)| <= lambda (|delta| + |epsilon|) e^(lambda (1 + |delta| + |epsilon|))"]
    omits: "checks the Duhamel identity e^X - e^Y = int e^((1-t)X)(X - Y)e^(tY) dt coefficient by coefficient through order 7 in lambda and the norms |B_3| = |R_23| = 1 and |delta B_3 + epsilon R_23| <= |delta| + |epsilon| at three sample (delta, epsilon); the inequality itself with the exponential factor is not evaluated"
  check_rates_in_tau:
    kind: exact
    clauses: ["delta = O(tau^(2/3))", "O(r^(1/2)) = O(tau^(1/3))"]
    omits: "does not test the comparison with the theta-line's tau^(2/3), the application of the tangential-curve theorem with |E_tau|_K = O(tau^(1/3)), or the SO(3) x R_t invariance and regularity on the exceptional set"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "Series coefficients and rates match the statement; the exponential bound is checked only through its Duhamel identity and norm inputs, not the final inequality."
