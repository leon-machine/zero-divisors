  check_created_mode_ledger:
    kind: sampled
    clauses: [(2), (3)]
    omits: Factorisation of the Gibbs state for one choice of q; per-mode ledger exact in prime logarithms at e^x = 3 (entropy 2 ln 2 - (3/4) ln 3, Killing energy (1/4) ln 3, deficit ln(4/3)) and at e^x = 1, and common-weight scaling with dm = 2, -1, 0 at e^x = 3; the general created and lost sets with different weights, the fraction x n/s < 1 for all x, and the inconsistency of (R_inst), (Cl), (E) are not computed.
