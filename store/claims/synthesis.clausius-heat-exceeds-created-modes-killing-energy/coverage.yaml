    clauses: [(1)]
    omits: 'One two-mode window with q = (1/3, 1/5): the KMS equations on all 16 matrix units have a one-dimensional solution space spanned by e^{-beta H}; general windows and weights are the cited uniqueness theorem; unchanged entropy and energy between instants follows trivially and is not computed.'
  check_exchange_leaves_kms:
    kind: exact
    clauses: [(4)]
