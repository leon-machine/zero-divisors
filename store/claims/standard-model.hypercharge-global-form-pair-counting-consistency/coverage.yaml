functions:
  check_orientation_fixed_by_anomaly:
    kind: exact
    clauses:
    - (1)
    omits: The parity statement is checked as the parity of the total mode numbers 2, 4, 1 of Q, the full and the empty doublet; the "particle-antiparticle orientation" reading is interpretive
  check_one_handed_singlet_spectrum:
    kind: exact
    clauses:
    - (2) "(1)_0 + (3bar)_{-2/3} + (3bar)_{+1/3} + (1)_{+1}, i.e. nu^c, u^c, d^c, e^c at 0, -2/3, 1/3, 1"
    omits: Only the hypercharges (weights) are computed; the colour labels 3bar are tested in the chirality-two-halves entity, and the identification of (0,k) components with grade-k states is the weight match -2k
  check_anomaly_free_and_unique:
    kind: exact
    clauses:
    - (3) "all four anomaly conditions hold"
    - (3) "the conditions determine Y_L, Y(e^c), {Y(u^c), Y(d^c)} uniquely"
    omits: The three linear steps are solved by hand in code and the cubic is shown to be a nonzero multiple of (y - 1/3)(y + 2/3) as an exact polynomial; the four sums are the Fact's formulae with overall index factors dropped
  check_hypotheses_necessary:
    kind: exact
    clauses:
    - (3) "with a fourth singlet of unconstrained hypercharge, a one-parameter family"
    - (3) "doublets in the opposite handedness give [SU(3)]^2 U(1) = -2/3 and cubic +4/9"
    omits: Shows the family Y + t(B - L) solves all four conditions (five t values for a cubic identity) but not that it is the entire solution set; the missing-lepton-doublet control is extra to the statement
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: All four functions are exact rational or polynomial computations of the stated sums, weights and uniqueness steps.
