functions:
  check_quaternionic_and_dirac_readings:
    kind: exact
    clauses:
    - '"(i) Cl(1,3) is isomorphic to M_2(H)"'
    - '"(ii) ... a faithful representation Cl(1,3) -> M_4(C) whose complex span is all of M_4(C)"'
    omits: 'nothing: finite rank computations'
  check_spacetime_split:
    kind: exact
    clauses:
    - '"(iii) sigma_j sigma_k + sigma_k sigma_j = 2 delta_jk and sigma_1 sigma_2 sigma_3 = I"'
    - '"Cl+(1,3) is isomorphic to Cl(3,0)"'
    omits: 'nothing: a finite computation'
