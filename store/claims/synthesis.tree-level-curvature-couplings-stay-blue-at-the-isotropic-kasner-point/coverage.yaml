functions:
  check_dictionary_extensions_off_the_einstein_region:
    kind: sampled
    clauses: ["(i) I . D sigma = 0 gives m^2 = -wJ - rho w(n+2w-2); the three extensions' xi and mu; agreement on Einstein regions", "(i) control: off the Einstein region the first two differ", "(i) conformal weight gives the Yamabe value (n-2)/(4(n-1)) with no mass term, n = 3..6", "(ii) values of the first two extensions at the real dictionary weights and their ranges on [-3, 0]"]
    omits: "the pairing is linear in (sigma, grad sigma, Box sigma) and polynomial of degree two in w; checked at 432 points (n, w, R, Lambda), which fixes every polynomial identity used; the ranges on [-3, 0] are sampled on a 41-point grid and proved in the proof"
  check_curvature_coupling_acts_only_at_the_isotropic_disk_point:
    kind: exact
    clauses: ["(iii) R = 0 on the four-dimensional circle (Schwarzschild interior, BKL points)", "(iii) R_5 = 0 at both five-dimensional vacuum ends", "(iii) induced four-metrics at the ends have R = 0", "(iii) R T^2 = -2/3 at the isotropic disk point", "(iii) sign control: accelerating power law has R > 0"]
  check_listed_couplings_are_blue_at_the_isotropic_point:
    kind: complete
    clauses: ["(iv) c^2 = 2/3 from the Ricci engine and nu^2 = 3 xi/2 at the isotropic point with no hidden-scale weight", "(iv) each of the twelve listed couplings outside the window, index above 63/50 (3 - sqrt 3)", "(iv) exact xi window from the measured index"]
  check_hidden_scale_weight_bound:
    kind: sampled
    clauses: ["(iv) Einstein-frame reduction of both ends: (1/3,1/3,1/3), b ~ tau_E^(+-2/3)", "(iv) nu^2 = (lambda - 1)^2/4 + 3 xi/2 for lambda in {-2, -1, 0, 1, 3} and every listed xi", "(iv) index above 7/20 (3 - sqrt 7) for |lambda - 1| <= 2, xi <= 1/2; bound attained", "(ii), (iv) the Wilson-line weight would need an unfixed coupling in [0.8559, 0.8815]"]
    omits: "five weights sampled; the bound for all |lambda - 1| <= 2 and xi <= 1/2 follows from the closed form in the proof"
  check_window_needs_weight_outside_unitary_range:
    kind: complete
    clauses: ["(v) first extension: window weights in [-9.2885, -9.1355], m^2/H^2 negative", "(ii), (v) principal series gives a complex coefficient, the dictionary stays real", "(v) third extension cannot reach the window", "(v) second extension: real weights below the window, principal-series interval"]
