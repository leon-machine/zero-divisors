functions:
  check_enclosures_contain_zero_at_the_three_stored_points_and_exclude_it_at_controls:
    kind: sampled
    clauses: ["the enclosure of T at twists 1/4, 1/3, 1/2 contains zero and is narrower than 10^-12; r^2 = 1/4, 2/3, 1 there", "controls: T < -10^-4 at 0.23 and 0.40, T > 10^-4 at 0.29; T'(1/4) > 0, T'(1/3) < 0, and the enclosure of T'(1/2) contains zero"]
    omits: "a guard on the function and the library, not a step of the proof; that T vanishes at the three points is the cited stored clause"
  check_no_zero_for_windows_shorter_than_three_twentieths_of_a_period:
    kind: exact
    clauses: ["step 1: the rational inequalities of the bound (the cut at 429/2000, a >= 1/5, e > 2.718, (9/400) 2.718^8 > 24 * 41/100, pi >= 3, 3/20 < pi/5) and the enclosure of pi"]
    omits: "the inequalities between the sum and the exponential, and the monotonicity of r^2 exp(2 pi/(5r)), are the proof's"
  check_sign_of_the_thermal_test_on_the_three_open_stretches:
    kind: complete
    clauses: ["step 4: T < 0 on [429/2000, 246/1000], T > 0 on [254/1000, 3233/10000], T < 0 on [3433/10000, 46/100], by the mean-value enclosure with bisection"]
    omits: "complete for the stretches, given the bound of step 2 on the omitted terms, which the check applies and the proof justifies"
  check_monotone_near_one_quarter_and_one_third_and_concave_near_one_half:
    kind: complete
    clauses: ["step 5: T' > 0 on [246/1000, 254/1000], T' < 0 on [3233/10000, 3433/10000], T'' < 0 on [46/100, 1/2]; the opposite signs are rejected"]
    omits: "the passage from these signs to the count of zeros is step 6 of the proof"
