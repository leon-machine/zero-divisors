functions:
  check_even_subalgebra_is_cl23_cl41_and_mat4c:
    kind: exact
    clauses: ["(i) Cl^0(2,4) = Cl(2,3) = Cl(4,1) = Mat(4,C), generated by e_i e_6 and e_i e_1", "(i) omega_6 is even, squares to -1, commutes with every even element and is the complex unit"]
    omits: "The 32-dimensional span and the relations of the two generating sets are computed; the identification of the centre uses the five bivectors e_i e_(i+1), assumed to generate the even subalgebra."
  check_both_oriented_shadows_inside_even_subalgebra:
    kind: exact
    clauses: ["(ii) the bivectors e_i e_6 (i = 2..5) generate a Cl(1,3) and e_i e_1 (i = 2..5) a Cl(3,1)"]
    omits: ""
  check_conformal_spinors_are_the_module_of_the_even_subalgebra:
    kind: partial
    clauses: ["(iii) every input to the copy theorem is an object of Cl^0(2,4) or its complexified modules"]
    omits: "Computes only that, in the Fock model, the even blades preserve the conformal spinor space CS, span End(CS) (complex dimension 16), and omega_6 acts as a square root of -1; that Cl(1,3) and Cl(3,1) are two real forms of the complexification, and that each input of the copy theorem lies in these objects, has no separate finite content (the docstring says so)."
  check_signature_reversal_changes_the_centre:
    kind: complete
    clauses: ["(iv) Cl(2,3) is not isomorphic to Cl(3,2) and Cl(1,4) to Cl(4,1)", "(iv) the centre is C in Cl(2,3), Cl(4,1) and R + R in Cl(3,2), Cl(1,4)"]
    omits: "Central blades are enumerated for every signature with n <= 6, and omega^2 and the central idempotent or the field norm for the four named algebras."
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "Clauses (i), (ii) and (iv) are computed exactly; clause (iii) is tested only through the conformal spinor module, the remainder being a reading the docstring declares as having no finite content."
untouched_premises:
  std-algebra.pseudoscalar-commutation: "standard algebra cited in the proof; the check computes the statement directly"
  primer.sign: "standard algebra cited in the proof; the check computes the statement directly"
