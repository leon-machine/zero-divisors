functions:
  check_five_dimensional_vacuum:
    kind: sampled
    clauses:
    - (1)
    omits: Ricci-flatness of the five-dimensional Kasner metric at three rational points of K_5 and its failure at one point off it; the general statement is the diagonal computation in the proof
  check_reduction:
    kind: sampled
    clauses:
    - (1)
    omits: The reduced Einstein-scalar equations (store sign Ric_TT = -(3/2) P_4^2/T^2, other components zero) and the wave equation at the same three points, with a control off K_5; the decomposition G = T^{-P_4} g - T^{2P_4} dy^2 is read off, not computed
  check_exponents:
    kind: sampled
    clauses:
    - (1)
    - (2)
    omits: The exponent map, the Kasner-disk relations, the normalisation 8 pi G q^2 = (3/2) P_4^2/k^2, the identity sum p^2 + 8 pi G q^2 = 1 + (S2 - 1)/k^2 and the inverse P_i = p_i k - P_4/2 at the sample points; injectivity and surjectivity of Pi (and the inverse formula for P_4, which involves sqrt(3/2)) are proved in the text
  check_completed_residue:
    kind: sampled
    clauses:
    - (3)
    omits: hat B^2 = 1, B_w^2 = 1 - c^2, B_5^2 = 1 and k B_w = B_5^(3) + (P_4/2) sum B_i in Cl(1,4) with GA.py at the three sample points (e_4^2 = -3/2 for hat B to keep the coefficient rational); the conformal-change reading of the isotropic term is argued in the proof
