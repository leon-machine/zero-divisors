functions:
  check_first_on_tests_are_exclusive_with_sizes:
    kind: sampled
    clauses: ["(o) g_j and P_m are idempotents, the g_j exclusive, N(g_j) = 2^-j, N(P_m) = 2^-m, g_1 + ... + g_m + P_m = 1"]
    omits: "j, m <= 3 in rung 3; every j and m is the proof's one-switch-at-a-time argument"
  check_finite_parts_are_solved_by_partial_sums:
    kind: sampled
    clauses: ["(i) E_n solves the equations with j <= n", "(ii) a finite J and a cofinite J are solved in the tower"]
    omits: "five sets J restricted to j <= 3, in rung 3; (ii) for finite and cofinite J only on the g_j of that rung"
  check_no_solution_in_a_lower_rung_by_linear_algebra:
    kind: sampled
    clauses: ["(ii) no x in rung m is the identity on g_j and zero on g_j' for j, j' > m"]
    omits: "m = 1 with the pair (2, 3) in both orders, as the inconsistency of the linear system for the four coefficients of x, with three solvable controls; every m and every infinite, co-infinite J is the proof"
  check_factorisation_used_in_the_proof:
    kind: sampled
    clauses: ["(ii) proof: g_j = P_m h with h even on later switches, and N(c h) = N(c) N(h) for c in rung m"]
    omits: "m = 1, j = 2, 3, five elements c; the general step is clause (iv) of the size theorem"
  check_sizes_of_partial_solutions_and_the_gap_from_one_third:
    kind: sampled
    clauses: ["(iii) N(E_2n) = (1 - 4^-n)/3 and N(E_2n+2 - E_2n) = 4^-(n+1)", "(iii) |j/2^m - 1/3| >= 1/(3 * 2^m)", "(iii) the lower bound on N(E_2n - x)"]
    omits: "n = 1, 2 in rung 4; the arithmetic gap for m <= 16; the lower bound for six elements x of rung 1 against E_4; general n, m and x are the proof"
untouched_premises:
  synthesis.size-of-an-element-of-the-switch-tower: "its clauses (multiplicativity on separate switches, sizes of tests, additivity) are cited by the written proof; the checks recompute every size they use directly as a rank"
