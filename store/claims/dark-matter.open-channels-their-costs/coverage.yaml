functions:
  check_mirror_radiation_and_threshold:
    kind: exact
    clauses: ["N_eff^tot = 7.447", "threshold T'/T_gamma < 0.448 (0.47 with the heaviest neutrino non-relativistic, coefficient 6.40)", "met by eight orders or more at the hot-deposit point estimate", "xi = 1 is excluded"]
    omits: "the 0.47 threshold is pinned in (0.465244, 0.465245), above the rounding edge 0.465; the condition 'T'/T below about 0.3' for the heaviest neutrino being non-relativistic and the burning-branch reheating factor 3.0 to 3.2 are not computed"
  check_five_dimensional_thresholds:
    kind: exact
    clauses: ["Delta N_eff ~ 2.2 g (T_r/T_gamma)^4 per species", "thresholds 0.51 for g = 2 and 0.46 for g = 3"]
    omits: ""
  check_route_a_colder_sector:
    kind: exact
    clauses: ["route (a): (g_*(GeV)/g_*(now))^(1/3) ~ 2.51, 0.11 per two-polarisation species, two towers at 0.22 under the cap and 0.33 over it"]
    omits: "g_* values 61.75 and 3.91 are the check's inputs; that the sector is decoupled and releases less entropy is the physical premise of route (a)"
untouched_premises:
  dark-matter.superselected-hence-dark-exactly-stable: "the mirror being heated only through the shared metric is a physical argument with no computation here"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "the arithmetic is bracketed exactly; routes (b) and (c) are declared uncomputed. 2026-10-23 (weak checks): check_mirror_radiation_and_threshold pins N_eff_tot, both thresholds and the coefficient 6.403 to six figures from both ends of the bracket, xi at the hot-deposit point to 4.244e-3, the ratio to the cap to (8.055, 8.057)e-9 and the xi = 1 excess at 24 times the cap; check_route_a_colder_sector pins the cube-root bracket exactly and the 0.111, 0.222, 0.333 values to six figures. Inputs moved to module level; the quoted windows are implied by the tighter ones and were removed."
