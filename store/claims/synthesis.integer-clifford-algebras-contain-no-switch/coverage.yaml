functions:
  check_reduction_mod_two_is_the_commutative_group_algebra:
    kind: complete
    clauses: ["proof setup: the blade product has structure constants +-1 and index set the symmetric difference, so the reduction mod 2 is commutative"]
    omits: "every pair of blades in every signature with n <= 3; general n is the product formula"
  check_square_is_the_coefficient_sum_mod_two:
    kind: complete
    clauses: ["(i) proof: in the mod-2 algebra x^2 is the sum of the coefficients of x"]
    omits: "all 276 elements of the mod-2 algebras with n <= 3; general n is the proof's additivity of squaring"
  check_no_integral_idempotents_on_boxes:
    kind: sampled
    clauses: ["(i) no idempotent other than 0 and 1"]
    omits: "integer coefficients in [-4, 4] for n = 1, [-2, 2] for n = 2, [-1, 1] for n = 3, every signature; all integers is the proof's descent"
  check_no_integral_switch_on_boxes:
    kind: sampled
    clauses: ["(ii) no switch over the integers; anticommutators of integral nilpotents are even"]
    omits: "Cl(1,1), Cl(2,0), Cl(0,2) with coefficients in [-3, 3]; the general statement is the proof's reduction mod 2"
  check_half_vectors_are_a_switch:
    kind: sampled
    clauses: ["(iii) the half-vectors (e_1 +- e_{p+1})/2 are a switch"]
    omits: "six signatures with p, q >= 1; the general case is the proof's two-line computation"
  check_orthonormal_order_has_index_four_in_the_switch_order:
    kind: sampled
    clauses: ["(iv) e_1 -> v + w, e_2 -> v - w is multiplicative, with image the parity lattice of index 4"]
    omits: "the index is the exact determinant; multiplicativity on integer elements with coefficients in [-2, 2] against three fixed elements; the parity lattice matched on matrices with entries in [-2, 2]"
