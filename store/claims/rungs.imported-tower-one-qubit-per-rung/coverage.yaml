functions:
  check_ladder_pairs_satisfy_car:
    kind: sampled
    clauses:
    - v_i v_j + v_j v_i = 0, w_i w_j + w_j w_i = 0, v_i w_j + w_j v_i = delta_ij as vectors in T_k = Cl(p+k, q+k)
    omits: grounds (1,3), (0,0), (2,1) and k = 1, 2, 3 only
  check_commuting_copies:
    kind: sampled
    clauses:
    - B_k generated by the 2k plane generators is Cl(k,k)
    - the twisted ground generators generate a commuting copy A_k = Cl(p,q)
    - multiplication A_k (x) B_k -> T_k is an isomorphism
    omits: grounds (1,3), (1,1), (0,2) and k = 1, 2 only; B_k = M_{2^k}(R) is established in check_fock_module_one_qubit_per_rung
  check_fock_module_one_qubit_per_rung:
    kind: sampled
    clauses:
    - Lambda W_k of dimension 2^k is an irreducible B_k-module (B_k = M_{2^k}(R))
    - the vacuum is annihilated by every w_j and cyclic for the v_j
    - Lambda W_{k+1} = Lambda W_k (x) Lambda(R v_{k+1}), one qubit per rung
    omits: k = 1, 2, 3 (doubling up to Lambda W_4)
  check_witt_index_one_per_rung:
    kind: partial
    clauses:
    - The Witt index rises by exactly one per rung
    - the Witt index of a real quadratic space is the maximal number of anticommuting mode pairs realisable by vectors
    omits: constructs min(p,q) + k pairs over four grounds and k = 0..3 (a lower bound equal to min(n+, n-)); maximality is Witt's bound, not recomputed (docstring)
  check_star_structure:
    kind: sampled
    clauses:
    - a unique conjugate-linear antiautomorphism * fixing the positive frame generators and negating the negative ones, under which v_j^* = w_j
    omits: real form only, three floors (T_1 over (1,1) and (0,2), T_2 over (0,0)); conjugate-linearity on the complexified floor is not computed (docstring)
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The docstring lists the instances checked; the general-(p,q,k) statement is sampled and the Witt-index maximality is imported.
