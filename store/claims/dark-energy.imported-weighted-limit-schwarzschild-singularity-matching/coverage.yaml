functions:
  check_parallel_frame_and_leading_kasner_connection:
    kind: sampled
    clauses: ["frame D-parallel along g_tau", "Hubble-normalised connection tends to -sum p_i B_i (x) theta_i with p = (-1/3, 2/3, 2/3)", "rates O(tau^(2/3)) boost block and O(tau^(1/3)) rotation block"]
    omits: "parallelism checked at sample points of the exported interior field; the limit and rates are read off the first coefficients of exact series; transport-level statements are cited and not recomputed"
  check_schwarzschild_de_sitter_relative_correction:
    kind: partial
    clauses: ["Schwarzschild-de Sitter interior differs by relative O(Lambda tau^2)"]
    omits: "only the metric function ratio is computed (at sample Lambda and r); that the same limit, exponents and rates hold for the SdS connection is not computed"
  check_unit_boost_residue:
    kind: partial
    clauses: ["total residue bivector B_w is a unit boost", "sum p_i^2 = 1"]
    omits: "B_w^2 = 1 and sum p_i^2 = 1 exact at the Schwarzschild exponents only; membership in the exceptional algebra and sum p_i^2 = 1 for every admissible field of the class are not tested"
  check_weights_are_the_exponents:
    kind: partial
    clauses: ["the weights of the completion are forced to equal the exponents"]
    omits: "only the arithmetic (2/3)(-1/2, 1, 1) = (-1/3, 2/3, 2/3) with the weights taken as given; that the weights are forced is not tested"
untouched_premises:
  interior.boosts-generate-exactly-levi-factor: "Levi-factor statement is not part of the computable content checked"
  interior.kasner-form-interior: "Kasner comparison model is not recomputed"
  interior.schwarzschild-lines-exactly: "phi-line transport exactness is cited from T6, not recomputed"
  interior.transport-level-convergence-along-tangential-curves: "transport-level clauses are cited and not recomputed, as the docstring says"
  sheaf.matching-connection-level: "sheaf-level matching of the connection is not computed here"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "checks cover the values-level limit and arithmetic, three of four at partial strength; the docstring discloses the transport-level omission"
