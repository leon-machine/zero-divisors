functions:
  check_frame_exactly_parallel:
    kind: sampled
    clauses: ["(1)"]
    omits: "four interior radii (r0 = 1/2, 1/5, 4/5, 1/10 with Lambda = 0) at rational angles: torsion-free with rank-24 torsion map, (e_0 . D) e_b = 0 for b = 0..3, control (e_1 . D) e_0 != 0, and the closed forms for sigma_1, sigma_2 and Omega(e_1) = -sigma_1 e_0 ^ e_1; 'at every tau > 0' is not covered beyond these radii"
  check_rates_converge_to_kasner_exponents:
    kind: exact
    clauses: ["(2)"]
    omits: "exact power series in rho = sqrt(r) truncated at order 12: tau sigma_1 = -1/3 - (4/15) R and tau sigma_2 = 2/3 - (2/15) R with the remainder starting at R^3; the statement's O(R^2) tail is exhibited, not bounded"
  check_one_uniform_rate:
    kind: exact
    clauses: ["(3)"]
    omits: "exact series for the five listed quantities (two scale-factor deviations, the two rates, the S^2 curvature against tau^-2), each starting at rho^2 = O(tau^{2/3}) with nonzero leading coefficient, and the rotation coefficient at rho^1 = O(tau^{1/3}); 'velocity-dominated' and 'no oscillations' are read from the one-signed leading terms and not tested separately; truncated at order 12"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "the leading constants and exponents are computed exactly as truncated series; the frame parallelism in (1) is checked at four radii"
