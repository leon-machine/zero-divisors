functions:
  check_derived_metric_and_tau:
    kind: sampled
    clauses: ["derived metric d tau^2 - A dt^2 - r^2 dOmega^2, A = 1/r - 1", "tau = (2/3) r^(3/2) (1 + (3/10) r + O(r^2))"]
    omits: "metric Gram compared at three sample points (r, theta); the tau series is exact (coefficients of u^3, u^4, u^5 compared)"
  check_parallel_frame_and_t_line_connection:
    kind: sampled
    clauses: ["the frame is exactly D-parallel along the free-fall worldlines of velocity g_tau", "rotation-gauge field on e_1 along a t-line is -sigma_1 B_1, sigma_1 = d_tau log sqrt(A), B_1 = e_0 ^ e_1"]
    omits: "three sample points of the premise engine's field via first-order jets; torsion-freeness and the connection compared there; the angular connection components are not part of this statement's check"
  check_rates_and_kasner_limits:
    kind: exact
    clauses: ["tau sigma_1 = -1/3 - (4/15) R + O(R^2)", "tau sigma_2 = tau sigma_3 = 2/3 - (2/15) R + O(R^2), R = (3 tau/2)^(2/3)", "limits are the Kasner exponents (-1/3, 2/3, 2/3)"]
    omits: "exact series coefficients, but sigma_1, sigma_2 are typed closed forms in interior_series rather than read from the field of the previous function; sigma_3 = sigma_2 by symmetry"
  check_limiting_boosts_generate_so13:
    kind: exact
    clauses: ["the three limiting boosts B_i generate so(1,3)", "they do not commute"]
    omits: "Lie algebra dimension 6 computed for the boosts scaled by the Kasner exponents (-1/3, 2/3, 2/3); [B_i, B_j] = +-e_i e_j shown for the unit boosts"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The exceptional-set clause ({tau = 0} x R_t x S^2) is a description of the blow-up and has no check function (docstring says not computed); the other clauses reproduce."
