functions:
  check_twisted_ground_copy:
    kind: sampled
    clauses:
    - A_k = <x^(k)> is isomorphic to Cl(p,q) via x -> x^(k)
    omits: Grounds with n <= 3 at k = 1, 2 plus (1,3) at k = 2 only; the twisted generators satisfy the ground relations and the 2^n blade images are independent, so injectivity is exact per case, not for general (p,q,k)
  check_plane_algebra_is_full_matrix_algebra:
    kind: sampled
    clauses:
    - B_k is isomorphic to Cl(k,k), which is Mat_{2^k}(R)
    omits: Only the six pairs in CASES_B (k <= 2, and k = 1 over Cl(1,3)); the plane algebra does not depend on the ground, but only k = 1, 2 are run
  check_commuting_copies_tensor_isomorphism:
    kind: sampled
    clauses:
    - A_k and B_k commute elementwise
    - multiplication A_k (x) B_k -> T_k is an isomorphism
    omits: Same finite CASES; the statements "canonical given the ordered planes" and "compatible with the tower embeddings up to the twist" are not tested here
untouched_premises:
  std-algebra.existence-uniqueness: "standard algebra cited in the proof; the check computes the statement directly"
  std-algebra.blade-basis: "standard algebra cited in the proof; the check computes the statement directly"
  tower.grade-twist-when-it-inner: cited only for the compatibility remark "up to the twist"; the docstring says that part is checked in the grade-twist and compatibility entities
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The four clauses are tested on finite grounds and k <= 2; the final compatibility sentence is outside this check.
