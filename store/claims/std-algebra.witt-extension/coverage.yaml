functions:
  check_extension_by_reflections:
    kind: sampled
    clauses:
    - '"the extension can be taken to be a product of reflections"'
    omits: four nondegenerate subspaces in R^{2,1}, R^{2,2}, R^{1,3}, both branches of the reflection
      step; the general theorem is imported
  check_null_line_extends_and_radical_obstructs:
    kind: sampled
    clauses:
    - '"U any subspace"'
    - '"an isometry of V maps rad V to itself"'
    omits: one null line in R^{2,1} and one degenerate counterexample
