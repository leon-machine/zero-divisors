functions:
  check_sign_change_moves_residue_by_two:
    kind: complete
    clauses: ["a sign change moves (p, 4-p) to (p +- 1, 4-p -+ 1) and the residue by +-2"]
    omits: ""
  check_every_path_crosses_two_two:
    kind: sampled
    clauses: ["every sequence of changes from (1,3) to (3,1) passes through (2,2), residue 0"]
    omits: "Walks are enumerated only up to length 6 (non-revisiting) and length 8 (with revisits); unbounded sequences are not enumerated. The statement holds because (2,2) is a cut vertex of the five-vertex path graph, which is not computed as such."
  check_euclidean_dead_end:
    kind: complete
    clauses: ["(0,4) at residue 4 is a dead end whose only continuation returns to (1,3)"]
    omits: ""
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The one-step law and the dead end are exhaustive on the sixteen sign assignments; the passage through (2,2) is checked for bounded walk lengths on a graph small enough that the bound is not a practical gap."
