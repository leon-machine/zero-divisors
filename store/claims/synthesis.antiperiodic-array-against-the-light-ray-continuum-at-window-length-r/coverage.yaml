functions:
  check_self_duality_of_the_partition_function:
    kind: sampled
    clauses: ["(i): f(r) = f(1/r)", "(i): f(1) = (1/2) ln 2 and c(1) in (0.08477, 0.08478)"]
    omits: "the duality at r = 2, 4, 1/2, 4/5 and the value at r = 1, each to 10^-30 by rational interval arithmetic, with the control f(2) != f(4); the identity for every r is the proof's (clauses (a), (b) of the imported Fact)"
  check_energy_matches_only_at_the_fixed_point:
    kind: sampled
    clauses: ["(ii): e_sym(1) = 0 and e(1) = pi/12", "(ii): e_sym(1/r) = -e_sym(r), D(1/r) = -D(r)", "(ii): values of e_sym(2), D(2), D(4), D(1/2)"]
    omits: "r = 1 to 10^-30; oddness at r = 2, 4; the signs for all r (monotonicity of r e_sym(r) and of G) are the proof's; the sea comparison is the rational statement 1/r = r only at r = 1 on four values; J^2 = -1 in Cl(1,3) through GA.py for the one-window half turn"
  check_entropy_difference_as_a_function_of_window_length:
    kind: sampled
    clauses: ["(iii): Delta(1) = (1/2) ln 2 - pi/6", "(iii): values at r = 2, 4, 8, 1/2, 1/4", "(iii): remainder bound at r = 1, 2, 4", "(iii): direct form of S against pi r/6 + Delta(r) at r = 2, 4"]
    omits: "interval values; the sign for every r > 0 and the remainder bound for every r >= 1 are the proof's; the Riemann-sum identification of the limit with the density integral is not checked"
  check_energy_variance_against_the_continuum:
    kind: sampled
    clauses: ["(iv): v(1) in (0.79821, 0.79822), v(1) - pi/6 in (0.2746, 0.2747)", "(iv): dual form at r = 1, 2", "(iv): v(2) - pi/3 in (0.1000, 0.1002)", "(iv): v(1/2) - pi/12 < 0 < v(5/8) - 5 pi/48"]
    omits: "interval values; positivity of the dual terms for every r >= 1 is the proof's; the closed form pi^4/(24 Gamma(3/4)^8) is not checked and not claimed"
  check_residue_if_the_continuum_value_were_counted:
    kind: exact
    clauses: ["(v)"]
    omits: "bounds on 1/(4 ln 2), 3/(4 pi), 3/(2 pi), 1/(2 ln 2), 3 ln 2/pi, 6 ln 2/pi, r/(4 S(r)) at r = 2 and pi/ln 2; the irrationality of 6 ln 2/pi is not claimed, only that it lies strictly between 1 and 2"
