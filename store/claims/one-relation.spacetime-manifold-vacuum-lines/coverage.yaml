    - '"null-separated exactly when their incidence lines share a vacuum"'
    omits: seven sample points and 21 pairs; the Klein quadric identification and the remark that it is not the pure-spinor variety P^3 are not tested
  check_car_over_a_chosen_vacuum:
    kind: sampled
    clauses:
    - clause 3 "excitations over a chosen vacuum obeying the CAR"
    omits: two sample points and one vacuum each; that the vacuum choice is an extra datum (a null direction) and that GR is the dynamics of the vacua are readings
