functions:
  check_ideal_is_spanned_by_radical_blades:
    kind: complete
    clauses:
    - '"f a = \hat a f"'
    - '"J = Cl rad V = rad V Cl, spanned by the blades with a radical factor, dim 2^n - 2^(n-r)"'
    omits: every diagonal signature (p,q,r) with r >= 1 and n <= 5 (35 signatures); non-diagonal Gram
      matrices are covered by the proof (the statement is basis-free)
  check_nilpotency_index_is_r_plus_one:
    kind: complete
    clauses:
    - '"J^k is spanned by the blades with at least k radical factors"'
    - '"J^(r+1) = 0 and J^r != 0"'
    omits: every diagonal signature with r >= 1 and n <= 5, powers computed from spanning sets
  check_quotient_is_clifford_algebra_of_reduced_space:
    kind: complete
    clauses:
    - '"pi is an algebra homomorphism onto Cl(V/rad V) with kernel exactly J"'
    - '"Q-bar well defined"'
    omits: every pair of basis blades for every diagonal signature with r >= 1 and n <= 5; the
      vector clause on three sampled vectors per signature
  check_j_is_the_largest_nilpotent_ideal:
    kind: complete
    clauses:
    - '"J is the radical of (x, y) -> <xy>_0"'
    - '"tr L_x = 2^n <x>_0"'
    omits: every signature with n <= 4 for the form; the trace identity on two sampled elements per
      signature; that nilpotent ideals have traceless elements is proved in the text
  check_null_hyperplane_of_spacetime:
    kind: sampled
    clauses:
    - '"Example: the null hyperplane k^perp of R^{1,3}"'
    - '"e^N = 1 + N"'
    omits: the one null vector k = g0 + g1 and two null rotations; other null vectors are Lorentz images
  check_non_diagonal_gram_matrices:
    kind: sampled
    clauses:
    - '"J = Cl rad V, dim 2^n - 2^(n-r)" for non-diagonal Gram matrices'
    - '"J^(r+1) = 0, J^r != 0"'
    omits: three non-diagonal degenerate Gram matrices (n = 3, 3, 4; r = 1, 1, 2) in the exterior
      model; J^(r+1) tested on the words a f b f (r = 1) and a f b f' f'' (r = 2), the reduction
      of general products to these is (ii) of the proof
untouched_premises:
  std-algebra.sylvester-inertia: "cited for an orthonormal basis of the complement; GA.py signatures are diagonal already"
