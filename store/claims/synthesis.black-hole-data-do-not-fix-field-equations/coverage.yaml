functions:
  check_black_hole_data:
    kind: partial
    clauses: [(i), (ii), (iv)]
    omits: 'Curvature is computed at one mass (M = 3/2), one Q^2 and one Lambda, at the single angular point x = 1/2, exact in r: Ricci-flat Schwarzschild, K = 48 M^2/r^6, Ricci = Lambda g, RN mixed Ricci components, nonzero R^t_t + R^r_r at the RN horizon, and the Wald term 4 pi beta (R^t_t + R^r_r) A. (ii) is computed under (W) only for the Einstein part (A/4G) and the two quadratic monomials R_ab R^ab, R^2 (zero on Schwarzschild); higher-degree monomials are not tried. Horizon locus, surface gravity and Hawking''s integral are derived from f at five masses (1/T interpolated through four, confirmed at the fifth, integrated in M). Not tested: that a vacuum field solves the field equations of every L_f, and (iii)''s claim that the matter field equations differ from Einstein''s (no field equations are derived).'
  check_gtg_black_hole_data:
    kind: sampled
    clauses: [(i), (ii), (iv)]
    omits: 'Gauge-field computation at five Schwarzschild points (two masses) and two Reissner-Nordstrom points (M = 3/2, Q^2 = 5/4): curvature operator, vacuum, Kretschmann, radial eigenvalue, horizon rate; the Wald direction -<B sigma> sigma read through C11 as Riem^o = -eps_uv eps_wz on all frame quadruples (constant 1); the Wald contraction as a derivative along -<B sigma> sigma for R, R^2 and Ric^2 only (quadratic Lagrangians, where the symmetric difference is the exact derivative). Not tested: the vacuum field equations of every L_f and the fourth-order claim of (iii).'
  check_gtg_formal_readings_of_the_ricci_components:
    kind: sampled
    clauses:
    - 'formal conventions: gamma^a . calR(gamma_b) = R^a_b in signature (-,+,+,+) with the Ricci tensor positive on spheres, and d_a . calR(a) = R'
    - '(i) 2 <calR(a ^ b) calR(d_b ^ d_a)> = R_abcd R^abcd; (iii) d_a . calR(calR(a)) = R_ab R^ab; (iv) d_a . calR(P_sigma(a)) = R^t_t + R^r_r and the RN radial value -Q^2/r^4'
    omits: 'three static fields (Reissner-Nordstrom, Reissner-Nordstrom-de Sitter, Schwarzschild) at one radius each, all sixteen mixed components against the Christoffel computation; the general identification is the dictionary''s C11 with the C7 signature change, argued in the proof'
judge:
  by: fix-round-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: 'Surface gravity and horizon now derived from f, Hawking integral computed (1/T fitted at five masses, integrated, equals A/4), (ii) computed for the Einstein part and two quadratic monomials; docstring lists (iii) and the vacuum field equations as untested.'
