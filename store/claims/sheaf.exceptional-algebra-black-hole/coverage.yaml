functions:
  check_rescaled_gram_and_its_limit:
    kind: exact
    clauses: ["Gram limit diag(m^2,-1,-1,-1), signature (1,3)", "cross term -sqrt r vanishes at the wall", "dying entry -1 exact, not limiting"]
    omits: "exact in u but only m = 1, 2, 3, at the equator"
  check_residue_is_minus_k_tensor_k:
    kind: exact
    clauses: ["none: the residue of the inverse cometric is not asserted by this statement"]
    omits: "computes r G^-1 -> -k (x) k on the (rho, dt) block, which belongs to the residue entity, so it establishes no clause here"
  check_exceptional_algebra_is_cl13:
    kind: exact
    clauses: ["the exceptional algebra of the Schwarzschild singularity is Cl(1,3)"]
    omits: "checks that the rescaled orthonormal frame satisfies the Cl(1,3) relations in the Chevalley model of the limit form for m = 1, 2, 3; that the exceptional algebra defined by deformation to the normal cone equals the Clifford algebra of the limit form is the imported premise, not tested"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The rescaled Gram, its limit diag(m^2,-1,-1,-1) and the Cl(1,3) relations are exact (rational functions in u, masses 1, 2, 3); the identification of the exceptional algebra with this Clifford algebra is the premise's content.
