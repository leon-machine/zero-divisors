functions:
  check_tower_pairs_give_windows:
    kind: sampled
    clauses:
    - (i)
    omits: CAR for v_j, w_j in Cl(n,n) for n = 1..4, the projection pair v_0 w_0, w_0 v_0, and the dimension 4^n of the generated algebra (rank of the 4^n ordered words) for n = 1..4; the tower limit, the physical closure and the shadow walls are interpretive and untested
  check_particle_hole_turns_array_into_positive_modes:
    kind: sampled
    clauses:
    - (ii)
    omits: 'Jordan-Wigner windows k = -K..K for K = 1, 2 and q = e^{-beta kappa} in {1/2, 1/3, 2/5}: CAR for a and b, N''_k = 1 - N_k for k < 0, H = H'' + sum_{k<0} k, frequency multiplicities, Gibbs marginals; the time evolution b_k -> e^{-i kappa |k| t} b_k is not computed directly and the general-window case is not enumerated'
  check_zero_mode_kms_is_trace:
    kind: sampled
    clauses:
    - (iii)
    omits: n = x(1 - n) with x = e^{-beta omega} solved at omega = m kappa, m = 0..3, e^{-beta kappa} = 1/2, giving n = 1/2 at m = 0; the final Consequently paragraph (definition applies with J = Z minus 0, I-state under (Q)) is untested
untouched_premises:
  hawking.i-state: declared for the closing paragraph (I-state identification under (Q)), no function calls it
  tower.answers-iteration-question: declared for the physical-closure and shadow-wall remark in (i), interpretive and untested
