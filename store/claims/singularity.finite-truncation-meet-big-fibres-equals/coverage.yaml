functions:
  check_meet_of_big_fibres_is_joint_diagonal:
    kind: sampled
    clauses: ["intersection of the big fibres B_j is the joint-number-diagonal algebra of dimension 2^N"]
    omits: "N = 1, 2, 3 points only (Jordan-Wigner matrices); exact linear algebra at each N"
  check_join_of_small_fibres_is_the_same_algebra:
    kind: sampled
    clauses: ["the algebra generated by the small fibres A_x^+ equals the meet, dimension 2^N"]
    omits: "N = 1, 2, 3 points only; closure of the span under products computed exactly"
  check_range_of_joint_descent_is_the_same_algebra:
    kind: sampled
    clauses: ["range(E_F) equals both, dimension 2^N"]
    omits: "N = 1, 2, 3 points only; E_F built as the composite of the mode-wise parity averages, and checked on every matrix unit to be the pinching (diagonal units fixed, off-diagonal ones sent to 0)"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "W413 pass 2026-10-23: check_range_of_joint_descent_is_the_same_algebra now pins E_F on every matrix unit (fixes diagonal units, kills off-diagonal ones), which fixes the 1/2 of each parity average that the rank checks could not see; N samples moved to module level"
