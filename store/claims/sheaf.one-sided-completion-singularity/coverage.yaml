functions:
  check_determinant_identity_and_no_shadow_wall:
    kind: sampled
    clauses: ["no shadow wall forms anywhere in the manifold"]
    omits: "det h = det G (-F) is an exact rational-function identity in u, but only for m = 1, 2, four couplings and three bump values; F >= 1 is evaluated at four interior radii per mass rather than deduced symbolically from s < 0 and mu nu < 0"
  check_signature_two_four_on_the_whole_closure:
    kind: sampled
    clauses: ["h is nondegenerate of constant signature (2,4) at every point of the manifold, E included"]
    omits: "signature at E, at four interior radii with three bump values, and at four horizon-and-exterior radii with b = 0, for four couplings and m = 1, 2; the smooth bump profile between sample values is not modelled"
  check_ladder_pair_exactly_over_the_boundary:
    kind: sampled
    clauses: ["k* = n_O/(2 nu), k k* + k* k = 1, k^2 = (k*)^2 = 0", "the ladder pair exists exactly over E"]
    omits: "one coupling (nu,mu) = (1,-1) and m = 1, 2; the relations are checked on all 64 states at E, and 'exactly over E' only as c(k)^2 = -r != 0 at u = 1/2 and 1; 'the subalgebra generated by W is canonically the degeneration sheaf' and the Cl(1,3) to Cl(2,4) ascent are not computed"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The determinant identity, signature (2,4) on E and at sample interior and exterior radii, and the ladder pair on E (64 states) are verified at masses 1, 2 with sample couplings and bumps; the canonical identification of the generated subalgebra is stated as not computed.
