functions:
  check_boltzmann_yield:
    kind: sampled
    clauses: ["Y = c T_desc^3 / (3 kappa_s M_P^3)"]
    omits: "Gamma/(H T s) = c T^2/(kappa_s M^3) is checked at nine rational (h, sigma, T) samples with H = h T^2/M, s = sigma T^3 assumed; the antiderivative T^3/3 is exact but the Riemann-sum bracket is a numerical sanity check; the Boltzmann equation dY/dT = -Gamma/(H T s) itself is taken; that the rate counts events of two quanta is taken from the pair-production theorem (its check exports nothing), and the yield 2Y of quanta is the same identity with source 2 Gamma; the energy fraction u (sigma/r) Y for mean energy u T per event is the same identity with rho = r T^4 in place of T s"
  check_kappa_and_convention:
    kind: exact
    clauses: ["kappa_s = 145.3 at g_* = g_s = 100"]
    omits: ""
  check_mean_energy_per_event:
    kind: exact
    clauses: ["mean energy of a leg 4 zeta(5)/zeta(4) T = 3.832 T (Bose), (30/7) zeta(5)/zeta(4) T = 4.106 T (Fermi)", "events 7.664 T (Bose pair), 8.212 T (Fermi pair); 7.66 < E/T < 8.22 for every bath and content", "E = 7.873 T (real scalar), 7.890 T (chiral fermion, vector), 7.889 T (a copy) for the bath (4, 45, 12)", "energy fraction between 10.49 Y and 10.52 Y"]
    omits: "that each incoming leg is weighted by E^3 times its occupation is read from the proof of clause (v) of the pair-production theorem (its check exports nothing) and enters as the moments Gamma(k+1) zeta(k+1) and their Fermi factors 1 - 2^-k, which are not derived here; the consistency tested is that the theorem's Fermi coefficient 49/4800 is 3 (7/8)^2/225 and that the Bose and Fermi parts sum to the theorem's printed rationals; zeta(5) is bracketed by a partial sum with integral tail bounds and zeta(4) = pi^4/90 is compared with its own partial-sum bracket"
  check_floor_prefactor_and_scaling:
    kind: sampled
    clauses: ["xi_floor = ((4/3)(E/T) Y g*/g_d)^(1/4) = 1.23e-3 c^(1/4) (16/g_d)^(1/4) (T_desc/6e14 GeV)^(3/4)", "prefactor between 1.225 and 1.226e-3 for the three contents, between 1.21 and 1.24e-3 for any bath and content", "energy fraction (4/3)(E/T) Y"]
    omits: "the prefactor is an exact bracket at one point (c = 1, g_d = 16, T = 6e14, M_P = 2.435e18) for each of the four values of E/T and for the Bose and Fermi ends; the scaling in E/T, c, g_d, T_desc is checked at three samples; the energy fraction is the rational identity (2/45) 30 = 4/3 at g* = g_s, with the energy equation's sample identity in check_boltzmann_yield; thermalisation within the tower and a constant g* during production are assumed; the ratio to the deposited paper's value at 3T per event (9.625149e-4) is bracketed in (1.272, 1.274)"
  check_ceiling_range_factor:
    kind: exact
    clauses: ["(3.5e11/6e14)^(3/4) = 3.75e-3, about 4e-3"]
    omits: "the endpoints 3.5e11 and 6e14 GeV come from the ceiling premise and are not re-derived"
  check_later_evolution_of_the_ratio:
    kind: sampled
    clauses: ["later evolution of the ratio by (g_d_seed/g_d)^(1/3) (g_s/g_s_seed)^(1/3)"]
    omits: "checks the cube of the ratio at two rational histories under assumed separate entropy conservation; not the cube root"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "the numbers 145.3, 9.6e-4 and 3.75e-3 are bracketed exactly; the closing remarks (floor is a lower bound, deposit energy undetermined) have no computable content. 2026-10-23 (weak checks): check_kappa_and_convention pins kappa_s = 145.25993 and sqrt(8 pi^3/90) = 1.6601547 by hand (which pins the 8 and the 90); check_floor_prefactor_and_scaling pins xi_floor = 9.625149e-4; the quoted brackets are implied and were removed; scaling samples moved to module level. 2026-11-18 (maintainer pass, version 5): the two changed functions touch the pair-production theorem; the added clause (events of two quanta: yield 2Y of quanta, energy fraction 8Y against the stored 4Y, 2^(1/4) in (1.189, 1.190)) is checked exactly; not judged again by an independent judge. 2026-11-18 (maintainer pass, version 6): the floor is defined with the mean energy per event; the new function check_mean_energy_per_event brackets zeta(5), the two leg means, the four event energies and the energy fraction exactly, and check_floor_prefactor_and_scaling pins the prefactor at 1.225073e-3, 1.225718e-3 and 1.225708e-3; the clauses on 4Y, 8Y and 2^(1/4) are gone with the statement; not judged again by an independent judge."
