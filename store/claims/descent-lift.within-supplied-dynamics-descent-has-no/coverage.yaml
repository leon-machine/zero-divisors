functions:
  check_admissible_generators_conserve_number:
    kind: sampled
    clauses: ["admissible generators (hops and Cartan elements, the supplied class) conserve total number"]
    omits: "pair plus two rungs (4 modes) only; the symmetric hops a_i^dag a_j + a_j^dag a_i, N_k and the 16 parity monomials are the full set there, but the antisymmetric (i-multiplied) hops are not run and general nu, k are not covered"
  check_vacuum_ray_stabilisers_have_no_pairing:
    kind: sampled
    clauses: ["Hermitian quadratic elements that stabilise the joint vacuum ray are hops and Cartan elements, with no pairing component"]
    omits: "4 modes; the six pair states a_i^dag a_j^dag |0> are shown independent (rank 6, exact), but the stabiliser statement is run on two sample quadratics (with and without pairing) and one pair annihilation; so(2(nu + k)) is named, not enumerated, as the docstring says"
  check_lift_needs_pairing_on_rungs:
    kind: sampled
    clauses: ["no unitary generated by admissible elements realises a lift", "a lift exists when a pairing rotation is added; it places the pairing on the rungs"]
    omits: "nu = 2, k = 2 only; the no-lift direction is the charge-sector count (system part A, total number |A| forces record |00>), not a computation over unitaries generated by the admissible algebra; the existence direction exhibits C(1 + X), which induces 2E and is not unitary (1 + X has norm sqrt 2 on the even pair)"
  check_quartic_control:
    kind: partial
    clauses: ["a lift needs a generator that fails to conserve the total number"]
    omits: "a control, not a test of the statement's quadratic scope: it shows one quartic generator K = N0 (a2^dag a3^dag - a3 a2), even, killing the vacuum and not number-conserving, whose pi/2 rotation is an orthogonal map carrying psi (x) |00> to the two-rung occupation copy at (4/5, 3/5); the quartic generator is not in the admissible class, and the unit i is represented by the scalar i"
untouched_premises: {}
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The docstring states the four-mode scope and what is not computed; the general-nu,k claims are covered only by the proof."
