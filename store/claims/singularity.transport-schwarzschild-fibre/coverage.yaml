functions:
  check_static_fibre_lift_incidence_involution:
    kind: sampled
    clauses: ["in the static gauge the Gram of Q_p is diag(f, -1/f, -r^2, -r^2 sin^2)", "(1) X_p(x) satisfies the incidence condition, iota preserves it and is an involution"]
    omits: "three static rational points and two sample x each; the quadric value is preserved by iota on one generic non-incident N"
  check_invertible_directions_return_reciprocal:
    kind: sampled
    clauses: ["(2) if Q_p(x) != 0 then dsc(iota(X_p(x))) = x/Q_p(x), read through the identification x -> hb^{-1}(x): the physical vector hb^{-1}(x)/Q_p(x)"]
    omits: "three static points, three x each; the iota slots are pinned as s = -Q_p(x), t = -1/2"
  check_null_directions_go_ideal:
    kind: sampled
    clauses: ["(3) if Q_p(x) = 0, in particular x = e_t + f e_r, then iota(X_p(x)) = [x + (1/2) n_inf], an ideal point, and dsc is undefined"]
    omits: "three static points; iota(X_p(x)) = -(hb^{-1}(x) + n_inf/2) with hb^{-1}(x) = sqrt(f)(e_t + e_r), the class [hb^{-1}(x) + n_inf/2] of the statement's identification; Q(e_t + f e_r) = 0 as an identity in Q(r) only via f - f^2/f"
  check_dying_direction_dual_norm_and_read_out:
    kind: sampled
    clauses: ["(4) Q*_p(xi) = -r exactly at every radius, the horizon included", "iota(X_p(xi)) descends at every r > 0 to dsc = -xi/r (the physical covector -hb^T(xi)/r) and converges as r -> 0+ to an ideal point", "the read-out fails exactly on E"]
    omits: "dual norm checked at 3 masses x 4 radii in the PG gauge, at three static points, and as exact identities in Q(r) for the static form and PG Gram; 'nowhere else in the physical closure' is read from s = r != 0 at samples, the u -> 0 limit from four values of u"
