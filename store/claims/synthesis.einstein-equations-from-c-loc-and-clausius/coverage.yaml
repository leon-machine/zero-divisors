functions:
  check_focusing_leading_order:
    kind: sampled
    clauses: ["(2)"]
    omits: "exact power-series algebra but at 2 kappa x 2 e x 3 slope/shear/Killing-error samples; the Raychaudhuri ODE is typed in; the lam0^3 coefficient kappa((t1 + e2 t0)/3 - e r1/6) and the shear's lam0^4 shift -kappa e s2/12 are pinned against by-hand series, the rest of lam0^4 only as 'enters here'"
  check_equilibrium_hypotheses:
    kind: sampled
    clauses: ["(2)"]
    omits: "shear shift -kappa e s0/2 and the first-order theta0 defect, at one parameter point; (H2) twist-free remark not tested"
  check_unruh_to_killing_temperature:
    kind: sampled
    clauses: ["(1)"]
    omits: "symbolic in the orbit parameter but sampled in rho and kappa; 1+1 Rindler wedge only; the Unruh temperature a/2pi is an input (clause (ii)), so only |chi| = kappa rho and a = 1/rho are computed"
  check_null_null_to_store_einstein:
    kind: sampled
    clauses: ["(2)", "(3)", "(4)"]
    omits: "polarisation rank 9 with kernel g is exact on 11 null vectors, but the passage Ric0(l,l) = kap T(l,l) to the Einstein form and the (3) restatement are checked at sample kap, h, e and fixed matrices; constancy of Lambda is not here; the (1,3) to (3,1) signature restatement is not tested"
  check_universality_at_bianchi:
    kind: sampled
    clauses: ["(6)", "(4)"]
    omits: "differences reading only, at three sample dkap and two kap; the contracted Bianchi relations are typed in as a 2x2 linear system rather than derived; constancy of Lambda in (4) is tested only through dkap = 0"
  check_integrated_entropy_reading:
    kind: sampled
    clauses: ["(6)"]
    omits: "integrated reading only, linear eta along one generator at sampled e0, e1; the first-order defect kappa e1 is shown, 'forces grad eta = 0' is the reading of that"
  check_dimension_enters_only_at_trace:
    kind: sampled
    clauses: ["(H4)"]
    omits: "the statement has no dimension-n clause; this tests a side remark (rank 5 of 6 in 3D, dh = kap dtau/(n-2) for n = 3..6), not any numbered conclusion"
  check_newton_constant:
    kind: sampled
    clauses: ["(5)"]
    omits: "G_cl = 1/(4 eta) is checked at three eta values; the mode-count reading G_cl = G/(16 pi nu <s>) is checked after a hand-chosen parametrisation nu = c/(pi L) that removes pi, so the pi cancellation is not tested; the 'registered nu' assert is arithmetic"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "checks match their docstrings and the statement; hypotheses (H1) to (H3) and the Einstein-form signature restatement are not tested, and pi bookkeeping in (5) is by hand. 2026-10-23 weak-checks: check_focusing_leading_order now pins the lam0^3 coefficient and the shear's lam0^4 shift by hand; check_integrated_entropy_reading pins the differences-reading defect through lam0^3 and counts that the e1 = 0 control ran"
