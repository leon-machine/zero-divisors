functions:
  check_chiral_traces_are_two_proj:
    kind: complete
    clauses:
    - '(1) Tr X = 4 <X>_0 and the chiral traces 2(<X>_0 -+ i x_4) on all sixteen blades of Cl(1,3), through explicit Dirac matrices over Q(i); the four-vector scalar and pseudoscalar parts'
    omits: 'the four-vector identities are tested on one sample quadruple (they follow from the blade statement by linearity)'
  check_vacuum_polarisation_transverse_with_log_coefficient_one_twelfth:
    kind: complete
    clauses:
    - '(2) the shifted, symmetrically integrated numerator -2 Q(l) g + 8 x(1-x)(Q(q) g - q q) + 4 Delta g; transversality; the vanishing I4 part of the chiral numerator after symmetric integration, with the control that the terms linear in l carry a nonzero I4 part; the radial antiderivative of the g part; its cancellation under Pauli-Villars with the single-regulator control; the rational coefficient 1/12'
    omits: 'the numerator is checked at five x (a quadratic polynomial in x) and one sample q; the Wick rotation, the angular integral pi^2 u du and the logarithmic integral are imported (the one-loop machinery Fact) and stated in the proof'
  check_contraction_identities_four_dimensional:
    kind: sampled
    clauses:
    - '(3) the four-dimensional contraction identities used in the vertex'
    omits: 'tested on one sample triple of rational vectors (the identities are multilinear; the standard proof is in the text)'
  check_vertex_magnetic_part_and_schwinger_coefficient:
    kind: sampled
    clauses:
    - '(3) the on-shell sandwich decomposition with b = 2 m z(1-z) and c = -2 m (z-2)(x-y) at seven simplex points (no common conic) and two on-shell momentum pairs; the Q(l) part g^mu; the Gordon identity with the real bivector and its sign control; the exact parameter integral 1; the unit chain to F2(0) = e^2/(8 pi^2)'
    omits: 'momentum independence of b and c is checked at two pairs only (the standard reduction covers all); the Wick-rotated integral of (l^2 - Delta)^{-3} is imported'
  check_resolvent_and_ward_takahashi_integrand:
    kind: sampled
    clauses:
    - '(4) the inverse of k - m, the resolvent identity in both orders with sign and one-propagator controls, and the integrand-level Ward-Takahashi identity'
    omits: 'two sample momentum triples; the identity is algebraic for every k off the mass shell; passing it through the regulated integral and the definitions of Z1, Z2 are in the text'
  check_unit_inside_massive_loop_breaks_transversality:
    kind: sampled
    clauses:
    - '(5) the numerator with I4 inside the product equals -N + 8 m^2 g (agreeing at m = 0); the Pauli-Villars remainder sum c_i M_i^2 ln Delta_i is nonzero at q = 0 by the prime-exponent argument'
    omits: 'five x, three masses, two loop momenta; the logarithmic integral multiplying 8 m^2 g is imported'
untouched_premises:
  synthesis.imported-one-loop-integrals-and-pauli-villars-regulators: "the imported loop machinery (parametrisation, Wick-rotated integrals, Pauli-Villars, covariant propagator) is stated in the proof; the check computes the exact numerators and rational integrals it is applied to"
  synthesis.krein-form-premise-indefinite-inner-product-for-gauge-fields: "the premise licenses the covariant propagator and negative-weight regulators; nothing in the check computes from it"
