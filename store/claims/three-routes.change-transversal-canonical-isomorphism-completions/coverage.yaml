    clauses: ["(5) ladder (k, n0/2nu) is carried to a CAR pair of h_u for the same k"]
    omits: "Two cases only (one fibre each, first basis v) in the 64-state exterior model; no completion of the Clifford algebra and no check that the induced map is an algebra isomorphism beyond the CAR relations of the image pair."
