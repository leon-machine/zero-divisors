    clauses: ["(1) h_u(Phi_v x, Phi_v y) = h_(u+v)(x, y)", "(2) Phi_v is the identity on W and fixes k", "(3) Phi_v unipotent and invertible"]
    omits: "Schwarzschild boundary data at m = 1, 2, 3, 1/2 with two transversals, two (mu, nu) pairs and four choices of v (64 cases); not general G, u, v, mu, nu."
