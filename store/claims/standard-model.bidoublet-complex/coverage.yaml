functions:
  check_real_rung_vector_has_conjugate_coefficients:
    kind: sampled
    clauses: ["a real vector x gamma_6 + y gamma_7 equals a v_4 + b w_4 with b = conj(a), so |a| = |b|"]
    omits: "four real (x, y) samples including the proof's (3, 5), and a converse on three (a, b) examples; not a symbolic identity in x, y"
  check_mass_form_magnitudes:
    kind: sampled
    clauses: ["the mass form of a rung vector has entries of magnitude |a| on (L, nu^c), (Q, u^c) and |b| on (L, e^c), (Q, d^c)"]
    omits: "two (a, b) pairs (one real, one complex); these are the entries of the called one-vev Corollary and are recomputed from the invariant pairing built from its formula"
  check_one_rung_vector_gives_equal_up_and_down_masses:
    kind: sampled
    clauses: ["with the up-type masses read through the conjugate c*, one rung vector c = a v_4 + b w_4, real or complex, gives m_u = m_d at tree level"]
    omits: "two real and three complex samples (a, b); the reading of the up-type masses through c* = conj(b) v_4 + conj(a) w_4 is taken from the Corollary rather than derived, and the control (read through c, complex samples separate) shows the reading matters"
  check_two_couplings_separate_up_and_down:
    kind: sampled
    clauses: ["m_t != m_b needs a second independent doublet coupling", "a second independent doublet coupling separates m_u from m_d"]
    omits: "two samples of independent rung vectors c_1 (down-type) and c_2 (up-type through c_2*), giving unequal magnitudes |b_1|, |b_2|; that 'a complex bidoublet, carrying two electroweak doublets, supplies one' is not tested (no bidoublet is constructed), and necessity is only the one-vector equality of the previous function"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "exact Q(i) computation in the 32-dimensional Fock module at sample vectors; the bidoublet-supplies-a-second-coupling sentence is untested"
