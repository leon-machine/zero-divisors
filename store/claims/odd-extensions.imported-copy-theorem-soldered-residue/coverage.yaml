    clauses: ["Cl^0(2,4) and Cl^0(4,2) are both Mat(4,C)"]
    omits: ""
  check_residue_is_soldered:
    kind: exact
    clauses: ["the residue is a soldered invariant, not an algebraic one"]
    omits: "Compares only the congruence signatures (2,4) and (4,2) of the two generating subspaces and their residues 6 and 2; the claim that the one metric superselects the tower charge is not computable."
