    clauses: ["Cl^0(2,4) is isomorphic to Cl^0(4,2) (and Spin(2,4) to Spin(4,2))", "the reversion form is invariant under signature reversal"]
    omits: "Multiplicativity of phi on all 32 x 32 even blade pairs, bijectivity, grade preservation and compatibility with reversion; the helicity form and the mass formula of two conformal spinors are not computed beyond this algebraic carrier."
  check_both_are_mat4c:
