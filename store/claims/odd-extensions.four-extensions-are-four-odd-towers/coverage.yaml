functions:
  check_residues_and_roles:
    kind: exact
    clauses: ["residues of the four extensions are 5, 7, 1, 3", "(1,4), (4,1) are the representatives at residues 5 and 3; (2,3), (3,2) are the ambients of (1,2), (2,1)"]
    omits: "The table of representatives at the dimension nearest four is hard-coded from the imported Fact; only its residue consistency and the membership of (1,4), (4,1) are checked, so the role clause restates the Fact."
  check_conformal_step_is_one_rung:
    kind: exact
    clauses: ["Cl(2,3) and Cl(3,2) are the conformal ambients of (1,2) and (2,1)"]
    omits: "Computed for exactly these two cases (Cl(2,3) = Mat_2(Cl(1,2)) and Cl(3,2) = Mat_2(Cl(2,1)) by commuting copies, 32 distinct blades); the general conformal completion is the imported Fact."
  check_frozen_point_algebra_coincides_as_algebra_only:
    kind: sampled
    clauses: ["Cl(I^perp) coincides with a five-dimensional shadow for Lambda > 0 and a three-dimensional ambient for Lambda < 0 as an algebra, and neither as a soldered object"]
    omits: "Four (t, s) samples, two of each sign of Lambda; the algebra coincidence is read from the signature of I^perp and the soldered side from the frame's residue 6, with the soldered argument itself in the cited belongs-tower."
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The residue arithmetic, the one-rung step for the two ambients and the algebra-versus-soldered residues are computed; the roles rest on the imported representatives table."
