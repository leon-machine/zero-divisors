functions:
  check_blade_product_is_the_twisted_rule:
    kind: sampled
    clauses: ["setup: the blade product e_S e_T = (-1)^f(S,T) e_{S xor T}, associativity through bilinearity of f, and v^2 = Q(v)"]
    omits: "all signatures with n <= 4 (every pair and triple of blades); v^2 = Q(v) on integer vectors with coordinates in {-2, 0, 1, 3}; general n is the proof's bilinearity argument"
  check_vector_invertible_exactly_when_its_square_is_a_unit:
    kind: sampled
    clauses: ["(i) v is invertible over R exactly when Q(v) is a unit of R, with v^{-1} = v/Q(v)"]
    omits: "integer vectors with coordinates in {-3, ..., 3} in Cl(2,0), Cl(1,1), Cl(0,3), Cl(1,2) and the rings Z[1/P] for five prime sets P; the converse over an arbitrary commutative ring is the proof's, sampled once over Z/6Z by its own function"
  check_the_smallest_ring_of_division_is_the_rationals:
    kind: sampled
    clauses: ["(ii) e_1 (m e_1)^{-1} = 1/m, so inverting the non-null integer vectors inverts every integer; the grade-0 part of a product of rational elements is rational"]
    omits: "m = 1..30 in Cl(1,0), Cl(0,1), Cl(1,1); all m is the proof's one-line computation"
  check_null_vectors_and_zero_divisors_survive_division:
    kind: sampled
    clauses: ["(iii) nonzero null vectors exactly for p, q >= 1; zero divisors exactly outside (0,0), (0,1), (0,2), with integral witnesses; x xbar = sum of squares in the three exceptional signatures"]
    omits: "every signature with n <= 5 (null vectors searched on a box, which suffices for the existence direction; absence for definite forms is the proof's); x xbar on a grid of integer coefficients"
  check_invertibility_over_the_integers_mod_six:
    kind: complete
    clauses: ["(i) over a commutative ring that is not a subring of Q: in Cl_{Z/6}(1,1) a vector has a left or right inverse exactly when Q(v) is a unit"]
    omits: "one ring and one signature, searched exhaustively over all 6^4 elements; other rings are the proof's"
