functions:
  check_atom_on_the_physical_radial_plane:
    kind: sampled
    clauses: ["the hyperbolic atom on the radial plane, sigma = v*v - vv* = e0 e1, sigma^2 = +1", "at every r > 0 the radial plane has signature (1,1) and carries a CAR pair inside Cl(1,3) with no ascent"]
    omits: "atom identities are exact constants; the physical plane is tested at four values of beta only (1/3, 1, 2, 5), not every r > 0"
  check_eigen_and_square_characterise_sigma:
    kind: complete
    clauses: ["S(sigma) = -2 sigma and sigma^2 = +1 characterise sigma up to sign among the unit frame bivectors", "the square excludes the dual, (I sigma_r)^2 = -1"]
    omits: "exhaustive over the 12 signed unit frame bivectors; that the eigenvalue equation confines sigma to {sigma_r, I sigma_r} is imported (only S(sigma) and S(I sigma) = -2 are verified), and the (a,b) square computation is on a rational grid"
  check_boost_flow_weights_and_orientation:
    kind: sampled
    clauses: ["the flow generated by sigma has opposite weights on v and v*", "exchanging v and v* sends sigma to -sigma (the Z_2 orientation)"]
    omits: "three Pythagorean-hyperbolic samples (ch, sh) of the real rotor ch + sh sigma; the phase flow Ad(e^{it sigma/2}) and the match with Theorem modular-structure-completed-pair(2) are not tested"
  check_degenerate_plane_at_r_zero_and_shared_direction:
    kind: sampled
    clauses: ["at r = 0 the radial plane degenerates, no CAR pair supported on it survives", "k-sharp = -sqrt(r) e_r is spacelike at every r > 0 while the atom's legs are null"]
    omits: "limit diag(-1,0) is obtained by quadratic interpolation through sample values of 1/beta (degree assumed), spacelikeness at four radii; corank one in the forced weighting, hyperbolic planes in the weighted module, the localisation theorem and the transport of the identification to E are not tested"
untouched_premises:
  sheaf.localised-transport: "cited for the localisation of the pair at the degenerate radial direction; a literature restatement with no computable content here"
  sheaf.one-sided-completion: "cited for the completion's ladder pair over E (the imported Fact); not computed in this check"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "the computable parts (atom, characterisation among 12 bivectors, boost weights, degeneration at r=0) are tested as recorded; the identification-by-transport to E is a stated residual step and untestable"
