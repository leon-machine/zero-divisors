functions:
  check_hyperbolic_plane_and_signed_ascent:
    kind: sampled
    clauses: ["(i)", "(ii)"]
    omits: "Four non-null samples (c, d), two of each sign of Lambda, not a symbolic identity in (c, d). The chain Cl(1,3) in Cl(I^perp) in Cl(2,4) is read from dimensions 16, 32, 64 of the generated subalgebras and the induced signatures; the isomorphism with Cl(1,4) or Cl(2,3) is by signature of the generating vectors."
  check_null_frozen_point_degenerate:
    kind: sampled
    clauses: ["(iii)"]
    omits: "Two null samples only (c = d = 1 and c = d = -5/2); the opposite null direction c = -d is not run. Cl(1,3;1) is identified by the generated 32-dimensional algebra with a square-zero 16-dimensional ideal, not by an explicit isomorphism."
  check_lorentz_frame_signature_constant:
    kind: sampled
    clauses: ["(iv)"]
    omits: "Six samples of (c, d); the frame is fixed in R^{2,4} and orthogonal to the plane by construction, so the sampling adds little."
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The three functions test (i) to (iv) on rational samples of the frozen point; the sampling is over (c, d) and no function runs a free-parameter identity."
