    clauses: ["the descent is complete if and only if the record is maximally paired"]
    omits: "factor evaluated at eight real A values and found zero only at A = +-1; the 'only if' over all A rests on the closed form (1 - A^2), and 'maximally paired' is read as A^2 = 1 without a separate entanglement computation"
