functions:
  check_constant_rank_sixteen_through_degeneration:
    kind: sampled
    clauses: ["A is locally free of constant rank 2^n", "the rank does not detect the degeneration"]
    omits: "n = 4 only, six samples of the Schwarzschild weighted Gram (m = 2) and four of one non-diagonal family; local freeness as a sheaf statement and 'for any cometric' are not tested"
  check_structure_functions_polynomial_in_gram:
    kind: sampled
    clauses: ["structure functions are polynomial in the components of G"]
    omits: "two products (e0 e1 and e0 e1 e0) along the one Schwarzschild family at six u, compared with hand-derived coefficients; general blade pairs and smoothness are not covered"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: Rank 16 of the blade symbols is checked at sample points along two n=4 degenerating families; polynomiality is checked for two products along one family.
