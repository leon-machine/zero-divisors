functions:
  check_square_of_an_odd_element:
    kind: sampled
    clauses:
    - '"C^2 = Q(v) + Q(w) - 2I(v ^ w)"'
    - '"C^2 = -1 if and only if v ^ w = 0 and Q(v) + Q(w) = -1"'
    omits: identity at six rational vector pairs, the unit-circle form at four angles and three unit vectors; the only-if direction is exhibited by counterexamples, not proved (the odd part spanning rank 8 is exact)
  check_rotors_move_u_over_the_hyperboloid:
    kind: sampled
    clauses:
    - '"carries C to R~CR and moves u over the whole one-sided hyperboloid"'
    omits: four sample targets with R = 1 - u' gamma_3 and one boost rotor; transitivity of Spin+(1,3) on the whole hyperboloid is not proved (R vanishes at u' = gamma_3, which is not sampled)
  check_chiral_phase:
    kind: sampled
    clauses:
    - '"psi -> psi exp(tI) carries C to C exp(2tI)"'
    - '"it is not a rotor"'
    - '"shifts the Takabayasi angle by the constant 2t"'
    omits: one angle (cos t, sin t) = (3/5, 4/5), three sample C and one spinor; I anticommuting with every odd blade is exact over the 8 odd blades
  check_even_part_of_c_excludes_invertible_even_solutions:
    kind: sampled
    clauses:
    - '"the parity of the fields forcing C to be odd (a law with an even part of C admits no even solution invertible anywhere)"'
    omits: four sample even parts C_+; the closing clause (every first-order covariant law with Klein-Gordon square is Dirac-Hestenes, minimal coupling scope) is not tested
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "no premises declared; the identities are checked at rational samples and the final classification sentence has no check, which the docstring does not claim. 2026-10-23 weak-checks pass: check_even_part_of_c_excludes_invertible_even_solutions now pins the rank of left multiplication by the annihilator element at exactly 8 of 16 (quaternionic rank 1 in Mat(2, H)) instead of < 16, and checks oddness of gamma^mu psi for every gamma^mu"
untouched_premises:
