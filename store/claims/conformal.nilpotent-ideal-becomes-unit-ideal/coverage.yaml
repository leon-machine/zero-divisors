functions:
  check_radical_ideal_dimension_and_nilpotency:
    kind: sampled
    clauses:
    - dim J = 2^m - 2^{m-r}
    - J^{r+1} = 0 and J^r != 0
    - J^2 = 0 precisely when r = 1
    omits: 19 (p, q, r) cases (p + q <= 2, 1 <= r <= 3, and PGA); J is generated by left multiples plus a few right
      multiples, which suffices because radical letters commute or anticommute with blades
  check_model_completion_unit_ideal:
    kind: sampled
    clauses:
    - in a completion the image of the radical generates the unit ideal
    - each radical vector spans a hyperbolic plane with a partner
    omits: the model completion rho_j -> a_j + b_j only, at the same 19 (p, q, r) cases
  check_any_completion_unit_ideal_hyperbolic_partner:
    kind: sampled
    clauses:
    - in any completion the image of the radical generates the unit ideal
    - each radical vector spans a hyperbolic plane with a partner of the completion
    omits: six (p, q, r) with two random nondegenerate samples each, all completions of minimal dimension m + r
      with diagonal nondegenerate part; completions of larger dimension are not sampled
untouched_premises:
  std-algebra.vector-squares: standard algebra cited in the proof; the check computes the statement directly
  std-algebra.radical-ideal-and-quotient: cited in the proof for the structure of the radical ideal; the check computes
    the ideal directly
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: Dimension counts are exact per case; the 'any completion' clause is sampled and limited to minimal-dimension
    completions.
