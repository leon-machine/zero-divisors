functions:
  check_even_residue_table:
    kind: complete
    clauses:
    - The even residues whose spacelike extension is type C are {2, 6}; those whose timelike extension is type C are {0, 4}
    - every even residue has exactly one obstructing one-dimensional extension
    omits: read off all even signatures with 2 <= p+q <= 8 (every residue occurs several times); dependence on p-q mod 8 alone beyond n = 8 is not tested
  check_physical_lineage_and_mirror:
    kind: sampled
    clauses:
    - The physical lineage sits at residue 6 and its Rule 1 ascents never leave it
    - it leaves residue 6 only through a spacelike Kaluza-Klein direction, into the obstruction at residue 5
    - the opposite-sign repair returns it to 6 as Mat_2 of where it started
    - the same holds at the mirror residue 2
    omits: ascents checked only (1,3) to (2,4) to (3,5); the "only through" claim only at (1,3) and (3,1); the causal-convention reading and the cited Proposition synthesis.mirror-extensions-causal-convention (not a declared use) are not tested
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The residue table is an exhaustive computation over n <= 8; the lineage and mirror sentences are checked at the two named signatures.
