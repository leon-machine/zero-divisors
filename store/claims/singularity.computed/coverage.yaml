    kind: sampled
    clauses: ["Q(K) = f = 1 - 2M/r", "K = hb^-1(e_t) is the static Killing field"]
    omits: "four (beta, M) sample points outside the horizon; Killing property as antisymmetry of A -> (A.D)K on the physical frame, via exact first-order jets"
  check_redshifted_acceleration_of_static_observers:
    kind: sampled
    clauses: ["redshifted proper acceleration sqrt f sqrt(-Q((v.D)v)) = f'(r)/2 at every r > 2M"]
    omits: "four sample points r > 2M with f' = 2M/r^2 typed; checked as f (-Q(a)) = (f'/2)^2"
