    kind: sampled
    clauses: ["kappa = lim f'(r)/2 = 1/(4M)"]
    omits: "three masses; computes (K.D)K = kappa K directly on the locus beta = 1 and compares with f'(2M)/2 = 1/(4M); the limit r -> 2M of the exterior acceleration is not taken as a limit"
