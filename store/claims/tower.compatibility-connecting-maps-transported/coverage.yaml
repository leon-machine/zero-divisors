functions:
  check_identification_data:
    kind: sampled
    clauses:
    - phi_k^-1 is multiplicative on matrix units, V_k invertible (u_A^2 = +-1)
    omits: Does not assert Omega_k^2 = 1 directly (only V V^-1 = 1 and the images of Omega-bar and u_A (x) Omega-bar); finite CASES only
  check_transported_connecting_map_is_ad_v_theta:
    kind: sampled
    clauses:
    - psi_k = Ad(V_k) o theta_k
    omits: Every basis element a (x) E_IJ is checked, on the eleven (ground, k) pairs in CASES, exactly those the docstring lists (Cl(0,0), Cl(1,1), Cl(2,0), Cl(0,2) at k = 1, 2; Cl(1,3), Cl(3,1), Cl(2,2) at k = 1)
  check_naive_corrector_and_labelling_convention:
    kind: sampled
    clauses:
    - the corrector is not the transported single-step corrector diag(1,u_Tk) for n >= 1
    - with vw and wv exchanged diag(1,u_Tk) works and V_k does not; for n = 0 they coincide
    omits: Exchanged-labelling test only on grounds (1,1), (2,0), (1,3); n = 1 does not occur (even charge forces n even)
judge:
  by: fix-round-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: CASES widened with Cl(2,0) at k = 2 and Cl(0,2) at k = 1, so all three functions now run every (ground, k) pair docstring (2) lists.
