functions:
  check_size_bounds_and_rank_inequalities_at_rung_two:
    kind: sampled
    clauses: ["(ii) bounds, N = 0 only at 0, subadditivity, invariance under nonzero multiples, N(ab) <= N(a), N(b)", "(i) the values are multiples of 2^-k, on samples with hand values"]
    omits: "fourteen elements of Cl_Q(2,2) with sizes pinned by hand, all ordered pairs; the general statements are the proof's dimension counts"
  check_frobenius_inequality_on_all_triples:
    kind: sampled
    clauses: ["(ii) N(ab) + N(bc) <= N(b) + N(abc)"]
    omits: "all 2744 ordered triples of the fourteen samples of rung 2; the general inequality is the proof's kernel count"
  check_size_is_the_rank_on_a_minimal_left_ideal:
    kind: sampled
    clauses: ["(i) N_k(a) is the rank of a on a 2^k-dimensional module divided by 2^k"]
    omits: "k = 2 only, on the left ideal generated by off_1 off_2 and the fourteen samples; the isomorphism with all maps for every k is the proof's induction"
  check_size_is_unchanged_up_the_tower:
    kind: sampled
    clauses: ["(iii) N_{k+1}(a) = N_k(a)"]
    omits: "the fourteen samples from rung 2 to rung 3 and four from rung 1 to rung 2; the general case is the proof's tensor factorisation"
  check_sizes_multiply_on_separate_switches:
    kind: sampled
    clauses: ["(iv) ab = ba and N(ab) = N(a) N(b) for b even on other switches", "(iv) evenness is needed: e_1 e_2 is a unit"]
    omits: "thirty pairs at rung 3 with a on switch 1 and b even on switches 2, 3, and one interleaved pair; general index sets are the proof"
  check_null_vectors_have_size_one_half:
    kind: sampled
    clauses: ["(v) every nonzero null vector has size 1/2, every other vector size 1; the tests have size 1/2 and are conjugate by e_i"]
    omits: "vectors of Cl_Q(2,2) with integer coefficients in [-2, 2] (128 nonzero null ones); all null vectors in every rung are the proof's two inequalities"
  check_idempotent_rules_that_force_the_size:
    kind: sampled
    clauses: ["(v) sizes of exclusive tests add and N(e) + N(1 - e) = 1", "(vi) the ingredients of uniqueness: invariance under conjugation, and 2^k exclusive minimal tests of equal size summing to 1"]
    omits: "rung 2 only, one conjugating unit; that these rules determine the function on every element is the proof, not computed"
