functions:
  check_window_gibbs_fd_kms_quasifree_consistent:
    kind: sampled
    clauses: ["(1)"]
    omits: "one three-mode window with Boltzmann factors (1/2, 1/3, 1/5): product state equals the Gibbs matrix, KMS on all 4096 matrix-unit pairs, Wick moments checked up to order 6 for the number operators and odd moments, and consistency under partial trace; 'the unique quasi-free extension of these window states' and 'tau-KMS on the full algebra' (Fact on inductive limits) are not tested"
  check_full_kms_forces_gibbs_gauge_invariance_and_fd_symbol:
    kind: sampled
    clauses: ["(2)", "(3)"]
    omits: "two-mode window, three pairs of Boltzmann factors (one degenerate); the full KMS system over all states has the Gibbs matrix as its only solution, with vanishing pairing and symbol delta_jk n_j; stronger than the quasi-free statement but only at two modes with diagonal h"
  check_one_particle_kms_symbol_and_pairing:
    kind: sampled
    clauses: ["(2)", "(3)"]
    omits: "one non-diagonal h = O diag O^T on three modes (rational orthogonal O, one set of Boltzmann factors): A(1 + E) = E has the unique solution A = E(1 + E)^{-1} (eigenvalues x_j/(1 + x_j)) and the antisymmetric pairing solving P E = -P is zero"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "the checks establish the window-level content of (1)-(3) exactly at chosen Boltzmann factors; uniqueness of the quasi-free extension and the inductive-limit step are not tested"
