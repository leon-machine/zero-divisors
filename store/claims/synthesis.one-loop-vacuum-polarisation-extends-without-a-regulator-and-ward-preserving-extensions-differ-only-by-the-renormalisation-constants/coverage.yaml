functions:
  check_spin_traces_and_homogeneity_in_the_spacetime_algebra:
    kind: complete
    clauses:
    - '(i) <g_mu x g_nu x>_0 = 2 x_mu x_nu - g_mu_nu Q(x) and <g_mu x g_nu>_0 = 0 in Cl(4,0) and Cl(1,3), by polarisation on e_i and e_i + e_j (and one generic vector); g^mu x g_mu = -2x; g^mu g_mu = 4'
    - '(i) the real trace of left multiplication on Cl(1,3) is 16 <X>_0 for every basis blade'
    - '(i) the massless propagator x/(2 pi^2 Q(x)^2) is homogeneous of degree -3 (sampled at two vectors and three rational scales)'
    omits: 'the passage from the real trace on the algebra to the matrix trace 4<X>_0 on the Dirac module is the module count in the proof'
  check_vacuum_polarisation_extension_is_transverse_and_gives_the_log_coefficient:
    kind: exact
    clauses:
    - '(ii) the Klein-Gordon recursion gives the m^2 ln s coefficient 1/(16 pi^2)'
    - '(ii) the order-m^0 part of the kernel is (e^2/pi^4)(2xx - g s)/s^4 = (e^2/(12 pi^4))(dd - g box) s^-2 and the order-m^2 part is -(e^2 m^2/(8 pi^4))(dd - g box)(1/s); both divergence-free'
    - '(ii) s^-2 = -(1/4) box(L/s) and box(1/s) = 0 off the origin; box(1/s) = -4 pi^2 delta from the flux through the 3-sphere'
    - '(ii) mu d/dmu of the extension is (e^2/(6 pi^2))(dd - g box) delta; log coefficient e^2/(12 pi^2); the m^2 part is mu-independent'
    omits: 'the remainder of scaling degree at most 2 and the uniqueness of its extension are proof-only (imported theorem); the Fourier step d -> iq is in the proof'
  check_covariant_ambiguities_are_the_renormalisation_constants:
    kind: exact
    clauses:
    - '(iii) difference spaces (existence of Ward-preserving extensions not checked; imported): photon two-point: 240 unknowns, covariant 3, transverse 1'
    - '(iii) self-energy: 80 unknowns, covariant 4, with the reflection 2; vertex: 64 unknowns, covariant 2, with the reflection 1'
    - '(iii) self-energy and vertex under the Ward-Takahashi identity: 2 with the reflection, 4 without; c_V = -c_2 forced'
    - '(iii) three-current: 576 unknowns, covariant 8, transverse on legs (1,2), (2,3), (1,3) 0, on one leg not 0; four-photon: 256 unknowns, covariant 4, transverse on one leg 0'
    omits: 'covariance is imposed infinitesimally (connected Lorentz group); the reflection only where stated'
  check_scalar_bubble_extension_gives_the_quartic_coefficient:
    kind: exact
    clauses:
    - '(vi) Delta_0^2 = 1/(16 pi^4 s^2) = -(1/(64 pi^4)) box(L/s); mu d/dmu of the extension delta/(8 pi^2); 3 channels times 1/2 give 3/(16 pi^2)'
  check_scaling_degrees_and_degrees_of_divergence:
    kind: exact
    clauses:
    - '(i) scaling degrees 6 (order m^0 vacuum polarisation), 4 (order m^2), 5 (self-energy structure x/s^3 = (1/16) dslash box(L/s)), 4 (scalar bubble)'
    - '(i) omega = 2, 1, 0 and by power counting 0, 1, 0 for vertex, three-current, four-photon'
  check_no_weighting_of_the_conformal_energy_keeps_a_boost:
    kind: sampled
    clauses:
    - '(vii) the stored commutant of gamma_0 e_+ among the 15 bivectors of Cl(2,4) is recomputed: 7-dimensional and closed; the anticommuting bivectors span 8'
    - '(vii) the commutant with any one of seven tested generators (three boosts, two translations, a special conformal generator, the dilation) generates all 15'
    omits: 'the closure for an arbitrary element outside the commutant is the irreducibility of the 8-dimensional complement, argued in the proof; Schur''s lemma and the irreducibility of the attachment''s modules are cited'
untouched_premises:
  synthesis.imported-epstein-glaser-extension-theorem-and-ward-preserving-time-ordered-products: "imported extension theorem and existence of Ward-preserving extensions, cited in the proof; the check computes the kernels, their extensions and the difference spaces, not the theorem"
  synthesis.krein-form-premise-indefinite-inner-product-for-gauge-fields: "a premise of the self-energy and vertex parts of clause (iii) only; the check counts the covariant differences, which use no inner product"
