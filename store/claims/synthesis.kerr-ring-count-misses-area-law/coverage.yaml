functions:
  check_kerr_schild_data:
    kind: sampled
    clauses: ["setup: g = eta + 2H k k, Sigma g^{rr} = Delta, horizons r_+-", "(3): A_+ = 8 pi M r_+"]
    omits: "twelve deterministic rational points: k null for eta, det g = -Sigma^2, Sigma g^{rr} = r^2 - 2Mr + a^2; one worked hole (M = 5, a = 3: r_+ = 9, r_- = 1) with horizon area density r_+^2 + a^2 = 2 M r_+ = 90; the metric components are entered from the statement, so this checks internal consistency, not the imported Kerr-Schild form"
  check_tube_determinant:
    kind: sampled
    clauses: ["(2)"]
    omits: "det h = -rho^4 [1 + (rho^2/a^2) cos 2psi - (2M rho/a^2) cos^3 psi] at five holes (including the rho^3 = 2M locus), six Pythagorean angles and both signs of cos psi, and unchanged when d_t is replaced by d_t + Omega d_phi (one Omega); an identity in rho, psi, M, a that is checked, not proved symbolically; the lower bound 1/2 of the bracket is in check_regime_and_ctc"
  check_averages_and_bound:
    kind: sampled
    clauses: ["(3)"]
    omits: "circle averages <x> = 0 and <x^2> = eps^2/2 + 5 delta^2/16 by exact Fourier averages at three (eps, delta); the squared-form polynomial bounds 1 + x/2 - x^2/2 <= sqrt(1+x) <= 1 + x/2 as exact polynomial identities with the side conditions on a 101-point grid in |x| <= 1/2; the one-sheet coefficient -2/3; the integral of sqrt(bracket) giving V' = 4 pi^2 rho_c^2 (1 - eta) is not itself computed, and the cross term eps*delta of <x^2> is covered only by the three sample points"
  check_regime_and_ctc:
    kind: sampled
    clauses: ["(1)", "(2)"]
    omits: "four exact holes with rho^3 = 2M and a^2 >= 8 M rho_c: rho_c < a^2/(2M) <= r_-, delta <= 1/4, bracket >= 1/2 at ten angles (timelike tube), and g(d_phi, d_phi) = rho_c^2 + a^2(1 - rho_c^2) < 0 at r = -rho_c, u = 0 (closed timelike orbit) from the metric; 'beyond the inner horizon' for all r_- <= r <= r_+ with |z| >= r_- > rho_c and both sheets meeting the locus are not asserted"
  check_count_ratio:
    kind: sampled
    clauses: ["(3)", "(4)"]
    omits: "Schwarzschild control gives exactly 1; for three Kerr holes at a/M = 3/5 with M = 500, 4000, 32000 the leading coefficient of N/(A_+/4) is rho_c^2/(2 sqrt(M^2 - a^2)) = 1/8, 1/16, 1/32 (eight times the mass halves it: the M^{-1/3} law), then times (1 - eta) with eta at its stated maximum; nu = 1/(16 pi) and the modular period beta_+ = 2 pi/kappa_+ are entered as inputs; the general-tau formula in (3), the one-sheet remark and 'Delta t of order M^{4/3}' are not tested"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "each quantitative claim (tube determinant, 1 - eta bound, ratio pi/2 rho_c^2 (1-eta)/sqrt(M^2-a^2)) is reproduced at exact sample holes; none is proved symbolically"
