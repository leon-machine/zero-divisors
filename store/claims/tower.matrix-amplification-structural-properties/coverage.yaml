functions:
  check_centre_of_matrix_algebra:
    kind: sampled
    clauses:
    - (i) Z(Mat_m(A)) = Z(A) 1_m
    omits: Five Clifford algebras A (Cl(0,1), Cl(0,2), Cl(1,0), Cl(1,1), Cl(1,2)) and m = 2, 3 only; not a general unital real algebra A or m
  check_matrix_algebra_over_simple_is_simple:
    kind: sampled
    clauses:
    - (ii) if A is simple so is Mat_m(A)
    omits: m = 2 only, A = C, H, Mat_2(R); the ideal generated by a few sample nonzero elements is the whole algebra, which does not by itself cover every nonzero element; control A = R + R is proper as expected
  check_block_flattening:
    kind: sampled
    clauses:
    - (iii) Mat_m(Mat_r(D)) is isomorphic to Mat_mr(D)
    omits: (m, r, D) = (2,2,H), (2,3,C), (3,2,R+R) only; bijection and multiplicativity on all basis pairs for these
  check_matrices_over_direct_sum:
    kind: sampled
    clauses:
    - (iv) Mat_m(A1 + A2) is isomorphic to Mat_m(A1) + Mat_m(A2)
    omits: m = 2, A = Cl(0,3) = H + H and Cl(1,0) = R + R only
untouched_premises:
  std-algebra.morita-amplification: "standard algebra cited in the proof; the check computes the statement directly"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: Each of (i)-(iv) is tested exactly on a few concrete Clifford algebras and small m; the general-algebra statements are standard and are not reached by sampling.
