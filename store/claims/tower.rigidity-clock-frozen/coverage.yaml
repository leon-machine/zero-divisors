functions:
  check_clock_and_centre_frozen:
    kind: sampled
    clauses:
    - the transport charge d = p - q mod 8 is constant
    - the centre of every floor equals that of the ground floor
    - a type-C obstruction (central idempotent) never arises by transport from a simple ground algebra
    omits: Grounds n <= 4 and k <= 2 with n + 2k <= 8; centre computed blade-wise (valid for diagonal forms); "obstruction taxonomy is floor-independent" is tested only for the type-C part; "Bott periodicity manifests as immediate freeze" is interpretive
  check_full_corner_is_ground:
    kind: sampled
    clauses:
    - every floor is Morita equivalent to the ground floor
    - same division-ring type and simplicity class as the ground
    omits: Grounds n <= 4 at k = 1, 2 with n + 2k <= 8; shows P full and the twisted generators satisfy the ground relations in the corner of dimension 2^n, but does not assert that these generators span the corner (relies on dimension and tower.commuting-copies)
  check_physical_tower_is_quaternionic:
    kind: sampled
    clauses:
    - the physical tower Cl(1+k, 3+k) is Mat_{2^(k+1)}(H), frozen at clock position 6
    omits: k = 0, 1, 2 only
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The numerical claims (charge 6, Mat(H), centre, corner) are tested on finite grounds and k <= 2; the interpretive sentence on Bott periodicity has no check.
untouched_premises:
  std-algebra.sta-matrix: "standard algebra cited in the proof; the check computes the statement directly"
