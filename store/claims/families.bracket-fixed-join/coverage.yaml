    kind: sampled
    clauses: ["B_Lambda != 0 if and only if m^2 > Lambda C/3"]
    omits: "five sample composites (generic pairs, two doubled, one massless-type pair) at three Lambda: 6 nonzero and 9 zero cases; 'every composite heavier than the Hubble scale' for C of order one and the order-parameter reading are not computable"
