    kind: sampled
    clauses: ["|B_Lambda|^2 = m^2/2 - Lambda C/6 for the composite of two twistors", "the flat bracket differs from B_Lambda by the Lambda-suppressed omega-area (Lambda/6)[omega1 omega2]"]
