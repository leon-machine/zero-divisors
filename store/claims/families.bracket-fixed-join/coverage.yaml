    omits: "identity in formal Lambda (GA.RF) at four rational (nu, C) points, affine in (nu^2, C) so they suffice; m^2 = (nu^2 + 9/4) Lambda/3 for a principal-series composite is inserted, not derived, and the first equality (that the join gives the bracket) is tested in check_bracket_from_composites"
