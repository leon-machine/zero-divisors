functions:
  check_type_sites_by_signature:
    kind: sampled
    clauses:
    - type C occurs exactly at p - q = 1 mod 4
    - type N (null vector) exactly in the mixed signatures
    - a non-central idempotent (type P) exists except for the five division-sum algebras
    omits: All 28 signatures with n <= 6 only; type P is detected by a blade witness (1+b)/2, with absence compared to the list of five
  check_exhaustiveness_on_lattice:
    kind: sampled
    clauses:
    - every zero divisor of a nondegenerate real Clifford algebra falls under the three rules (N, C, P)
    omits: Only the 256 nonzero elements with coefficients in {-1,0,1} of Cl(1,0), Cl(0,1), Cl(2,0), Cl(1,1), Cl(0,2) plus three hand-picked samples in each of Cl(2,1), Cl(1,3); the zero-divisor counts 4, 0, 32, 32, 0 are expected values counted by hand; general exhaustiveness rests on the cited exhaustiveness theorem
  check_each_rule_repairs_its_type:
    kind: sampled
    clauses:
    - 'Type N: ascend by one hyperbolic plane, repair at the level of points'
    - 'Type C: ascend by one generator, fused algebra with centre R'
    - 'Type P: no ascent, the identity is the repair'
    omits: N tested at (1,1), (1,3), (2,1) via iota X(v) = -(v + ninf/2); C at (1,0), (2,1), (0,3) for both gamma (centre R and eps no longer central); P at Cl(1,1) only (e e e = e); minimality and uniqueness of the repairs (the cited minimality, fusion-uniqueness and representation-independence theorems) are not computed
untouched_premises:
  transport.embedding-independent-minimality-fusion: cited for the uniqueness of the minimal Type-C fusion; the check only verifies the fused algebra has centre R
  transport.no-go-level-elements: cited as the Type-N no-go motivating the ascent; the check does not recompute the no-go (it is its own entity)
  transport.one-generator-minimal-minimal-completions-classified: cited for the classification of one-generator minimal completions; not recomputed here
  transport.representation-independent-minimality-completion: cited for representation-independence of the Type-N completion; not recomputed here
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The three type sites and the repair mechanisms are tested on small signatures and a coefficient lattice; the uniqueness and minimality statements are cited rather than checked. 2026-10-23 weak-checks pass: check_each_rule_repairs_its_type now asserts v null for the type N cases, e^2 = e (was e^3 = e) for the type P idempotents, and the type P case count (2, by hand)"
