    clauses: ["(3)"]
    omits: "five (I, X) pairs only; checks the signature of X-perp in I-perp ((0,3) plus null direction or (1,2) plus null direction); that the polar hypersurface meets the quadric in the whole projectivised null cone of I-perp, and the S^3 conformal structure, are not tested"
