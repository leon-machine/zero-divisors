functions:
  check_weyl_space_and_duality:
    kind: exact
    clauses: ["the algebraic Weyl maps on bivectors commute with I", "Lambda^+ and Lambda^- are the eigenspaces of I on complexified bivectors"]
    omits: "the setup of the proof: the space of algebraic Weyl maps of Cl(1,3) is computed as an exact kernel (dimension 10), with I^2 = -1 and the +-i eigenspaces of dimension 3"
  check_vanishing_half_forces_vanishing_weyl:
    kind: exact
    clauses: ["if either duality half of W vanishes, W vanishes"]
    omits: "pointwise and algebraic: restriction to each half is injective on the whole 10-dimensional real Weyl space, which is the statement's pointwise claim; the reading as conformal flatness (Weyl's theorem) is not recomputed"
  check_signature_contrast:
    kind: complete
    clauses: ["classical remark: the Lorentzian case differs from the Riemannian case"]
    omits: "all five four-dimensional signatures: Weyl-space dimension 10 in each, and half-flat Weyl maps form a space of dimension 5 for (4,0), (2,2), (0,4) and 0 for (3,1), (1,3)"
  check_schwarzschild_and_kerr_are_not_half_flat:
    kind: sampled
    clauses: ["no real Lorentzian black hole is half-flat: the Weyl maps of Schwarzschild and Kerr are nonzero"]
    omits: "two Schwarzschild points computed from the gauge fields, three Kerr points where the operator is the imported closed form (not computed from gauge fields), whose normalisation M/2 is pinned by its a = 0 reduction to the computed Schwarzschild operators; both halves nonzero at those points, off the singular locus"
untouched_premises:
  correspondence.imported-weyls-theorem: "literature equivalence between vanishing Weyl tensor and conformal flatness, used only for the conformal-flatness reading of the statement, which the checks do not recompute"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The algebraic core is exact over the whole Weyl space; the black-hole clause is sampled and its Kerr operator is imported rather than derived. 2026-10-23 weak-checks pass: the Kerr closed form at a = 0 is now asserted equal to the Schwarzschild operators computed from the gauge fields, which pins its normalisation M/2."
