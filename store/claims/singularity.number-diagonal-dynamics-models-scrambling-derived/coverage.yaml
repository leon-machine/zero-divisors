functions:
  check_sigma_algebra_is_the_diagonal_algebra:
    kind: sampled
    clauses: ["every generator in the abelian algebra generated by {sigma_k} is diagonal in the joint number basis"]
    omits: "three Jordan-Wigner modes only (dimension 8); (L_E) itself, that every available generator lies in this algebra, is the assumed premise and has no computable content here"
  check_exponentials_are_diagonal_and_conserve_populations:
    kind: sampled
    clauses: ["its exponential is a diagonal unitary", "each mode's occupation probabilities are constants of the motion"]
    omits: "exp(i t X) for the eight subset products X individually at the single angle (cos, sin) = (3/5, 4/5), series coefficients through order 12; populations conserved on three rational density matrices; commutation of every product with every n_k is exact for three modes"
  check_controlled_z_in_algebra_and_hop_outside:
    kind: sampled
    clauses: ["the controlled-Z circuit is the general form of what (L_E) permits (CZ lies in the algebra)"]
    omits: "CZ_jk = (1 - sigma_j - sigma_k - sigma_j sigma_k)/2 verified for all three pairs of three modes; the control (a hop is outside the algebra and moves a population, 9/25 to 11881/15625) is one product state at one angle; 'general form' means the algebra, i.e. all diagonal unitaries, which follows from the first function"
untouched_premises:
  singularity.ascended-marginals-are-diagonal: "cited as the context for diagonal marginals; the check derives the diagonal dynamics directly from the sigma algebra"
