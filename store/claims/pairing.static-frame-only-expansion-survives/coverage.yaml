functions:
  check_omega_reproduces_covariant_derivatives:
    kind: sampled
    clauses:
    - '"the bivectors Omega(e_c) reproduce the covariant derivatives (e_c . D) e_b = omega^a_b(e_c) e_a for all b, c"'
    omits: four rational points (M = 1/2, 1/2, 3/2, 1/3) against the hand table of connection forms, all 16 pairs (b, c) at each
  check_pairing_classes_and_optical_scalars:
    kind: sampled
    clauses:
    - '"pv(Omega(e_0)) = pv(Omega(e_1)) = 0, pv(Omega(e_2)) = -sqrt f/r, pv(Omega(e_3)) = -i sqrt f/r"'
    - '"pv(Omega(l)) = pv(Omega(n)) = pv(Omega(m)) = 0 and pv(Omega(mb)) = -2 sqrt f/r"'
    - '"its only optical scalar is the transverse expansion 2 sqrt f/r"'
    omits: the same four points; the expansion is the screen trace of A -> (A . D) l; tau = 0 and shear-freeness are not computed separately, only read through the imported spin-coefficient dictionary
  check_transport_along_l_and_the_stabiliser:
    kind: sampled
    clauses:
    - '"(l . D) l = (f''/2 sqrt f) l, a rescaling"'
    - '"Omega(e_0) is a multiple of e_01 and Omega(e_1) = 0"'
    omits: the same four points
  check_horizon_limit_and_sample_value:
    kind: sampled
    clauses:
    - '"Every class vanishes at F = 0, and at r = 25/16 (F = 3/5) the transverse class is -48/125"'
    omits: -48/125 is an exact value at r = 25/16; vanishing at F = 0 (the singular horizon, where the jets divide by F) is reached only through the polynomial -F(1 - F^2) at M = 1/2, matched at the sample points F = 3/5 and 4/5
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: the classes, scalars and sample value are computed on exact jets at sample points; the F = 0 limit is read from a polynomial matched at samples, which the function name does not hide
