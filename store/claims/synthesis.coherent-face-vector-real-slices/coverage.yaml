functions:
  check_fourier_line_isotropic_and_not_real:
    kind: exact
    clauses: [(ii)]
    omits: 'Exact in Q(sqrt 3)[i]: f_+ is C-null and orthogonal to u'', zeta is not real, and (extra) every unit-phase real slice carries half the Hermitian norm at eight phases; the conclusion for all sigma_{x,y} is in check_real_structures.'
  check_real_structures:
    kind: sampled
    clauses: [(i), (ii)]
    omits: The four C-compatible slices have exact signatures (3,0), (1,2), (2,1), (0,3); involution, S_3-equivariance and compatibility iff x^2 = y^2 = 1 are checked on an 8 x 8 grid of unit phases and four test vectors; that these are the only equivariant real structures (the classification) is not computed; non-fixedness of the coherent vector at seven w and eight phases; the restriction of C to the slice as +-(t^2 - Q(d)) is read from the signature, not the form.
  check_projection_and_koide:
    kind: sampled
    clauses: [(iii), (iv)]
    omits: 'Seven values of w = lambda e^{i chi}: C(v) = 3, |P_d v|^2 half-retained, p_k = 1 + Re(rot zeta^k) with rot = w or -i w (so delta = chi or chi - pi/2), Q_p = 1/3 + lambda^2/6, and C(p) = -(t^2 - Q(d)) on the Lorentzian slice, for sigma_{-1,-1} and sigma_{-1,1} only; the independence of Q(d) from all (x, y), the orientation remark, "iff lambda^2 = 2" (one instance w = 1 + i plus the general formula), ||v||^2 = 3|C(v)| at that instance, and the 1:2 weight ratio and |a.a| = |a|^2/3 forms are not each asserted.'
judge: {by: coverage-judge-2026-10-23, date: '2026-10-23', verdict: agrees, note: 'Slice signatures, the real-coordinate formula, Q_p and the Koide instance are reproduced; the classification of real structures and the x, y independence are not enumerated.'}
