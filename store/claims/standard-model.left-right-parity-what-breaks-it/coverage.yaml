functions:
  check_d_is_a_half_turn:
    kind: exact
    clauses:
    - '"D^2 = -1 and D = exp(pi/2 gamma5 gamma9), a half-turn generated by a slot-pair mixing bivector"'
    omits: The exponential is not evaluated; D^2 = -1, D^3 = -D, D^4 = 1 give exp(theta D) = cos theta + D sin theta, and conjugation by D reverses e_5 and e_9 only
  check_d_exchanges_left_and_right:
    kind: exact
    clauses:
    - '"conjugation by D exchanges su(2)_L and su(2)_R"'
    - '"maps the eight states of Q and L onto the eight singlet states"'
    - '"D anticommutes with chi"'
    omits: ''
  check_grade_four_pati_salam_singlet:
    kind: exact
    clauses:
    - '"among the 210 grade-four elements the Pati-Salam singlets form a one-dimensional space spanned by gamma6 gamma7 gamma8 gamma9, which acts as chi"'
    omits: The final sentence (a vev along the rung parity breaks Spin(10) to Pati-Salam and left-right parity at the same scale) is a reading and is not computed
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: Every algebraic sentence of the statement is an exact finite computation in Cl(10,0) or the 32-dimensional module; the symmetry-breaking conclusion is the reading, as the docstring says.
