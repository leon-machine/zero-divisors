functions:
  check_synchronous_derived_metric_and_tau:
    kind: sampled
    clauses: ["derived metric d tau^2 - A dt^2 - r^2 dOmega^2, A = (1-r)/r", "tau = (2/3) r^(3/2) (1 + (3/10) r + O(r^2))"]
    omits: "metric Gram compared at three sample points (r, theta); the tau series is an exact power-series computation (coefficients through r^(5/2) compared)"
  check_frame_parallel_and_connection_shape:
    kind: sampled
    clauses: ["frame exactly D-parallel along g_tau", "Omega(e_i) = -sigma_i B_i plus a sphere term"]
    omits: "three sample points of the interior field taken from the premise engine; torsion-freeness and the connection shape compared there, not as identities in r"
  check_hubble_normalised_rates:
    kind: exact
    clauses: ["tau sigma_1 = -1/3 - (4/15) R + O(R^2)", "tau sigma_2 = tau sigma_3 = 2/3 - (2/15) R + O(R^2)", "R = (3 tau/2)^(2/3)"]
    omits: "series coefficients are exact, but sigma_1, sigma_2 are typed closed forms in interior_series, not read from the field of check_frame_parallel_and_connection_shape; sigma_3 = sigma_2 by symmetry, not computed separately"
  check_weighted_limit_and_values_level_holonomy:
    kind: partial
    clauses: ["weighted limit equals -sum p_i B_i (x) theta^i for the admissible class", "boundary holonomy exactly so(1,3) at values level"]
    omits: "only the exactly solvable Kasner member (E_tau = 0) at three exponent permutations and three times, plus Lie-algebra dimension 6 on a 5^3 grid of constants; existence of the limit for general admissible fields, integrability of E_tau, constant-Lambda Einstein, and parallel-tractor extension are cited (T6 Thm 5.6), not computed"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "Docstring says the general-field limit and tractor extension are cited and not recomputed; the checks test the interior formulas exactly and the theorem only on its Kasner member."
