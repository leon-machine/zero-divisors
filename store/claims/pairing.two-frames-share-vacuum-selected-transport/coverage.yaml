functions:
  check_frames_related_by_boost_in_p_of_l:
    kind: sampled
    clauses:
    - '(i) "e_0^PG = (e_0 - beta e_1)/F, e_1^PG = (e_1 - beta e_0)/F, a Lorentz transformation, that fixes e_2, e_3 and scales l by (1-beta)/F = F/(1+beta): a boost in the plane of l, generated by e_01, which lies in p(l)"'
    - '"The two frames'' vacua coincide; on the horizon locus itself the static frame does not exist"'
    omits: four outside points (beta, F, M); the rotor U = (1 + 1/F) + (beta/F) e01 realises the map; non-existence at beta = 1 is only that the would-be static vector K is null; that the regular frame continues the same vacuum is not tested
  check_t_line_transport_has_zero_class_in_both_frames:
    kind: sampled
    clauses:
    - (ii) "at the pre-ascent level its class is zero in both frames"
    omits: four outside points with exact jets; that the selected transport is the flow along the t-line with holonomy the boost of the completed plane is the cited singularity-paper result and is not computed
  check_sample_rotors_give_distinct_null_directions:
    kind: exact
    clauses:
    - (iii) "the rotor 1 + A e_12 ... whose null directions are e_0 + 7/25 e_1 + 24/25 e_2 and e_0 + 175/337 e_1 + 288/337 e_2, distinct"
    omits: A = 3/4 and 9/16 only; that these are the Hawking-state amplitudes at the singularity paper's sample point is taken as given (only (3/4)^2 = 9/16 is checked); the one-rotor-per-mode remark is interpretation
untouched_premises:
  singularity.modular-flow-boundary-modes-holonomy-universal: cited for the holonomy of the selected t-line transport being the boost of the completed plane; only the pre-ascent zero class is computed
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: the frame relation and zero class are checked at four sample points with exact jets and the rotor directions are exact numbers; the cited singularity-paper holonomy is not recomputed
