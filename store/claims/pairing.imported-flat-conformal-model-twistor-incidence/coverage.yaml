functions:
  check_point_vacua_form_a_line_and_lines_meet_on_null_separation:
    kind: sampled
    clauses:
    - '"the point embedding X(x) is null"'
    - '"the vacua at x are the conformal spinors whose isotropic three-space contains X(x), a projective line of P(CS)"'
    - '"two points are null-separated exactly when their lines meet"'
    omits: seven sample points (real and complex) and their 21 pairs; for each point four spinors on the line and one off it are tested
  check_translations_generate_point_motion_poincare_stabiliser:
    kind: sampled
    clauses:
    - '"the motion of the point''s null vector X(x) under a displacement is generated by the translations {e_a ^ n_inf}"'
    - '"the four-dimensional nilradical of the ten-dimensional stabiliser so(1,3) + R^4 of n_inf in so(2,4)"'
    omits: the point-motion identity at four sample points; the stabiliser dimension 10 and the abelian, ideal and two-step nilpotent properties are exact; that the flat tractor connection is the ambient derivative (trivial transport) is literature and is not checked; maximality of the nilpotent ideal is not tested
untouched_premises:
  pairing.imported-flat-conformal-model-twistor-incidence-external: literature restatement, declared not called in the docstring
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: the two computable parts are tested at sample points and exact where the statement is a dimension count; the tractor input is declared unchecked
