functions:
  check_towers_are_residues_and_mirror_is_another:
    kind: sampled
    clauses:
    - '"the eight towers are the residues of the shadow dimension mod 8"'
    - '"this world''s tower one of them and the mirror tower another"'
    omits: The Morita step preserving p - q mod 8 is checked for the ten signatures with n <= 3 only; that there are exactly eight residues is not computed. The distinction of towers is exact for (1,3) at r = 6 versus (3,1) at r = 2, and for (2,4) versus (4,2)
  check_even_subalgebras_of_reversal_pair_agree:
    kind: partial
    clauses:
    - '"the mirror tower''s derived content is a copy of this one''s, with the same gauge algebra, global form, generation, hypercharges and chirality halves"'
    omits: Only that the even subalgebras of (1,3)/(3,1) and (2,4)/(4,2) have the same dimension and centre span(1, I), I^2 = -1 (simplicity and the identification with a matrix algebra are not tested); gauge algebra, global form, generation, hypercharges, chirality halves and the beta-functions are not computed here
untouched_premises:
  dark-matter.superselected-hence-dark-exactly-stable: physical statement of T14 about superselection and stability; the docstring says it has no finite algebraic core
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The docstring declares the superselection, wall and gravitational-only clauses uncomputable and the beta-function equality delegated; the two functions test only the algebraic substrate.
