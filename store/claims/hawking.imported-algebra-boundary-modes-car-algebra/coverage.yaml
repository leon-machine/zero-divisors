functions:
  check_physical_lineage_has_even_charge_six:
    kind: exact
    clauses: ["\"the physical lineage has charge six, so the theorem applies\""]
    omits: "the transport charge p - q mod 8 is computed for floors k = 0..6 of Cl(1+k, 3+k) (it equals -2 = 6 mod 8 for every k); the completed limit Cl(p,q)_C tensor CAR itself is the cited theorem and is not tested (the docstring says so)"
  check_mode_operators_are_the_null_pairs:
    kind: sampled
    clauses: ["\"the mode operators are the adjoined null pairs themselves (a_j = v_j^* = w_j, a_j^dagger = v_j)\"", "\"the ground algebra tensored with the CAR algebra\" (finite floors)"]
    omits: "k = 1, 2, 3 planes over Cl(1,3): CAR, v_j* = w_j, commutation with the twisted ground generators (which satisfy the Cl(1,3) relations), e_j = v_j + w_j and f_j = v_j - w_j, and ground words times mode words hitting all 16 * 4^k blades of the floor (direct rank 64 from the v, w words at k = 1); the completed C*-limit and its complexification are the cited theorem"
  check_fock_adjointness:
    kind: sampled
    clauses: ["\"with the Fock adjointness\""]
    omits: "k = 1, 2, 3: the images rho(e_j) = wedge + contraction, rho(f_j) = wedge - contraction satisfy the Cl(k,k) relations, rho(v_j) computed from the Clifford element is the wedge, rho(v_j^*) = rho(w_j) = rho(v_j)^T, and the vacuum is killed by every w_j and by no v_j; rho(x^*) = rho(x)^T for every blade x at k <= 2 only; the infinite Fock space of the limit is not represented"
judge:
  by: fix-round-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "strengthened: spanning of the floor by ground copy times mode algebra (16 * 4^k blades, k <= 3), the Fock representation rho of the actual Clifford elements with rho(x^*) = rho(x)^T; stale docstring remark on a swapped labelling removed"
