    kind: sampled
    clauses: ["their correlations are placed, at eviction, in L(t) u R(t)"]
    omits: "at the 9 evictions of two runs: evicted qubit diag(c^2, s^2), its complement's nonzero spectrum {c^2, s^2}, and I(L_j : rest) = 2 H(c_j^2) as a formal combination of entropies of computed spectra; not all schedules or pair parameters"
