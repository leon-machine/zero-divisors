  check_sector_spectra_agree:
    kind: sampled
    clauses: ["modes exiting the window carry no q-number content out of the two-sector decomposition"]
    omits: "global normalisation and equality of the nonzero spectra of rho_R and rho_L (explicit orthogonal eigenvectors of rho_R) at all 13 stages of two runs; positivity of rho_R (a marginal) is used, not computed; not all schedules or pair parameters"
