functions:
  check_connection_shape_and_rates:
    kind: partial
    clauses: ["(1) Levi-Civita part: boost correction O(tau^(2/3)) and rotation correction O(tau^(1/3)) for Schwarzschild"]
    omits: "three sample points for the exact shape of Omega; rates as exact series. The tractor connection part of (1), the continuous extension to the exceptional boundary for general admissible metrics, and the claim that tractor coupling terms scale to zero (O(tau) in the proof) are not computed anywhere in check.py"
  check_limiting_values_annihilate_scale_tractor:
    kind: sampled
    clauses: ["(2) every limiting connection value annihilates I_g", "(3) the limiting values are -p_i B_i with p = (-1/3, 2/3, 2/3)"]
    omits: "Lambda in {0, 3, -6}; the limiting values are built from the computed exponents rather than obtained as limits of the Hubble-normalised field; the boundary bundle and the parallel trivialisation are not modelled; vanishing of rotation and tractor-coupling limits (rest of (3)) is not tested here"
  check_holonomy_algebra_is_levi_factor:
    kind: sampled
    clauses: ["(4) the values generate exactly Lambda^2 W (dimension 6), no component on the nilpotent summands or the grading element", "Lambda = 0: Levi factor of the parabolic stabiliser, nilradical I_g ^ W abelian", "Lambda != 0: stabiliser reductive, Lambda^2 W a proper subalgebra"]
    omits: "Lambda in {0, 3, -6}; the identification Lambda^2 W = so(1,3) (signature of W) is not computed; the Lambda != 0 containment is shown for the algebra generated by the supplied exponents"
  check_transport_along_abelian_directions:
    kind: sampled
    clauses: ["t- and theta-line generators are fixed bivectors times scalars (transports commute)", "phi-lines: B_3 and R_23 do not commute", "tau-geodesic frame log-ratio O(tau^(2/3))"]
    omits: "one sample point for the bivector shape; the scale-factor ratios sqrt(1 - r) S^(1/3) and S^(-2/3) are shown to differ from 1 at order rho^2 as series; the statement that the two transports differ by a boost of angle O(tau^(2/3)) over fixed Hubble length is not computed; admissible metrics other than Schwarzschild are not touched"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "Schwarzschild boost/rotation rates, limiting algebra and Levi-factor structure are tested; the tractor-coupling decay in (1) and (3) and everything for general admissible metrics has no check."
