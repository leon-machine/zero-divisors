functions:
  check_extension_by_sign_of_lambda:
    kind: sampled
    clauses: ["(i) Lambda > 0: Cl(I^perp) = Cl(1,4), e_5^2 = -1", "(ii) Lambda < 0: Cl(I^perp) = Cl(2,3), e_5^2 = +1"]
    omits: "Three samples with |Q(V)| a rational square (one with Lambda > 0, two with Lambda < 0); the algebra is identified by the signature of the five generators and 32 independent products."
  check_translation_bivectors_generate:
    kind: sampled
    clauses: ["(i) the translation bivectors generate this world's shadow Cl(1,3)", "(ii) they generate a copy of Cl(3,1) and the Lorentz frame generates the (1,3) algebra"]
    omits: "Same three samples; \"copy of the mirror's abstract algebra\" is read from the signature (3,1) of the pairwise anticommuting generators and 16 independent products. What this copy is as a soldered object (the cited belongs-tower and two-readings) is not computed."
  check_contraction_keeps_type:
    kind: sampled
    clauses: ["the Poincare contraction ell -> infinity leaves the Clifford type of the translation algebra unchanged"]
    omits: "Rescaling the generators by 1/ell (three finite values) multiplies their squares by 1/ell^2 and so keeps the signs, which is immediate; the limit ell -> infinity, where the rescaled squares tend to zero, is not computed."
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The sign-of-Lambda dependence of the extension and of the bivector algebra is checked at three rational samples; the contraction clause is checked at finite ell only."
