functions:
  check_boost_bivector_weights_and_spectral_projectors:
    kind: exact
    clauses:
    - sigma^2 = 1, sigma generates the rotor flow with weights -+1 on the pair, the occupation projectors are its spectral projectors, and sigma/2 = N - 1/2 in the Fock representation
    omits: ''
  check_unique_flow_up_to_reparametrisation:
    kind: exact
    clauses:
    - sigma is the unique one-parameter rotor flow of the atom up to reparametrisation and orientation (the bivector space is one-dimensional)
    omits: ''
  check_surface_gravity_normalisation:
    kind: sampled
    clauses:
    - the geometric normalisation converts rapidity to Schwarzschild time at the surface gravity kappa = 1/(4M)
    omits: kappa = f'(r_h)/2 = 1/(4M) is computed at M = 1, 3/2, 7; that the normalisation converts rapidity at kappa (rapidity = t/(4M)) is the cited appendix, not computed
  check_euclidean_continuation_period_and_reality:
    kind: sampled
    clauses:
    - continued to imaginary rapidity the boost rotor becomes a unitary of the complexified atom whose conjugation action has period exactly 2 pi
    - the generator i sigma lies outside the real algebra
    omits: conjugation by U(theta) is evaluated at five (cos, sin) samples (identity iff sin = 0, U(2 pi) = -1); unitarity of U is not tested (only U U^-1 = 1); (a + b sigma)^2 != -1 is tested at nine sample (a,b) with the real commutant of dimension 2 computed
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The atom Cl(1,1) facts are exact; the continuation and the surface gravity are tested at sample points.
