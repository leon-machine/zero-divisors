functions:
  check_bundle_maps_conserve_every_occupation:
    kind: sampled
    clauses:
    - dGamma(a) = sum of single-point bilinears
    - commutes with every occupation number N_xj
    omits: Only block-diagonal integer matrices at (N, r) in {(2,1),(3,1),(4,1),(2,2)}, one fixed pattern a_ij = i+2j+1; the step "C^infty-linear endomorphism is a bundle map" is the cited support lemma, not tested
  check_cross_components_hop:
    kind: sampled
    clauses:
    - a one-particle map with a nonzero cross component quantises to a generator containing psi_x^dag psi_y, mapping (N_x,N_y) = (0,1) onto (1,0)
    omits: Exhaustive over matrix units E_ij but only on the four finite (N, r) cases; checks the single matrix-unit generator psi_i^dag psi_j, not a general map with a nonzero cross component (sums with other terms are not tested)
  check_cross_point_diagonal_products_are_not_hopping:
    kind: sampled
    clauses:
    - (technical section only) cross-point diagonal products such as sigma_x sigma_y conserve both occupations
    omits: 'Tests a remark in ## technical, not a clause of ## formal; only r = 1 and N = 2, 3, 4'
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The three checks test the commutation with N_x for block-diagonal maps and the hop of a cross matrix unit on four finite truncations; the general-N statement and the support lemma are not tested.
