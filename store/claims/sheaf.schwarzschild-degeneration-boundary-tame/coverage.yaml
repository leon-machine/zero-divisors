functions:
  check_gram_matrix_of_the_cometric:
    kind: sampled
    clauses: ["the Gram matrix G(r) on (rho, dt_PG, mu_1, mu_2) with entries polynomial in r"]
    omits: "equality with the stated matrix at three masses and four radii, plus the adjoint relation; polynomiality of degree <= 1 in r is inferred from those samples (as the docstring argues), not asserted symbolically"
  check_nondegenerate_off_the_wall:
    kind: sampled
    clauses: ["(1) det G = -r", "(1) signature (1,3) at every r > 0, horizon included"]
    omits: "three masses, four radii plus the horizon r = m^2; not symbolic in r"
  check_corank_one_on_the_wall:
    kind: exact
    clauses: ["(2) rank exactly three at E", "(2) radical spanned by k = rho + m dt_PG", "(2) V_1 carries diag(m^2,-1,-1) of signature (1,2)"]
    omits: "the wall Gram G0 is entered by hand and tied to the computed cometric by G(s) - G0 = -s^2 E_00 at four radii; masses 1, 5/4, 3/7 only"
  check_first_order_degeneration:
    kind: sampled
    clauses: ["(3) g_k = G(k,k) = -r exactly at every radius"]
    omits: "three masses, five radii; the transversality datum delta(k (x) k) = -dr|_E and the conormal line N*_r E are not computed, they follow from g_k = -r"
  check_schwarzschild_frame_transition:
    kind: sampled
    clauses: ["(4) dt_S = dt_PG + m/(m^2-r) rho diagonalises G", "(4) k = m dt_S + r/(r-m^2) rho", "(4) the transition is a smooth invertible change of W-frame"]
    omits: "three masses, radii off the horizon only; the radical on E being the Killing-time covector (the rho coefficient vanishing at r = 0) and 'the same module' are not evaluated here, the transition matrix is solved from the frames and checked equal to the hand-written unitriangular one (determinant 1)"
  check_rain_identity:
    kind: sampled
    clauses: ["(5) k = dPhi with Phi = m t + (2/3) r^{3/2}", "(5) k annihilates the infalling congruence along d_t - beta d_r at every radius"]
    omits: "three masses and four radii; first-order jets of Phi, hb^{-1}(rain) = e_t and (e_t . D) e_t = 0 in the Painleve-Gullstrand field; 'conormal to the foliation ruled by the rain' is interpretation, not computed"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The Gram matrix, det, wall corank, g_k=-r, the Schwarzschild-frame transition and the rain identity are computed literally in GTG at three masses and four to five radii; polynomiality in r is inferred from agreement at those samples. 2026-10-23 weak-check pass: the frame-transition check now solves the transition matrix from the frames and compares it with the hand-written one (before, only the determinant of the hand-written matrix was computed)."
