    kind: sampled
    clauses: ["the seesaw m_3 = m_D^2/M_R values M_rung = M_R = m_D^2/m_3"]
    omits: "three (m_D, M_R) samples; the light root of the 2 x 2 matrix [[0, m_D], [m_D, M_R]] is bracketed within 2 m_D^4/M_R^3 of -m_D^2/M_R; the seesaw is premised as in the cited paper, not derived"
