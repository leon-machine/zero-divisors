    kind: exact
    clauses: ["M_rung runs from m_b^2/m_3 = 3.5e11 GeV to m_t^2/m_3 = 6e14 GeV, the two readings of Hypothesis (U)"]
    omits: "m_b = 4.18 GeV, m_t = 172.57 GeV and m_3 = 0.050 eV are typed constants (PDG 2024 central values with their ranges), not read from the store; the ends stay in (3.3, 3.7)e11 and (5.8, 6.1)e14 over the input box and (m_t/m_b)^2 rounds to 1.7e3"
