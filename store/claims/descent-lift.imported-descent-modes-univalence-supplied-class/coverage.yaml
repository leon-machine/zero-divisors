functions:
  check_descent_is_parity_average_and_pinching:
    kind: sampled
    clauses: ["descent is the parity average (1/2)(x + sigma x sigma)", "on nu modes the composite of the mode-wise averages is the pinching onto the joint-number-diagonal algebra"]
    omits: "one mode over all matrix units, and nu = 2, 3 only for the composite; the statement is for general nu"
  check_even_subalgebra:
    kind: sampled
    clauses: ["physical states are even; the observable algebra is the even subalgebra"]
    omits: "only the dimension 2^(2 nu - 1) of the commutant of total parity for nu = 1, 2, 3 and vanishing of the sample state on the odd matrix units; the univalence rule itself is a premise and not computed"
  check_supplied_class_is_joint_number_diagonal:
    kind: sampled
    clauses: ["parity sections and their products are joint-number-diagonal", "a pairing term lies outside the supplied class"]
    omits: "nu = 2, 3 only; the exclusion of pairing terms from the boundary-mode dynamics is premised, the check shows the sample pairing generator on modes 0, 1 has [N_k, pairing] = a_0^dag a_1^dag - a_1 a_0 for k in {0, 1} and commutes with every other N_k"
  check_vacuum_stabilisers_and_tangent:
    kind: sampled
    clauses: ["hops and pair annihilations stabilise the vacuum ray", "pair creations span the tangent of the vacuum orbit"]
    omits: "nu = 2, 3, 4 only; computes the dimension nu(nu-1)/2 of the span of pair creations off the ray, but does not compute the orbit or identify the span with its tangent"
  check_pairing_rotation_witness:
    kind: exact
    clauses: ["the rotation |00> -> (3/5)|00> + (4/5)|11> is a pairing rotation on one pair"]
    omits: "that the envelope corollary needs it is not a computable content"
  check_thermofield_marginals_gibbs:
    kind: sampled
    clauses: ["thermofield pair has both marginals equal to the Gibbs state diag(c^2, s^2)", "e^(-omega/T) = 9/16 gives (c, s) = (4/5, 3/5)"]
    omits: "marginals checked at three (c, s) points, not as a free-parameter identity; tan(theta) = e^(-omega/2T) is used only through q = (s/c)^2 = 9/16"
untouched_premises:
  descent-lift.imported-descent-modes-univalence-supplied-class-external: "external literature record for the cited results; no computable content"
  singularity.l-boundary-mode-locality: "hypothesis that the boundary-mode dynamics is local; no computable content (the check only shows pairing is outside the supplied class)"
  singularity.p-univalence: "the univalence premise itself; the check computes only the even subalgebra dimension, the rule being a physical postulate"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "W413 pass 2026-10-23: check_supplied_class_is_joint_number_diagonal now pins [N_k, pairing] exactly (moves the two paired numbers, commutes with the rest) instead of only non-commutation with N_0; sample mode counts moved to module level."
