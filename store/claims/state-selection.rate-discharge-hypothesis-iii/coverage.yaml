functions:
  check_kms_state_is_the_faithful_gibbs_state:
    kind: sampled
    clauses: ["Hypothesis (iii): the state is faithful, which the modular group presupposes"]
    omits: "KMS on the two-level mode factor with K = w (N - 1/2) at sample Boltzmann factors q; that the GMC itself contains faithfulness is not computed."
  check_one_beta_for_all_modes:
    kind: sampled
    clauses: ["by Corollary universality-temperature-under-g (one temperature for all modes)"]
    omits: "Two modes with weights 1 and 2 at sample pairs (q1, q2), not the corollary for arbitrary modes."
  check_conjugation_closes_at_two_pi:
    kind: sampled
    clauses: ["the modular period in rapidity is exactly 2 pi"]
    omits: "Only the elliptic rotor of Cl(1,3): conjugation is the identity exactly at s = 0 (theta = 2 pi), at rational circle samples. That (P), (R) and the GMC force the modular period to be this rotor period is not computed."
  check_calibration_beta_is_eight_pi_m:
    kind: sampled
    clauses: ["beta = 2 pi / kappa = 8 pi M and T = 1/(8 pi M)"]
    omits: "kappa = f'(2M)/2 = 1/(4M) for f = 1 - 2M/r at sample masses M; the calibration is cited from T5 Prop. 6.2."
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The docstring says it checks finite cores of the argument; the four functions test those cores at samples and none claims the (P), (R), GMC derivation."
