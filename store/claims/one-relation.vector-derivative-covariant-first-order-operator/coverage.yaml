functions:
  check_covariant_operators_span_gamma_and_gamma_i:
    kind: sampled
    clauses:
    - '"Then A^mu = gamma^mu(a + bI) for real a, b"'
    - '"the vector derivative is unique up to an invertible constant factor"'
    omits: the upper bound (covariant solutions have dimension at most 2) is an exact kernel computation on six rational rotors; that both solutions are covariant for the whole of Spin+(1,3) is checked at those six rotors only (true in general by definition of M and I commuting with even elements)
  check_constant_factor_is_invertible:
    kind: sampled
    clauses:
    - '"D = (a - bI) nabla" and "a - bI is invertible whenever (a,b) != (0,0)"'
    omits: four sample pairs (a,b); I^2 = -1 and anticommutation with the four vectors are exact, the product (a - bI)(a + bI) = a^2 + b^2 is a free-parameter identity checked at samples
  check_right_multiplication_is_outside_the_class:
    kind: sampled
    clauses:
    - '"Right multiplications are outside the class ... not of the form A^mu d_mu acting on the left unless B is central"'
    omits: B = gamma_0 non-central and B = 1, 2 central, tested on one field psi = gamma_1; the covariance of psi -> nabla psi B is not tested
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "the classification is bounded exactly on six rotors and the remaining clauses are checked at samples; the covariance direction is sampled. 2026-10-23 weak-checks pass: check_right_multiplication_is_outside_the_class samples moved to module level and the by-hand count of mismatches (4, all from gamma_0) is asserted"
untouched_premises:
  std-algebra.pseudoscalar-commutation: "standard algebra cited in the proof; the check computes the statement directly"
