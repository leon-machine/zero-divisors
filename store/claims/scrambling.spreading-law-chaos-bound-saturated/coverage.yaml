functions:
  check_boost_flow_scales_ladders_exponentially:
    kind: sampled
    clauses: ["a quadratic generator containing the boost scales ladder operators by e^{+-kappa t}", "boost-hyperbolic one-body dynamics expands amplitudes as e^{kappa t}"]
    omits: "checked at four sample rapidities x in Cl(1,1) and two in Cl(2,2), not symbolically in x; the generic quadratic coupling and the claim that this is the window's translation clock are not tested"
  check_spreading_threshold_is_log_n:
    kind: sampled
    clauses: ["t_* = kappa^{-1} ln N", "support spans the N-mode window when e^{kappa t} ~ N"]
    omits: "only N = 4, 9, 25, 49 (perfect squares) and three masses; the 1/N initial suppression is an input, and N ~ S over an epoch of order M is not tested"
  check_rate_is_modular_rate:
    kind: sampled
    clauses: ["kappa^{-1} = beta/2 pi, beta/2 pi = 4M", "expansion rate is exactly 2 pi T"]
    omits: "three sample masses only; the equality kappa = 2 pi T is arithmetic given beta = 2 pi/kappa, so it restates premise (R) and says nothing about chaos or the MSS bound"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: The three checks test the computable core (boost rotor scaling, threshold e^(kappa t)=N, kappa=1/(4M)=2 pi T) at sample points; the generic-coupling spreading model and the MSS bound are declared tier and untested.
