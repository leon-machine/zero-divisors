functions:
  check_classes:
    kind: sampled
    clauses: ["(2)", "(3)"]
    omits: "one fixed rational P, v, l, m; independence of the class from the extension of W is not tested"
  check_own_ray:
    kind: exact
    clauses: ["(4)"]
    omits: "equivalence (a) iff (c) is exact (11 null directions give rank 9 of 10, kernel span(eta)); (b) uses only 6 companions; the -Lambda/6 g(v,w) class is checked at Lambda = 3 only; Sch to Ric translation not tested"
  check_fixed_vacuum:
    kind: exact
    clauses: ["(6)"]
    omits: "Sch = c l l (real, trace-free) is exact; Ric = 2c l l and J = 0 as Ricci statements are not tested"
  check_fock:
    kind: sampled
    clauses: ["(2)"]
    omits: "Fock-vacuum clause only, for one W and three P (generic, radiation, Einstein) along five directions; the 8-dimensional module and kernel facts restate the imported chart"
  check_real_direction:
    kind: sampled
    clauses: ["(1)"]
    omits: "only the one-real-direction clause, for three axis-aligned l; the shape of every infinity vacuum and 'exactly two infinity vacua per real null direction' are not tested"
  check_matter_and_bianchi:
    kind: sampled
    clauses: ["(7)"]
    omits: "only the forward direction at one (kappa, Lambda, T); the converse 'only if' is not tested; the Bianchi linear system is typed in, not derived; the de Sitter normalisation assert is a tautology of the constructed Ric0"
  check_gtg_tractor_gauge_field_moves_ig_and_x:
    kind: sampled
    clauses:
    - "the stored vacuum equations nabla I_g = (0, -P, 0)"
    - "omega_v(I_g, w) = -P(v, w) for infinity vacua and omega_v(X, w) = g(v, w) for point vacua"
    omits: "five gauge fields (de Sitter, SdS, Schwarzschild, FLRW instant, Kasner) at one point each, every frame direction; the tractor gauge field built from each field's own Schouten map"
  check_gtg_own_ray_classes_on_gauge_fields:
    kind: sampled
    clauses:
    - "(4) (a) iff (c): own-ray classes vanish on Einstein fields"
    - "(7) omega_l(I_g, l) = 4 pi G T(l, l) with Ric + 8 pi G T = (Lambda + 4 pi G tau) g"
    omits: "five rational null vectors on five gauge fields; the converse of (4) is the exact rank test of check_own_ray; T is read from the field equation, so (7) is the identity on actual fields, not an independent source"
  check_gtg_infinity_vacua_with_the_unit_i7:
    kind: sampled
    clauses:
    - "(1) every infinity vacuum is W = span(I_g, l, m) with l, m spanning a totally null plane"
    - "(2) the classes of W along l on the de Sitter and FLRW gauge fields"
    omits: "three null directions with explicit screens, two fields; the exactly-two count and the Fock criterion are tested by the earlier functions"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "checks match their docstrings; clause (5) Ricci-flat and the nabla I_g = 0 equivalence have no function"
