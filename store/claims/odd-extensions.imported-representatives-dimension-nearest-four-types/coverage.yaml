functions:
  check_representatives_and_sterile:
    kind: complete
    clauses: ["the listed representatives (1,3) at 6, (3,1) at 2, (2,2) at 0, (0,4) and (4,0) at 4, (2,1) at 1, (1,2) at 7, (4,1) at 3, (1,4) at 5", "residues 0 and 4 are sterile and the other six admit matter"]
    omits: "Exhaustive over all signatures with 1 <= p + q <= 10, but the selection rule (the census under P3: dimension four for even residues, three then five for odd ones with a single time) and the definition of sterile as \"no single-time representative\" are coded in the check, not derived from the statement."
  check_shadow_types:
    kind: exact
    clauses: ["Cl(1,3) is Mat(2,H) with one module, Cl(3,1) is Mat(4,R) with one module", "the two are not isomorphic as real algebras"]
    omits: ""
  check_type_depends_on_residue_alone:
    kind: partial
    clauses: ["the real spinor type is a function of the residue alone"]
    omits: "Only the eight signatures with p + q <= 6 of residues 6 and 2 are examined (all H, resp. all R); the other six residues and larger dimensions are not tested."
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The representative table, the two shadow types and their non-isomorphism are computed; the claim that the type is a function of the residue is checked only for residues 6 and 2 up to dimension six."
