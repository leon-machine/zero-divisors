functions:
  check_rotor_rotates_the_null_direction:
    kind: exact
    clauses:
    - '"R l R~ = e_0 - 7/25 e_1 + 24/25 e_2, a null vector not proportional to l (<R l R~, l> = 32/25)"'
    - '"the double angle with (cos, sin) = (-7/25, 24/25)"'
    omits: the half-angle statement as a general fact is the imported null-flags Fact; only this instance is computed
  check_rotated_state_is_the_rotated_witt_vacuum:
    kind: exact
    clauses:
    - '"R|0> = 3/5 |0> + 4/5 |12>, with no odd component"'
    - '"R|0> is annihilated by R l R~ and R m R~, so it is the Witt vacuum of the rotated decomposition"'
    omits: ''
  check_rotation_acts_through_its_pairing_class:
    kind: exact
    clauses:
    - '"the spin action of a real rotation of the frame about the e_3 axis" (acting on |0> through its pairing class, pv(e12) = -1)'
    omits: the general mismatch-is-half-the-angle statement is the imported Fact; only the instance is computed
  check_boost_rotor_fixes_the_ray:
    kind: exact
    clauses:
    - '"the boost rotor 5/3 + 4/3 e_01 acts on |0> as the scalar 1/3 and fixes the ray"'
    omits: ''
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: all four functions are exact computations of the rotor, the rotated vacuum and the boost scalar the statement quotes
