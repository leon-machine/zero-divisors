functions:
  check_middle_mass_lemma:
    kind: sampled
    clauses: ["(i) Q(t, t, 1) - 2/3 = -(2t^2 + 8t - 1)/(3(2t + 1)^2)", "(i) t* in (0.1213, 0.1214), t*^2 in (0.01471, 0.01472), decided in rationals", "(i) Q > 2/3 when both lighter roots are at most 0.1213 of the largest", "(i) equality only at the degenerate triple"]
    omits: "the identity on six rational samples and the bound on a 91-point grid; the general case is the monotonicity argument of the proof"
  check_up_sector_charm_to_top_ratio_is_below_the_bound:
    kind: complete
    clauses: ["(ii) m_c/m_t below t*^2 at both stored mass sets, m_s/m_b above it", "(ii) Q(m_c, m_c, m_t) > 2/3", "(ii) the order-preserving threshold D_t/D_c in (1.99, 2.00) and (4.08, 4.09)"]
    omits: "none"
  check_remaining_class_thresholds:
    kind: complete
    clauses: ["(iii) R_1 in (7.88, 7.89), (11.00, 11.01), (2010.2, 2010.3), (4799.8, 4799.9)", "(iii) R_2 in (2.19, 2.20), (2.63, 2.64), (9.36, 9.37), (19.33, 19.34)", "(iii) the ninth conditions at the upper ends", "(iii) both classes contain Koide brackets (certified sign changes)", "(iii) R_1 m_u > m_c in the up sector"]
    omits: "none"
  check_stored_corner_bound_covers_the_class:
    kind: sampled
    clauses: ["(iii) the stored corner bound applies inside the class D2 > D3 > D1", "(iv) Q > 2/3 below the corner value inside the class", "(iv) Q < 2/3 at the upper ends 1.89, 2.20, 8.68, 17.56 of the R* intervals"]
    omits: "a 16-point grid per mass set; the general case is the stored monotonicity argument"
