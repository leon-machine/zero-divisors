functions:
  check_chart_and_first_law:
    kind: sampled
    clauses:
    - (o)
    - (i)
    omits: 'Six rational horizon radii and four ell: f(r_h) = 0, f increasing at three sample points (not for all r), beta^2 = 1 at the horizon locus, r_h^3 < r_*^3, r_h < 2M, the temperature and the Clausius identity; uniqueness of the antiderivative up to a constant and the if-and-only-if of (Z) are in the proof, not computed; Q(K) = 1 - beta^2 is taken from the stored gauge, not recomputed in the algebra'
  check_branches_and_free_energy:
    kind: sampled
    clauses:
    - (ii)
    - (iii)
    omits: 'Sign of the derivative of 4 pi ell T at three points on each branch, the identity tau^2 - 12 = (1 - 3x^2)^2/x^2 at five points, F and its sign and zero at six points, the values at x = 1; (FE) is a hypothesis and is not tested; "exactly two black holes" is the proof''s monotonicity argument'
  check_dimension_d:
