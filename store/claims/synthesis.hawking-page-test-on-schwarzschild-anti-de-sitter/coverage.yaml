    clauses:
    - (iv)
    omits: 'd = 4 to 7 only, at the sample radii; the entropy r^{d-2}/4 per unit of sphere area is assumed as in the statement; the minimum is tested by its value at x^2 = (d-3)/(d-1), not as a minimum'
