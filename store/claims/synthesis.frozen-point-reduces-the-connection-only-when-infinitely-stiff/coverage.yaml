functions:
  check_gtg_formal_forms_equal_their_index_readings:
    kind: sampled
    clauses:
    - 'setting: the Weyl map W(a ^ b) = calR(a ^ b) - P*(a) ^ b - a ^ P*(b) is the index reading R - KN(P*) for torsion-free Omega'
    - '(iii) (1/2) <W(a ^ b) W(d_b ^ d_a)> = (1/4) W_abcd W^abcd; (iv) the GA display equals the index display and (1 - t) L1(P*) + t L1(rho id)'
    omits: 'one torsion-free curvature sample (and one with torsion for the Weyl-map convention), four values of t and two of rho; the general equalities are the dictionary identities, argued in the proof'
  check_broken_components_of_the_frozen_point:
    kind: sampled
    clauses:
    - (i) DI = rho e - S + beta (ninf - rho n0), DX = e - beta n0 (dilation beta ninf ^ n0)
    omits: one generic slot and dilation at rho in {3/7, -2/5}; the general case is the commutator algebra in the proof (both sides linear in S and beta)
  check_stelle_west_family_slot_gradient_at_the_frozen_value:
    kind: sampled
    clauses:
    - (ii) slot derivatives at the frozen value 2(G + Lambda), (G + 2 Lambda)/rho, 12/rho id; the tuned line c3 = -2 rho c1, c5 = rho^2 c1 has zero derivative and the Euler form as frozen value
    omits: one torsion-free curvature plus the flat one at rho in {3/7, -2/5}, and one curvature without pair symmetry for the tuned line; the general torsion-free case is the equivariance argument in the proof
  check_stiffness_is_the_slot_hessian_form:
    kind: complete
    clauses:
    - (iii) St = Q2(S - rho id), beta-blind; L1(S) = L1(S*) + Q2(S - S*) with S* the Schouten map of the transposed Ricci contraction; L1(S*) = W.W/4 when torsion-free
    omits: 'none: the S-linear term is verified on a basis of 36 curvatures (no pair symmetry assumed) times 16 slots; the quadratic forms on the identity shifts of all matrix units and twenty pairs'
  check_stiffness_interpolates_conformal_gravity_and_the_frozen_functional:
    kind: sampled
    clauses:
    - (iv) slot equation of L1 + mu St solved by (S* + mu rho)/(1 + mu); value (1 - t) W.W/4 + t MM, t = mu/(1 + mu); MM = GB/4 - (Lambda/3)(R - 2 Lambda)
    omits: mu in {0, 1, 3, -1/2}, rho in {3/7, -2/5}, one torsion-free curvature; the general case is the completing-the-square algebra in the proof from (iii)
  check_frame_equation_is_the_frozen_slot_equation:
    kind: sampled
    clauses:
    - (v) frame derivative with S = rho H tied is 2 rho times the slot derivative 2(G + Lambda); over Q(I) the stored frame equation
    omits: one torsion-free curvature at rho in {3/7, -2/5}; the general case is the frame-slot symmetry of the block argued in the proof
  check_gtg_readings_of_the_curvature_operator:
    kind: sampled
    clauses:
    - "setting: the index readings of the Ricci, Schouten and Weyl maps, the Weyl square and the Euler density"
    - (iii) L1 at the Schouten slot is the Weyl square
    - (iv) L1 at the frozen slot
    - (v) the slot derivative 2(calG + Lambda id) as a map
    omits: "one torsion-free and one torsionful curvature sample, one slot matrix for Q2, two values of rho"
