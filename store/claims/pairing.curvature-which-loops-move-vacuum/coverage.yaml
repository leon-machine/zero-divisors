functions:
  check_frame_plane_classes:
    kind: sampled
    clauses:
    - '"pv(R(e_0,e_1)) = pv(R(e_2,e_3)) = 0, pv(R(e_0,e_2)) = M/r^3, pv(R(e_1,e_2)) = -M/r^3, pv(R(e_0,e_3)) = i M/r^3, pv(R(e_1,e_3)) = -i M/r^3"'
    omits: three rational Schwarzschild points (M = 1/2, 1/2, 3/2) with exact first-order jets; the closed form M/r^3 is matched at each point, not carried symbolically in r
  check_null_rotation_about_l_and_radial_loop:
    kind: sampled
    clauses:
    - '"R(l, e_2) = (M/r^3) l e_2 is a null rotation about l with zero class, while R(n, e_2) has class 2M/r^3"'
    omits: the same three points
  check_complex_loops:
    kind: sampled
    clauses:
    - '"(l,m), (l,mb), (m,mb) and (n,m) have zero class and (n,mb) has class 4M/r^3"'
    omits: the same three points
  check_class_supported_on_n_wedge_mbar:
    kind: sampled
    clauses:
    - '"The holonomy therefore moves the vacuum exactly for loops with an n ^ mb component, and for no loop lying in the null hypersurface generated by l"'
    omits: the same three points; support read off the six tetrad bivectors, with the rank-6 spanning check exact
untouched_premises:
  pairing.imported-weyl-scalars-petrov-type-schwarzschild: cited for the Weyl reading of the classes, which is the companion claim and not part of this statement
  pairing.loop-classes-are-weyl-components: companion claim that reads these classes as Weyl components, with its own check
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: all four functions compute the stated classes on exact jets at three sample points of the Schwarzschild field
