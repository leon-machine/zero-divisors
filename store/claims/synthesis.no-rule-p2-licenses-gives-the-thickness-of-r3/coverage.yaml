functions:
  check_every_other_premise_is_blind_to_the_thickness:
    kind: sampled
    clauses:
    - "(i) at (1,1) and (2,1/2): equal shares and mirrored residues within each reversal orbit, the labels and R2 densities listed, T(1,1) in (5.36, 5.37), T(2,1/2) in (9.7, 9.8), and agreement with the stored T(c) at c = 1/2, 1, 3"
    omits: "general (lam, mu), covered by the proof since no premise but R3 contains them"
  check_family_reaches_every_ratio_above_one:
    kind: sampled
    clauses:
    - "(i) at pi = 3 and 16/5: slope in lam 16/(3 pi) at three values of mu, the step in mu, T(1/2, 1/3) in (59/6, 89/9), T(1/1000, 1000) exactly bracketed just above 1, T(10, 1) > 20"
    omits: "the continuity argument for every value above 1, in the proof"
  check_own_cells_are_not_isometric_across_dimensions:
    kind: complete
    clauses:
    - "(ii) the space Gram matrices of the six populated representatives are definite of ranks 3, 3, 2, 2, 4, 4, equal within each reversal orbit"
    omits: "none"
  check_licensed_shares_miss_r3:
    kind: complete
    clauses:
    - "(ii) 8/(3 pi) in (5/6, 8/9) and below 1 <= 1/eps for sample eps in (0, 1]; licensed lam = 3 pi/8 in (9/8, 6/5); the three-dimensional share 4/3 equals 1/eps only at eps = 3/4 among the samples"
    - "(iii) T = 1 + 4/eps equals 5.364 at eps = 1000/1091 in (0.916, 0.917); equal filling gives 5"
    omits: "the classification of licensed rules into shares 1 and 1/eps, in the proof"
