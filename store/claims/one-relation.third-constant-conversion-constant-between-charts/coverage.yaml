functions:
  check_finite_ratio_iff_nondegenerate_and_mixed:
    kind: sampled
    clauses:
    - (i) "A finite invariant ratio of length to time exists if and only if Q is nondegenerate and mixed, pq != 0"
    - '"letting c -> infinity degenerates Q to the rank-one form t^2"'
    omits: three finite c and the formal c = infinity limit diag(1,0,0,0); null-vector existence by search over the grid {-2..2}^n for n <= 4 (definite forms shown null-free on the grid only); invariance of the cone under every isometry is not tested
  check_one_number_by_witt:
    kind: sampled
    clauses:
    - (ii) "the isometry group is transitive on the hyperbolic planes of (V, Q), so every hyperbolic plane carries the same c"
    omits: checks only the hypothesis of Witt on three distinct hyperbolic planes of (1,3) (complements of signature (0,2)); transitivity is the imported theorem
  check_witt_rescaling_is_the_boost:
    kind: sampled
    clauses:
    - (iii) "R = cosh(eta/2) - sinh(eta/2) e0e1, with R e0 R~ = cosh eta e0 + sinh eta e1 and R f+ R~ = e^eta f+"
    - '"the coordinate velocity of the boosted time axis is c tanh eta"'
    omits: three sample rapidities in Cl(1,1) with c = 1 (tanh eta only); that the Witt chart contains no other quantity and that the transition requires c are readings
  check_time_orientation_iff_min_p_q_is_one:
    kind: sampled
    clauses:
    - '(iv) "{Q > 0} has the components of S^(p-1): two when p = 1, one when p >= 2, none when p = 0"'
    - '"a nondegenerate form admits a future/past split if and only if min(p, q) = 1"'
    omits: ten signatures counted by union-find on at most about 40 rational grid points joined by straight certified segments; the two-component case is shown by sign-pure classes, not by a topological proof; the iff on five signatures; the (2,2) remark and the causal criterion of the dark-matter paper are not separately tested
  check_cone_determines_the_form:
    kind: sampled
    clauses:
    - closing paragraph "the cone determines Q up to scale"
    omits: nine signatures with 1 <= p, q <= 3; the Zeeman clause for n >= 3 and the levels of c, G, hbar are not tested
  check_three_constants_fix_three_units:
    kind: exact
    clauses:
    - closing paragraph "the exponent matrix of (c, hbar, G) over (length, time, mass) has determinant -2 ... hbar and G alone fix no base unit"
    omits: ''
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "each function tests its clause within the recorded kind; the conformal, metric and Witt level assignments of c, G, hbar are readings with no check. 2026-10-23 weak-checks pass: check_time_orientation_iff_min_p_q_is_one now derives the expected count from the S^(p-1) rule instead of a table, and asserts for every nonempty {Q > 0} that both time signs occur and that the classes are sign-pure exactly in the two-component case"
untouched_premises:
  std-algebra.bivector-exponential: "standard algebra cited in the proof; the check computes the statement directly"
