functions:
  check_residue_square_is_sum_of_squares:
    kind: sampled
    clauses: ["(1) B_w^2 = sum p_i^2"]
    omits: "GA products in Cl(1,3) at four rational p (two on the Kasner circle, two inside the disk); 'unit boost iff p on the Kasner circle' follows from the identity and is not separately computed"
  check_circle_has_nonpositive_entry:
    kind: sampled
    clauses: ["(2) on the Kasner circle some exponent is nonpositive", "(2) an exponent vanishes only at permutations of (1,0,0)"]
    omits: "six values of the parameter u > 0 on the rational parametrisation (first entry negative), not u < 0 or the point at infinity, so the whole circle is not covered; the vanishing-entry statement is a scan of b in {-12..12}/12 with c = 1 - b, an instance of an algebraic fact (b c = 0), not the general proof"
  check_positive_exponents_not_unit:
    kind: sampled
    clauses: ["(2) if every p_i > 0 then B_w^2 = 1 - 2 sum_{i<j} p_i p_j < 1"]
    omits: "every positive triple on the grid N = 12 (55 triples, maximum 17/24 pinned) with the identity 1 - sum p^2 = 2 sum_{i<j} p_i p_j; the grid is exhaustive but the statement is for all real p"
  check_scalar_kasner_relations:
    kind: partial
    clauses: ["(3) with Sum p = 1: Sum p^2 = 1 - 8 pi G q^2 and B_w^2 = 1 - 8 pi G q^2", "(3) the stiff isotropic point has 8 pi G q^2 = 2/3"]
    omits: "the Ricci components tau^2 R_00 = Sum p^2 - Sum p and tau^2 R_ii = -p_i (Sum p - 1) and R_ab = -8 pi G d_a phi d_b phi are coded from the cited Proposition's convention, not computed from the Kasner metric; three p points; the 'only if' direction (the equations force Sum p = 1) and the exact wave equation for phi = q log tau are not tested; k := -R_00 makes B_w^2 = 1 - k a consistency check"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "(1) and (2) are checked at sample points and on a grid; (3) is checked as algebra on coded Ricci components"
