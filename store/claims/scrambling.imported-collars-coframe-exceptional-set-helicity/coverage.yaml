functions:
  check_weighted_coframe_on_the_exceptional_set:
    kind: sampled
    clauses:
    - the weighted coframe carries weights r^(1/2) on sqrt(A) dt and r^-1 on r d theta, r sin theta d phi, with (r^(1/2) sqrt(A))^2 = 1 - r -> 1 and r^-1 . r = 1, so the horizon-normalised coframe on the exceptional set is (dt, r_h d theta, r_h sin theta d phi) exactly
    omits: three sample points of the premise field; the identities (r^(1/2) sqrt(A))^2 = 1 - r and r^-1 . r = 1 are evaluated, the limit r -> 0 is not computed
  check_orders_become_kasner_exponents:
    kind: exact
    clauses:
    - these are the Kasner exponents (-1/3, 2/3, 2/3) of the proper-time variable tau ~ r^(3/2), which in the variable r read (-1/2, 1, 1)
    omits: tau ~ r^(3/2) is read from the interior series; the orders (-1/2, 1, 1) are entered, not recomputed from the field
  check_helicity_homogeneities:
    kind: exact
    clauses:
    - 'the two helicities of a massless species are two channels at distinct homogeneities -2s - 2: -4 and 0 for the photon, -6 and +2 for the graviton'
    omits: arithmetic of the formula only; the formula and the channel identification J3 (modelling tier) are not computed
untouched_premises:
  hawking.helicity-lift-joints-itemised: the joint J3 is a modelling joint, not computable (docstring)
  hawking.imported-penrose-transform: cited for the lift only; the check covers the homogeneity arithmetic and the coframe weights, not the transform
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: Only the computable part is checked (docstring); the J3 channel identification and the Penrose-transform lift are modelling-tier and untested.
