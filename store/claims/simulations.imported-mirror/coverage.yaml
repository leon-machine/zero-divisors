functions:
  check_mirror_share_from_mass_per_baryon:
    kind: exact
    clauses: ["Omega_b' = 0.995 to 1 times Omega_b"]
    omits: "helium branch (ratio in (0.994, 0.996), computed 0.99486) with our composition taken as 75/25 by baryon number; the proton branch ratio 1 holds by definition and is not computed"
  check_temperature_ratio_interval:
    kind: exact
    clauses: ["xi between the gravitational floor 2.8 to 3.2e-4 and the hot-deposit estimate about 4e-3", "hot deposit inside the helium window (3e-3, 2e-2)"]
    omits: "interval arithmetic from T14's typed inputs (yield coefficients, g_d, g*, ceiling, eta); the helium window itself is T14c's cited result, only the hot deposit's position in it is checked; c, n_B/s pinned exactly, the floor ends and the hot deposit to one-decimal enclosures"
  check_eta_prime:
    kind: sampled
    clauses: ["eta' = eta/xi^3"]
    omits: "the identity is definitional (equal baryon number, photon number proportional to T^3 assumed) and checked at three sample xi; the interval values at the floor and hot deposit are extra to the statement"
  check_atomic_cross_section_per_mass:
    kind: exact
    clauses: ["elastic cross-section per mass of order 2e8 (hydrogen) or 5e7 (helium) cm^2/g"]
    omits: "interval arithmetic with the geometric cross-section pi (2 a_0)^2 taken as the definition, using the hydrogen Bohr radius for both; each value is pinned to its one-decimal enclosure (3.5-3.6e-16 cm^2, 2.1-2.2e8, 5.2-5.3e7 cm^2/g)"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "Docstring lists the helium/neutron composition and halo plasma behaviour as not computable; the four computable figures reproduce. 2026-10-23 weak-check pass: brackets that a looser bracket also passed (and two one-sided interval tests that an inverted interval passed) were replaced by exact by-hand pins of c, eta and n_B/s and one-decimal enclosures of the floor ends, hot deposit, eta' values and atomic cross-sections."
