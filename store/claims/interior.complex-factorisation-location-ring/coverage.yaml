functions:
  check_pseudoscalar_subalgebra_is_a_field:
    kind: sampled
    clauses: ["(1)"]
    omits: "I^2 = -1 and parity behaviour of I against all 16 blades exactly; z z~ = x^2 + y^2, the inverse z~/(x^2 + y^2) and multiplicativity of x + I y -> x + i y at three sample z (all with nonzero norm), so the 'only if' direction (z z~ = 0 means not invertible) is not exercised beyond z = 0"
  check_kerr_scale_times_shape:
    kind: sampled
    clauses: ["(2)"]
    omits: "three (M, r, a cos theta) triples; the Fact's curvature form against M_frak S(B) on all six frame planes, S^2 + S = 2 and C-linearity of S on two complex multiples of each plane, eigenvalue ratio 2 : (-1) read from the planes sigma and I sigma against the four mixed ones; the Kerr curvature is the imported Fact, not recomputed"
  check_noninvertibility_locus_is_the_ring:
    kind: sampled
    clauses: ["(3)"]
    omits: "a in {1, 3/2} and a 5 x 5 rational grid of (r, cos theta): z z~ = r^2 + a^2 cos^2 theta vanishes only at r = 0, cos theta = 0; on the disc z^3 = I c^3 and M_frak = M I / c^3 at two (M, c); the locus is a statement over the reals that the grid does not prove in general"
  check_a_zero_is_schwarzschild_from_gauge_fields:
    kind: sampled
    clauses: ["(4)"]
    omits: "three interior radii with 2M = 1 (M = 1/2): the curvature computed from the Schwarzschild interior gauge fields (torsion-free, Lambda = 0) equals M_frak S on all six frame planes with M_frak = -M/r^3; checks the a = 0 member against Proposition exact-scale-decoupling's content, not the proposition's statement in general"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "each of (1)-(4) is tested exactly at chosen points; Kerr curvature is imported and only its algebraic form is checked"
