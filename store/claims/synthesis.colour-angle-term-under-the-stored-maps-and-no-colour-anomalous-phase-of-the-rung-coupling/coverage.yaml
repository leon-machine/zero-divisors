functions:
  check_four_form_of_a_field_square_in_the_spacetime_algebra:
    kind: sampled
    clauses:
    - '(i) in Cl(1,3): <F^2>_4 = 2 (E.B) I_4 for F = E + I_4 B, with the grade-zero part E.E - B.B and no grade-two part; reversal and the grade involution fix the four-form'
    - '(i) five isometries of the vectors (a reflection, the total inversion, time reversal, a boost, a rotation) multiply I_4 and the four-form by their determinant and keep <F1 F2>_0'
    - '(i) the duality map F -> I_4 F sends bivectors to bivectors, reverses the four-form and reverses <F1 F2>_0, so it is the outermorphism of no isometry'
    omits: 'fixed rational fields and five isometries; the statement for every isometry, and that the duality map is the outermorphism of no linear map at all, are the determinant arguments of the proof'
  check_stored_conjugation_fixes_even_elements_and_reflections_reverse_the_six_form:
    kind: sampled
    clauses:
    - '(ii) in Cl(2,4): I_6^2 = -1, Ad(I_6) is -1 on the six vectors and fixes a generic bivector, the four-form of two generic bivectors and I_6'
    - '(ii) the other convention: reversal composed with Ad(I_6) sends the product of two bivectors to the product in the other order, keeps the symmetrised grade-four part and reverses I_6'
    - '(ii) a reflection in one direction and the product of three reflections reverse I_6; a reflection reverses exactly the four-form components that contain its direction'
    omits: 'two fixed bivectors; the action of the conjugation on the colour index is the hypothesis of (ii) and is not checked here (the trace form is checked in check_colour_form_is_invariant_under_automorphisms)'
  check_signature_reversal_carries_the_four_form_with_its_sign:
    kind: complete
    clauses:
    - '(iii) sigma: e_i e_j -> -e''_i e''_j is multiplicative on the whole basis of Cl+(1,3), sends I_4 to I''_4 and carries the four-form with its sign; the unsigned identification is not multiplicative and gives the same four-form'
    - '(iii) sigma composed with Ad(gamma_0) is multiplicative too, sends I_4 to -I''_4 and carries the four-form with the opposite sign'
    omits: 'the four-form on one pair of fields (enough by bilinearity once I_4 -> +-I''_4 is checked); that sigma is the stored tower-top reversal on the even ground algebra, and that the copy theorem names no identification, are read from the cited statements'
  check_colour_form_is_invariant_under_automorphisms:
    kind: sampled
    clauses:
    - '(ii) the trace form of su(3) is real, nondegenerate and negative on an explicit basis; it is kept by the outer automorphism X -> conj X, by one inner automorphism and by the transposition, an anti-automorphism that reverses brackets'
    omits: 'one inner automorphism (a cyclic permutation matrix); invariance under every automorphism and anti-automorphism is the proof''s'
  check_further_stored_maps_fix_the_four_form:
    kind: sampled
    clauses:
    - 'Reading (a): the rung boost at I_4-imaginary rapidity in two rung planes (cos = -7/25) moves gamma_0, fixes the six spacetime bivectors and I_4, keeps the four-form and turns a rung null vector by a phase'
    - 'Reading (a): in Cl(10,0) omega fixes sample bivectors; D = gamma_5 gamma_9 is a rotor that moves a bivector and keeps the scalar part of a product of two bivectors'
    omits: 'one rapidity and sample bivectors; that these are the stored maps of the cited results is read from their statements'
  check_invertible_pair_admits_no_phase_symmetry_with_a_colour_coefficient:
    kind: sampled
    clauses:
    - '(iv) exact kernels of the invariance conditions for three invertible pairs (n = 3 symmetric, n = 2, n = 3 non-symmetric): every phase symmetry has colour coefficient 0 and equal doublet weights; the ends of det(aY + bY~) are det Y~ and det Y'
    - '(iv), (v) one matrix up to a number, and a singular second matrix whose determinant form is not a monomial, also give colour coefficient 0'
    omits: 'fixed pairs with Gaussian-rational entries; the general statement is the trace argument of the proof'
  check_counter_models_with_a_colour_coefficient_have_monomial_determinant:
    kind: sampled
    clauses:
    - '(v) five counter-models (Y~ = 0, Y = 1 with Y~ nilpotent for n = 2 and 3, the family split and its exchange) have det(aY + bY~) a single monomial c a^j b^(n-j) and a phase symmetry with colour coefficient -(2j - n)(q_1 - q_2), nonzero'
    omits: 'that a nonzero colour coefficient forces the monomial form in general is the determinant-weight argument of the proof'
  check_conjugate_coupling_removes_the_fourth_charge_and_keeps_a_quarter_turn_of_the_unit:
    kind: exact
    clauses:
    - '(vi) one family in the five-mode module: the rows of the coupling to c conserve four charges, the fourth with A_3 = -2(h_v + h_w); adding the rows of the coupling to c* leaves three, forces h_v + h_w = 0 and A_3 = 0 on them'
    - '(vi) the unit of the module with slot charges -2 is conserved by the coupling to c, has charge 4 on every row of the coupling to c*, A_3 = 8, and of the group it generates exactly the quarter turns survive; the quarter turn shifts the angle by one whole turn per family'
    omits: 'that the quarter turn is the pseudoscalar omega of the ten Majoranas up to its inverse is the proof''s, from the cited order-four result'
  check_axial_phase_is_a_symmetry_of_the_stored_potential_and_unbroken_on_the_cone:
    kind: sampled
    clauses:
    - '(vii) the axial phase fixes N, m, |Q| and the sum of squared moment maps, multiplies Q by its square, and moves the lift constraint Q = -H^2; hypercharge fixes Q'
    - '(vii) at the family point of the cone the axial phase composed with the inverse hypercharge rotation fixes the point and turns the direction of the normal pair, the first-order change of Q turning with it'
    omits: 'one field value and one phase; the terms k_4 to k_9 and the statement that no direction but the gauge orbit is massless there are read from the cited scalon-sum result'
  check_determinant_phase_of_the_normal_pair_and_mass_product_of_a_monomial:
    kind: sampled
    clauses:
    - '(iv) at the family point det M_d = beta^n det Y and det M_u = conj(beta)^n det Y~'
    - '(viii) the first-order coefficients of det M_u and det M_d along the normal pair are det Y~ tr(Y~^-1 Y) conj(beta)^2 and det Y tr(Y^-1 Y~) beta^2, so the logarithmic derivatives are tr(Y~^-1 Y)/conj(beta) and tr(Y^-1 Y~)/beta'
    - '(v) for a monomial determinant on the lift locus the product of the quark masses is |c|^2 H^(2n)'
    omits: 'one symmetric pair with n = 3 and one monomial model; the order-of-magnitude estimate of the Reading (the relative displacement of order 10^-13) is not checked'
untouched_premises:
  dark-matter.mirror-tower-copy-one: 'cited in (iii) and in the Reading for the statement that the mirror is related to this tower by the signature reversal and that the copy theorem names no identification of orientations; nothing is computed from it (the signature check computes the two isomorphisms themselves)'
  synthesis.imported-chern-weil-and-chern-simons-forms: 'imported Fact cited for the reading of Theta(F) as the characteristic four-form of the trace form; the checks compute the four-form in the algebra and the trace form on su(3) directly and call no premise for it'
