functions:
  check_charge_conjugation_and_invariant_states:
    kind: sampled
    clauses: ["C implemented as particle-hole reflection about the sea level, J -> -J and T -> T", "the vacuum and the thermal state have the three invariances"]
    omits: "a six-mode window (Fock dimension 64) of the infinite array, J_n for |n| <= 3 and the truncated Sugawara T_n for |n| <= 2; one thermal weight x = 1/2; that the induced state of the cited Fact has the invariances is premise (Q) and is not tested"
  check_graviton_blind_to_charged_and_c_odd_probes:
    kind: sampled
    clauses: ["phi(T O) = 0 for gauge-charged and C-odd neutral probes", "likewise for every mode T_n"]
    omits: "the six-mode window, T_n for n in -2..2, charged probes a_k and a_k^dag for all six modes plus three bilinears, C-odd probes J_m for |m| <= 3, in the vacuum and one thermal state; 'any nontrivial irreducible representation of any respected symmetry' is not tested; controls (C-even neutral probes, a chemical potential, a charge superposition) give nonzero values"
  check_vacuum_orthogonality_by_dimension:
    kind: sampled
    clauses: ["in the conformal vacuum every quasi-primary of dimension other than two is orthogonal to T"]
    omits: "only <0|T_2 X|0> = 0 for current-built states at levels 1, 3 and 4 (all states at levels 1 and 3, two of five at level 4), which is L0-grading orthogonality inside the window; quasi-primarity is not tested, no value is asserted for two of the three sample level-2 states, and uniqueness of T as the only dimension-two quasi-primary with overlap is not tested; the overlap <0|T_2 T_{-2}|0> = 1/2 is checked"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "Everything is a six-mode window model of an infinite-array statement with positive and negative controls; the checks do not exceed their docstring."
