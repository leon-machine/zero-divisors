functions:
  check_even_residue_table:
    kind: sampled
    clauses: ["even residues whose spacelike extension is type C are {2,6}; timelike {0,4}", "every even residue has exactly one obstructing one-dimensional extension"]
    omits: "all even (p,q) with 2 <= n <= 8, which hits each of the four even residues mod 8 several times, but not every (p,q) of a given residue"
  check_physical_lineage_and_mirror:
    kind: sampled
    clauses: ["the physical lineage is at residue 6 and its Rule 1 ascents never leave it", "it leaves residue 6 only through a spacelike direction, into the obstruction at residue 5", "the opposite-sign repair returns it to 6 as Mat_2 of the algebra it started from", "the same at residue 2 (mirror), with Cl(4,1) unobstructed"]
    omits: "three Rule 1 steps (1,3) -> (2,4) -> (3,5) checked for residue and omega^2, and Mat_2 only for the first two; one residue-6 and one residue-2 example (Cl(1,3), Cl(3,1)); 'only through a spacelike direction' is the exactly-one table at those two signatures; the T14 causal-convention reading of 'spacelike' (mirror's second time) is interpretive and untested"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The residue table is exact on all even (p,q) with n <= 8 and the lineage claims on the named examples (1,3) and (3,1); the convention sentence about T14 is not testable here."
