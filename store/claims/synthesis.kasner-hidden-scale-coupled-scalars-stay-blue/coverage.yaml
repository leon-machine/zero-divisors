functions:
  check_reduction_weights:
    kind: sampled
    clauses: ["(v) sqrt|g_5| = sqrt|g_4| b and Q(f_y) = -b^2 in Cl(1,4)", "(v) weights b^1, b^-1, b^0 and alpha = 1 + (lambda - 1) p_h"]
    omits: "computed at tau = 2^12 for six exponent sets; the identity is the exponent sum"
  check_bessel_order:
    kind: sampled
    clauses: ["(i) operator identity on s^n (ln s)^m to the order |lambda - 1||p_h|/(2q)", "(i) control: order 0 iff (lambda - 1) p_h = 0"]
    omits: "terms n in {0, 1, 2, 5/2, nu}, m <= 1, lambda in {-1, 0, 1, 3, 5}, six exponent sets, k = q"
  check_normalisation_and_index:
    kind: complete
    clauses: ["(ii) alpha + 2a = 1, so the normalisation is free of k", "(ii) n - 1 = 3 - 2 nu; (v) pinned (nu, n - 1) at both isotropic vacuum points"]
    omits: "the small-argument form of H_nu is cited"
  check_equal_observed_exponents:
    kind: sampled
    clauses: ["(iv) circle iff p in {0, 1/2}, disk iff 0 <= p <= 1/2", "(iv) |1 - 3p|/(1 - p) <= 1 with closed form of the gap", "(iv) unequal observed exponents give different orders"]
    omits: "grids in steps of 1/24 and 1/60; the inequality is proved in closed form in the proof"
  check_every_point_has_a_blue_axis:
    kind: sampled
    clauses: ["(iii) one exponent in [-1/2, 1] (factorisation 2(2p + 1)(p - 1))", "(iii) 3|p_h| > 2 + p_h impossible on the range", "(iii) grid of the ball: some exiting observed axis has order <= 1, worst case 1 at (1/2,1/2,1/2;-1/2)"]
    omits: "grid step 1/12 in the observed exponents at lambda = -1; the general statement is proved in the proof"
  check_stored_fields_blue:
    kind: sampled
    clauses: ["(v) lambda in {0, 1, -1}: nu <= 1, n - 1 >= 1", "(v) gap 1.0351, over 246 sigma", "(v) control lambda = 5 sweeps [-1, 3]", "(v) gauge vector zero modes order p/(1 - p) <= 1, conformal control"]
    omits: "grid in steps of 1/60 on the segment"
untouched_premises:
  synthesis.imported-bessel-reduction-and-small-argument-hankel-forms: "imported Fact: the Bessel reduction and Hankel forms are used in the proof; the check verifies the operator identity directly"
  synthesis.imported-kaluza-klein-ansatz: "imported Fact: the Kaluza-Klein weights are recomputed in Cl(1,4) by the check, the ansatz itself is cited"
  synthesis.imported-planck-2018-isocurvature-and-isotropy-bounds: "imported Fact: statistical isotropy is a remark in (iv); no number from it enters the checks"
