functions:
  check_partner_makes_unit_ideal:
    kind: sampled
    clauses: ["in every fibrewise completion the ideal generated by k contains 1"]
    omits: "nine signatures with p + q <= 3, one fixed off-diagonal pattern, completions of dimension n + 1 and n + 2 only (18 spaces); the quantifier over every nondegenerate (W,Q) rests on the constructive proof"
  check_null_partner_needs_the_normalisation:
    kind: sampled
    clauses: ["none: a control showing the normalisation Q(k,v) = 1/2 is needed for k* to be null"]
    omits: "identity Q(v - Q(v,v)k) = Q(v,v)(1 - 2Q(k,v)) checked on two vectors per space, with at least one non-null candidate per space; establishes no clause of the statement"
  check_degenerate_fibre_ideal_square_zero:
    kind: sampled
    clauses: ["resolution converts a square-zero ideal into the unit ideal (the square-zero side)"]
    omits: "c(k) c(e_I) c(k) = 0 on all blades and A k A of rank 2^(n-1) for the nine signatures with n <= 4 only"
untouched_premises:
  std-algebra.vector-squares: "standard algebra cited in the proof; the check computes the statement directly"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "The unit ideal via a null partner and CAR is checked on 18 hand-built completions of corank-one fibres with p+q<=3, and the square-zero contrast on the same fibres; the quantifier over every nondegenerate (W,Q) is the proof's, not the check's. 2026-10-23 weak-check pass: the normalisation control now asserts that some unnormalised candidate partner is non-null in every space (a redundant guarded assert implied by the identity was replaced)."
