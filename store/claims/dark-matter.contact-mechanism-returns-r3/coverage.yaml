functions:
  check_five_dimensional_count:
    kind: exact
    clauses: ["(i) f_5D = V_3/V_4"]
    omits: "the contact criterion (a ball of radius d at height h meets the hyperplane iff h^2 <= d^2, in the unit d) is checked at sample heights and foot points; the postulates C, I, S and O are assumed"
  check_side_is_immaterial:
    kind: exact
    clauses: ["(iii) the one side S"]
    omits: "the statement does not assert side-immateriality in so many words; the check supports the one-side count by central orthogonal idempotents in Cl(1,4)"
  check_three_dimensional_sheets:
    kind: exact
    clauses: ["(ii) f_3D = V_3/V_2", "sheet spacing s = 1 from O"]
    omits: "in the unit d = 1; the dependence on d is checked only on the coded densities, in check_total_and_alternatives"
  check_total_and_alternatives:
    kind: exact
    clauses: ["(iii) the total is the unit-ball rule's", "d cancels"]
    omits: "the cancellation of d is checked at the sample lengths in UNITS; the comparison with observation (more than 5.5 sigma without S) uses the check's own OBS and SIG constants"
  check_own_cell_reading_differs:
    kind: exact
    clauses: ["(iv) for a five-dimensional tower, on a quantum's own cell the thickness is the own cell radius and the share is (V_3/V_4)(a/d); at sixteen times heavier and rarer, a = 2d and the share doubles"]
    omits: "the five-dimensional tower only, at k = 1, 16, 81"
  check_own_cell_sheets_use_our_cell:
    kind: exact
    clauses: ["(iv) for a three-dimensional tower the sheets come out this world's own cell radius a_6 apart and the share is (V_3/V_2)(d/a_6), whatever the tower's own quanta are", "(iv) this is not the own-cell reading of R3"]
    omits: "three values of a_6 and three of the tower's own cell radius, on the coded densities of E; the step that the balls meeting the plane are this world's is the proof's"
judge:
  by: maintainer-2026-11-19
  date: '2026-11-19'
  verdict: agrees
  note: "the arithmetic and geometry derived from the postulates are exact in Q(pi); the postulates themselves are not tested"
