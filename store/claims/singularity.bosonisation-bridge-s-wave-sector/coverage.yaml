functions:
  check_current_algebra_with_edge_operator:
    kind: sampled
    clauses: ["(1)"]
    omits: "one finite window of 10 sites, m = 1, 2, 3: edge identity [a_m, a_-m] = B_m - T_m on all 252 charge-zero states, m delta_{m+n,0} only on the 6 bulk states, [a_m, a_n] = 0 (m + n != 0) on bulk states for six pairs, a_-m = a_m^T on 60 states; the infinite-array statement and general windows are not tested"
  check_currents_are_weight_vectors_and_kms_restricts:
    kind: sampled
    clauses: ["(2)"]
    omits: "[H, a_m] = -kappa m a_m on every seventh charge-zero state at kappa = 1, 3/2 and m = 1, 2, -1; non-affine weights k^2 fail (m = 1), with [H, a_1] pinned hop by hop as -(2k + 1) psi_k^dag psi_{k+1}; the Gibbs occupations are pinned at half filling n_0 = 1/2 (the identity itself holds at any fugacity); KMS restriction only as the window product-Gibbs identity <a_-m a_m> = x^m/(1-x^m) <B_m - T_m> at x = 1/2, 2/3, m = 1..3, not the general 'KMS state restricted to an invariant subalgebra' statement or the modular flow of the premise"
  check_planck_factor_and_role_of_q:
    kind: sampled
    clauses: ["(3)"]
    omits: "detailed balance as rational-function identities in x at m = 1, 2 and k in {-4,-1,0,3}; telescoping identity S_K (1 - x^-m) = T_K exact at x = 1/2, 2/3, m = 1..3, K = 30, and the infinite sum is concluded from a tail bound at K = 30 (S != planck there), not a limit proof; the no-(Q) counterexample is one correlated state with connected correlator -1/100"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "W413 pass 2026-10-23: the omega_k = k^2 control now pins [H, a_1] term by term (-m(2k + m) on the hop k + m -> k) instead of only 'more than one ratio'; the Gibbs occupations are pinned at n_0 = 1/2 since the KMS identity holds at any fugacity; samples moved to module level"
