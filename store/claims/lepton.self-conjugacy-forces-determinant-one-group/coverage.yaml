functions:
  check_not_self_dual_under_full_group:
    kind: complete
    clauses: ["Con_k* is Con_(3-k) tensor (det A det B)^-1", "no Con_j is isomorphic to Con_k* (j, k in {0,1,2,3})", "K-weights 1 - j and -(1 - k) never agree with matching content"]
    omits: "all four k and all 16 pairs (j, k) on torus weights (characters); not an explicit intertwiner"
  check_self_dual_iff_determinant_one:
    kind: sampled
    clauses: ["for G containing SU(2) x SU(3), Con is self-dual iff det A det B = 1 on G"]
    omits: "subgroups G are encoded by the lattice of central characters trivial on G, an encoding argued in the docstring and not computed; the biconditional is checked over the trivial lattice and the 24 + 276 lattices generated by one or two vectors from the box 2a x 3b with a, b in [-2, 2], not all sublattices"
  check_dimension_twelve:
    kind: exact
    clauses: ["S(U(2) x U(3)) is twelve-dimensional"]
    omits: "that S(U(2) x U(3)) is the largest subgroup with a conjugation-closed spectrum is not separately tested (it rests on the biconditional, which covers subgroups containing SU(2) x SU(3) only)"
  check_twisted_action_is_self_conjugate:
    kind: exact
    clauses: ["(Con_k tensor t)* is Con_(3-k) tensor t for t = (det A det B)^(-1/2)"]
    omits: "half-integer shifted torus weights for k = 0..3; the double cover and the remark that the conclusion fails there (the linked observation) are not computed"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "Non-self-duality, dimension twelve and the twisted self-conjugacy are exact; the subgroup biconditional is checked on a bounded family of lattices."
