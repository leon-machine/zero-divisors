functions:
  check_ad_nu_is_grade_involution:
    kind: sampled
    clauses:
    - nu a nu^-1 = a^ for a in A
    omits: Signatures 1 <= n <= 6 and gamma = +-1 on every basis blade (54 cases), not all (p,q)
  check_projectors_exchanged_and_sum_to_one:
    kind: sampled
    clauses:
    - nu omega nu^-1 = -omega
    - nu eps_pm nu^-1 = eps_mp
    - eps_+ + nu eps_+ nu^-1 = 1
    omits: The ten type-C bases with n <= 7 (omega central, omega^2 = 1) and both gamma; the interpretive sentence on the type-C obstruction being resolved is not a computable claim
  check_ideal_of_projector_is_unit_ideal:
    kind: sampled
    clauses:
    - the two-sided ideal of B_gamma generated by either projector is all of B_gamma
    omits: Type-C bases with n <= 3 only, and only the ideal generated by eps_+ is computed (eps_- by the exchange of the previous function)
untouched_premises:
  std-algebra.involution-properties: "standard algebra cited in the proof; the check computes the statement directly"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: Conjugation identities and the unit-ideal conclusion are tested exactly on finite signatures; the final interpretive sentence is not checked.
