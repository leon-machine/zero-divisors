functions:
  check_untuned_fit_caps_lightest_heavy_neutrino:
    kind: partial
    clauses: ["alpha <= ||M_D||^2/m_3 (norm bound)", "alpha < 7.3e8 GeV and M_I/alpha above 26", "c above 3.9e12 needed, seeding temperature more than 1400 times the cap for c <= 1", "c <= 1 is forty-one vector species or one Standard-Model content (0.568); the odd towers' vectors 0.529; four contents 2.27, more than 1100-fold", "tuned rows give alpha < 8.9, 15.4, 29.2 e11 GeV and do not decide even at c = 1"]
    omits: "the norm bound is tested only in its trace form tr(M_D^T R^-1 M_D) <= ||M_D||_F^2/min d on three real integer Dirac matrices with three real diagonal Majorana matrices (equality on the rank-one instance); m_3 <= ||M_D||^2/alpha for complex M_D, complex symmetric M_R and the largest Takagi value is not tested; the numbers are exact rational computations from hard-coded inputs (Planck densities, rho_c/h^2, s_0, M_P, kappa_s from the formula with g = g_s = 100) and from the production law Y = c T^3/(3 kappa M_P^3) coded in the check rather than read from the imported Fact; the per-species coefficients are computed from the closed form of the pair-production theorem's clause (v), coded in the check and compared with its printed rationals (that theorem's check exports nothing); Premise T_desc <= alpha and the consequence 'reheats below the intermediate scale' are logical"
judge:
  by: coverage-judge-2026-10-23
  date: '2026-10-23'
  verdict: agrees
  note: "the thresholds 7.3e8, 26, 1400, 3.9e12 and the tuned-row bounds are reproduced exactly; the inequality behind them is tested on real diagonal instances only. 2026-11-18 (maintainer pass, version 2): the contents meeting c <= 1 and the margin at c = 2.27 added with the derived coefficients; thresholds unchanged; not judged again by an independent judge."
