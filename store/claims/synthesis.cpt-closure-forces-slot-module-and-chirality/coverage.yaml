functions:
  check_cpt_closure_classification:
    kind: sampled
    clauses: [(1)]
    omits: Enumerates all 1023 nonempty multiplicity-0/1 choices over the ten irreducibles with lambda_1 <= 3 (exactly three are self-conjugate, matching a, b in {0,1}), checks a, b <= 3 are self-conjugate and that adding any of (2,0), (2,1), (2,2), (3,0) breaks it; larger multiplicities, lambda_1 > 3 and general (a, b) are not enumerated; the 32-state, 11-isotype content of the (S) module is checked.
  check_generation_forces_fermionic_slots:
    kind: sampled
    clauses: [(3)]
    omits: The equivariant maps C^2 (x) C^2 -> Lambda^2 and -> Sym^2 are each one-dimensional and kill the symmetric, respectively alternating, tensors (the exclusion for Lambda^bullet C^2); generated modules F_0 = C with quotient-of-Pieri choices are enumerated only through slot number 4 and give Lambda^bullet C^2 as the sole CPT-closed one; truncations of Sym C^2 to top <= 4 are not closed.
  check_anomaly_free_halvings:
    kind: sampled
    clauses: [(2)]
    omits: For a = 1 and b = 0..5 the number of anomaly-free halvings is 2 if b is odd and 0 if even (exhaustive over halvings of each V), with cubic SU(3) and Witten parity extras; b = 3 content is checked (one generation plus one vectorlike pair of each type); the four conditions on the five net chiralities have a one-dimensional kernel spanned by (-1, 1, -1, -1, 1); b > 5 and a != 1 are not covered.
  check_chirality_is_mode_parity:
    kind: complete
    clauses: [(4)]
    omits: 'Exhaustive over all CPT halvings of F = Lambda^bullet C^2: the anomaly-free ones are exactly the even and odd n + k halves away from the neutral singlet (the line choice there is not enumerated), the even half is one generation, and at slot parity 0 neither tower-grading half is anomaly-free.'
judge: {by: coverage-judge-2026-10-23, date: '2026-10-23', verdict: agrees, note: (4) is an exhaustive finite classification; (1)-(3) are enumerations to bounded slot number or multiplicity.}
