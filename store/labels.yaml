  table: The tests at a glance
T14b:tab:halo:
  kind: table
  near: simulations.merger
  number: '4'
  table: Projected ellipticity 1 - b/a inside 500 kpc of the assembled cluster, mean of three projections, for the two seeds;
    the last column is each seed's ratio to the CDM run of the same seed. CDM's own two seeds differ by 0.15
T14b:tab:merger:
  kind: table
  near: simulations.averaged-pair-operator
  number: '3'
  table: 'The Bullet-like merger (Section sec:measure): separation at the Bullet-like moment, maximum separation after closest
    approach up to t = 1.3 (the CDM run was followed to 1.5; the runs at 1083 to 1090 and 759 to 846 kpc are still separating
    at 1.3), lensing contrast, signed mass-peak offset from the galaxies (positive: the mass peak leads; below 10 kpc is within
    one grid cell), the subcluster''s own mass within 150 kpc of its galaxies relative to CDM''s, and the mass-to-light change
    since t = 0 (sampling error 15 to 21 percent). The own-mass column has no observed counterpart: Randall et al.''s 23 percent
    bound on mass loss is inferred from the mass-to-light ratio, not from the mass inside a fixed aperture. Where the contrast
    is near or below 1 there is no separate subcluster peak, and the offset ( rule\_perp''s +185) locates the nearest mass
    maximum, not a subcluster''s. ``Dissolved'''': the subcluster no longer has a galaxy concentration, so the ratio does
    not measure what the observation measures. Each run is one realisation. Observed values from Fact fact:bullet; ^ the subcluster''s
    lensing peak, within 1 of its galaxy centroid, which is known to 22 kpc; ^*the observed value is the ratio itself, not
    a change'
T14b:tab:sidm:
  kind: table
  near: simulations.effective-cross-section-sheet-matter
  number: '1'
  table: The three-dimensional towers' _ eff/m in (Proposition prop:sigmaeff), in clusters at z = 0.3 ( the overdensity),
    for in-sheet cross-sections = 0.21 fm (the nucleon's Compton length) to 2 fm. The cluster bounds are 0.47 to 1.25\ (Fact
    fact:bullet). In a core at = 1 fm the in-sheet mean free path 1/(n_2 ) is 26 AU, so on cluster scales the matter is a
    fluid within its sheets
T14b:tab:stages:
