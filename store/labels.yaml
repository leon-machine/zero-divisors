T05:tab:chain:
  kind: table
  near: singularity.imported-equivalence-einstein-equations
  number: '1'
  table: 'The transport chain, with statuses. The step names in italics are those of the transport algorithm of [ 8.1]ButlerT1,
    verbatim, and the section titles carry the same names; Table tab:algmap gives the bijection. Each status is argued where
    the step is proved, and every premise is a named one stated in the text: univalence (P) and horizon regularity (R), the
    KMS condition at the period the Euclidean section fixes, imposed mode by mode, in Step 4d; joint quasi-freeness (Q) in
    Step 4e; the metric-level reading , licensed in Step 5 by Proposition prem:localuniv up to its definitional antecedent;
    the capacity postulates (C1)-(C3) in Step 6a; localisation (L), purity (U), capacity (C) and injection (I), collected
    as Premise prem:ratemodel in Step 6b, with boundary-mode locality (L_E) stated as Premise prem:local in Step 4d and used
    in Step 6b, of which (L)''s exhaustiveness clause is the one carrying conjectural weight, and (I)''s freshness clause,
    like (L_E)''s never-return clause, is the rate model''s own assumption rather than an import. Given them the statements
    are theorems; Step 6b uses no typicality and claims the envelope, the exact rising branch, the quantified falling branch
    and the endpoint; exact saturation of the falling branch holds only in the zero-frequency idealisation, of which the linear
    weights supply exactly one mode'
