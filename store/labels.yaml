T14b:tab:comps:
  kind: table
  near: simulations.averaged-pair-operator
  number: '2'
  table: 'Compositions run, as shares of the dark matter ( merger.py). The orientation codes describe the sheets'' normals:
    random (a random normal per particle), perp (all normals along the line of sight, perpendicular to the merger axis, so
    the axis lies in the sheets) and par (all normals along the merger axis). A run is named model\_orientation; mirror\_only
    is model mirror with random normals, reading (C). Suffix nm: the mirror collisionless from the start; suffix lo: half
    resolution'
T14b:tab:files:
  kind: table
  near: simulations.mirror-galaxy
  number: '7'
  table: The files in code/ and what each produces
T14b:tab:glance:
  kind: table
