house_style:
  banned_words:
  - honest
  - honestly
  disclaimer: '\textbf{Authorship and disclosure. }The founding idea of the series is the author''s: that division by zero in a Clifford algebra should be read not as a prohibition but as a transport into a higher-dimensional algebra, and that the transported division need not be accompanied by an inverse operation. The direction of investigation and the critical review of the results are likewise the author''s. The mathematical development and the drafting of the text were carried out in extended collaboration with Claude Fable 5 (Anthropic), an AI system.'
  disclaimer_source: T07 v1 (Sep 2026) verbatim; replace with the v2.0 wording, which adds the Zenodo community link
governance:
  maintainers:
  - leon
  # GitHub logins with maintainer rights (CI passes the pull request's login as
  # the author)
  github_logins:
  - leon-machine
  core_regions:
  - transport
ai_judge:
  enabled: false
# research programmes held side by side in the store (roadmap item 12; rules E218,
# docs/PROGRAMMES.md). An entity belongs to its own `programme`, else to
# default_programme; every subject in subjects.yaml names its programme.
default_programme: transport-papers
programmes:
  transport-papers:
    title: The Transport Papers
    about: "the Transport Papers series: Clifford-algebra transport, gauge theory gravity (GTG), the completion and what is built on it"
    maintainers:
    - leon
  standard:
    title: Standard physics
    about: "standard physics imported once: textbook results, measured quantities and conventions that programmes build on; imported Facts with textbook or DOI provenance, checked where a finite core exists"
    maintainers:
    - leon

# the public address of the site (the page that serves index.html), e.g. https://zerodivisors.org/
# when set, shared links use it, link previews name absolute images, and each result gets a small
# share page r/<id>.html carrying its own preview. Empty until the site is hosted.
site_url: "https://zerodivisors.org/"
# the public, read-only MCP endpoint (tp/mcp_http.py, docs/HOSTING.md), e.g. https://mcp.zerodivisors.org/mcp
# when set, the Explore with AI page and llms.txt offer it first, so a visitor can connect an AI
# with no install. Empty until it is hosted.
mcp_url: "https://mcp.zerodivisors.org/mcp"
# the private preview of the site (the claude.ai artifact): used for shared links while site_url is
# empty and the viewer cannot see the page's own address
preview_url: "https://claude.ai/artifact/U5uQ2AitmiRZCwEDFEa8qQ"

# expert reviews sealed by ORCID (tp/reviews.py, docs/REVIEWS.md). Records in store/reviews are
# always validated; `enabled` only decides whether they are shown on the site and through MCP.
# Switched on 16 November 2026.
reviews:
  enabled: true
  # the open review log (a separate repository holding the identifying part of each record),
  # relative to this store; checked out beside the lab
  log: ../../review-log
  orcid:
    issuers: ["https://orcid.org"]
    # the review service's production ORCID client id, once registered (stage 2)
    client_ids: []
  # iDs whose answers to objections count as the maintainer's
  maintainer_orcids: ["0009-0006-4449-5617"]
  # qualification rule and reviewer terms versions in force (docs/REVIEWS.md)
  rule_versions: [1]
  terms_versions: [1]
  # qualification rule version 1 (tp/qualify.py): OpenAlex subfields that count, and whether a
  # work counts only when OpenAlex lists the reviewer's iD among its authors
  qualification:
    min_works: 3
    subfields: [2610, 3103, 3106, 3107, 2602, 2608]
    require_author_match: true
    invited: []
  # the review service (tp/review_server.py). Secrets come from the environment, never from here:
  # TP_ORCID_CLIENT_ID, TP_ORCID_CLIENT_SECRET, TP_GITHUB_TOKEN. The site shows "Review this
  # result" only once base_url is set.
  server:
    base_url: ""
    orcid_base: https://orcid.org
    graph_repo: leon-machine/zero-divisors
    log_repo: leon-machine/review-log
    privacy_contact: ""
