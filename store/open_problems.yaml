- id: op.qft-loops-and-renormalisation
  title: The interacting field theory beyond tree level, in the series' own formalism
  area: quantum-fields
  kind: research
  difficulty: frontier
  status: partial
  source: "The field-theory results of 16 October (second quantisation with i = I4, the elementary photon, tree-level exchange) and the review of what a quantum field theory still needs, 1 November; the one-loop, regulator and unit results and Leon's decisions (the Krein-form premise, the unit's placement on massive lines), 1 November; the two-loop, LSZ, regulator-free, triangle-anomaly and chiral-loop results and Leon's decisions (the extension, dimensional-regularisation and anomaly imports, the floor no-go merged into the floor-regulator result, the chiral-loop convention), 2 November; the curved-field kernel result accepted 10 November, with the scaling-degree rules and local covariance with scaling imported by Leon's decision of 9 November"
  statement: >-
    The series has free fermion and photon fields with $i = I_{4}$
    (\claimref{field-theory.second-quantisation},
    \claimref{field-theory.fock-space-maxwell-modes}) and tree-level exchange
    (\claimref{field-theory.coupled-system-tree-level}); one and two loops,
    an S-matrix element and the chiral anomaly are now reproduced, each with a
    stated scheme. What remains is renormalisation in the series' own scheme
    beyond one loop: compute the two-loop vacuum polarisation, and the
    one-loop self-energy and vertex, by extension of distributions with no
    regulator, prove the existence of Ward-preserving extensions inside the
    store, and either find a Lorentz-covariant regulator native to the series
    or adopt extension of distributions as its scheme; or show where the
    formalism needs an input it does not have.
  why: >-
    The series' loop results so far rest on imported regulators (Pauli-Villars
    fields of negative norm, dimensional regularisation) or on an imported
    existence theorem; until its own scheme reaches two loops, its quantum
    predictions beyond the leading logarithm are borrowed.
  known: >-
    Tree-level QED and contact interactions are reproduced; the tower has no
    CCR pair (\claimref{field-theory.no-canonical-commutation-relations-tower}).
    One loop: under the Krein-form premise
    (\claimref{synthesis.krein-form-premise-indefinite-inner-product-for-gauge-fields})
    with imported Pauli-Villars regulators, one-loop electrodynamics in the
    spacetime algebra gives the transverse vacuum polarisation
    $e^{2}/(12\pi^{2})$, $F_{2}(0) = \alpha/(2\pi)$ and $Z_{1} = Z_{2}$, the unit
    standing outside the product on massive lines
    (\claimref{synthesis.one-loop-qed-in-the-spacetime-algebra}); the running
    coefficients follow from spin traces
    (\claimref{synthesis.one-loop-running-coefficients-from-spacetime-algebra-spin-traces}).
    Regulator-free vacuum polarisation: under the imported extension theorem
    of causal perturbation theory
    (\claimref{synthesis.imported-epstein-glaser-extension-theorem-and-ward-preserving-time-ordered-products}),
    the one-loop vacuum polarisation extends across the coincident point with
    no regulator field and no Krein form to a covariant transverse kernel with
    log coefficient of magnitude $e^{2}/(12\pi^{2})$ per Dirac fermion; any two
    covariant extensions of the other one-loop kernels obeying the Ward
    identities and the reflection differ only by $Z_{3}$, $\delta m$ and
    $Z_{2} = Z_{1}$ (their existence imported, Scharf; the self-energy and vertex
    parts under the Krein-form premise), and the vector-conserving three-current
    extension is unique, so the axial divergence is scheme independent
    (\claimref{synthesis.one-loop-vacuum-polarisation-extends-without-a-regulator-and-ward-preserving-extensions-differ-only-by-the-renormalisation-constants}).
    So the Pauli-Villars clause of the Krein premise is not needed for the
    vacuum polarisation (noted on the premise; not retired, since the stored
    self-energy and vertex still use it). Two loops: under the Krein-form
    premise and in dimensional regularisation with its imported integral rules
    (\claimref{synthesis.imported-dimensional-regularisation-and-the-bmhv-gamma5},
    clause (iv)), the two-loop vacuum polarisation of a massless Dirac fermion,
    with the Clifford product continued in dimension by one contraction rule,
    is transverse and independent of the gauge parameter identically in $d$,
    has only a simple pole, and recovers the standard
    $\beta_{1} = 4$ per fermion ($\mu\,d\alpha/d\mu = 2\alpha^{2}/(3\pi) +
    \alpha^{3}/(2\pi^{2})$, Jost and Luttinger) with the
    $\overline{\mathrm{MS}}$ constant $16\zeta_{3} - 55/3$; $Z_{1} = Z_{2}$ holds
    at two loops integrand by integrand (argued for the integrals)
    (\claimref{synthesis.two-loop-qed-in-the-spacetime-algebra-continued-in-dimension-gives-the-second-beta-coefficient}).
    S-matrix: with LSZ reduction the residues $p \pm m$ are twice the mass
    times idempotents of trace two, the tree cross section of
    $e^{+}e^{-} \to \mu^{+}\mu^{-}$ follows from two Clifford traces, and the
    cut of the photon self-energy equals the tree rate (the s-channel
    optical-theorem relation; full order-$e^{4}$ unitarity not computed)
    (\claimref{synthesis.electron-positron-to-muon-pairs-in-the-spacetime-algebra-lsz-tree-cross-section-and-one-loop-unitarity}).
    Chiral loops: with $\gamma_{5} = iI_{4}$, the $I_{4}$ inside the product
    and the unit outside it (recorded as a convention), the chiral projectors
    delete the evanescent loop momentum and the breaking terms and finite
    symmetry-restoring counterterms of the abelian factor are the standard BMHV
    ones, recomputed: chiral loops need nothing beyond the imported scheme
    (\claimref{synthesis.chiral-abelian-loops-with-i4-as-the-bmhv-gamma5-need-finite-symmetry-restoring-counterterms}).
    The triangle anomaly with Pauli-Villars regulators is
    $(1/(2\pi^{2}))\langle I_{4}\gamma^{\nu}k_{1}\gamma^{\rho}k_{2}\rangle_{0}$,
    the bilinear form of the pseudoscalar part of $F^{2}$ (the standard
    Adler-Bell-Jackiw value,
    \claimref{synthesis.imported-adler-bell-jackiw-axial-anomaly}), and the
    anomaly tensor of one generation vanishes on the whole gauge algebra, for
    any number of generations
    (\claimref{synthesis.triangle-anomaly-in-the-spacetime-algebra-is-the-pseudoscalar-part-of-the-field-square-and-cancels-per-generation}).
    The native regulator: the tower's floors keep the charge, the continuity
    equation and the central term on the filled sea up to the cut-off, but
    keep the rotations and no boost, and no weighting of the floors by
    conformal energy, sharp or smooth, keeps a boost (the commutant of the
    conformal Hamiltonian with one boost generates the conformal algebra;
    Schur)
    (\claimref{synthesis.floor-regulator-keeps-the-charge-and-the-central-term-below-the-cut-off}).
    The one-particle Gupta-Bleuler form of the Krein premise is the trace form
    of Clifford conjugation, minus the metric: restated in the store, not
    derived
    (\claimref{synthesis.clifford-conjugation-is-the-twistor-adjoint-and-its-trace-form-is-the-one-particle-gupta-bleuler-form}).

    (10 November.) Attack item 3, the curved-field clause: first steps
    (\claimref{synthesis.vacuum-polarisation-kernel-on-a-gravitational-field-has-the-flat-leading-part-and-no-weyl-term-of-degree-four}).
    Scope: one loop, the trace form of the Dirac Hadamard parametrix on a torsion-free gravitational field, in
    the normal coordinates of one point with the other index transported along the geodesic. The transport
    rotors cancel exactly from the leading kernel, which is the flat one in the tangent $D\sigma$ times the Van
    Vleck determinant (proved). At first order $D_{x}U = +\tfrac{1}{12}\mathcal{R}(\xi)R$, with
    $\mathcal{R}(\xi)$ the Ricci vector, which is zero on a vacuum field whatever the Weyl part (proved given
    the stored Taylor data and the protraction identity). The Weyl part of the curvature operator enters from
    degree three down, and squared at degree two through the Van Vleck determinant. Argued, not proved: the
    degree counting (degree six with the flat leading part, nothing at five, mass and Ricci terms at four) and
    the extension count (degree of divergence $2$, the flat value), on the scaling-degree rules that are now
    clause (vi) of the imported extension Fact
    (\claimref{synthesis.imported-epstein-glaser-extension-theorem-and-ward-preserving-time-ordered-products},
    version 2). For each fixed point the freedom is $15$ local terms per index pair, with coefficients that are
    functions of the point unless local covariance with scaling is used; that principle is now an imported Fact
    (\claimref{synthesis.imported-local-covariance-with-scaling-of-time-ordered-products}, Hollands and Wald,
    cited from memory and sourced for a scalar field), by Leon's decision of 9 November. What remains of the
    clause: the Ward identity (transversality) on the curved field; the reduction of the freedom to the constant
    $Z_{3}$ using the new Fact; the first Hadamard transport equation and the protraction identity, which stay
    stated hypotheses (the identity is stored under no name and is to be derived in the algebra core from
    vanishing torsion); and a state's current two-point function in place of the parametrix trace. Clause (v) of
    the stored vacuum-polarisation result stays argued.
  attack:
    - "Extension of distributions beyond one loop: the two-loop vacuum polarisation by extension, whose sharp test is beta1 = 4 (scheme independent for one coupling), and the one-loop self-energy and vertex by extension, after which the Pauli-Villars clause of the Krein premise could be retired."
    - "Existence of Ward-preserving extensions inside the store: prove, for the self-energy and vertex, the four-photon and the three-current kernels, that a covariant extension obeying the Ward identities exists (now imported from the causal approach), using the computed difference spaces."
    - "The native regulator: the floors are excluded for every weighting; test the lattice of the descent, or record extension of distributions (which needs no regulator) as the series' scheme, and carry its curved-field clause (argued: the Hadamard scaling degree gives the flat counting) to a proof. Started 10 November on the leading parametrix trace of a torsion-free field (the rotors cancel exactly; the first order is Ricci only; the degree and extension counts are argued). What remains: the Ward identity on the curved field, the reduction of the 15 local terms per index pair to a constant using the imported local covariance with scaling, the first Hadamard transport equation, and a state's kernel in place of the parametrix."
    - "Chiral loops beyond the abelian factor: the non-abelian BMHV counterterms and the fermion self-energy and vertex counterterms with the right unit; the full one-loop e+e- cross section (vertex, box and soft-photon emission)."
    - "Whether the Krein-form premise can be derived or avoided: its one-particle form is restated as the trace form of Clifford conjugation; the content left is that the unphysical modes are quantised with the indefinite form."
    - >-
      Derive the protraction identity of the curvature operator, $\partial_{a}\wedge\mathcal{R}(a\wedge b) = 0$,
      in the algebra core from vanishing torsion (the first Bianchi identity of a torsion-free field). It is a
      stated hypothesis of the curved-field kernel result
      (\claimref{synthesis.vacuum-polarisation-kernel-on-a-gravitational-field-has-the-flat-leading-part-and-no-weyl-term-of-degree-four})
      and is stored under no name; the nearest stored text names it as a condition defining the Weyl maps and
      does not derive it.
  success: >-
    Renormalisation at two loops in a scheme native to the series (extension
    of distributions or a covariant regulator built from its objects), with the
    existence of Ward-preserving extensions proved in the store, or a no-go
    naming the missing input.
  entities: [synthesis.one-loop-vacuum-polarisation-extends-without-a-regulator-and-ward-preserving-extensions-differ-only-by-the-renormalisation-constants, synthesis.two-loop-qed-in-the-spacetime-algebra-continued-in-dimension-gives-the-second-beta-coefficient, synthesis.electron-positron-to-muon-pairs-in-the-spacetime-algebra-lsz-tree-cross-section-and-one-loop-unitarity, synthesis.chiral-abelian-loops-with-i4-as-the-bmhv-gamma5-need-finite-symmetry-restoring-counterterms, synthesis.triangle-anomaly-in-the-spacetime-algebra-is-the-pseudoscalar-part-of-the-field-square-and-cancels-per-generation, synthesis.floor-regulator-keeps-the-charge-and-the-central-term-below-the-cut-off, synthesis.krein-form-premise-indefinite-inner-product-for-gauge-fields, synthesis.one-loop-qed-in-the-spacetime-algebra, synthesis.vacuum-polarisation-kernel-on-a-gravitational-field-has-the-flat-leading-part-and-no-weyl-term-of-degree-four, synthesis.imported-local-covariance-with-scaling-of-time-ordered-products]
