# The curated open problems of the Transport Lab store: what the series and the
# last two days' work leave open, each with what is known, routes of attack and
# what would settle it.  Shown on the site under "Open problems" and served by
# the MCP tools list_open_problems and get_open_problem.
#
# Fields: id (op.<kebab-slug>), title, area (a subject id from subjects.yaml),
# kind (research | consistency | housekeeping), difficulty (tractable |
# substantial | frontier), status (open | partial | reformulated | settled),
# source, statement, why, known, attack (a list), success, entities (2 to 8
# store ids), added.  LaTeX is allowed in statement, known, attack and success,
# with \claimref{<id>} for links.  Ordered by area as in subjects.yaml, and by
# importance within each area.

# ---------------------------------------------------------------- einstein

- id: op.derive-loc-and-r-loc
  title: Derive the entropy clause (Loc) of the local-horizon premise, or the local form of (N+)
  area: einstein
  kind: research
  difficulty: frontier
  status: partial
  source: "The conditional Einstein derivation and the analysis of the local-horizon premise, 22 October; the null ground-state premise and the (Loc) results, 23 October; the scaling-limit results of 26 October; the integrated-(Loc) and local-normality results and Leon's decisions, 31 October; the Clausius relation on the action shell, the generator analogue of the Hadamard condition and Leon's decisions, 1 November; the flat-null-plane restriction result and the Hadamard scaling-limit premise, 1 November; the Hadamard deposit premise and the deposit-state results, 1 November; the Hadamard scaling results and Leon's decisions of 2 November ((HS) restated as a statement about the field); the Hadamard scaling-bound results and Leon's decisions of 2 November ((HS) retired to a theorem)"
  statement: >-
    Premise (C$_{\mathrm{loc}}$) version 3
    (\claimref{synthesis.c-loc-local-horizon-premise}) has two clauses on the
    per-light-ray continuum modes of a local Rindler patch: (Loc), the entropy
    of a cut is $\int\eta\,dA$ with $\eta$ independent of curvature and matter
    and no Euler term; and (R$_{\mathrm{loc}}$), before matter crosses, the
    modes are jointly KMS for the local boost at rapidity period $2\pi$. The
    continuum form of (R$_{\mathrm{loc}}$) follows from the null ground-state
    premise (N$_{+}$) in Minkowski space. On the integrated reading (Loc) is
    now known to be two clauses: a curvature clause, derived on calibrated
    paths, and a one-coupling clause, independent of the thermal premises
    (see below); on the joint set with the store's gravitational action the
    one-coupling clause and the period of (R$_{\mathrm{loc}}$) imply each
    other where matter crosses. Derive the one-coupling clause on fields the
    joint set does not reach, and the curvature clause off the calibrated
    paths, from the series' structure; or derive that the series' states
    satisfy local normality to the null vacuum (or the generator analogue of
    the Hadamard condition, which implies it) at each point of a generator in
    a gravitational field of nonvanishing field strength, from which the
    local form of (N$_{+}$), and with it (R$_{\mathrm{loc}}$), follows there.
  why: >-
    With the premise the store derives Einstein's equations
    (\claimref{synthesis.einstein-equations-from-c-loc-and-clausius}); (Loc)'s
    curvature-independence is exactly what excludes the Ricci-polynomial
    extensions, and it is now the clause that carries the whole selection of
    Einstein's equations on this route.
  known: >-
    (R$_{\mathrm{loc}}$): on the continuum of a horizon's generators a
    gauge-invariant quasi-free ground state for the affine null translations
    restricts on either side of the edge to the continuum I-state at rapidity
    period $2\pi$, so the continuum form of (R$_{\mathrm{loc}}$) follows from
    (N$_{+}$) (\claimref{synthesis.n-plus-null-ground-state}) in Minkowski
    space and is argued for a gravitational field of nonvanishing field
    strength at leading order
    (\claimref{synthesis.positive-null-energy-gives-r-premises}); the
    positivity there follows from a nonnegative conformal energy
    (\claimref{synthesis.positive-conformal-energy-gives-positive-null-translations}),
    and the twistor attachment's Fock vacuum satisfies the positivity and
    invariance clause on the Minkowski local horizons, so there (N$_{+}$) is
    the choice of that vacuum
    (\claimref{synthesis.attachment-conformal-energy-is-generated-by-z}).
    The local form (26 October): on a generator the kernel class "ground-state
    singularity plus a remainder bounded near the point" is the same in every
    regular parameter for the weight-$\tfrac12$ kernel (Schwarzian
    difference), and a state in the class has the ground state as its scaling
    limit at the point; the late-time limit at a future horizon is exactly that
    scaling limit
    (\claimref{synthesis.collapsing-hole-flux-from-ground-state-on-the-ingoing-sheet}),
    and a stationary state is its own scaling limit at the bifurcation surface,
    where it satisfies (N$_{+}$) exactly when it is locally the null vacuum
    (\claimref{synthesis.stationary-horizon-state-is-its-own-edge-scaling-limit}).
    Local normality (31 October): the weight-$\tfrac12$ scaling preserves the
    Hilbert-Schmidt norm of a kernel shrunk onto a point, so for
    gauge-invariant quasi-free states local normality to the null vacuum on
    the algebra of an interval of a generator (by Powers-Stormer, a
    square-integrable difference of two-point kernels) gives the null vacuum
    as the scaling limit at every point of the interval, in any regular
    parameter and with no reference to the field strength: the local form of
    (N$_{+}$) at a point follows from local normality there, which replaces
    the null-surface Hadamard condition previously cited from memory
    (\claimref{synthesis.local-normality-at-the-edge-gives-the-null-ground-state}).
    The condition is the generator-algebra analogue of Haag's local normality
    (Fact \claimref{synthesis.imported-haag-local-normality}), not a theorem
    of the series; what remains for the second alternative is that the
    series' states satisfy it at every point of the generators.
    Without (N$_{+}$), (R$_{\mathrm{loc}}$) with modes labelled by null
    direction is independent of the other premises and fixes the matter
    coupling, $G_{\mathrm{cl}} = cG$ at period $2\pi c$
    (\claimref{synthesis.r-loc-independent-sets-matter-coupling}). (Loc)
    remains a premise on both readings of the entropy. On the differences
    reading it is independent: a density $\tfrac14(1 + c\,S_{ab}S^{ab})$ keeps
    the Clausius relation, (R$_{\mathrm{loc}}$) and every $\Lambda$-vacuum
    horizon datum and differs from $\tfrac14$ in the Einstein static universe
    (\claimref{synthesis.loc-independent-of-clausius-and-killing-data}). On the
    integrated reading the version-3 premise adopts, the Clausius relation on
    open patches forces $\eta$ constant on each spacetime, and within the
    series' entropy family excludes the Euler term and forces the
    curvature-independent density
    (\claimref{synthesis.euler-entropy-first-order-rate-on-local-patches},
    \claimref{synthesis.series-wald-entropy-changes-without-flux-on-local-horizons}).
    Two results (31 October) replace the earlier narrowing to fields whose
    arguments are constant everywhere, which is false without continuity. (a)
    The curvature clause, derived on calibrated paths: with the de Sitter
    calibration $\eta = \tfrac14$, a continuous density is $\tfrac14$ on every
    admissible field whose local data approach calibrated data; the flat
    Friedmann fields with $w \in [0, 1]$ and $\Lambda \ge 0$ are such fields and
    pass through every isotropic Weyl-free curvature with space-plane value
    $\beta > 0$ and time-plane value $-2\beta \le \alpha < \beta$, the Einstein
    static universe's among them (the flat dust field with the same $\Lambda$
    at its inflection instant), so a continuous density depending on curvature
    alone that keeps those fields admissible is $\tfrac14$ at every such
    curvature. (b) The one-coupling clause, independent: the density
    $\tfrac14(1 + cQ)$, $Q$ the square of the departure from Einstein's
    equations at the calibrated coupling, a polynomial in curvature and
    stress, keeps every field satisfying Einstein's equations at $G_{e} = 1$
    admissible with $\eta = \tfrac14$, yet on an Einstein static universe of
    radius $2$ with dust it takes $\eta = \tfrac12$ with the Clausius relation
    holding and $G_{e} = \tfrac12$. So on the integrated reading, beyond the
    Clausius relation, the calibration and continuity, (Loc) adds curvature
    independence at curvature values no asymptotically calibrated admissible
    field passes through, and one coupling for admissible fields whose local
    data stay away from calibrated data
    (\claimref{synthesis.integrated-loc-curvature-clause-forced-matter-clause-independent}).
    The cutoff count does not supply (Loc): on Schwarzschild-de Sitter it is
    not a local area density
    (\claimref{synthesis.cutoff-count-is-not-a-local-density-on-sds}).
    The joint set with the gravitational action (1 November): with the field
    equations of the store's action on the field space, one normalisation
    $G$ for every admissible field and $\Lambda \neq 0$, taken as a stated
    hypothesis, the Clausius defect at rapidity period $2\pi c$ is
    $t(k,k)(1 - 4G\eta/c)$, so at a point where matter crosses (the stress
    not a multiple of the metric) the Clausius relation holds exactly when
    $\eta = c/(4G)$, Jacobson's identification read with $G$ given by the
    action, and on matter-free regions it holds for every $\eta$ and $c$
    (\claimref{synthesis.clausius-on-the-action-shell-ties-entropy-density-to-period}).
    So on the joint set with the action and the calibration $\eta = \tfrac14$
    at the action's $G$ (an independent input), the one-coupling clause and
    the period imply each other where matter crosses (the direction from the
    period needs no calibration), both stored independence models fail there
    given the other datum, and the Clausius relation is a constraint on the
    thermal data, not a derivation of the field equations: a premise exchange
    through the action's single coupling, not a derivation from transport
    (status note on \claimref{synthesis.c-loc-local-horizon-premise}). The
    generator analogue of the microlocal (Hadamard) condition, on both
    orderings of the two-point kernel, holds on an interval of a generator
    exactly when the kernel differs from the null vacuum's by a smooth
    kernel, and gives the local form of (N$_{+}$) at every point with no
    stationarity and no temperature
    (\claimref{synthesis.microlocal-condition-on-a-generator-gives-the-local-null-ground-state}).
    With it imposed at matter-crossed points, $c = 1$ there at leading order
    (through the stored leading-order passage from the local form of
    (N$_{+}$) to the period, argued where the field strength is nonzero), so
    $\eta = 1/(4G)$ on every admissible field that carries matter; the
    period-$2\pi c$ model fails the condition at the patch edge, so imposed
    at every point it would also fix the period at vacuum points, as a new
    premise and not a derivation. The bulk Hadamard condition (Fact
    \claimref{synthesis.imported-microlocal-hadamard-condition}), which
    propagates from one Cauchy surface (Fact
    \claimref{synthesis.imported-propagation-of-hadamard-form}) and makes
    local quasi-equivalence a theorem for free fields (Fact
    \claimref{synthesis.imported-local-quasi-equivalence-of-hadamard-states}),
    would give the generator condition only through a restriction of bulk
    Hadamard states to the generator algebra, which is not in the store (for
    the Dirac field it needs the s-wave reduction J3). That the series' states
    satisfy the Hadamard (microlocal) condition on horizon generators is
    recorded as the open premise, not adopted as a postulate. Reduction
    (marked, 1 November): the restriction just named is now computed on the
    flat field for the Dirac field on every null plane, with no s-wave
    reduction: every gauge-invariant quasi-free Hadamard state restricts to
    a state satisfying the generator condition, hence the local form of
    (N$_{+}$) at every point of every local Rindler horizon there
    (\claimref{synthesis.bulk-hadamard-states-restrict-to-the-generator-condition-on-flat-null-planes}); where the field strength is nonzero the same local form follows
    for such states by (HS)
    (\claimref{synthesis.hadamard-scaling-limit-premise}), adopted then as a premise and a
    theorem since 2 November. So, for the local form of (N$_{+}$),
    the open premise is reduced to the statement that the series' states are
    Hadamard; the ground-state clause is not reached. (Marked,
    2 November.) The bulk clause of (HS) is now a theorem: every
    gauge-invariant quasi-free Hadamard Dirac state has the flat massless
    vacuum as its scaling limit at every point of every globally hyperbolic
    field, for every mass, in any gauge with $\hb(x_{0}) = 1$ (standard,
    Sahlmann and Verch; \claimref{synthesis.hadamard-dirac-states-scale-to-the-flat-massless-vacuum-at-every-point-of-a-gravitational-field}).
    On the generators of a null hypersurface the field strength, the
    expansion and the shear cancel exactly from the coefficient of the
    leading null singularity of the restricted Hadamard kernel, which is the
    null vacuum's at leading order, and restricted kernels of Hadamard states
    differ by smooth kernels
    (\claimref{synthesis.field-strength-cancels-from-the-leading-null-singularity-of-hadamard-dirac-states-on-null-hypersurfaces}).
    (HS) is restated as a statement about the field, not states: the Dirac
    Hadamard parametrix restricted to the generators of a local Rindler
    horizon, minus its null-vacuum term, has generator scaling degree below
    one; with the two results it gives the local form of (N$_{+}$) for every
    gauge-invariant quasi-free Hadamard state (argued, given the
    characteristic-data embedding of the generator field), and the state
    enters only through its being Hadamard: (HD) and the propagation of the
    Hadamard form. (Marked, 2 November, later.) (HS) is now a theorem
    (\claimref{synthesis.hadamard-scaling-limit-premise}, version 4): the remainder bound it
    posed is proved for the epsilon-regularised restriction
    (\claimref{synthesis.restricted-dirac-hadamard-parametrix-on-a-null-hypersurface-is-the-null-vacuum-plus-a-bounded-kernel}),
    the flux contraction of the Dirac current gives the restriction of every
    state to the generators with no characteristic Cauchy problem
    (\claimref{synthesis.dirac-states-restrict-to-null-hypersurfaces-through-the-flux-contraction-and-are-thin-layer-limits-under-the-generator-car}),
    and the causal propagator gives the generator anticommutation relations
    on every geodesic null hypersurface
    (\claimref{synthesis.dirac-causal-propagator-between-nearby-null-leaves-tends-to-the-generator-car-on-every-geodesic-null-hypersurface});
    so every gauge-invariant quasi-free Hadamard Dirac state of any mass has
    the null vacuum as its generator scaling limit at every point of every
    local Rindler horizon, whatever the field strength, and the local form
    of (N$_{+}$) now rests on (HD) and the propagation of the Hadamard form
    only (given the radiation-type descent). The ground-state clause of
    (N$_{+}$) and (Loc) are still open. Outside routes
    (argued): the species renormalisation of Susskind and Uglum, in which the
    entropy density and $1/G$ renormalise together, supports one coupling
    only at leading order in the Planck length times the local field
    strength and stress, and the stored one-coupling witness, an Einstein
    static universe of radius $2$ in Planck units, lies outside that regime;
    Jacobson's 2016 entanglement-equilibrium route assumes (Loc) (Fact
    \claimref{synthesis.imported-jacobson-entanglement-equilibrium-2016}).
    (Marked, deposit state, 1 November.) That the series' states are
    Hadamard is now supplied by the adopted Hadamard deposit premise (HD)
    (\claimref{synthesis.hadamard-deposit-premise}) with the propagation of
    the Hadamard form for the scalar and the Dirac field
    (\claimref{synthesis.imported-dirac-hadamard-form-propagates-and-adiabatic-states-are-hadamard}),
    given the radiation-type descent (a stated hypothesis); on Weyl-flat
    regions the local form of (N$_{+}$) follows for the massless Dirac field
    with no further premise
    (\claimref{synthesis.weyl-flat-fields-need-no-scaling-limit-premise-and-robertson-walker-generators-see-the-schwarzian}),
    elsewhere by the theorem (HS). What remains: the curvature clause on matter-free
    fields off calibrated data, the period at vacuum points, and the open
    premise that the series' states satisfy the Hadamard condition on horizon
    generators (for the local form of (N$_{+}$), now supplied by (HD), the
    propagation Facts and (HS), given the radiation-type descent; the
    ground-state clause is not reached).

    (7 November.) The Hadamard results that give the local form of (N$_{+}$) inherited (N$_{+}$) and the
    slot-module hypothesis among their premises only through citations of algebraic clauses; see
    op.r-premises-external, 7 November.
  attack:
    - >-
      The one-coupling clause where the joint set with the action is silent:
      on admissible fields with no matter-crossed point the Clausius relation
      fixes no value of $\eta$
      (\claimref{synthesis.clausius-on-the-action-shell-ties-entropy-density-to-period}(iv));
      derive $\eta = 1/(4G)$ there from a premise of the series, or exhibit a
      matter-free admissible field with another density as a model of all the
      other premises, the action included.
    - >-
      The curvature clause off the calibrated paths: show that the admissible
      class contains, for every curvature value, an asymptotically calibrated
      field passing through it (anisotropic and Weyl curvatures included), or
      that a field whose local data stay away from calibrated data conflicts
      with another premise.
    - >-
      The open premise: derive that the series' quasi-free states satisfy the
      generator analogue of the Hadamard condition (hence local normality) at
      each point of a generator on a normal neighbourhood, so that the local
      form of (N$_{+}$), the period at vacuum points and, with the action, the
      one coupling on every matter-carrying field follow; for example import
      or prove a restriction of bulk Hadamard states to the generator algebra
      (through J3 for the Dirac field) and use the propagation of the
      Hadamard form from one Cauchy surface (shared with
      op.r-premises-external). The scaling limit at each point, hence the
      local form of (N$_{+}$), is now the theorem (HS)
      (\claimref{synthesis.hadamard-scaling-limit-premise}), for every field
      strength and mass; what remains of this attack is the generator
      condition on intervals and the period at vacuum points.
    - >-
      Compute the entropy of the per-light-ray modes in the state of
      (N$_{+}$) for entropy differences (Araki's relative entropy, Fact
      \claimref{synthesis.imported-null-plane-modular-hamiltonian-first-law})
      and test whether the change across cuts is a fixed multiple of the area
      change with a curvature-independent coefficient.
  success: >-
    A derivation of the one-coupling clause of (Loc), and of its curvature
    clause off the calibrated paths, from the series' structure on the
    integrated reading, or a model of the other premises, with (N$_{+}$), in
    which the integrated (Loc) fails; or a derivation of local normality at
    each point of a generator, and with it the local form of (N$_{+}$), for a
    gravitational field of nonvanishing field strength, for example by
    deriving that the series' states satisfy the generator analogue of the
    Hadamard condition there.
  entities:
    - synthesis.c-loc-local-horizon-premise
    - synthesis.einstein-equations-from-c-loc-and-clausius
    - synthesis.integrated-loc-curvature-clause-forced-matter-clause-independent
    - synthesis.loc-independent-of-clausius-and-killing-data
    - synthesis.clausius-on-the-action-shell-ties-entropy-density-to-period
    - synthesis.n-plus-null-ground-state
    - synthesis.microlocal-condition-on-a-generator-gives-the-local-null-ground-state
    - synthesis.local-normality-at-the-edge-gives-the-null-ground-state
