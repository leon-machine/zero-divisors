- id: op.which-capacity
  title: Which premise fixes the observer's tube point when a field has more than one horizon, and on Schwarzschild
  area: one-relation
  kind: research
  difficulty: substantial
  status: reformulated
  source: "T16, successor problems (1) and (2); maintainer decision of 23 October; restated by Leon's decision of 26 October after the tube-point results; decided for one-horizon fields under the costed tube-point clause adopted by Leon's decision of 31 October"
  statement: >-
    A wedge's boost-KMS data together with the ascent pair fix the compatible
    tube point up to one scale $\rho$, and the capacity a state reads is the
    same at every tube point. Under the adopted costed clause, that a state's
    tube point is invariant under the symmetries of the gravitational field
    that commute with its wedge's boost, $\rho$ is decided for fields with one
    horizon: in the de Sitter field $\rho^{2} = 12/\Lambda$, and for
    $\Lambda \le 0$ it stays free (see below). Open: (a) fields with more than
    one horizon, where the clause does not say which horizon's boost is the
    observer's: decide whether an observer's tube point is assigned per
    observer or per horizon, for example in a static region of
    Schwarzschild-de Sitter bounded by a black-hole and a cosmological horizon
    with $\kappa_{b}/\kappa_{c} = 8/5$; (b) the Schwarzschild field, where the
    clause is not computed. Or show that the present premises leave $\rho$
    free there.
  why: >-
    The vacuum-line reading of spacetime and the measurement account of T16
    both rest on one state reading the right capacity at one tube point; with
    the capacity answered and the one-horizon case decided by an adopted
    clause, the remaining cases are the fields in which an observer sees more
    than one horizon, the generic case of a black hole in a universe with a
    positive cosmological constant.
  known: >-
    The capacities are \claimref{one-relation.two-capacities-three-consequences}
    and the vacuum lines \claimref{one-relation.spacetime-manifold-vacuum-lines};
    the compatible positive structures are the twistor form's polarisations at
    forward-tube points
    (\claimref{synthesis.positive-structure-is-twistor-form-at-imaginary-time}).
    The Wick-rotated boost of a wedge is unitary exactly at the tube points
    $m = x_{\perp} + i\rho u$ over the bifurcation plane, and the boost-KMS
    data and the ascent pair fix the tube point up to $\rho$
    (\claimref{synthesis.wick-rotated-boost-selects-observer-tube-point});
    every capacity-type property is the same at every tube point (argued,
    exact in a model). The de Sitter field (31 October, proved): the
    symmetries of the field commuting with a wedge's boost are the boost and a
    transverse $\so(3)$, and the compatible tube points they fix are exactly
    one boost orbit, foot at the scale's centre and $\rho^{2} = 12/\Lambda$;
    there $\operatorname{Re}X(m) = \tfrac{6}{\Lambda}I_{\Lambda}$ and the
    complexified Stelle-West vector $X(m)/\sigma(m) - \tfrac{3}{\Lambda}I_{\Lambda}$
    is purely imaginary, the boost generator's physical norm is maximal and
    equal to $1/\kappa$, the orbit is in free fall and the bifurcation plane
    is a round sphere with its equator there; so the frozen-point and
    surface-gravity candidates are one tube point when $\rho = 1/\kappa$ is
    read as the physical norm of the boost generator, while in chart length
    $\rho_{\Lambda} = 2/\kappa$, the factor $2$ being the local scale
    $\sigma = 2$; for $\Lambda \le 0$ no tube point is fixed; in the
    Schwarzschild-de Sitter field with lapse $1 - 2M/r - \tfrac{\Lambda}{3}r^{2}$
    at $\Lambda = M = \tfrac37$, horizons at $r = 1$ and $2$ with
    $\kappa_{b} = \tfrac27$, $\kappa_{c} = \tfrac{5}{28}$, the candidates
    separate
    (\claimref{synthesis.de-sitter-field-fixes-the-observer-tube-point}).
    Decided for one-horizon fields (Leon's decision of 31 October): the
    selection rule is adopted as a costed clause
    (\claimref{synthesis.tube-point-clause-invariant-under-boost-commuting-symmetries}),
    which carries the hypothesis gap from the uniqueness of the de
    Sitter-invariant Hadamard state of a massive scalar (Fact
    \claimref{synthesis.imported-de-sitter-invariant-hadamard-state-unique})
    to the series' CAR modes, ties the scale to $\Lambda$ and supplies no
    independent unit. For the Schwarzschild field the tools do not apply as
    they stand: it is not a pure dilation of the background, and the static
    Killing norm normalised by $\kappa = 1/4M$ reaches $1$ only at infinity,
    so the analogue of the norm rule selects the asymptotic observer (argued,
    not computed).
  attack:
    - >-
      Two horizons: compute, in Schwarzschild-de Sitter, the tube points the
      clause fixes for each horizon's wedge, and decide between assigning the
      observer's tube point per observer and per horizon (for example by the
      Tolman reading, under which the selected observer is the coldest and the
      free-fall one), or show that the premises leave the choice free.
    - >-
      Schwarzschild: compute the compatible tube points fixed by the field's
      symmetries commuting with the horizon's boost (time translation and
      rotations) in a gauge adapted to the tube-point machinery, and test
      whether a finite $\rho$ is selected.
    - >-
      Derive the compatibility condition (unitarity of the Wick-rotated boost)
      as a property of the continuum I-state rather than as the
      finite-dimensional image of the Osterwalder-Schrader and
      Bisognano-Wichmann structure.
  success: >-
    A premise of the series, or a derivation, fixing the observer's tube point
    in fields with more than one horizon and in the Schwarzschild field, or a
    proof that $\rho$ is a free datum of the state there under the present
    premises.
  entities:
    - synthesis.de-sitter-field-fixes-the-observer-tube-point
    - synthesis.tube-point-clause-invariant-under-boost-commuting-symmetries
    - synthesis.wick-rotated-boost-selects-observer-tube-point
    - synthesis.imported-de-sitter-invariant-hadamard-state-unique
    - synthesis.positive-structure-is-twistor-form-at-imaginary-time
    - synthesis.positive-structure-and-natural-scale-actions-do-not-select-the-almost-einstein-scale
    - one-relation.two-capacities-three-consequences
    - one-relation.spacetime-manifold-vacuum-lines
