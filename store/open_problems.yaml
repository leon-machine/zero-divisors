- id: op.hypothesis-s
  title: 'Hypothesis (S): are a composite''s twistor slots fermionic modes'
  area: standard-model
  kind: research
  difficulty: substantial
  status: reformulated
  source: T12, successor problem (6); maintainer decisions of 23 and 26 October and Leon's decision of 31 October; the 9 November results and Leon's decisions
  statement: 'Hypothesis (S) is derived (\claimref{standard-model.hyp-s-slot-statistics}) from the slot-module hypothesis
    (\claimref{standard-model.slot-module-hypothesis}): a graded $U(2)$ slot module tensored with one pair system, hypercharge
    from the centre, the slot module generated from a unique vacuum by one doublet of slot creation operators, the chirality
    a CPT halving that commutes with the Pati-Salam algebra of the chain once the slots are fermionic, and slot and pair
    operators one Clifford system. Derive the remaining clauses from stated structure (the single doublet of slot creation
    operators, the joint Clifford system, and the chirality clause, whose content beyond the other clauses and anomaly freedom
    is the choice of the empty state as the particle half''s neutral singlet, now placed on the chain''s Pati-Salam stage),
    or record which of them remain premises.'
  why: The lepton doublet, the common handedness of doublets and singlets, $\mathrm{Spin}(10)$, the values $3/8$ and $3/4$,
    and every result naming a species rest on it; without it the tensor state space contains no lepton, and the families
    and neutrino papers must re-examine what they import.
  known: >-
    CPT closure of a slot module tensored with the pair system, with hypercharge from the centre, holds
    exactly for $F \cong a\Lambda^{0}\C^{2} \oplus b\Lambda^{1}\C^{2} \oplus a\Lambda^{2}\C^{2}$; with
    one vacuum, anomaly-free halvings need $b$ odd, the extra doublets entering in vectorlike pairs; for
    a slot module generated from its vacuum by one doublet, CPT closure alone forces the fermionic
    module with exclusion; and for that module anomaly freedom forces the chirality $\pm(-1)^{n + k}$
    except for a free line in the neutral-singlet block
    (\claimref{synthesis.cpt-closure-forces-slot-module-and-chirality}). On that basis the premise was
    restated (23 October). The clause fixing the neutral-singlet line, first stated as commuting with
    $\mathrm{Spin}(10)$, is now stated as "the chirality is the grading of the joint Clifford system"
    (every slot and pair Majorana generator is odd for it), proved equivalent for a CPT halving; version
    3 of the premise (26 October). Its content beyond the other clauses is known exactly
    (\claimref{synthesis.spin10-clause-content-is-the-neutral-singlet-choice}). On the five-mode module
    the gauge algebra, the number-conserving bilinears $\mathfrak{u}(5)$ and $\mathfrak{so}(10)$ leave
    commutants of dimensions $14$, $6$ and $2$. The gauge-commuting CPT halvings are $32$ sign patterns
    times a free pair of lines in the neutral block. Commuting with the total mode number and anomaly
    freedom cut them to four, differing only in whether the empty or the full five-mode state is the
    particle half's neutral singlet; the two are exchanged by a swap that commutes with the gauge
    algebra, so no gauge quantum number decides between them. The grading clause selects the empty
    state. So the clause is one bit of premise, not derivable from CPT, anomaly freedom and the
    generation clause (the vacuum-swapped halving satisfies them all); the first line of attack is
    answered in the negative and the clause stays a premise. Earlier: anomaly freedom with the tower
    grading as chirality forces odd slot parity and the slot module $(\Lambda^{\bullet}\C^{2})^{\oplus
    m}$ (\claimref{synthesis.anomaly-freedom-forces-slot-content}); for two-level slots, slot parity
    decides (S) (\claimref{synthesis.slot-parity-decides-hypothesis-s}); inside the composite's own
    five-rung floor two-level slots are odd, and even slots need a spectator generator
    (\claimref{synthesis.even-slots-need-a-spectator-generator}), whence the no-spectator premise
    (\claimref{standard-model.no-spectator-slots}). The negative clause of
    \claimref{standard-model.quarks-leptons-two-level-fermion-content}(2) shows any derivation of the
    lepton must change the state space. A module generated from one vacuum by a doublet of creation
    operators is a Fock module of the algebra core (\claimref{std-algebra.fock-representation}), and its
    creation and annihilation operators obey the canonical anticommutation relations
    (\claimref{std-algebra.witt-basis-car}). The intermediate gauge algebras are now decided, as a
    dichotomy: hypercharge grades $\so(10)$ into the number-conserving $\uu(5)$, pair creation and pair
    annihilation with three disjoint eigenvalue sets, so a gauge algebra between the Standard Model and
    $\so(10)$ either lies in $\uu(5)$, and then the vacuum-swapped halving commutes with it and the bit
    is free, or contains a pair-creation bilinear and its adjoint, and then that pair with the
    anomaly-fixed charged chirality forces $\pm(-1)^{N}$, with no use of number conservation. The
    Pati-Salam, left-right, $\su(4) \oplus \su(2)_{L} \oplus \uu(1)$ and flipped $\uu(5)$ stages decide
    the bit; the Georgi-Glashow $\uu(5)$, and the Standard Model algebra with $B - L$ or the total mode
    number adjoined, do not
    (\claimref{synthesis.neutral-singlet-bit-decided-by-gauge-algebra-leaving-u5}). On that basis the
    clause was restated (Leon, 31 October; version 4 of the premise) as "the chirality commutes with the
    Pati-Salam algebra of the chain", equivalent to the grading form for an anomaly-free halving;
    anomaly freedom is now used to exclude the pair-parity halving $\pm(-1)^{k}$, which also commutes
    with the Pati-Salam algebra and is anomalous. Since the chain is itself derived under (S), this
    exchanges the bare choice of the empty state for a requirement on the chain's intermediate stage; it
    is not a derivation. Other structure is blind to the bit: under the swapped halving the odd-grade
    Yukawa forms give the neutral singlet no Dirac coupling to the lepton doublet, the Clifford CPT
    antiunitary treats both halvings alike (same result), and the light-ray array count is sixteen per
    generation for every CPT halving
    (\claimref{synthesis.slot-module-light-ray-arrays-are-weyl-components}).

    (7 November; argued and computed, from a survey of the store.) What
    \claimref{synthesis.cpt-closure-forces-slot-module-and-chirality} leaves open is the neutral-singlet
    bit, clause (G) (a unique vacuum, one doublet), clause (f) and the clauses (a) and (b). The
    neutral-singlet bit is invisible to every structure the swap of the two candidate singlets commutes
    with: CPT, anomaly freedom, (G), the light-ray count and the Clifford CPT antiunitary all fail to
    decide it, and no structure in the thermality, entropy, descent or wall subjects breaks the swap,
    since all of them see only number-conserving or count data. Computed: the gauge algebra with the
    even pair algebra leaves exactly $\pm(-1)^{N}$ among the anomaly-free CPT halvings and excludes the
    vacuum-swapped one, and the $\mathfrak{su}(4)$ half of Pati-Salam suffices. Since $\mathfrak{su}(4)$
    and the conformal algebra $\mathfrak{so}(2,4)$ are real forms of one complex algebra
    (\claimref{standard-model.pair-mixing-not-colour}), the Pati-Salam clause is the conformal
    invariance of the chirality on the pair factor; what it still needs is the identification of the
    label copy's parity with the twistor's, which the store's notes call the same missing theorem as (S)
    and which, with the relative unit sign, would also fix the orientation bit.

    (9 November.) Clause (f) asks no more than the signed-direction postulates: on the composite space the CAR
    of the five slot and pair modes are exactly Premise (F2) for their ten Majoranas with the sign bit acting
    as $-1$ (a group of order $2^{11}$, signature $(5,5)$, of the class of $(10,0)$ by its Gauss sum $2^{5}$);
    the Fock adjoint is the group inverse and the invariant form is unique up to scale. The untwisted slot
    operators generate the same group but are not signed directions, so the clause's content is the choice of
    directions: once the ten Klein-twisted Majoranas are declared the directions, a choice the postulates do
    not make, clause (f) is an instance of (F2) and (F3), (F1) entering only as the index set of the ten
    labels (\claimref{synthesis.joint-clifford-clause-is-an-instance-of-the-signed-direction-postulates}; the
    twist is canonical up to a central unit by
    \claimref{synthesis.joint-clifford-clause-is-a-klein-convention-on-the-composite-space}). The sign-bit
    item is done. By Leon's decision of 9 November clause (f) of
    \claimref{standard-model.slot-module-hypothesis} is restated in that form: the ten slot and pair Majoranas
    (slots Klein-twisted) are distinct directions of one group of signed directions, (F2) and (F3), the sign
    bit acting as $-1$; the identification of the direction labels with (F1)'s distinctions is flagged as a
    reading.
  attack:
  - Derive the single doublet of slot creation operators ($b = 1$) from the label copy of the pair space that the hierarchy
    bundle carries.
  - Derive the joint Clifford system from tower membership of the slot operators, along the no-spectator route.
  - Derive a gauge stage that leaves $\uu(5)$, the Pati-Salam stage of the chain or another, from the tower without (S);
    by the dichotomy that would turn the chirality clause into a consequence. The gauge quantum numbers, CPT, anomaly freedom,
    the generation clause, the light-ray count and the Clifford CPT antiunitary cannot decide the bit.
  - Resolve the tension that the tower reading at three constituents gives the $32$ of $\mathrm{Spin}(12)$, one generation
    and its conjugate, not three families.
  - >-
    Clause (G) as a Fock clause: if the slot module is a Fock module of either statistics over its
    one-slot space, CPT closure forces one doublet and the exterior algebra of it (for two or more
    doublets the two-slot space carries weak spin one; a symmetric Fock module is infinite-dimensional),
    so the statistics and the doublet count become outputs (the unique vacuum is part of the Fock clause) and the clause holds
    automatically if the slot quanta are tower modes (\claimref{synthesis.fock-slot-module-is-cpt-closed-only-over-one-doublet}).
  - >-
    Clause (f) as a Klein convention: the Klein-twisted slot operators obey the same relations as the
    slot operators, the Pati-Salam generators and the grading are the same operators in both
    conventions, and the twist is unique up to a central phase, so on the composite's module the joint Clifford
    system exists canonically (\claimref{synthesis.joint-clifford-clause-is-a-klein-convention-on-the-composite-space};
    \claimref{synthesis.even-slots-need-a-spectator-generator} already uses the twist).
  - >-
    Done (9 November): the joint Clifford system from the sign bit. By
    \claimref{synthesis.signed-directions-and-the-integer-clifford-algebra}, directions sharing one central sign
    bit, with distinct directions not commuting, generate exactly a Clifford algebra; the clause asks no more than
    that the ten Klein-twisted slot and pair Majoranas are such directions (the adjoint is the group inverse, the
    signature is forced by the modes), and it is restated as an instance of (F2) and (F3), (F1) only as the index
    set (\claimref{synthesis.joint-clifford-clause-is-an-instance-of-the-signed-direction-postulates}).
  success: A theorem deriving (S) or its weaker form from stated structure, or one of the five outcomes adopted and recorded
    in the tier declaration with its consequences carried to T13 and T15.
  entities:
