- id: op.generic-weighted-limit
  title: The weighted limit beyond the Kasner axis, and edge regularity
  area: interior
  kind: research
  difficulty: substantial
  status: partial
  source: "T06, successor problems (2) and (4); T17, open direction 3; the interior results of 26 and 31 October"
  statement: >-
    Formulate and prove the analogue of the weighted limit theorem on the
    quotient by Kasner-axis dynamics, where the generic mixmaster approach
    lies, and, for a general admissible gravitational field, control the tangential
    derivatives of the error $E_\tau$ on compact sets of the exceptional set.
  why: >-
    The weighted completion of the wall programme in its generic-singularity
    extension depends on both; the density prediction does not, since it is
    stated for Schwarzschild, inside the admissible class with constant
    exponents and no bounces.
  known: >-
    The limit is proved for Schwarzschild and every admissible gravitational
    field (\claimref{interior.weighted-limit-theorem}); transport along
    tangential curves of fixed Hubble-normalised length converges for the
    whole admissible class
    (\claimref{interior.transport-level-convergence-along-tangential-curves}),
    and the tangential regularity holds at Schwarzschild by symmetry
    (\claimref{interior.schwarzschild-lines-exactly}). The admissibility
    integral of
    \claimref{obj.interior.weighted-blow-up-hubble-normalisation-admissible}
    says what fails framewise under bounces. If the approach follows the BKL
    transition law, the fixed-frame weighted limit jumps by at least $20/21$
    once per era, so no framewise limit exists for irrational $u$, and every
    continuous invariant of the exponents is constant
    (\claimref{synthesis.bkl-bounces-no-framewise-invariant}): the first half
    of the success clause holds in its negative form under that law. That law
    is now derived for the homogeneous curvature wall: a Kasner approach whose
    negative-weight covector keeps its helicity is, in the Bianchi II model, a
    bounce whose in and out epochs obey exactly the BKL law
    (\claimref{synthesis.kasner-curvature-wall-is-negative-weight-helicity}(iv),
    proved). What survives each bounce is the holonomy algebra: for approaches
    returning to non-Taub Kasner models the tangential transport bound holds
    epoch by epoch with one constant, and the accumulated values still
    generate $\Lambda^{2}W$
    (\claimref{synthesis.bkl-bounce-invariant-holonomy-and-bound}). The return
    hypothesis of that result cannot be dropped: the flat Kasner field $(1, 0,
    0)$ already shows it
    (\claimref{synthesis.bkl-bounces-no-framewise-invariant}(ii)), and
    Taub-NUT is a non-flat vacuum witness (proved, 31 October): on its Taub
    region, in synchronous gauge, the weights tend to the Taub point $(0, 0,
    1)$ at $t = t_{+}$ and the Hubble-normalised values converge to $-(1 -
    \kappa I)B_{3}$, $\kappa = t_{+}/l = \cot(\varphi/2)$, which generate a
    one-dimensional algebra, not to the Taub Kasner model
    (\claimref{synthesis.taub-nut-cauchy-horizon-is-taub-point-with-complex-residue};
    the locus $t = t_{+}$ is the Cauchy horizon of Misner's extension,
    \claimref{synthesis.imported-taub-nut-field-and-misner-extension}, cited
    and not used in that proof). Every era of the BKL map still ends with $1
    \le u \le 2$, so near-Taub eras need no change to the holonomy clause;
    what an extension to approaches near the Taub point needs is a dynamical
    exclusion of Taub-NUT-like approaches, which for vacuum Bianchi IX would
    come from Ringstrom's curvature blow-up and attractor theorems (argued;
    cited from memory, not imported). The accumulation algebra $\Lambda^{2}W$
    is specific to spacelike walls: at the Kerr ring the weighted limit's
    values span the abelian null-rotation plane
    (\claimref{synthesis.kerr-ring-connection-limit-null-rotation-winding-three}).
    For edge regularity, admissibility alone does not control tangential
    derivatives: an explicit error term meets every decay clause while the
    tangential derivative of the transport diverges
    (\claimref{synthesis.admissible-decay-does-not-control-tangential-derivatives});
    under the added hypothesis that the coordinate derivative of $E_{\tau}$
    tends to zero, the transport derivatives converge to the Kasner model's
    (\claimref{synthesis.tangential-derivative-transport-bound}). The open
    part is whether the Einstein clause of admissibility supplies that
    derivative control. Evidence on 26 October, not filed: Gowdy spikes are no
    counter-model, since they need variable exponents, which admissibility
    excludes; in polarized Gowdy fields with data losing up to half a
    derivative, the Hubble-normalised tangential derivative of the error still
    tends to zero (computed numerically on one family), and Gowdy energy
    monotonicity bounds it for the whole polarized class (argued, from the
    literature as remembered), so the stored independence example is not
    realised in that Einstein class; for coframes independent of $\tau$ the
    error is explicit, with terms $c(x)\tau^{2 - 2p_{m}}$. In polarized Gowdy
    with Bessel modes of coefficients $c_{n} \sim n^{-\sigma}$, $C^{1}$
    regularity at positive time needs $\sigma > 5/2$, and then the
    Hubble-normalised second tangential derivative tends to zero like
    $t^{\sigma - 2}$ (argued, 31 October; Bessel asymptotics from memory).
  attack:
    - >-
      State the billiard-invariant limit on the holonomy algebra
      $\Lambda^{2}W$ rather than on frames, and extend it to approaches that
      pass near the Taub point under a hypothesis that excludes Taub-NUT-like
      approaches (the return hypothesis is needed:
      \claimref{synthesis.taub-nut-cauchy-horizon-is-taub-point-with-complex-residue}),
      importing Ringstrom's Bianchi IX theorems as Facts if the dichotomy
      between curvature blow-up and a Cauchy horizon is wanted as a theorem.
    - >-
      Show whether the Einstein clause of admissibility implies the derivative
      hypothesis of
      \claimref{synthesis.tangential-derivative-transport-bound}, or find a
      vacuum solution in the admissible class that violates it; a weighted
      energy monotonicity for the Hubble-normalised field equations, as in the
      polarized Gowdy class, is the route the evidence suggests. (Extending
      the Gronwall bound to first derivatives is done, and fails without such
      a hypothesis.)
  success: >-
    A billiard-invariant limit theorem, or a proof that no framewise statement
    survives the mixmaster approach; and a tangential-derivative bound for the
    admissible class, which T06 names as the only analysis left in the edge
    problem.
  entities:
    - interior.weighted-limit-theorem
    - obj.interior.weighted-blow-up-hubble-normalisation-admissible
    - synthesis.bkl-bounces-no-framewise-invariant
    - synthesis.bkl-bounce-invariant-holonomy-and-bound
    - synthesis.taub-nut-cauchy-horizon-is-taub-point-with-complex-residue
    - synthesis.kasner-curvature-wall-is-negative-weight-helicity
    - synthesis.admissible-decay-does-not-control-tangential-derivatives
    - synthesis.tangential-derivative-transport-bound
  added: "2026-10-22"

- id: op.null-positivity-curved-horizons
  title: Positive null translations on the eternal hole's horizon, as a state condition
  area: thermality
  kind: research
  difficulty: frontier
  status: reformulated
  source: "The null ground-state premise (N+) and the conformal-energy result, 23 October; the twistor attachment's conformal energy and the collapse results, 26 October; the Schwarzschild conformal-symmetry and local-normality results and Leon's decision, 31 October; the field-level and net-level modular-conjugation results and Leon's decisions, 6 November"
  statement: >-
    Item (i) of this problem, that the series' modes carry a unitary
    representation of $\mathrm{Spin}^{+}(2,4)$ with nonnegative conformal
    energy generated by $Z = e_{0}\nu$, is settled (see below). Item (ii), the
    positivity of the affine null translations along the generators of the
    eternal Schwarzschild horizon, case (a) of (N$_{+}$), is restated as a
    condition on the state of the generators' modes: the conformal route is
    closed, since no conformal symmetry of the Schwarzschild field acts on the
    generators as the affine translations, and within stationary
    gauge-invariant quasi-free states the positivity follows from local
    normality to the null vacuum at the bifurcation surface. What is open is
    that state condition: derive it for the eternal hole from a principle of
    the series, or derive the positivity from another condition on the state
    of the generators. For holes formed by collapse the ingoing-sheet
    condition replaces it and no positivity on the horizon's own generators
    is used.
    (6 November) Item (ii) can also be posed as field-level geometric
    modular action on the generators, which gives the positivity with no
    stationarity or conformal symmetry within gauge-invariant quasi-free
    states; that condition is posed, not derived, on the eternal hole, and
    no condition on the net of local algebras alone can give the
    positivity.
  why: >-
    With (ii) the positivity at the eternal hole's horizon would no longer be
    part of (N$_{+}$); it is the last case in which the premise still assumes
    positivity rather than choosing a vacuum that has it.
  known: >-
    Every future translation in $\Cl(2,4)$ is a limit of positive multiples
    of conjugates of $Z$, so nonnegative conformal energy gives the
    translation spectrum in the closed forward cone and positive null
    translations on every local Rindler horizon of Minkowski space; on a
    one-particle space such as $L^{2}(\R, du)$ the null momentum takes both
    signs, so the representation must act on the GNS space
    (\claimref{synthesis.positive-conformal-energy-gives-positive-null-translations}).
    De Sitter (24 October): for the de Sitter field $\hb = \sigma$, a pure
    dilation of the flat background, the uniform translation of the physical
    affine parameter along a cosmological horizon is the background conformal
    null rotation generated by $\tfrac12 nI = P_{n} + \tfrac{\Lambda}{12}n\nO$,
    a nonnegative generator, so the positivity holds for de Sitter for a
    conformally invariant field in its conformal vacuum, with the
    identification of the horizon modes argued
    (\claimref{synthesis.de-sitter-horizon-translation-is-conformal-null-rotation}).
    Item (i), settled (26 October): $Z$ grades the twistor form into the
    Hilbert form; quantised, it generates the twistor attachment's conformal
    energy $|s| + 1 + n$, future translations, null special conformal
    transformations and the de Sitter horizon generator are nonnegative with
    it, and the attachment's Fock vacuum satisfies the positivity and
    invariance clause of (N$_{+}$) on Minkowski local horizons and, for
    conformally invariant fields, on de Sitter horizons
    (\claimref{synthesis.attachment-conformal-energy-is-generated-by-z}).
    Collapse (26 October): for a hole formed by collapse the thermal
    condition is (N$_{+}$) in its short-distance form on the ingoing sheet
    through each point of the future horizon, given J3
    (\claimref{synthesis.collapsing-hole-flux-from-ground-state-on-the-ingoing-sheet}).
    The conformal route is closed (31 October): every conformal symmetry of
    the Schwarzschild field, on any connected open part of its invertible
    region, is a constant combination of its time translation and rotations,
    since $\hat g = (2M/r)^{3}g$, a constant multiple of the square root of
    the field's Weyl square times $g$, is invariant under its conformal maps
    and has scalar curvature $(27M - \tfrac92 r)/(2M)^{3}$; on the horizon the
    time translation dilates the affine parameter, so no element of the
    field's conformal symmetry algebra near a piece of the horizon, nor a
    limit of elements, acts on the generators as the affine translations
    (\claimref{synthesis.schwarzschild-horizon-translations-are-no-conformal-symmetry}).
    An abstract unitary group on the generators' modes is not excluded, and
    that is where the positivity must sit. The state condition (31 October):
    a stationary gauge-invariant quasi-free state locally normal to the null
    vacuum on the algebra of an interval of each generator containing the
    bifurcation surface is the null vacuum of (N$_{+}$), positivity included,
    and every other stationary such state, the half-thermal products at every
    period included, is locally disjoint from it there
    (\claimref{synthesis.local-normality-at-the-edge-gives-the-null-ground-state});
    the condition is the generator-algebra analogue of Haag's local normality
    (Fact \claimref{synthesis.imported-haag-local-normality}) and is adopted
    as the equivalent form of (N$_{+}$) within that class, not derived.
    Adversarial finding (argued, not filed): in the null-shell in-vacuum the
    null energy along a future-horizon generator, relative to the vacuum in
    the generator's affine parameter $V$, is $-1/(48\pi V^{2})$ per complex
    chiral field: a physical state with negative averaged null energy on the
    horizon, so positivity on the eternal horizon is a property of the
    Hartle-Hawking-type state, not of every physical state.
    (Marked, 6 November.) A further state condition gives the positivity
    with no stationarity and no conformal symmetry: within gauge-invariant
    quasi-free states on one generator, field-level geometric modular
    action of the half-line modular conjugations at a set of cuts whose
    differences generate a dense subgroup, with the sign $\eta = -1$,
    gives the null vacuum, positivity included
    (\claimref{synthesis.geometric-modular-conjugations-on-a-generator-give-the-null-ground-state}).
    It needs only the generator algebra, so it can be posed on the eternal
    hole's generators; there it is posed, not derived, and the orientation
    of the positivity enters as the assumed sign $\eta = -1$ (the
    orientation of the imaginary unit relative to time, which the series
    does not fix). Conditions on the net of local algebras of the
    generator cannot give the positivity: the translation-invariant Fermi
    seas satisfy all of them and have negative-energy excitations
    (\claimref{synthesis.modular-data-on-a-generator-fix-neither-the-translation-lift-nor-the-sign-of-i}).
    Item (ii) stays open, restated as field-level geometric modular action
    on the eternal hole's generators; positivity is not shown to be a
    permanent part of the premise.

    (7 November.) The orientation datum of item (ii) is the one examined under op.r-premises-external on
    7 November: on fields reached by the Hadamard deposit premise it is carried by that premise; on the
    eternal hole it stays assumed.
  attack:
    - >-
      Derive local normality at the bifurcation surface of the eternal hole
      for the series' state of the generators' modes from a principle of the
      series (shared with op.r-premises-external).
    - >-
      A condition without stationarity: test whether local normality at every
      point of the generators, with the attachment's vacuum far from the hole,
      gives the positivity on the eternal horizon.
  success: >-
    Item (ii) proved for the eternal Schwarzschild horizon from a condition on
    the state that the series derives; or a proof that no condition stated in
    the series' algebra supplies it, which would leave positivity in case (a)
    of (N$_{+}$) a permanent part of the premise.
  entities:
    - synthesis.schwarzschild-horizon-translations-are-no-conformal-symmetry
    - synthesis.local-normality-at-the-edge-gives-the-null-ground-state
    - synthesis.imported-haag-local-normality
    - synthesis.n-plus-null-ground-state
    - synthesis.stationary-horizon-state-is-its-own-edge-scaling-limit
    - synthesis.attachment-conformal-energy-is-generated-by-z
    - synthesis.de-sitter-horizon-translation-is-conformal-null-rotation
    - synthesis.positive-conformal-energy-gives-positive-null-translations
