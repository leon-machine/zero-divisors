- id: op.gram-square-and-face-space
  title: The Gram-square structure and the real structure of face space
  area: generations
  kind: research
  difficulty: substantial
  status: partial
  source: T13, successor problems (2), (4) and (5); the 9 November results and Leon's decisions
  statement: Derive that the full three-family Yukawa form is the square of a face-space map; find, or refute, a real structure
    on the complexified face space under which the bracket form has signature $(1,2)$ on the physical slice; and account
    for the quarks' failure of the Koide relation, which the perturbative strong dressing cannot produce from Koide brackets.
  why: The Gaussian section and the alignment result assume the Gram-square form; the real structure would promote Koide's
    light-cone reading from a choice to a consequence; the quark account decides whether the relation is selective at bracket
    level at all.
  known: 'The alignment result rests on the Gram-square form (\claimref{families.alignment-computed-thirteenth-refutation-democracy-one}(3));
    the light-cone reading is a choice in \claimref{families.koide-nullity-condition-one-member-invariant}; the face identification
    is a working hypothesis (\claimref{families.hyp-face-identification}). Under the adopted premise of slot covariance
    (\claimref{families.slot-covariance-of-mass-law}), a family form sesquilinear in the face vector, with constant coefficients
    and face-wise diagonal $2|\beta_{k}|^{2}$, is forced to be the Gram square, exact at $\Lambda = 0$ and rank one, while
    the permutations alone leave a nine-dimensional freedom (\claimref{synthesis.slot-covariance-forces-gram-square}). The
    real structure is found: the one on which the bracket form is Lorentzian is complex conjugation conjugated by the doublet
    quarter-turn, under which the bracket form becomes the light-cone member, so the real structure and the choice of member
    are one datum and the physical vector is null on no slice; the Koide angle is the Hilbert-Schmidt angle between the
    mass matrix and the identity (\claimref{synthesis.light-cone-koide-is-quarter-turn}). Every $S_{3}$-equivariant real
    structure gives the same geometry with the coherent source after a face unitary (\claimref{synthesis.real-structure-breaks-source-stabiliser-to-z2}(i)),
    so nothing built covariantly in face space can select the Lorentzian member. The Gaussian coherent face vector lies
    on no permutation-equivariant real slice, and its projection satisfies Koide exactly when the channel feeding ratio
    is $\lambda^{2} = 2$ (\claimref{synthesis.coherent-face-vector-real-slices}). The third part, the strong dressing, is
    answered in the negative at perturbative level: a dressing that is flavour-blind or favours the lighter quarks can only
    lower the Koide quotient, the measured quark quotients exceed $\tfrac23$ in both sectors at every standard mass definition
    (between $0.731$ and $0.889$), and perturbative QCD running, pole conversion and constituent dressing are of that kind
    (argued, standard QCD: \claimref{synthesis.imported-flavour-blind-quark-mass-running}, \claimref{synthesis.imported-one-loop-pole-mass-relation}),
    so they cannot turn Koide brackets into the measured quark masses; a Koide bracket would need a dressing favouring the
    heaviest quark by at least $1.88$ (down) and $8.67$ (up, own-scale masses); dressings that raise the middle mass and
    lower the lightest relative to the heaviest ($D_{2} > D_{3} > D_{1}$) are covered by the same theorem''s part (iv), although
    the last sentence of its version 1 said they were not treated (\claimref{synthesis.mass-ordered-dressing-cannot-spoil-koide};
    corrected in its version 2, 9 November).
    The selectivity observation is restated accordingly (\claimref{families.selectivity-observation-level}). Both parts
    of the success clause are met, the first under a premise, but the light-cone reading stays a choice rather than a consequence,
    and whether the quark brackets satisfy the relation at all is open. The one quark triple near the relation is a look-elsewhere
    effect: over the twenty quark triples at three mass definitions (sixty quotients spread from $0.448$ to $0.987$) the
    nearest to $\tfrac23$ is $(c, b, t)$ at own-scale masses, $0.6693$, against a nearest deviation of about $0.0045$ expected
    by chance, and it moves with the mass definition ($0.6575$ with the charm pole mass, $0.7209$ at $M_{Z}$); so the $(c,
    b, t)$ relation (Rodejohann and Zhang 2011, cited from memory) is no evidence that quark brackets satisfy Koide, while
    the lepton triple, a single triple within about $5 \times 10^{-6}$, is far from chance (computed with masses partly
    cited from memory, not filed).

    (9 November.) The remaining class is closed: every positive triple with Koide quotient $\tfrac23$ has its
    middle entry at least $\tfrac{17}{2} - 6\sqrt{2} \approx 0.0147$ times its largest, which $m_{c}/m_{t}$
    violates at own scale and at $M_{Z}$, so no up-type triple $(x, m_{c}, m_{t})$ with $x \le m_{c}$ is a
    Koide triple; part (iv) of the stored theorem covers the class $D_{2} > D_{3} > D_{1}$, whose sharp
    threshold is $D_{3}/D_{1} \ge 7.88$ (down) and about $2010$ (up, own-scale masses, with the bracket order
    of $u$ and $c$ reversed); so no ordering of the dressing factors escapes a dressing that favours the
    heaviest quark, which no perturbative strong effect does
    (\claimref{synthesis.koide-middle-mass-bound-closes-the-remaining-quark-dressing-class}). Attack item 1 is
    closed in the negative for QCD-type dressing. The data alone exclude no class, so whether the quark
    brackets satisfy the relation is decided only by a dressing law, which no stored premise supplies; the
    selectivity account for quarks is dropped unless a dressing law favouring the heaviest quark is proposed.'
  attack:
  - 'Closed in the negative for QCD-type dressing (9 November; \claimref{synthesis.koide-middle-mass-bound-closes-the-remaining-quark-dressing-class}):
    in every ordering of the dressing factors, the remaining class $D_{2} > D_{3} > D_{1}$ included, a Koide bracket needs
    a dressing favouring the heaviest quark, which no perturbative strong effect does. The selectivity account for quarks
    is dropped unless a dressing law favouring the heaviest quark is proposed, which would reopen the item. The $(c, b,
    t)$ near-hit is at chance level and does not count.'
  - 'Look for what would make the light-cone member a consequence: since the real structure and the member are one datum
    (\claimref{synthesis.light-cone-koide-is-quarter-turn}) and every equivariant real structure looks the same from the
    source, the selection must come from structure outside face space.'
  success: The Gram-square form derived from stated structure, and a real structure found or excluded.
  entities:
  - families.koide-nullity-condition-one-member-invariant
  - families.selectivity-observation-level
  - families.slot-covariance-of-mass-law
  - synthesis.slot-covariance-forces-gram-square
  - synthesis.light-cone-koide-is-quarter-turn
  - synthesis.coherent-face-vector-real-slices
  - synthesis.mass-ordered-dressing-cannot-spoil-koide
  - synthesis.real-structure-breaks-source-stabiliser-to-z2
  - synthesis.koide-middle-mass-bound-closes-the-remaining-quark-dressing-class
  added: '2026-10-22'

