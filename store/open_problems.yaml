- id: op.googly-analytic-half
  title: The analytic googly half
  area: conformal-spacetime
  kind: research
  difficulty: frontier
  status: reformulated
  source: "T09, successor problem (1); T17, open direction 6; the conformal results of 26 October"
  statement: >-
    Construct part (b) of Conjecture
    \claimref{correspondence.googly-localisation-quartic-order}, the
    self-dual (googly) data carried by the quartic-order ordering tensor, as
    patching (Cech) data: local quartic redefinitions on the sets of a
    cover of a proper region of the conformal spinor space (twistor space) whose failure to glue is a
    cohomology class carrying a known self-dual curvature; or refute the
    localisation by an example in which no such class exists.
  why: >-
    The googly problem, encoding self-dual curvature in twistor data, is open
    in twistor theory generally; the series' contribution is a definite claim
    of where the data sits, which a construction would confirm and a
    counterexample would end.
  known: >-
    The algebraic half is proved: the anti-self-dual sector's ordering
    discrepancies stay in that sector and never source the googly slot
    (\claimref{correspondence.chirality-split-ordering-insensitivity-asd-sector}),
    and the ordering filtration places the quartic-order tensor exactly where
    curvature operators lie (\claimref{correspondence.ordering-filtration}).
    If the deformed palatial product closes on the symmetrised quadratics,
    the quartic ordering tensor is a deformation of the rigid bracket of
    $\mathfrak{sl}(4)$ (second cohomology zero, computed exactly), so
    self-dual data there is pointwise a redefinition of the generators
    (\claimref{synthesis.quartic-ordering-tensor-locally-trivial}). The
    closing hypothesis is not needed for global polynomial deformations
    (argued, 26 October): the palatial algebra is the polynomial Weyl algebra
    of $\CS \oplus \CS^{*}$, whose second Hochschild cohomology vanishes
    (Sridharan 1961, cited from memory and not imported), so every formal
    deformation of it is a change of generators, closing on the quadratics or
    not. The quartic ordering tensor commutes with the Euler operator
    $\Upsilon = Z\cdot\partial_{Z}$, while linearised googly data is
    represented by classes of homogeneity $-6$ (Euler weight $-2$), so the
    tensor can hold googly data only pointwise, as a cochain on a region
    (argued). Hence part (b) can hold only as patching data on a proper region
    of the conformal spinor space, produced from the weight $-2$ class by a weight-raising
    operation such as contraction with the infinity twistor, which breaks
    conformal invariance (argued; a lead, the same kind of scale datum as the
    one op.which-capacity needs).
  attack:
    - >-
      Test part (b) as patching data: on a self-dual example with nontrivial
      global structure, compute the obstruction to gluing the local quartic
      redefinitions. A real half-flat field of Lorentzian signature has
      vanishing Weyl part
      (\claimref{correspondence.no-real-lorentzian-vacuum-half-flat}), so use
      a Kleinian self-dual metric such as self-dual Taub-NUT.
    - >-
      Test whether the weight-raising step must use the infinity twistor:
      build the weight-zero cochain from a weight $-2$ class on a
      neighbourhood of a line, with and without a scale, and check the result
      against
      \claimref{correspondence.chirality-split-ordering-insensitivity-asd-sector}
      first.
  success: >-
    A palatial patching construction whose quartic-order defect reproduces a
    known self-dual curvature, or an example in which googly data appears at
    another order, refuting part (b).
  entities:
    - correspondence.googly-localisation-quartic-order
    - correspondence.chirality-split-ordering-insensitivity-asd-sector
    - correspondence.ordering-filtration
    - synthesis.quartic-ordering-tensor-locally-trivial
    - note.correspondence.setting-successor-problems
  added: "2026-10-22"

