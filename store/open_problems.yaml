- id: op.rung-unit
  title: The rung unit, and the rung component as a field
  area: standard-model
  kind: research
  difficulty: frontier
  status: partial
  source: T12, successor problem (1); T13, successor problem (6); maintainer decisions of 23 and 26 October; results of
    31 October; results and Leon's decisions of 1 November; the B-mixing and quartic-running results and Leon's decisions of 2 November (the transmutation branch excluded under the coupling reading, the branch with a level the working branch); the 9 November results and Leon's decisions
  statement: >-
    The weak scale is the size of the rung's algebraic unit, $v/H \approx 10^{44}$ Hubble units
    ($H^{2} = \Lambda/3$), which nothing in the series fixes. On the null-lift locus the rung field's one
    neutral mode is the rung unit, and in the hypercharge D-term action the frame is set by the D-term level
    $\xi$, an input; the register holds $\xi$ (strictly $\xi G$) as the constant of the laws, so under the
    Henneaux-Teitelboim promotion $v/M_{P}$ is the law and $v/H$ initial data. Supply the second invariant
    $W(N)$ of the rung potential that the Higgs mass requires, or derive it, with a charged pair that
    collider searches allow; derive the level, or $\xi G$, from a dynamics if any can; and account for the
    up-down mass hierarchy under the $\su(2)_{R}$-covariant completion of the $c^{*}$ reading, where the
    second family matrix is the coupling to $c^{*}$.
  why: It is the hierarchy between the weak and the gravitational and cosmological scales in the framework's terms,
    and it decides whether the series' rung coupling can carry the quark masses.
  known: >-
    The Higgs doublet's representation, its Yukawa pattern and the transported frozen point's
    landing in the doublet directions are derived; the scale is not
    (\claimref{standard-model.what-derived-what-not}). The rung unit is the boost of the rung frame
    against the lift's null pair, invisible to the tractor norm $-\Lambda/3$
    (\claimref{synthesis.rung-unit-is-frame-boost},
    \claimref{synthesis.rung-unit-transverse-to-norm}); $v/H$ is not derived. The register
    (\claimref{synthesis.rung-unit-second-free-number}, version 3): the constant of the laws is the
    D-term level $\xi$, strictly $\xi G$, not derived and not a function of $N$; under the
    Henneaux-Teitelboim promotion, which the series adopts, $v/M_{P}$ is the law up to relative
    order $(H/v)^{4}$, $v/H$ is initial data, and $Gv^{2}N^{2} = (v/H)^{2}$ is an identity, not a
    law. The stored D-term action with a constant level, read under the promotion, met the
    refutation condition of the premise's earlier version, which held $v/H$ as the law
    (\claimref{synthesis.constant-d-term-level-fixes-weak-scale-against-planck-under-promotion}).
    The $H$ of $v/H$ is $H_{0}\sqrt{\Omega_{\Lambda}}$ ($v/H \approx 2.1 \times 10^{44}$); some
    texts use $H_{0}$ ($1.7 \times 10^{44}$), a factor of order one. The action. On the null-lift
    locus $Q(c) = -\Lambda/3$ (\claimref{synthesis.rung-field-on-the-lift-locus}) every
    $U(2)$-invariant potential is a function of the Hermitian norm $N$ and the hypercharge moment
    map $m$ on $N^{2} - m^{2} \ge H^{4}$, whose boundary is the lift family; the D-term action puts
    the vacuum on it at $m^{*} = g'^{2}\xi/(g^{2} + g'^{2})$ with $m_{h} = M_{Z}$ and a charged pair
    at $M_{W}$ at tree level, so a second invariant $W(N)$ is needed
    (\claimref{synthesis.rung-field-d-term-action-and-tree-masses-on-the-lift-locus}); at tree level
    $(m_{\pm}^{2} - M_{W}^{2}) - (m_{h}^{2} - M_{Z}^{2}) = 2(m^{*}/N^{*})^{2}(W' - N^{*}W'')$, and
    $W = \kappa N^{2}$ gives a charged pair near $117$ GeV
    (\claimref{synthesis.rung-field-charged-scalar-sum-rule}). The level is needed and is not
    right-invariant: for every $W(N)$ an off-balanced charge-preserving vacuum has $m_{\pm}^{2} =
    (M_{Z}^{2} - M_{W}^{2})(\xi/m^{*} - 1)$, so local stability needs $\xi/m^{*} > 1$; the commutant
    of the weak $\su(2)$ on the rung summand is an $\su(2)_{R}$ containing the hypercharge, under
    which the level is not invariant
    (\claimref{synthesis.rung-field-level-needed-off-balance-and-not-right-invariant}), and a D-term
    level exists only for abelian factors
    (\claimref{synthesis.imported-fayet-iliopoulos-level-only-for-abelian-factors}), so the
    electroweak level must be an $\su(2)_{R}$-breaking remnant. The Yukawa form. The per-sector
    $c^{*}$ reading (down-type entries from $c$, up-type entries from $c^{*}$, one family matrix;
    \claimref{standard-model.one-vev-vector-relations-breaking-pattern}) is not $\su(2)_{R}$
    covariant: it vanishes on the $\alpha$ half, which $\su(2)_{R}$ carries into the $\beta$ half.
    The $c^{*}$ reading stands for its covariant completion, $Y$ on $c$ and $\tilde{Y}$ on $c^{*}$
    as wholes, the two-coupling structure of a left-right bidoublet
    (\claimref{synthesis.imported-left-right-bidoublet-two-yukawa-couplings}), and the per-sector
    reading is its leading mass reading. The completion supplies the second family matrix: $M_{d} =
    \beta Y + \bar{\alpha}\tilde{Y}$, $M_{u} = \alpha Y + \bar{\beta}\tilde{Y}$, equal to the
    per-sector masses up to relative $e^{-2\eta}$, with up-down split $\tr H_{u} - \tr H_{d} =
    2m(\|Y\|^{2} - \|\tilde{Y}\|^{2})$, at the vacuum proportional to the moment map $m^{*}$ set by
    $\xi$ and zero at the balanced frame; $\tilde{Y} = Y$ gives $m_{u} = m_{d}$, and the top cannot
    come through $c$
    (\claimref{synthesis.rung-field-coupling-to-its-conjugate-is-the-second-family-matrix}). Under
    the per-sector reading one family matrix per composite never splits up from down for
    $T_{3R}$-even weightings; only $T_{3R}$-odd weightings, or the product of two CP-odd relative
    phases, do (\claimref{synthesis.conjugate-reading-up-down-split-is-t3r-odd-or-cp-odd}, extending
    \claimref{synthesis.up-down-split-under-conjugate-reading-needs-su2r-odd-weighting}). The
    charged pair. The $W = \kappa N^{2}$ pair near $117$ GeV is excluded on both readings. Under the
    per-sector reading its fermion couplings carry $e^{-2\eta}$, so it is stable, and searches for
    long-lived charged particles exclude it, a reinterpretation of the stau limits
    (\claimref{synthesis.imported-long-lived-charged-particle-stau-limits};
    \claimref{synthesis.rung-field-charged-pair-decouples-from-fermions-under-conjugate-reading});
    under the covariant completion it couples at Yukawa strength and $t \to bH^{+}$ has a branching
    near $25$ per cent (\claimref{synthesis.imported-two-doublet-top-to-charged-higgs-width-ratio}),
    far above the ATLAS limits
    (\claimref{synthesis.imported-atlas-charged-higgs-top-decay-tau-nu-limits}). Classical scale
    invariance. A charge-preserving tree-level vacuum at the weak scale needs the physical-branch
    coefficient to vanish to about $10^{-88}$, so classical scale invariance needs the flat physical
    branch, and $W = \kappa N^{2}$ is not a flat-direction potential
    (\claimref{synthesis.scale-free-rung-potentials-need-the-flat-physical-branch}).
    Gildener-Weinberg transmutation on that branch
    (\claimref{synthesis.imported-coleman-weinberg-gildener-weinberg-scalon-mass}) was explored and
    is not a derivation: with the Majorana and Pati-Salam sectors decoupled from the rung field, the
    measured Higgs mass needs a charged pair at $450$ to $456$ GeV and gives $\mu_{\gamma\gamma}
    \approx 0.90$, against the Particle Data Group average $1.10 \pm 0.06$; decoupling fails for the
    order-one neutrino Dirac couplings the $c^{*}$ reading gives with the stored $v_{R}$, and the
    transmutation scale is itself an input of $v/M_{P}$ type
    (\claimref{synthesis.transmutation-of-the-rung-field-needs-a-charged-pair-near-450-gev}).
    (Marked, 2 November 2026.) For the elementary linear rung field and under the decided coupling
    reading, the covariant completion with complex symmetric family matrices (the rung $10$), the
    transmutation branch is recorded as excluded, by three independent strikes: (1) $h \to
    \gamma\gamma$: the stored bound $\mu_{\gamma\gamma} < 0.900$ lies $3.3$ standard deviations
    below the Particle Data Group 2026 average $1.10 \pm 0.06$ (pdglive node S126SGG, read on 2
    November 2026); (2) $B$-meson mixing: tree-level exchange of the neutral normal pair, below
    $542$ GeV on this branch, exceeds the measured $B_{s}$ and $B_{d}$ mass differences more than
    $50$ times for every splitting of its two masses, with quark mixing from tree-level
    determinations and unitarity
    (\claimref{synthesis.covariant-rung-coupling-gives-the-normal-pair-tree-level-b-meson-mixing-that-excludes-the-transmutation-branch});
    (3) strong coupling: on the scalon-sum surface the quartics reach $4\pi$ between about $0.8$ and
    $4$ TeV at one loop
    (\claimref{synthesis.rung-field-quartics-run-to-strong-coupling-within-a-few-tev-on-the-transmutation-branch}).
    The branch with a level is the working branch: the D-term level $\xi$, an input, carries the
    weak scale, and the second doublet is heavy, about $2.5$ to $3.5$ TeV
    (\claimref{synthesis.linear-rung-field-has-a-neutral-normal-pair-in-the-scalon-sum}). The
    rung-frame boost does not carry the Majorana scale: a Majorana vev of fixed size in Hubble units
    in one frame, read in the weak frame, is excluded by the record for order-one couplings, so the
    Majorana scale stays an input
    (\claimref{synthesis.majorana-scale-not-carried-by-rung-frame-boost},
    \claimref{synthesis.majorana-scale-free-input}). No selection by symmetry supplies the weak
    scale: the rung component's norm has its only critical point at the mirror frame, and a D-term
    even under $c \mapsto c^{*}$ has $\xi = 0$ and its vacuum at the balanced frame, so the weak
    scale enters through a $c^{*}$-odd constant such as $\xi$.

    (9 November.) $\xi G$ is free at fixed $N$ on the stored relations (proved): with $W =
    \kappa\mathsf{N}^{2}$ every frame of the lift family is a stable vacuum at $\xi = m(g^{2} + g'^{2} +
    8\kappa)/g'^{2}$, with all tree masses squared fixed multiples of $\mathsf{N}$, and two frames at equal
    $G$, $\Lambda$ (so equal $N$) and couplings are models with different $\xi G$ and $v/M_{P}$ in which every
    stored relation mixing the Planck and weak scales holds
    (\claimref{synthesis.d-term-level-free-at-fixed-n}). The models use the branch $W = \kappa\mathsf{N}^{2}$,
    which the record excludes (\claimref{synthesis.rung-field-charged-scalar-sum-rule}); they are models of
    the premise set, which is what independence needs. This is consistent with the register, which holds $\xi
    G$ as the constant of the laws (\claimref{synthesis.rung-unit-second-free-number}); a derived $\xi G$
    would still refute it.
  attack:
  - >-
    Compute the charged pair's mass from the second invariant $W(N)$ on the covariant completion, where it
    couples at Yukawa strength, and confront it with the searches in top decays and in $H^{+} \to \tau\nu$
    and $c\bar{s}$; derive or exclude a choice of $W$ from the series' structure or from quantum corrections
    ($W = \kappa N^{2}$, near $117$ GeV, is excluded on both readings).
  - >-
    Derive $\xi$, or $\xi G$, from the Pati-Salam breaking pattern: the electroweak level must be an
    $\su(2)_{R}$-breaking remnant, since a D-term level exists only for abelian factors; ask whether the
    right-handed breaking fixes its size, or whether the rung action couples to the promoted $\Lambda$ (a
    level proportional to $\Lambda$, under which $v/H$ would be the law). No stored relation fixes $\xi G$ at
    fixed $N$ (9 November; \claimref{synthesis.d-term-level-free-at-fixed-n}).
  - >-
    Derive or bound $|Y| - |\tilde{Y}|$, or the CP phases: under the covariant completion the up-down split is
    $2m^{*}(\|Y\|^{2} - \|\tilde{Y}\|^{2})$, under the per-sector reading it needs a $T_{3R}$-odd weighting or
    the product of two CP-odd relative phases; find what in the series fixes the difference of the two coupling
    norms or the relative phases, and with it the top-bottom hierarchy.
  - Decide the Hermitian structure on the rung summand, and with it whether the gauge masses read $H^{2}\cosh 2\eta$ or
    $-\Lambda/3$.
  - >-
    Take the Majorana sector's family matrix as a source of the split under the per-sector reading: the
    $T_{3R}$-odd degree-four part of the square of the Majorana element splits up-type from down-type masses,
    provided its family matrix is not that of the $10$; it needs a dynamics that selects that truncation, and
    with an $S_{3}$-invariant Majorana sector it is family-blind on the light plane (argued).
  success: A derived value of $\xi G$ (equivalently of $v/M_{P}$), which would refute the registered premise, or a
    Lagrangian for the rung field with its level as an input (the working branch), a potential consistent with the
    measured Higgs mass and a charged pair and second doublet consistent with collider and flavour limits; and the up-down hierarchy accounted for under the covariant
    completion of the $c^{*}$ reading.
  entities:
  - synthesis.rung-unit-second-free-number
  - synthesis.rung-field-d-term-action-and-tree-masses-on-the-lift-locus
  - synthesis.constant-d-term-level-fixes-weak-scale-against-planck-under-promotion
  - synthesis.rung-field-level-needed-off-balance-and-not-right-invariant
  - synthesis.rung-field-coupling-to-its-conjugate-is-the-second-family-matrix
  - synthesis.covariant-rung-coupling-gives-the-normal-pair-tree-level-b-meson-mixing-that-excludes-the-transmutation-branch
  - synthesis.transmutation-of-the-rung-field-needs-a-charged-pair-near-450-gev
  - synthesis.conjugate-reading-up-down-split-is-t3r-odd-or-cp-odd
