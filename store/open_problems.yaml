- id: op.helicity-per-boundary-mode
  title: Helicity counting per boundary mode, and joint J3
  area: thermality
  kind: research
  difficulty: substantial
  status: partial
  source: "T07, successor problems (2) and (6); maintainer decision of 23 October (array offset); the light-ray result and Leon's count-unit decision, 26 October; the slot-module light-ray result, 31 October; the 9 November results and Leon's decisions; the spin-2 horizon-channel result and Leon's decisions of 9 November (second pass)"
  statement: >-
    Under Premise (Q) version 3 one registered boundary mode carries two
    s-wave arrays. With the count taken per light ray (decision of 26
    October), the arrays of a light ray are the complex canonical channels of
    its spinor fields, one per chirality. The counted content is now known:
    the Weyl components per light ray, sixteen per generation (see below).
    What is open is joint J3: convert the helicity lift from an assembly to a
    theorem by proving the identification of each $(\omega, \ell, m, s)$
    channel with a two-dimensional mode, at the horizon.
  why: >-
    The channel count per registered mode fixes how the boundary modes map
    onto the matter fields that radiate, and J3 is the step that turns the
    helicity lift into a theorem; the residue's capacity convention does not
    depend on it, but the identification of the counted unit does.
  known: >-
    Joints J1 and J2 place the two helicities at distinct homogeneities but do
    not say how many channels one boundary mode registers
    (\claimref{hawking.helicity-lift-joints-itemised}); J3 is a modelling
    premise (\claimref{hawking.joint-j3-s-wave-reduction}). In the capacity
    convention the registered density does not depend on J3
    (\claimref{synthesis.capacity-per-mode-independent-of-helicity}). One
    s-wave array's current sector is one oscillator tower, so one array
    supplies one helicity channel, at either offset
    (\claimref{synthesis.array-ln2-is-zero-mode-doublet-one-tower}). Under
    (Q) version 3 one array carries $\tfrac12\ln 2$ and two arrays carry one
    registered mode's $\ln 2$
    (\claimref{synthesis.half-integer-weight-array-carries-half-ln2}). On
    spinors (26 October): the canonical part of a spinor on a horizon's null
    plane is the image of $\Lambda(m)$, of boost weight $\tfrac12$, split by
    chirality into two complex channels, one array per chirality, with
    helicity about the generators equal to minus the chirality; a Dirac
    species gives two arrays per light ray, a Weyl field one; vector and
    bivector fields carry the boost with integer weights
    (\claimref{synthesis.light-ray-good-part-of-a-spinor-is-two-chirality-arrays}).
    Leon's decision (26 October): the count is per light ray, with the counted
    unit a bookkeeping total over all horizon fields. The counted content (31
    October, proved): on a horizon's null plane mass terms reach only the
    constraint, so the arrays of a light ray are the Weyl components; every
    CPT halving of the slot module has sixteen per generation, eight
    registered units of $\ln 2$, for either neutral singlet and every mass
    term; its particle half is chiral in every halving, so the counted species
    are not gauge-covariant Dirac species, and with a nonzero Majorana term not
    Dirac species by mass either (seven Dirac species and two Majorana
    neutrals per generation); a five-dimensional field contributes one array
    set per Kaluza-Klein level, equivalently per resolution cell of the fifth
    direction
    (\claimref{synthesis.slot-module-light-ray-arrays-are-weyl-components}).
    So the clause "derive that the counted species are Dirac species with both
    chiralities" is replaced by the proved statement: the counted content is
    the Weyl components per light ray, sixteen per generation, and a
    fifteen-component generation, which would leave half a registered unit,
    does not occur. The area count is a count of spin-$\tfrac12$ channels:
    integer-weight fields (the photon, the graviton, scalars) lie outside the
    CAR count. The alternative reading recorded but not adopted, per
    partial-wave shell under J3, gives two arrays from the two members
    $m = \pm\tfrac12$ of one Weyl field's lowest shell $j = \tfrac12$, with the
    same count and entropy (argued). J3 holds at the horizon only (argued, not
    filed): each partial-wave channel of a massless field of spin $0$,
    $\tfrac12$, $1$ or $2$ obeys a two-dimensional wave equation in the
    tortoise coordinate with a potential that vanishes at the horizon,
    proportional to $1 - 2M/r$ for spins $0$ and $1$ (and $2$, from
    memory), decaying as $e^{2\kappa r_{*}}$, and to $\sqrt{1 - 2M/r}$ for
    spin $\tfrac12$, decaying as $e^{\kappa r_{*}}$ (corrected 9 November;
    the text had $1 - 2M/r$ for every spin); on the exterior the
    barrier gives greybody factors. That argument rests on the Regge-Wheeler,
    Zerilli, Teukolsky and Chandrasekhar reductions, cited from memory and not
    in the store.

    (9 November.) The channel-reduction clause of J3 is proved at the horizon for spins $0$, $\tfrac12$ and
    $1$, in Gauge Theory Gravity from stored premises rather than from imported reductions: in the static
    gauge on the Schwarzschild exterior every partial-wave channel of the scalar, Dirac and Maxwell fields
    obeys a two-dimensional equation in time and the tortoise coordinate whose coupling vanishes at the
    horizon, as $e^{2\kappa r_{*}}$ for spins $0$ and $1$ and as $e^{\kappa r_{*}}$ for spin $\tfrac12$,
    massive fields included for spins $0$ and $\tfrac12$, not uniformly in $\ell$; it is conditional on the
    completeness of spherical and spinor harmonics and the exact/co-exact split of one-forms on $S^{2}$, cited
    from memory
    (\claimref{synthesis.horizon-channels-of-scalar-dirac-and-maxwell-fields-are-two-dimensional}). Spin $2$
    is open. By Leon's decision of 9 November J3 (\claimref{hawking.joint-j3-s-wave-reduction}) is restated
    (version 2): the current-boson identification and the partial-wave lift stay premise for every massless
    field, and the channel-reduction clause is assumed for spin $2$ only, the graviton's channels; for spins
    $0$, $\tfrac12$ and $1$ it follows from the result.

    (9 November, second pass.) Spin $2$, odd parity, is derived for $\ell \ge 2$ in the static frame by
    linearising the gauge field of Gauge Theory Gravity about the stored Schwarzschild field: on a channel of
    real nonzero frequency the odd-parity linearised vacuum equations in the Regge-Wheeler gauge are equivalent
    to the two-dimensional Regge-Wheeler equation, whose potential is $1 - 2M/r$ times a function regular and
    positive at the horizon, value $(\ell(\ell+1) - 3)/(4M^{2})$ there, so the channel is a two-dimensional
    mode at the horizon with the rate $e^{2\kappa r_{*}}$ of the scalar and Maxwell channels (the first-order
    identity rests on an exact grid of cases and a degree bound that is argued). Even parity is reached one
    way: the Zerilli equation lies in the span of the linearised vacuum equations and their first derivatives
    (computed at sample points); the converse, that the Zerilli function carries the whole even-parity channel,
    and the tensor-harmonic facts (completeness, reachability of the gauge) are cited from memory. One
    superpotential gives both potentials and a first-order operator that carries odd-parity solutions to
    even-parity ones on every oscillating channel, its kernel being non-oscillating; the even potential over
    $1 - 2M/r$ is $(4\lambda^{2} + 4\lambda + 3)/(4M^{2}(2\lambda + 3))$ at the horizon, $\lambda =
    (\ell - 1)(\ell + 2)/2$
    (\claimref{synthesis.horizon-channels-of-the-linearised-gravitational-field-are-two-dimensional}).
    There is no radiative channel at $\ell = 0, 1$. By Leon's decisions J3
    (\claimref{hawking.joint-j3-s-wave-reduction}) is narrowed again (version 3): the channel-reduction clause
    stays premise for the even-parity channels of spin $2$ only; the current boson is worded as each
    partial-wave channel, $\ell \ge |s|$, since a field of helicity $s$ has no partial wave below $|s|$; and
    the identification of channels with current bosons of the arrays is recorded as not one array tower per
    helicity channel. Scope, for every spin: that a channel is free at the horizon is a statement in the
    static (Killing) frame and its null coordinates; in Kruskal-type coordinates the coupling at the horizon
    is nonzero (stated in both horizon-channel results), while the reduction of each channel to a field in
    two dimensions does not depend on the frame.
  attack:
    - >-
      Spin $2$, what remains (restated 9 November, second pass; the
      odd-parity reduction is derived,
      \claimref{synthesis.horizon-channels-of-the-linearised-gravitational-field-are-two-dimensional},
      and the reductions for spins $0$, $\tfrac12$ and $1$,
      \claimref{synthesis.horizon-channels-of-scalar-dirac-and-maxwell-fields-are-two-dimensional}):
      the even-parity converse, that every solution of the Zerilli equation
      in an oscillating channel is the master function of a vacuum solution,
      with the implication proved identically and not only at sample points,
      which would take the channel-reduction clause out of J3; the
      harmonic-analysis inputs cited from memory (completeness of tensor
      harmonics and reachability of the Regge-Wheeler gauge for spin $2$,
      completeness of spherical and spinor harmonics and the exact/co-exact
      split of one-forms on $S^{2}$ for the lower spins) and a proof of the
      degree bound of the odd-parity identity; the cases $\ell = 0, 1$
      (changes of mass, spin and gauge); and the statement in charts
      regular across the horizon. The current-boson identification and the
      partial-wave lift stay premise.
    - >-
      Derive the partial-wave identification from the fuzzy sphere of the
      counting programme, shared with T08 and T10.
  success: >-
    J3 proved at the horizon.
  entities:
    - synthesis.slot-module-light-ray-arrays-are-weyl-components
    - synthesis.light-ray-good-part-of-a-spinor-is-two-chirality-arrays
    - hawking.helicity-lift-joints-itemised
    - hawking.joint-j3-s-wave-reduction
    - synthesis.capacity-per-mode-independent-of-helicity
    - synthesis.array-ln2-is-zero-mode-doublet-one-tower
    - synthesis.half-integer-weight-array-carries-half-ln2
    - singularity.q-joint-quasi-freeness-s-wave
    - synthesis.horizon-channels-of-scalar-dirac-and-maxwell-fields-are-two-dimensional
    - synthesis.horizon-channels-of-the-linearised-gravitational-field-are-two-dimensional
  added: "2026-10-22"

- id: op.residue-killing-weights
  title: "The calibration residue: derive that one counted unit is two arrays"
  area: entropy
  kind: research
  difficulty: substantial
  status: reformulated
  source: "T08, successor problem (1); T17, open direction 4; BUILD_REPORT, the calibration residue (22 October); maintainer decision of 23 October (array offset); the light-ray result and Leon's count-unit decision, 26 October; the slot-module light-ray result, the null-ordering result and the adopted window reading, 31 October; the chirality-channel, spinning-hole and outside-count routes, 1 November; the 9 November results and Leon's decisions"
  statement: >-
    Under Premise (Q) version 3, weights $\kappa(k + \tfrac12)$, one s-wave
    array carries exactly $\tfrac12\ln 2$ at the Hawking temperature, so under
    the area-law hypothesis the registered residue $\kappa_c = 1/(4\ln 2)$
    holds exactly when the counted unit is two arrays. The counted content is
    proved: the Weyl components per light ray, sixteen per generation, eight
    registered units. Given the adopted window reading the half offset is
    singled out by (N$_{+}$). What remains a decision is the count unit:
    derive, from the structure of the boundary modes and without assuming the
    area law, that the registered unit is two arrays, or show which unit the
    residue requires.
  why: >-
    It is the series' declared open problem in counting: it produces or
    refutes $\nu = 1/(16\pi\ln 2)$ and with it the intrinsic-clock premise
    (IC), and the de Sitter mode count inherits the same residue.
  known: >-
    Under the area-law hypothesis the residue is $\kappa_c =
    1/(4\langle s\rangle)$ per counted unit
    (\claimref{synthesis.residue-from-mode-entropy}). At the offset of (Q)
    version 3 there is no zero-weight mode, one array carries exactly
    $\tfrac12\ln 2$, and two arrays carry one registered mode's $\ln 2$
    (\claimref{synthesis.half-integer-weight-array-carries-half-ln2}). On a
    light ray (26 October): the canonical part of a spinor on a horizon's null
    plane is two complex channels, one per chirality; read with one (Q)
    version 3 array per complex channel, a massless Dirac species carries two
    arrays per light ray and a Weyl field one
    (\claimref{synthesis.light-ray-good-part-of-a-spinor-is-two-chirality-arrays}).
    The counted content (31 October, proved): mass terms reach only the
    constraint on a null plane, so the arrays of a light ray are the Weyl
    components, and every CPT halving of the slot module has sixteen per
    generation, eight registered units of $\ln 2$, for every mass term; the
    counted species are not gauge-covariant Dirac species
    (\claimref{synthesis.slot-module-light-ray-arrays-are-weyl-components}).
    So the earlier aim "derive that the counted species are Dirac species
    with both chiralities" is replaced by the proved statement that the counted
    content is the Weyl components per light ray, sixteen per generation; a
    fifteen-component generation, which would leave half a registered unit,
    does not occur. The offset (31 October): measured from the null ground
    state of (N$_{+}$), the boost ground state carries $-\kappa/24$ per
    component over one recurrence window $2\pi/\kappa$, which an array's
    zeta-regularised sea energy $\tfrac{\kappa}{2}B_{2}(\delta)$ equals exactly
    at $\delta = \tfrac12$
    (\claimref{synthesis.null-ordering-of-counted-units-is-zeta-symmetric});
    under the adopted window reading
    (\claimref{synthesis.window-reading-array-killing-energy}) the half offset
    is therefore singled out by (N$_{+}$), a reason for it that is not the area
    law. The count unit, two arrays per registered unit, is not derived and
    remains a decision. Independence: the argued form recorded here
    earlier ($N$ identical copies of the array per generator) is replaced by
    the proved form of 9 November below, in which the free datum is the
    grouping of arrays into registered units. Without the weight clause the per-array entropy, hence
    the residue, is a free function of the slope and offset
    (\claimref{synthesis.q-splits-maximum-entropy-affine-weights}). No recount
    with a rational residue reaches $\kappa_c$
    (\claimref{scrambling.no-recount-reaches-quarter}). Off the Schwarzschild
    family the literal cutoff count fails the area law for every stored weight
    law, so the residue is calibrated on Schwarzschild only
    (\claimref{synthesis.cutoff-count-is-not-a-local-density-on-sds}). The
    agreement at version 3's offset is not a confirmation of the prediction:
    the count unit is fixed by decision. Three routes closed (1 November,
    argued; no result filed). The chirality channels: the counted content is
    chiral in every halving
    (\claimref{synthesis.slot-module-light-ray-arrays-are-weyl-components});
    after symmetry breaking the mass matrix pairs fourteen of the sixteen Weyl
    components per generation into seven charged Dirac pairs and leaves two
    neutral components, which with the stored Majorana element are two
    Majorana Weyl arrays rather than a chirality pair of one field, while the
    light-ray count is mass-independent; so "one unit is a chirality pair"
    holds only through the mass matrix and not for every array, and the route
    does not give the unit. The spinning-hole ledger: graded by the horizon
    generator's Killing time, as the window reading grids the arrays
    (\claimref{synthesis.window-reading-array-killing-energy}), the per-shell
    and two-array readings both carry $\ln 2$ per unit with zero mean $J_{z}$,
    so the angular-momentum ledger does not separate them in the generator
    grid; the split by $\pm m\Omega_{H}$ appears only on a grid in asymptotic
    time, which the window reading does not use, and the readings differ only
    in units per generation, which the area-law calibration does not see.
    Kerr is outside the present scope of (N$_{+}$)
    (\claimref{synthesis.n-plus-null-ground-state}). Outside counts: the
    Bekenstein-Mukhanov unit assumes a degeneracy of two per area quantum;
    the loop-gravity spin-$\tfrac12$ count fixes the Immirzi parameter by the
    area law (and that counting was later corrected by Domagala and
    Lewandowski); the asymptotic quasinormal $\ln 3$ of Dreyer and Hod holds
    for spins $0$ and $2$ and vanishes for spin $\tfrac12$; none supplies the
    unit without the area law. The independence of the grouping is the
    series' form of the Susskind-Uglum species and cutoff degeneracy: the
    entropy fixes only the mean number of arrays per unit together with the
    density of units per Planck area. The count unit stays a decision.

    (9 November.) The residue fixes a mean, not a grouping (proved). Under the area-law hypothesis, with the
    arrays of (Q) version 3 carrying $\tfrac12\ln 2$ each and sixteen per generation per light ray, a grouping
    of arrays into registered units with mean $\bar u$ arrays per unit gives $\kappa_{c} = 1/(2\bar u\ln 2)$,
    so the registered residue holds exactly when $\bar u = 2$: eight units per generation, whatever the sizes
    of the individual units (of the $231$ groupings of a generation's sixteen arrays by size, the $22$ with
    eight units). No premise of the cone fixes the grouping (J3's channels offer a candidate, units as
    channels or as the two helicity channels of one $(\omega, \ell, m)$, without imposing it), and no single
    ladder pair qualifies, since at these weights every mode carries less than $0.21 < \ln 2$
    (\claimref{synthesis.the-residue-requires-two-arrays-per-unit-on-average-and-fixes-no-grouping}). This
    replaces the argued $N$-copies form of the independence: with the sixteen Weyl components fixed, the free
    datum is the grouping, not a number of copies. With $c$ arrays per light ray the light rays per Planck
    area per modular period are $1/(2c\ln 2)$, so on the cosmological horizon the number $\pi N^{2}/\ln 2$
    counts registered units, $c/2$ per light ray, and the light rays number $2\pi N^{2}/(c\ln 2)$; the wording
    of \claimref{dark-matter.stored-asymmetry-charge-not-number} is corrected accordingly, its argument
    unaffected. The second branch of attack item 1 is answered: a mean of two arrays per unit. The count unit
    stays a decision, and the density $\nu = 1/(16\pi\ln 2)$ of \claimref{pred.boundary-mode-density} rests on
    it.
  attack:
    - >-
      Derive the count unit from the boundary-mode structure: show that a
      registered mode is two arrays without the area law, by a route other
      than the chirality channels of one light ray (closed, see above), for
      instance a premise that groups arrays into registered units (none of
      the present ones does; J3's channels are a candidate). The second
      branch, which unit the residue requires given sixteen Weyl components
      per generation, is answered (9 November;
      \claimref{synthesis.the-residue-requires-two-arrays-per-unit-on-average-and-fixes-no-grouping}):
      a mean of two arrays per unit, with the grouping free.
    - >-
      Separate the alternative per-shell reading (one Weyl field's lowest
      $j = \tfrac12$ shell, two members) from the two-array reading by an
      observable other than the spinning hole's angular-momentum ledger in the
      generator grid, where the two agree in unit entropy and mean angular
      momentum and differ only in units per generation; a spinning-hole test
      would first need Kerr inside the scope of (N$_{+}$).
    - >-
      Supply a first-principles slice-to-epoch aggregation rule (T08's
      successor problem (4)) to replace the two naive rules refuted in
      \claimref{scrambling.per-slice-verification-two-failed-aggregations}.
  success: >-
    A derivation from the series' structure that the registered unit is two
    arrays, returning $\kappa_c = 1/(4\ln 2)$ without the area law, settles the
    residue and confirms the internal prediction. A derivation returning any
    other count unit meets the kill condition of
    \claimref{pred.boundary-mode-density} and refutes (IC).
  entities:
    - synthesis.slot-module-light-ray-arrays-are-weyl-components
    - synthesis.null-ordering-of-counted-units-is-zeta-symmetric
    - synthesis.window-reading-array-killing-energy
    - synthesis.light-ray-good-part-of-a-spinor-is-two-chirality-arrays
    - synthesis.residue-from-mode-entropy
    - synthesis.half-integer-weight-array-carries-half-ln2
    - singularity.q-joint-quasi-freeness-s-wave
    - pred.boundary-mode-density
    - synthesis.the-residue-requires-two-arrays-per-unit-on-average-and-fixes-no-grouping
  added: "2026-10-22"

- id: op.counted-mode-energy
  title: The energy of the hole beyond the counted units, the label's energy function
  area: entropy
  kind: research
  difficulty: substantial
  status: partial
  source: "BUILD_REPORT, the calibration residue (22 October); synthesis.residue-from-mode-entropy, clause (v); maintainer decision of 23 October (temperature clause read before the crossing); the counted-unit energy result, 26 October; the null-ordering result and the adopted window reading, 31 October; the 9 November results and Leon's decisions"
  statement: >-
    For a mode of positive weight $\beta\omega n < s(x)$, so if the counted
    modes carry the entropy $A/4$ their Killing excitation energy satisfies
    $E < TS = M/2$. With the window reading adopted, the counted units carry
    zero mean Killing energy and the ground-energy label carries all of $M$
    (see below). What is open is the label: derive its energy function from
    the series rather than from the area law, or identify the structure that
    carries it.
  why: >-
    Read literally, the two hypotheses together (the counted modes carry
    $A/4$, and the hole is a thermodynamic system of energy $M$ at the
    series' temperature) leave $M$ without a carrier among the counted modes;
    under the window reading all of it sits in one label whose energy function
    is so far the area law written backwards.
  known: >-
    Clause (v) of \claimref{synthesis.residue-from-mode-entropy}; Hawking's
    argument at the series' temperature gives $S = A/4$ with internal energy
    $M$, explicitly not the boundary modes' Killing energy
    (\claimref{synthesis.quarter-from-temperature}). If the hole is a Gibbs
    state at $T = 1/8\pi M$ with mean energy $M$ and entropy $A/4$, a ground
    energy $E_{0}(M) \in (M/2, M]$ varying with $M$ is forced
    (\claimref{synthesis.hole-mass-is-ground-energy-label}), and a
    microcanonical model with a central label, $4\pi\mu(m)^{2} = m\ln 2$,
    realises it (\claimref{synthesis.central-label-carries-mass-at-zero-weight});
    both are consistency statements, the label's energy function being the
    area law written backwards. On the adopted reading of the temperature
    clause, a fixed window takes the heat of a crossing by its first law, with
    conservation of the patch's boost charge between window and matter
    (\claimref{synthesis.clausius-is-window-first-law-plus-boost-charge-conservation}).
    The counted units at (Q) version 3 (26 October): measured from the filled
    sea a counted unit of two arrays carries $\kappa/12$; in the
    zeta-regularised symmetric ordering it has $Z = 2$, $E = 0$, $S = \ln 2$
    and differs from one zero-weight mode only in its energy fluctuation
    (\claimref{synthesis.counted-unit-energy-at-half-offset}). The ordering
    (31 October): measured from the null ground state of (N$_{+}$), the boost
    ground state carries $-\kappa/24$ per component over one recurrence window
    $2\pi/\kappa$, which equals an array's zeta-regularised sea energy exactly
    at the half offset; so, given the window reading, the symmetric ordering
    is the physical one at (Q) version 3's weights, a counted unit carries
    mean Killing energy $0$, the equality case of clause (v), and the constant
    of the hole's Hamiltonian is all of $M$
    (\claimref{synthesis.null-ordering-of-counted-units-is-zeta-symmetric}).
    The window reading is adopted (Leon's decision of 31 October;
    \claimref{synthesis.window-reading-array-killing-energy}): the counted
    units carry no mean Killing energy and the label carries all of $M$. The
    ordering question is therefore decided, given that reading; the label's
    energy function $\mu(m)$ is not derived. Open question (argued, not
    filed): which fields form the light-ray sea. A one-period recurrence of
    fermion parity with the zeta ordering needs the total chiral central
    charge of the sea to be a multiple of $24$. If the integer-weight fields
    (gauge bosons, the Higgs, the graviton) share the sea it is $78$ at three
    generations and the test fails (a reading, not a stored result; see 9
    November); if only the spin-$\tfrac12$ content forms
    it, sixteen per generation, it is $48$ at three generations and the test
    passes exactly when the number of generations is a multiple of $3$. A
    test, not a derivation.

    (9 November.) The recurrence test is now exact. On every finite window an array's one-window flow is its
    grading, and the window reading adds $-\kappa/24$ per array, so the one-window Killing evolution of a sea
    of $n$ arrays is $e^{2\pi Jn/24}\Gamma$, which equals the grading exactly when $24 \mid n$ ($12 \mid n$
    with the grading's sign left free). The condition strengthens the one-period clause of (Q) from the
    automorphism to the operator, is not implied by (Q), the KMS condition, (N$_{+}$) or the window reading,
    and is independent of every postulate of the cone: models with one and with three generations satisfy them
    all and differ on it. On sixteen Weyl components per generation it gives $n_{g} \equiv 0 \pmod 3$, not
    $n_{g} = 3$, and $n_{g} \equiv 0 \pmod 8$ without the neutral singlet
    (\claimref{synthesis.one-window-parity-recurrence-of-the-light-ray-sea-needs-twenty-four-arrays}). The
    verdict depends on how the bosons are read. Under J3's reading of the integer-weight channels as currents
    of the arrays they add nothing, $c = 16n_{g}$, and the one-window and two-window tests both give $3 \mid
    n_{g}$. If instead the null data of the vectors, the scalar doublets and the graviton are counted
    additively as real arrays (a reading outside (N$_{+}$), the window reading and J3), then $c = 16n_{g} +
    2n_{V} + n_{s} + 2\epsilon$, the twelve vectors drop out, the verdict is set by the scalar content ($n_{h}
    \equiv 2n_{g} \pmod 6$ for one window, $n_{g} + n_{h} \equiv 0 \pmod 3$ for two), and with the graviton no
    content passes
    (\claimref{synthesis.light-ray-recurrence-test-verdict-on-generations-is-set-by-the-scalar-content}). Both
    statements are relative to J3 at version 1; J3's restatement of 9 November (version 2) narrows only its
    channel-reduction clause to spin $2$ and keeps the current-boson identification for every massless field,
    so under J3 the integer-weight channels are still read as currents of the arrays. By Leon's decision of 9
    November the condition is recorded as a test, not a premise. The value $78$ above is a reading, not a
    stored result. The conclusion $3 \mid n_{g}$ has prior art by anomaly routes (cited in both results).
  attack:
    - >-
      Derive the label's energy function $\mu(m)$ from the series rather than
      from the area law, or identify it with a horizon charge of Smarr-Komar
      type evaluated on the bifurcation surface (argued so far to be Smarr
      rewritten, not a derivation).
    - >-
      On the adopted reading of the temperature clause, follow the window
      between crossings: prove that the dilation returns it to the thermal
      state the next crossing presupposes, and that the boost charge it took
      in, summed over the history, is carried along the generators beyond the
      windows, where the label would then sit.
    - >-
      Decide which fields form the light-ray sea. The central charge test is
      now exact and recorded as a test, not a premise (9 November): its
      verdict is $3 \mid n_{g}$ if the integer-weight channels are currents
      of the arrays and is set by the scalar and graviton content if their
      null data are counted additively
      (\claimref{synthesis.one-window-parity-recurrence-of-the-light-ray-sea-needs-twenty-four-arrays},
      \claimref{synthesis.light-ray-recurrence-test-verdict-on-generations-is-set-by-the-scalar-content});
      what remains is to derive whether the integer-weight fields enter the
      sea as currents of the arrays, as J3 (version 2) reads them, or as
      further arrays.
  success: >-
    A derivation of the label's energy function, or of the structure carrying
    $M$ at the level of the whole horizon, compatible with the counted units
    at the registered residue; or a proof that none exists, which would force
    a change in the count unit, the weights or the window reading.
  entities:
