- id: op.window-p3
  title: "The window: derive each tower's dimension and retire P3"
  area: dark-matter
  kind: research
  difficulty: substantial
  status: partial
  source: "T14, successor problem (6); synthesis.oriented-causal-towers-mirror-pair-every-window (accepted 21 October); the dark-matter results and maintainer decisions of 26 October; the results and decisions of 31 October; the 9 November results and Leon's decisions"
  statement: >-
    Derive the tower dimension per residue from the descent and retire P3,
    which represents each tower at the dimension nearest four. Of its two
    clauses, the emptiness of residues 0 and 4 is a costed clause; what
    remains is the lowest causal representative: derive it, or show the
    descent leaves it free. A geometric restatement of the window, premise
    (W), is recorded as a costed alternative found with the fit known and is
    not adopted.
  why: >-
    P3 fixes the dimensions of the other residues' representatives, on which
    the odd towers' content, their types and the unit-ball rule's cell counts
    depend.
  known: >-
    The asymmetric share no longer needs P3: in every dimension a tower that
    is both oriented and causal has residue 2 or 6, a mirror pair
    (\claimref{synthesis.oriented-causal-towers-mirror-pair-every-window});
    the odd residues' exclusion was already window-free
    (\claimref{dark-matter.flag-bit-exists-exactly-tower-dimension}(i)).
    \claimref{dark-matter.towers-are-residues-single-clock-filter}(iii)
    records the other windows. Under T14c's constituent definitions P3 splits
    into two clauses, the lowest causal representative and residues 0 and 4
    empty, and the second is what the unit-ball fit needs (with residue 4
    populated the ratio is about $6.16$;
    \claimref{synthesis.lowest-causal-residues-zero-four-content}). Results of
    26 October: in every dimension a causal tower has a central pseudoscalar
    of square $+1$ exactly at residues 0 and 4 (dimension $n \equiv 2 \pmod
    4$), where reversion exchanges the two chiral idempotents, so the
    reversion pairing vanishes on a single spinor ideal; elsewhere it does
    not. With one ideal the emptiness of residues 0 and 4 is therefore
    equivalent to the pairing reading of mass in those dimensions, which
    agrees with the momentum reading wherever both are proved (dimensions
    three to five) and empties residues 0 and 4 at every causal member
    (\claimref{synthesis.reversion-pairing-vanishes-residues-zero-four},
    proved). Independently, in the lowest-causal window and given the imported
    anomaly theorems
    (\claimref{synthesis.imported-alvarez-gaume-witten-local-anomalies},
    \claimref{synthesis.imported-two-dimensional-covariant-gravitational-anomaly}),
    a single ideal at $(1,1)$ is anomalous in the one metric's field and at
    $(1,5)$, $(5,1)$ only under the reading (G6) that the tower's own gauge
    fields live on its six-dimensional space; at higher causal members of
    residue 0 the one metric meets no obstruction
    (\claimref{synthesis.residues-zero-four-real-chirality-anomaly}). By
    decision (26 October) the series adopts the single chiral ideal at
    residues 0 and 4 with the pairing reading of mass as a costed clause,
    chosen knowing that the unit-ball fit needs it, and records (G6) as the
    general reading, not a postulate (\claimref{dark-matter.status-rule}). P2
    does not reach the chirality choice (it is scoped to residue labels);
    admitting both ideals would make residues 0 and 4 vector-like, massive and
    populated (unit-ball total $8.254$). The flag bit is no reason for the
    emptiness: it exists exactly for $n \equiv 0 \pmod 4$, so residues 0, 4
    and the odd residues all lack it. A tower's residue $r = p - q \bmod 8$ is
    the index of the real Clifford classification
    (\claimref{std-algebra.periodicity}). Results of 31 October. Which pairing
    carries mass is no longer open: every spin-invariant bilinear form on a
    spinor ideal of any nondegenerate signature is a linear functional of the
    reversion pairing, so at residues 0 and 4 a single ideal, or any number of
    copies of it, has no mass term of any kind, while the two chiralities pair
    (\claimref{synthesis.invariant-forms-on-spinor-ideal-factor-through-reversion},
    proved; in substance the classical description of invariant forms through
    reversion and conjugation, cited for comparison); the costed clause
    therefore chooses between the pairing and momentum readings of mass, not
    among pairings, and stays chosen with the fit known
    (\claimref{dark-matter.status-rule}(vi), note). Premise (W), that every
    tower's spacetime is, up to sign, a nondegenerate subspace of the frozen
    point's complement $I^{\perp}$ (signature $(1,4)$ for $\Lambda > 0$), with
    the single-clock filter gives each residue other than 4 exactly one causal
    representative, its lowest, and residue 4 none; it admits the causal
    $(1,1)$ at residue 0, where P3 has $(2,2)$, so residue 0 is still emptied
    only by the single-ideal clause; the whole tractor space gives the same
    causal set, so the frozen point enters only in that for $\Lambda \le 0$
    the five-dimensional towers drop out
    (\claimref{synthesis.frozen-point-complement-window-lowest-causal}). (W)
    restates the window of dimensions up to five that the fit uses and was
    found with the fit known; by decision (31 October) it is recorded as a
    costed alternative to P3, with no postulate and no assumes edge, and P3
    carries a note saying so. Argued: every structural selector the series
    uses (flag bit, chirality type, parity of the anomaly degree, pairing
    type) is periodic mod 8 along a residue, so none can pick the lowest
    member; independence of the lowest-causal clause from the descent's
    premises is the expected outcome.

    (9 November.) The lowest-causal clause splits by residue. At residues $1$ and $7$ the constituent field is
    $\R$ in every causal member, and the stored pair count $\lfloor (n+2)/2 \rfloor$ exceeds the real Witt
    index $2$ of $\hatV$ above dimension three, so Premise U (U3) admits only $(2,1)$ and $(1,2)$: there the
    window follows from U, and P3's lowest-causal clause is not independent. At residues $3$ and $5$ adding
    eight directions of the majority sign splits off a factor $\Mat(16, \R)$, reversion included, and the
    model with those towers at $(12,1)$ and $(1,12)$ satisfies every premise of the window-sensitive results
    other than P3, Premise U included (the field $\HH$ supplies the units), with R2 in its dimension-generic
    reading; so the descent leaves the five-dimensional towers' dimension free, the window there is an input,
    and P3 stays a costed premise for those residues (the dark-to-baryon ratio is about $9.94$ in the shifted
    model against $5.364$) (\claimref{synthesis.bott-shifted-model-leaves-the-odd-towers-dimension-free}).
    Premise (W) admits the lowest representatives and neither shifted one. This revises the argued expectation
    above: the stored pair count is a selector that is not periodic mod $8$ along a residue, and through
    Premise U it fixes the window at residues $1$ and $7$. The thickness of R3 is the other recorded input of
    the same unit-ball relation (\claimref{synthesis.no-rule-p2-licenses-gives-the-thickness-of-r3}).
  attack:
    - >-
      Split by residue (9 November;
      \claimref{synthesis.bott-shifted-model-leaves-the-odd-towers-dimension-free}):
      at residues $1$ and $7$ the window follows from Premise U; at residues
      $3$ and $5$ the descent leaves the clause free, so the window there is
      an input and P3 stays, costed, unless a reason for (W) or for the
      lowest causal member is found that does not use the fit (a selector
      not periodic mod 8 along those residues, as the stored pair count is
      along residues $1$ and $7$).
    - >-
      Derive the pairing reading of mass, now the only alternative to the
      momentum reading, from what a field mass term needs in the series' own
      constituent definitions; under the momentum reading residues 0 and 4
      would deposit only massless quanta, bounded as dark radiation by $\Neff$
      rather than by the fit.
  success: >-
    A derivation of the dimension per residue, or a proof that the descent
    leaves it free, in which case P3 stays and is costed.
  entities:
