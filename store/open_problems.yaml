- id: op.qft-non-abelian-gauge-fields
  title: The non-abelian gauge fields as quantum fields
  area: quantum-fields
  kind: research
  difficulty: frontier
  status: partial
  source: "The review of what a quantum field theory still needs, 1 November; the BRST, running and lattice results and Leon's decision adopting the Krein-form premise, 1 November; the field-level BRST, quartet, Clifford-conjugation and Gribov results and Leon's decisions (the Neuberger, Fradkin-Shenker and Singer imports), 2 November; the colour-lattice results and Leon's decisions (no import of the strong-coupling clustering or of finite-group freezing; the colour item restated), 8 November; the 9 November results and Leon's decisions"
  statement: >-
    The gauge algebra of the minimal massive composite
    (\claimref{synthesis.gauge-algebra-by-tower},
    \claimref{standard-model.gauge-algebra-minimal-massive-composite}) now has
    a nilpotent field-level BRST differential and, under clauses (K1) and (K2)
    of the Krein-form premise, free gluons and massive vectors with a positive
    physical space at every number of quanta. Quantise the interacting gluons
    and W and Z: the interacting BRST charge on the Krein space with positive
    physical space, the BRST transformation of the scalar sector with the
    breaking pattern derived rather than taken as input, and what the series
    says on confinement of colour.
  why: >-
    Two of the three Standard Model forces exist in the store as free fields
    and a perturbative device; their interacting quantum theory, and colour
    confinement, are not in the store.
  known: >-
    Composite charged massless gauge bosons are excluded (Weinberg-Witten)
    (\claimref{field-theory.composite-gauge-bosons-what-excluded}). A nonzero
    self-adjoint BRST charge cannot exist on the store's positive forms; with
    the Gupta-Bleuler form and tower ghost pairs the free charge at a null
    momentum is nilpotent and self-adjoint
    (\claimref{synthesis.self-adjoint-brst-charge-needs-a-krein-form-and-the-tower-supplies-the-ghosts}),
    and the indefinite form is a premise
    (\claimref{synthesis.krein-form-premise-indefinite-inner-product-for-gauge-fields});
    its one-particle form is the trace form of Clifford conjugation, minus the
    metric, which restates (K1) and does not derive it; the Fock space over it
    is the Feynman-gauge realisation, other covariant gauges being other state
    spaces
    (\claimref{synthesis.clifford-conjugation-is-the-twistor-adjoint-and-its-trace-form-is-the-one-particle-gupta-bleuler-form}).
    Field-level BRST: on the gauge algebra
    $\mathfrak{su}(2) \oplus \mathfrak{su}(3) \oplus \mathfrak{u}(1)$, realised by
    bivectors (isomorphic to the stored realisation), the differential
    $sA = \nabla c + g[A, c]$, $sc = -\tfrac{g}{2}[c, c]$ squares to zero on all fields and their derivatives,
    needs no inner product and no Krein form, the field strength transforms
    covariantly and the gauge-fixing term is exact; the Goldstone and doublet
    terms are not included
    (\claimref{synthesis.field-level-brst-differential-of-the-derived-gauge-fields-is-nilpotent}).
    Quartet positivity: under (K1) and (K2) the free BRST charge of the gluons
    (null momenta) and of the massive W and Z in the Feynman-'t Hooft gauge, with
    their Goldstone modes, has a contracting homotopy, so at every number of
    quanta its cohomology is the Fock space of the transverse polarisations and
    the Krein form is positive on it; with the two doublets' neutral vacuum as
    input the Goldstone map has rank three (nine massless, three massive
    vectors, five physical scalars, 27 positive physical modes); the statement
    is free and perturbative, the interacting one needs Kugo and Ojima's
    hypotheses
    (\claimref{synthesis.quartet-homotopy-makes-gluon-and-massive-vector-physical-states-positive-at-every-number-of-quanta}).
    Gribov copies: the Coulomb and Landau conditions of the weak factor have
    copies beyond perturbation theory (on the round three-sphere as a
    compactified spatial slice, and on the rotor lattice, where the copy has
    two negative Faddeev-Popov modes and the signed count is the Euler
    characteristic, zero); with Singer's and Neuberger's theorems
    (\claimref{synthesis.imported-singer-gauge-slice-neuberger-lattice-brst-and-fradkin-shenker-complementarity})
    the covariant BRST construction is perturbative only. Lattice route: with a
    frozen fundamental doublet the weak Wilson loop at $\beta = 0$ is
    $c(\kappa)^{P}$, a perimeter law, so with the series' two doublets (input)
    the strong-coupling area law of the weak factor
    (\claimref{synthesis.weak-factor-rotor-lattice-strong-coupling-area-law})
    is no confinement criterion (Fradkin-Shenker complementarity, imported);
    the gauge-invariant rotor lattice, which needs no gauge fixing, ghosts or
    indefinite form, is a non-perturbative route for the weak factor, proposed
    as a reading and adopted by no stored result
    (\claimref{synthesis.non-abelian-gauge-fixing-has-gribov-copies-and-the-weak-rotor-lattice-with-doublets-has-a-perimeter-law}).
    Asymptotic freedom of both non-abelian factors under the Krein-form premise
    is in \claimref{synthesis.one-loop-running-coefficients-from-spacetime-algebra-spin-traces}.

    (8 November.) On a finite window of a null generator the pair currents of the channels satisfy, exactly, the
    level-one $\mathfrak{u}(n)$ current algebra
    (\claimref{synthesis.null-plane-photon-data-and-the-pair-currents-of-the-generators}(i)), and the energy is
    quadratic in the currents with the central term (\claimref{synthesis.exact-window-sugawara-identity-and-luttinger-normal-modes-of-tower-density-waves}).
    With the sixteen Weyl components per generation per light ray
    (\claimref{synthesis.slot-module-light-ray-arrays-are-weyl-components}) these are exact $\mathfrak{u}(16)$
    currents per light ray and generation: a one-dimensional current algebra along each generator, not the
    four-dimensional Yang-Mills field.

    (8 November, current algebra.) The Standard Model algebra acts on the sixteen channels of a light ray inside
    the $\mathfrak{u}(16)$ pair currents, with no generator mixing the two chiralities, and $\mathfrak{su}(3)$,
    $\mathfrak{su}(2)$ and hypercharge are at level $4$ relative to the five-mode trace form
    (\claimref{synthesis.standard-model-currents-of-the-sixteen-channels-levels-and-window-sugawara-split}). One
    generation's energy along the light ray is exactly the $\mathfrak{so}(10)$ Sugawara energy at level $4$ plus the
    number term on every window, $c = 15 + 1 = 16$
    (\claimref{synthesis.window-energy-of-one-generation-is-exactly-the-so10-sugawara-energy}); the Standard Model
    factors' parts leave a remainder of central value $52/7$, on localised vectors, with the Virasoro relations not
    derived. These currents see the linear (mixed gravitational) anomaly condition, $\mathrm{tr}\,Y = 0$, but no
    quadratic trace sees the cubic conditions: of the eight particle-antiparticle splittings with $\mathrm{tr}\,Y = 0$
    only two are anomaly-free
    (\claimref{synthesis.light-ray-gauge-currents-of-a-generation-do-not-see-its-anomaly-cancellation}). This is a
    current algebra along each generator, not the four-dimensional Yang-Mills field.

    (8 November, colour lattice.) Colour rotors are the rotors of the $e_{3}, \dots, e_{8}$ block fixing a pure-spinor
    idempotent (one condition for $J$-commutation and unit determinant); the triplet character is
    $4(\langle R\rangle_{0} + \langle R\rangle_{6}) - 1$, so Wilson's weight is the scalar part of the plaquette rotor
    with $\beta = 6/g^{2}$. On a finite lattice the centre $Z_{3}$ forces a flux chain on every surviving term: no
    rectangular fundamental loop has a term below order $A$, its leading term is $(\beta/18)^{A}$; Polyakov lines vanish
    at every $\beta$, a pair and a baryonic junction have leading terms $\tfrac19(\beta/18)^{N_{t}r}$ and
    $\tfrac1{27}(\beta/18)^{3N_{t}}$; the connected plaquette correlator has leading term $\tfrac1{18}(\beta/18)^{4t}$,
    a leading decay rate $4\ln(18/\beta)$ per time step at fixed $t$ (a gap uniform in $t$ is argued, not proved)
    (\claimref{synthesis.colour-centre-flux-bounds-polyakov-lines-and-the-leading-glueball-tube}). A centreless finite
    subgroup of order $96$ has the Haar averages through link degree three and differs at degree four, so every
    strong-coupling term of link degree at most three is the same for it and for $SU(3)$, while a finite group freezes
    at weak coupling (argued): strong-coupling data decide neither confinement nor a continuum gap
    (\claimref{synthesis.a-finite-subgroup-of-colour-shares-its-strong-coupling-expansion-through-link-degree-three}).
    With colour triplets the fundamental loop has a perimeter law at infinite coupling (exactly for frozen triplets, at
    leading hopping order for Wilson quarks), as the weak factor with doublets
    (\claimref{synthesis.colour-triplets-give-the-fundamental-colour-loop-a-perimeter-law-at-strong-coupling}). No stored
    premise gives the gauge field a lattice spacing on flat spacetime, and no stored gap is a spectral gap of the
    four-dimensional gauge field. All of this is strong-coupling lattice physics in geometric-algebra form; it does not
    bear on the Yang-Mills existence and mass-gap problem, which lives in the weak-coupling continuum limit.

    (9 November.) Virasoro relations: on the band of the null vacuum each gauge factor's Sugawara modes
    $L^{\mathfrak{f}}_{n}$, for all $n$, shift its currents and satisfy the Virasoro relations with $c =
    2\dim\mathfrak{f}/(2 + \lambda)$, giving $\tfrac{32}{7}$, $2$, $1$, $1$; the band energy has $c = 16$, and
    the remainder commutes with the factors and is a Virasoro algebra at $c = \tfrac{52}{7}$, the coset of
    $\so(10)$ at level $4$ by the gauge algebra, all unitary; on a finite window the relations cannot hold, so
    the statement is on the band domain only
    (\claimref{synthesis.gauge-factor-sugawara-parts-satisfy-virasoro-relations-on-the-band}). Higgs-sector
    BRST: with the two doublets as even elements of $\Cl(3,0)$, weak bivectors acting on the left and
    hypercharge on the right, $sh = -g\rho(c)(v + h)$ extends the stored differential nilpotently for every
    vacuum; the 't Hooft gauge-fixing fermion is exact and cancels the vector-Goldstone mixing up to a total
    derivative, and at $\xi = 1$, with the canonical normalisation of the Yang-Mills term and at a stationary
    vacuum, vectors, Goldstones and ghosts share one mass matrix, of rank $3$ for the neutral aligned vacuum
    (\claimref{synthesis.field-level-brst-of-the-two-doublets-and-the-thooft-feynman-gauge}). The free part of
    the scalar differential, the one the quartet construction quantises, is a symmetry of the quadratic action
    only at a stationary point of the potential; the Goldstone rank of two doublets is $3$ exactly for aligned
    doublets; two gauge-invariant quartics differing in the sign of one coupling have their global minima on
    the neutral and on a charge-breaking pattern with the BRST structure intact in both (classical two-doublet
    physics, in geometric-algebra form); so BRST does not fix the breaking pattern, the potential does, and on
    the rung field's lift locus the stored D-term vacuum lies on the charge-preserving boundary, where the
    rank is $3$, a corollary of stored clauses
    (\claimref{synthesis.higgs-sector-brst-does-not-fix-the-breaking-pattern-of-two-doublets}). All of this is
    free and perturbative.
  attack:
    - "The interacting charge: the operator BRST charge of the interacting theory on the Krein space (renormalisation and the Slavnov-Taylor identities, for example in causal perturbation theory, where the local construction is imported for electrodynamics and Yang-Mills), and positivity of its physical space under Kugo and Ojima's hypotheses."
    - >-
      Higgs-sector BRST in the interacting theory: the free differential with the Goldstone and doublet terms, the
      't Hooft gauge and the common masses at a stationary vacuum are stored, and the breaking pattern is an output
      of the potential, not of BRST (9 November;
      \claimref{synthesis.field-level-brst-of-the-two-doublets-and-the-thooft-feynman-gauge},
      \claimref{synthesis.higgs-sector-brst-does-not-fix-the-breaking-pattern-of-two-doublets}). What remains is
      the scalar sector in the interacting BRST charge (with the first item), at a stationary vacuum of the series'
      own potential, and the pattern that potential selects beyond the D-term case.
    - "Colour beyond strong coupling: the colour rotor lattice is stored at strong coupling only (centre bound, Polyakov lines, leading tube, string breaking with triplets at infinite coupling). Its continuum limit needs beta -> infinity (asymptotic freedom), which no stored result reaches. The series' colour sector has quark triplets, so its physical question is the one with quarks (string breaking, no Wilson-loop order parameter), as in QCD; pure-colour confinement and the mass gap of pure Yang-Mills (the Clay problem) are a different question and are not addressed."
    - "The weak factor on the lattice: the phase structure of the rotor lattice with the two doublets beyond strong coupling, and its continuum limit."
    - >-
      The current algebra along generators: compute the embedding of the Standard Model gauge algebra in the
      exact $\mathfrak{u}(16)$ channel currents per light ray, its level, and what the Sugawara form gives for
      its dynamics along a generator.
    - >-
      Done on the band domain (9 November;
      \claimref{synthesis.gauge-factor-sugawara-parts-satisfy-virasoro-relations-on-the-band}): the
      Virasoro relations of the gauge factors' Sugawara parts and of the remainder hold there, so their central
      values ($32/7$, $2$, $1$, $1$ and the remainder $52/7$) are central charges in the full sense on the band; on
      finite windows they cannot hold.
  success: >-
    Interacting non-abelian gauge fields with a consistent gauge fixing (or a
    gauge-invariant non-perturbative definition) and a positive physical space,
    with the scalar sector's BRST included, or a proof that the series cannot
    carry them.
  entities: [synthesis.field-level-brst-differential-of-the-derived-gauge-fields-is-nilpotent, synthesis.quartet-homotopy-makes-gluon-and-massive-vector-physical-states-positive-at-every-number-of-quanta, synthesis.non-abelian-gauge-fixing-has-gribov-copies-and-the-weak-rotor-lattice-with-doublets-has-a-perimeter-law, synthesis.clifford-conjugation-is-the-twistor-adjoint-and-its-trace-form-is-the-one-particle-gupta-bleuler-form, synthesis.krein-form-premise-indefinite-inner-product-for-gauge-fields, synthesis.self-adjoint-brst-charge-needs-a-krein-form-and-the-tower-supplies-the-ghosts, synthesis.weak-factor-rotor-lattice-strong-coupling-area-law, standard-model.gauge-algebra-minimal-massive-composite, synthesis.colour-centre-flux-bounds-polyakov-lines-and-the-leading-glueball-tube, synthesis.a-finite-subgroup-of-colour-shares-its-strong-coupling-expansion-through-link-degree-three, synthesis.colour-triplets-give-the-fundamental-colour-loop-a-perimeter-law-at-strong-coupling, synthesis.gauge-factor-sugawara-parts-satisfy-virasoro-relations-on-the-band, synthesis.field-level-brst-of-the-two-doublets-and-the-thooft-feynman-gauge, synthesis.higgs-sector-brst-does-not-fix-the-breaking-pattern-of-two-doublets]
  added: 2026-11-01

- id: op.qft-bosons-and-the-rung-field
  title: Elementary bosons and the quantised rung (Higgs) field
  area: quantum-fields
  kind: research
  difficulty: substantial
  status: partial
  source: "The review of what a quantum field theory still needs, 1 November; the linear rung field, the odd rung modes, the pairing gap and the locality results, and Leon's decision recording the Higgs as the elementary linear field with two doublets, 1 November; the B-mixing, quartic-running, doublet-count and induced-gravity results and Leon's decisions of 2 November (the transmutation branch excluded under the coupling reading, the branch with a level the working branch, the curvature coupling of the doublets an open datum)"
  statement: >-
    The tower has no CCR pair, so every elementary boson must come from the
    palatial (polynomial) storey, as the photon does; composite bosons exist
    only at mean field (\claimref{field-theory.composite-scalars-mean-field-level}).
    The rung field has a classical D-term action
    (\claimref{synthesis.rung-field-d-term-action-and-tree-masses-on-the-lift-locus}).
    Quantise the rung field (its charged pair and neutral components) on the
    working branch, the branch with a level, and decide whether the Higgs is
    elementary (palatial) or composite (tower).
  why: >-
    The Higgs mechanism in the store is classical; the scalar sector's quantum
    corrections (the hierarchy problem's arena) are absent.
  known: >-
    The tower's pair operators reach the CCR only as $n \to \infty$ on bounded boson number
    (\claimref{field-theory.how-close-tower-comes-ccr}). The rung field is recorded as elementary:
    quantised with $i = I_{4}$ as an elementary field it is the linear field on all eight components
    of the complexified rung summand, two doublets of hypercharge $\tfrac12$, with a neutral normal
    pair beside the stored neutral mode and charged pair
    (\claimref{synthesis.linear-rung-field-has-a-neutral-normal-pair-in-the-scalon-sum}). The count
    of two doublets is a reading: a field valued in one doublet is pure gauge on the null-lift
    locus, so two doublets follow only from the exact null-lift constraint, the Higgs taken exactly
    as the rung unit and a linear field; at any finite constraint coupling one doublet reproduces
    the rung-unit direction to relative order $H^{2}/v^{2}$, about $10^{-88}$, and the limit $k_{10}
    \to \infty$ lies outside perturbation theory
    (\claimref{synthesis.one-doublet-field-is-pure-gauge-on-the-null-lift-locus-so-two-doublets-need-the-exact-constraint}).
    The transmutation branch (marked, 2 November 2026). Under the Gildener-Weinberg formula and
    decoupling the normal pair enters the scalon sum, so the charged pair lies below $456$ GeV and
    the normal pair below $542$ GeV
    (\claimref{synthesis.linear-rung-field-has-a-neutral-normal-pair-in-the-scalon-sum};
    \claimref{synthesis.transmutation-of-the-rung-field-needs-a-charged-pair-near-450-gev}). Under
    the decided coupling reading, the $\su(2)_{R}$-covariant completion with complex symmetric
    family matrices (the rung $10$), the normal pair then couples down quarks through
    $\sqrt2V^{\dagger}\hat{M}_{u}V^{*}/v$, and this branch is recorded as excluded, by three
    independent strikes: (1) $h \to \gamma\gamma$: the stored bound $\mu_{\gamma\gamma} < 0.900$
    lies $3.3$ standard deviations below the Particle Data Group 2026 average $1.10 \pm 0.06$
    (pdglive node S126SGG, read on 2 November 2026); (2) $B$-meson mixing: tree-level exchange of
    the neutral normal pair, below $542$ GeV on this branch, exceeds the measured $B_{s}$ and
    $B_{d}$ mass differences more than $50$ times for every splitting of its two masses, with quark
    mixing from tree-level determinations and unitarity
    (\claimref{synthesis.covariant-rung-coupling-gives-the-normal-pair-tree-level-b-meson-mixing-that-excludes-the-transmutation-branch});
    (3) strong coupling: on the scalon-sum surface the quartics reach $4\pi$ between about $0.8$ and
    $4$ TeV at one loop
    (\claimref{synthesis.rung-field-quartics-run-to-strong-coupling-within-a-few-tev-on-the-transmutation-branch}).
    The stored results stand as statements under their hypotheses, with dated notes recording the
    exclusion. The one-loop running of all ten quartics is the standard two-doublet system under an
    explicit dictionary, the two-loop pure-quartic part is exact, and $m_{h}^{2} =
    4v^{2}\beta_{k_{2}}$ is the stored scalon sum; the gauge terms hold under the Krein premise
    (\claimref{synthesis.rung-field-quartics-run-to-strong-coupling-within-a-few-tev-on-the-transmutation-branch}).
    The working branch is the branch with a level: there the normal masses $2W' + 4N(k_{10} \pm r)$
    are free, and $B$ mixing requires the normal pair at about $2.5$ TeV or more with conservative
    inputs and no QCD running (about $3.5$ TeV with central inputs); with perturbative quartics,
    $|k_{10} \pm r| \le \pi$, the charged pair is heavy too (argued)
    (\claimref{synthesis.covariant-rung-coupling-gives-the-normal-pair-tree-level-b-meson-mixing-that-excludes-the-transmutation-branch}(iv)).
    So the second doublet is heavy, about $2.5$ to $3.5$ TeV, and the low-energy content is one
    doublet; the chain's one doublet below $M_{I}$ is not recomputed with the second doublet above a
    few TeV (note on \claimref{standard-model.chain}). The curvature coupling $\xi_{R}$ of the
    doublets is an open datum: a renormalisation datum in the covariant scheme, which the store does
    not fix; the induced Einstein-Hilbert coefficient of the weak-scale content is $8(1 - 6\xi_{R})$
    in the Feynman gauge
    (\claimref{synthesis.krein-quartet-drops-from-the-induced-einstein-hilbert-coefficient-only-under-a-regulator-that-treats-it-alike}).
    The rung field is odd in the tower and its modes carry no even doublet
    (\claimref{synthesis.rung-field-is-odd-in-the-tower-and-its-modes-carry-no-even-doublet}), and
    with a positive norm an elementary local rung scalar is palatial
    (\claimref{synthesis.locality-of-the-attached-free-fields-fixes-their-statistics}). For a
    one-species, single-shell tower composite the pair-breaking threshold is twice the quasiparticle
    energy, which excludes the top quark as sole constituent; a light composite of several species
    is not excluded, so the Higgs is elementary as recorded, argued rather than proved
    (\claimref{synthesis.tower-pairing-gap-at-fixed-charges-is-twice-the-quasiparticle-energy}).

    (8 November.) Beyond mean field the tower now has exact composite bosons: the density waves of a
    generator's filled sea are canonical pairs there, with the unit the kernel bivector
    (\claimref{synthesis.fluctuation-forms-of-the-tower-and-density-wave-bosons-of-the-null-vacuum},
    \claimref{synthesis.kernel-bivector-is-the-unit-of-hermitian-boson-fields-on-the-tower}), the fluctuation
    states of product block states converge to the Gaussian state at rate $N^{-1/2}$
    (\claimref{synthesis.central-limit-of-tower-fluctuation-states-with-the-kernel-unit}), and their dynamics is
    the window Sugawara form with linear dispersion, gapless also with a Luttinger coupling
    (\claimref{synthesis.exact-window-sugawara-identity-and-luttinger-normal-modes-of-tower-density-waves}).
    These exact pair bosons have helicity $0$; helicity-one pair modes are quasi-spins, not bosons
    (\claimref{synthesis.helicity-one-pair-modes-on-a-null-generator-are-quasi-spins}), which is why the photon
    stays elementary (\claimref{synthesis.null-plane-photon-data-and-the-pair-currents-of-the-generators}). That
    obstruction does not touch a helicity-zero scalar, but the pair bosons are even while the rung field is odd
    in the tower, so no pair boson is the rung field; what a composite Higgs would still need is a gap and a
    charged doublet, and channel-resolved pair densities can carry a canonical pair
    (\claimref{synthesis.density-modes-bosonise-only-along-one-null-direction}).

    (8 November, composite doublet.) A composite doublet is allowed by parity: an even doublet needs an odd
    number of singlet fermion factors, the simplest a doublet-singlet bilinear, and when its channel matrix
    squares to zero its pair modes on a null generator are quasi-spins, not exact bosons
    (\claimref{synthesis.even-composite-doublet-needs-a-singlet-constituent-and-its-pair-modes-are-quasi-spins}).
    For pairing-type elements a finite Goldstone bound holds at every size: a condensate's uniform pair channel
    lies within $2G$ of the ground state, a rotor, not a gapped boson
    (\claimref{synthesis.uniform-pair-channel-of-a-tower-condensate-is-a-goldstone-rotor}). On the symmetric band of
    a two-species floor the doublet pair mode is a gapped composite doublet, even, of isospin $\tfrac12$, bound
    below pair breaking with gap $\omega_{D}$, which closes exactly where the band's doublet condenses; the band
    need not hold the floor's ground state, and the condensed phase has further levels below threshold
    (\claimref{synthesis.two-species-floor-pairing-has-a-gapped-doublet-pair-mode-that-closes-where-it-condenses}).
    So no model here gives a doublet vacuum value together with a gapped doublet, and the elementary reading of
    the Higgs stands (argued); coupled condensates and the off-band ground states are not covered.
  attack:
    - "The branch with a level: the one-loop effective potential and the running of the linear field with a level, a second doublet near 2.5 to 3.5 TeV and perturbative quartics; the charged pair's mass and the alignment of the light doublet."
    - "The coupling reading: whether the series fixes the family matrices of the covariant completion as complex symmetric (the rung 10), under which the transmutation branch is excluded, or admits general matrices, where a tuned right-handed mixing could evade the B-mixing bound at the price of |m_H^2 - m_A^2|/m^2 of order 1e-5."
    - "The curvature coupling xi_R of the doublets, an open datum: whether anything in the series fixes it, and its running."
    - "Collider and flavour limits on the second doublet of the level branch (B and K mixing with QCD running, direct searches)."
    - "The light multi-species composite: two-condensate pairing on the tower (a doublet-singlet fermion condensate), the one composite route left open."
    - >-
      A gapped composite scalar with today's exact boson results: whether a two-condensate pairing on the tower
      gives an even doublet of helicity-zero pair bosons with a gap, and its charge.
    - >-
      (Low priority.) Prove the spectrum of the pair sum of the two-species floor for every number of blocks
      (computed exactly for up to six), through the duality between block rotations and flavour rotations, so
      that the lowest doublet level of the band is a theorem at every size.
  success: >-
    A quantised rung field on the branch with a level, with its one-loop effective potential
    computed in the formalism and a second doublet consistent with flavour and collider limits, or a
    proof it must be composite.
  entities: [synthesis.linear-rung-field-has-a-neutral-normal-pair-in-the-scalon-sum, synthesis.covariant-rung-coupling-gives-the-normal-pair-tree-level-b-meson-mixing-that-excludes-the-transmutation-branch, synthesis.rung-field-quartics-run-to-strong-coupling-within-a-few-tev-on-the-transmutation-branch, synthesis.one-doublet-field-is-pure-gauge-on-the-null-lift-locus-so-two-doublets-need-the-exact-constraint, synthesis.transmutation-of-the-rung-field-needs-a-charged-pair-near-450-gev, synthesis.rung-field-d-term-action-and-tree-masses-on-the-lift-locus, synthesis.tower-pairing-gap-at-fixed-charges-is-twice-the-quasiparticle-energy, synthesis.rung-field-is-odd-in-the-tower-and-its-modes-carry-no-even-doublet]
  added: 2026-11-01

- id: op.qft-on-gtg-fields
  title: The field theory on a general gravitational gauge field
  area: quantum-fields
  kind: research
  difficulty: frontier
  status: open
  source: "The review of what a quantum field theory still needs, 1 November; the attachment-transport, flat-null-plane and twistor-flat results and Leon's decisions (the Hadamard scaling-limit premise), 1 November; the deposit-state results and Leon's decisions (the Hadamard deposit premise), 1 November; the Hadamard scaling results and Leon's decisions of 2 November ((HS) restated as a statement about the field); the Hadamard scaling-bound results and Leon's decisions of 2 November ((HS) retired to a theorem)"
  statement: >-
    The twistor attachment supplies the mode space where the field is
    conformally flat (\claimref{field-theory.twistor-attachment}); on a general
    field with arbitrary $\hb$ and $\Omega$ the store has no construction of
    the one-particle space, and the state space rests on the premise that
    the series' states are Hadamard, now supplied by the adopted Hadamard
    deposit premise (HD) (\claimref{synthesis.hadamard-deposit-premise}) with
    the propagation of the Hadamard form, and which with the scaling-limit
    theorem (HS) (\claimref{synthesis.hadamard-scaling-limit-premise}), a premise until
    2 November, gives the consequence of the generator analogue of the Hadamard condition
    at each point, the local form of (N$_{+}$)
    (\claimref{synthesis.microlocal-condition-on-a-generator-gives-the-local-null-ground-state}).
    Construct the field theory on a general gravitational gauge field, or
    show which datum the series must add.
  why: >-
    The series' distinctive structure (the attachment, the horizon states)
    has to work beyond flat space for the horizon results to rest on a field
    theory rather than on premises.
  known: >-
    The ground does not attach the modes
    (\claimref{field-theory.ground-does-not-attach-modes}); local quasi-equivalence
    of Hadamard states is imported
    (\claimref{synthesis.imported-local-quasi-equivalence-of-hadamard-states}).
    The attachment's transport is flat only where the Weyl curvature
    vanishes: the subspace of conformal spinors annihilated by the tractor
    field strength has complex dimension 4, 2 and 0 at points of Petrov type
    O, N and the other types, the integrability condition of the twistor
    equation (Fact
    \claimref{synthesis.imported-twistor-equation-integrability-petrov-n-or-o}),
    and no conformal-energy generator commutes with a nonzero Weyl curvature;
    so off conformally flat regions the attachment's tractor transport
    supplies no state, other constructions not excluded
    (\claimref{synthesis.attachment-transport-is-flat-only-where-weyl-vanishes}).
    The field algebra itself exists: on every field with a globally
    hyperbolic derived metric the Dirac CAR algebra satisfies a generalised
    form of the Haag-Kastler axioms (Fact
    \claimref{synthesis.imported-dimock-dirac-car-algebra-on-a-gravitational-field}).
    On the flat field every gauge-invariant quasi-free Hadamard Dirac state
    restricts on every null plane to a state satisfying the generator
    microlocal condition, the vacuum of every mass to the null vacuum, hence
    the local form of (N$_{+}$) at every point of every local Rindler horizon
    (\claimref{synthesis.bulk-hadamard-states-restrict-to-the-generator-condition-on-flat-null-planes}). At points of
    nonzero field strength the bulk scaling limit is a theorem: such states
    scale to the flat field's massless vacuum at every point of every
    globally hyperbolic field, for every mass, in any gauge with
    $\hb(x_{0}) = 1$ (standard, Sahlmann and Verch;
    \claimref{synthesis.hadamard-dirac-states-scale-to-the-flat-massless-vacuum-at-every-point-of-a-gravitational-field}).
    On the generators of a null hypersurface the field strength, the
    expansion and the shear cancel from the coefficient of the leading null
    singularity of the restricted kernel, which is the null vacuum's at
    leading order, and Hadamard states differ there by smooth kernels
    (\claimref{synthesis.field-strength-cancels-from-the-leading-null-singularity-of-hadamard-dirac-states-on-null-hypersurfaces}).
    (HS) (\claimref{synthesis.hadamard-scaling-limit-premise}), restated on
    2 November as a statement about the field (the Dirac Hadamard
    parametrix restricted to the generators of every local Rindler horizon
    through the point, minus its null-vacuum term, has generator scaling
    degree below one), is now a theorem. (Marked, 2 November, later.) (HS) is now a theorem
    (\claimref{synthesis.hadamard-scaling-limit-premise}, version 4): the remainder bound it
    posed is proved for the epsilon-regularised restriction
    (\claimref{synthesis.restricted-dirac-hadamard-parametrix-on-a-null-hypersurface-is-the-null-vacuum-plus-a-bounded-kernel}),
    the flux contraction of the Dirac current gives the restriction of every
    state to the generators with no characteristic Cauchy problem
    (\claimref{synthesis.dirac-states-restrict-to-null-hypersurfaces-through-the-flux-contraction-and-are-thin-layer-limits-under-the-generator-car}),
    and the causal propagator gives the generator anticommutation relations
    on every geodesic null hypersurface
    (\claimref{synthesis.dirac-causal-propagator-between-nearby-null-leaves-tends-to-the-generator-car-on-every-geodesic-null-hypersurface});
    so every gauge-invariant quasi-free Hadamard Dirac state of any mass has
    the null vacuum as its generator scaling limit at every point of every
    local Rindler horizon, whatever the field strength, and the local form
    of (N$_{+}$) now rests on (HD) and the propagation of the Hadamard form
    only (given the radiation-type descent). The ground-state clause of
    (N$_{+}$) and (Loc) are still open. It
    reduces the open generator premise, for the local form, to the series'
    states being Hadamard. Neither gives the ground-state clause or selects a
    state. The missing datum is the state: no locally covariant choice of
    state exists (Hollands and Wald; a model-independent theorem of Fewster
    and Verch), so a field theory on a general field needs a state as an
    additional datum. The state class (1 November): it is the adopted
    premise (HD) (\claimref{synthesis.hadamard-deposit-premise}): the
    descent's deposited state is Hadamard on a Cauchy collar of the descent,
    the occupation profile over an admissible reference vacuum staying free
    data; with the propagation of the Hadamard form for the scalar field
    (\claimref{synthesis.imported-propagation-of-hadamard-form}) and the Dirac
    field
    (\claimref{synthesis.imported-dirac-hadamard-form-propagates-and-adiabatic-states-are-hadamard})
    the deposit is Hadamard on every later field in the domain of dependence
    of the collar, Weyl-curved regions included, and its Dirac stress tensor
    is defined
    (\claimref{synthesis.imported-renormalised-stress-tensor-of-hadamard-dirac-states}).
    On Weyl-flat fields the conclusion of (HS) on the generators is a
    theorem for the massless Dirac field at the leading order at which local
    Rindler horizons are defined
    (\claimref{synthesis.weyl-flat-fields-need-no-scaling-limit-premise-and-robertson-walker-generators-see-the-schwarzian};
    its bulk part is subsumed by the bulk theorem above); the Weyl-curved
    and massive cases are covered by the theorem (HS). The state itself, which profile is deposited, is still the
    missing datum (op.deposit-state-is-hadamard).
  attack:
    - "A Hadamard state on a field with nonzero Weyl curvature, derived from a construction of the series other than the attachment's tractor transport, or imported (with the existence results for Hadamard states on globally hyperbolic fields)."
    - "Derive the adopted premise (HD) that the descent's deposit is Hadamard, by selecting its occupation profile over an admissible reference vacuum (shared with op.deposit-state-is-hadamard); given (HD), the local form of (N+) already follows on every local Rindler horizon, by the scaling-limit theorem (HS)."
  success: >-
    A mode space and state class on a general field, with the Hadamard
    property derived, or a named additional datum.
  entities: [synthesis.attachment-transport-is-flat-only-where-weyl-vanishes, synthesis.bulk-hadamard-states-restrict-to-the-generator-condition-on-flat-null-planes, synthesis.hadamard-scaling-limit-premise, synthesis.microlocal-condition-on-a-generator-gives-the-local-null-ground-state, synthesis.imported-dimock-dirac-car-algebra-on-a-gravitational-field, synthesis.hadamard-deposit-premise, field-theory.twistor-attachment, synthesis.weyl-flat-fields-need-no-scaling-limit-premise-and-robertson-walker-generators-see-the-schwarzian]
  added: 2026-11-01

- id: op.einstein-from-the-field-theory
  title: Einstein's equations as consistency conditions of one algebra holding the gravitational and matter fields
  area: einstein
  kind: research
  difficulty: frontier
  status: open
  source: "Leon's aim of 22 October (a field theory from the series' own objects that yields Einstein's equations) and the review of 1 November; the twistor-flat, induced-gravity and attachment-transport results and Leon's decision naming the whole-stress clause, 1 November; the Weyl-flat channel, induced-gravity and Krein-quartet results and Leon's decisions of 2 November (the clause recorded as: the trace-free stress is a source)"
  statement: >-
    Einstein's equations come from Clausius with (C$_{\mathrm{loc}}$), (N$_{+}$)
    and (Loc) (\claimref{synthesis.einstein-equations-from-c-loc-and-clausius}),
    or from the imported action with the field-space postulate
    (\claimref{synthesis.field-space-premise-parallel-frozen-point}); neither
    derives them from the field theory. Without quantising gravity (the
    gravitational and quantum sides are one geometric object), find one
    algebra holding $\hb$, $\Omega$ and the matter fields whose consistency
    conditions are the field equations, or show none exists among the
    series' objects. Any field-theory route to Einstein's equations has as
    one of its clauses that the trace-free stress is a source (the
    whole-stress clause, recorded on 2 November in this form: the
    gravitational field is varied off the Weyl-flat class); a route must
    derive that clause or state it. It is a clause of the routes, not a
    postulate of the store.
  why: >-
    It is the series' founding aim; the present routes rest on premises.
  known: >-
    The operator Newtonian coupling gives the registered entangling phase
    (\claimref{field-theory.operator-newtonian-coupling}); the field-space premise is independent
    (settled negative on 1 November). Consistency alone does not select Einstein's equations: on the
    twistor-flat fields (vanishing Weyl curvature, the attachment's domain) Nordstr\"om's equations,
    sourced by the stress trace alone, satisfy the Bianchi identities, the conservation of the
    stress, second order and the Newtonian limit, while Einstein's equations there admit no perfect
    fluid whose density varies on its rest spaces and no vacuum field but constant curvature
    (\claimref{synthesis.twistor-flat-fields-give-nordstrom-not-einstein}; Nordstr\"om's theory is
    excluded by observation, Fact
    \claimref{synthesis.imported-nordstrom-scalar-theory-einstein-fokker-form}). The whole-stress
    clause (the whole stress map, not its trace, is the source) with Lovelock's theorem does select
    them (Fact \claimref{synthesis.imported-lovelock-and-anderson-duchamp-natural-lagrangians}); it
    is named as a clause of any field-theory route, and the Clausius route assumes it through
    $T(k,k)$ for every null $k$ (note on
    \claimref{synthesis.einstein-equations-from-c-loc-and-clausius}). Induced gravity with the
    attachment's modules as the vacuum and a smooth cut-off on conformal energy gives the standard
    Sakharov weights (Fact \claimref{synthesis.imported-sakharov-induced-gravity-coefficients}),
    which cancel at three separate generations of sixteen Weyl fields under this frame-dependent
    cut-off, defined only on Weyl-flat fields; reading the cancelled term as the induced
    Einstein-Hilbert term is argued, so the route supplies no $G$
    (\claimref{synthesis.attachment-modules-give-sakharov-weights-cancelling-at-three-separate-generations}).
    Einstein's sources (isolated stars, the Schwarzschild field, gravitational waves) lie outside
    the attachment's domain, where its transport supplies no state
    (\claimref{synthesis.attachment-transport-is-flat-only-where-weyl-vanishes}). (Marked, 2
    November 2026.) The whole-stress clause is the trace-free channel: at each non-null momentum the
    displacement-closed, Lorentz-invariant classes of first-order variations of $\hb$ are exactly
    four (gauge, the Weyl-flat class, the scalar-flat class, all), more at null momentum; Weyl-flat
    variations carry only the stress trace, null fluxes $T(k,k)$ are exactly the trace-free channel
    and with conservation fix the source up to a multiple of the identity (the unimodular
    mechanism), and at first order, with an action and minimal coupling, the clause holds exactly
    when $\hb$ is varied off the Weyl-flat class; it is not derived from displacement gauge
    invariance, and massless matter does not gravitate at first order within the Weyl-flat class
    (classically)
    (\claimref{synthesis.weyl-flat-variations-carry-only-the-stress-trace-and-the-whole-stress-clause-is-the-trace-free-channel}).
    It is recorded here as the clause that the trace-free stress is a source, not as a postulate.
    Induced gravity gives no $G$ without a fit: with a proper-time cut-off $\Lambda$, in the Feynman
    gauge, $1/G = [B\Lambda^{2} - \sum wm^{2}\ln(\Lambda^{2}/m^{2})]/(12\pi)$; for the weak-scale
    content $B = 8(1 - 6\xi_{R})$ and for the chain's Pati-Salam content under (S) $B = -36$ plus
    the scalars' weights; the logarithmic remainder is repulsive only if the weak-scale content
    alone lies below the cut-off, its sign not fixed by the store under (S); where $B > 0$ matching
    $G$ fixes the cut-off, a fit
    (\claimref{synthesis.series-content-induces-a-newton-coupling-only-through-an-unfixed-cut-off}).
    The quadratic coefficient depends on the regulator and the gauge: under the Krein premise the
    quartet drops level by level under an energy cut-off on the Einstein static field, but under a
    covariant heat-kernel cut-off a vector's weight is $\alpha - 5$, so the content induces
    $12(\alpha - 1) + 8(1 - 6\xi_{R})$
    (\claimref{synthesis.krein-quartet-drops-from-the-induced-einstein-hilbert-coefficient-only-under-a-regulator-that-treats-it-alike}).
    The doublets' curvature coupling $\xi_{R}$ is an open datum.
  attack:
    - "The state on Weyl-curved fields: a Hadamard state where the Weyl curvature is nonzero, derived or imported, from which the renormalised stress, the source, can be built (shared with op.qft-on-gtg-fields)."
    - "The trace-free channel: derive from the series' field theory that the trace-free stress is a source, that is, that the gravitational field is varied off the Weyl-flat class, or show that clause independent of the series' premises."
    - "Induced gravity without a fit: a series datum fixing the cut-off in Planck units, together with the doublets' curvature coupling xi_R (an open datum) and the gauge on which the quadratic coefficient depends."
    - "The modular flow of the matter field theory as the source of (N+) and (Loc)."
  success: >-
    Einstein's equations from the field theory's consistency with fewer
    premises than the present routes, or a proof that no algebra of the
    series' objects does it.
  entities: [synthesis.einstein-equations-from-c-loc-and-clausius, synthesis.weyl-flat-variations-carry-only-the-stress-trace-and-the-whole-stress-clause-is-the-trace-free-channel, synthesis.series-content-induces-a-newton-coupling-only-through-an-unfixed-cut-off, synthesis.krein-quartet-drops-from-the-induced-einstein-hilbert-coefficient-only-under-a-regulator-that-treats-it-alike, synthesis.twistor-flat-fields-give-nordstrom-not-einstein, synthesis.attachment-modules-give-sakharov-weights-cancelling-at-three-separate-generations, synthesis.imported-lovelock-and-anderson-duchamp-natural-lagrangians, synthesis.field-space-premise-parallel-frozen-point]
  added: 2026-11-01

- id: op.qft-structural-inputs
  title: Three generations, the Higgs doublet and spin-statistics as inputs of the field theory
  area: quantum-fields
  kind: research
  difficulty: frontier
  status: partial
  source: "The premise ledger and the review of what a quantum field theory still needs, 1 November; the locality, modular-period and faces results and Leon's decisions on spin and statistics, the doublet count and the face identification, 1 November; the causal spin-statistics, wedge-reflection, generation-number and doublet-count results and Leon's decisions of 2 November; the 9 November results and Leon's decisions; the capacity and induced-gravity result and Leon's decisions of 9 November (second pass); the mass-term and order-four results accepted 10 November and Leon's decision of 9 November on the gauge parameter"
  statement: >-
    The field theory takes three generations, one Higgs doublet and
    spin-statistics (imported via the Jost point,
    \claimref{field-theory.imported-standard-field-theory}) as inputs.
    Derive any of them from the series' field theory, or show each is
    independent of its premises.
  why: >-
    The ledger counts these among the structural choices on which the series
    is not more economical than the Standard Model.
  known: >-
    Spin and statistics: for the attached free fields (scalar, spinor, photon) the statistics follow
    from locality with a positive norm, given the massless two-point function, so the Jost-point
    import is needed only for interacting fields; with an indefinite (Krein) form a CAR scalar is
    local, the ghost case
    (\claimref{synthesis.locality-of-the-attached-free-fields-fixes-their-statistics}). The KMS
    condition at period $2\pi$ of (N$_{+}$) and (R$_{\mathrm{loc}}$) holds for CAR and CCR modes
    alike and does not fix statistics; modular covariance of the wedge algebras would, through the
    Guido-Longo theorem, and is not a premise of the store
    (\claimref{synthesis.modular-period-on-values-is-the-dual-plane-turn},
    \claimref{synthesis.imported-free-field-spin-statistics-and-guido-longo-theorem}). Generations:
    read in one state space the three faces of the three-spinor composite are not three generations
    under one gauge group (at most one face is a weak doublet; their chirality halves span $28$
    states with a shared pair system, $46$ to $47$ with separate pair modes, of the $48$ needed), so
    the face identification (\claimref{families.three-generations-faces-maximal-composite}) is
    restated as three composites with separate slots
    (\claimref{synthesis.faces-of-one-slot-space-are-not-three-generations-under-one-gauge-group}).
    Doublets: the rung field is recorded as the elementary linear field with two doublets
    (\claimref{synthesis.linear-rung-field-has-a-neutral-normal-pair-in-the-scalon-sum}); the
    generation and doublet counts $n_{g}$, $n_{h}$ enter the one-loop coefficients as inputs
    (\claimref{synthesis.one-loop-running-coefficients-from-spacetime-algebra-spin-traces}).
    (Marked, 2 November 2026.) Spin and statistics for interacting fields: in causal perturbation
    theory, with time-ordered products that are graded symmetric, parity preserving, causal, obey
    the Wick expansion and are covariant under the covering group (an assumption), and the free
    Feynman-gauge potential in its indefinite form, every interacting field with an even number of
    ghost factors keeps the spin-statistics connection to every order
    (\claimref{synthesis.interacting-fields-of-causal-perturbation-theory-keep-the-spin-statistics-connection-at-even-ghost-number});
    so the Jost-point import is needed only beyond perturbation theory (note on
    \claimref{field-theory.imported-standard-field-theory}). Beyond it, Kuckert's modular P$_{1}$CT
    symmetry with the spectrum condition would give the connection (Fact
    \claimref{synthesis.imported-kuckert-modular-pct-spin-statistics-and-borchers-theorem}); in the
    spacetime algebra the reflections of a wedge and of its quarter-turned copy compose to a rotor
    of square $-1$
    (\claimref{synthesis.wedge-reflections-compose-to-the-two-pi-rotor-so-geometric-modular-conjugations-give-interacting-spin-statistics});
    it is recorded as a weaker alternative premise, not adopted, and nothing in the store supplies
    the action of the modular conjugations on the local algebras. Generations: the shared three-slot
    space fails the slot-module premise even for one face, and the number of separate composites is
    free under the premise and anomaly freedom (Witten's condition holds with $4n$ doublets, Fact
    \claimref{synthesis.imported-witten-global-su2-anomaly}), at most five if both non-abelian
    factors are to be asymptotically free; three is only an argued reading resting on the imported
    three-spinor bound and a family-symmetry reading
    (\claimref{synthesis.slot-module-makes-the-faces-separate-composites-and-leaves-the-generation-number-free}).
    Doublets: two doublets follow only from three readings taken exactly
    (\claimref{synthesis.one-doublet-field-is-pure-gauge-on-the-null-lift-locus-so-two-doublets-need-the-exact-constraint});
    on the working branch with a level the second doublet is heavy, about $2.5$ to $3.5$ TeV, and
    the low-energy content is one doublet.

    (8 November.) The statistics half is now derived at the level of the tower: by the foundation's sign bit
    distinct directions anticommute (\claimref{synthesis.premise-minimal-non-commutativity},
    \claimref{synthesis.signed-directions-and-the-integer-clifford-algebra}), so the tower modes are fermions at
    every $N$, and on the ladder the bosons' spin and statistics are fixed by the single modes' spins: spin and
    statistics agree on the whole tower algebra exactly when every mode is a spinor, and the collective limit
    neither creates nor repairs the connection
    (\claimref{synthesis.ladder-bosons-inherit-spin-statistics-from-the-single-modes}). The tower does not supply
    the spin: which modes are spinors is what locality with a positive norm fixes for the attached free fields
    (\claimref{synthesis.locality-of-the-attached-free-fields-fixes-their-statistics}). So the remaining input is
    the spinor assignment, not the statistics.

    (9 November.) Three generations, a test: the one-window parity recurrence of the light-ray sea holds
    exactly when the number of arrays is a multiple of $24$; it strengthens (Q) and is independent of the
    cone's postulates, by two models with one and with three generations
    (\claimref{synthesis.one-window-parity-recurrence-of-the-light-ray-sea-needs-twenty-four-arrays}). On
    sixteen Weyl components per generation it gives $3 \mid n_{g}$, not $n_{g} = 3$, under J3's reading of the
    integer-weight channels as currents of the arrays; with the null data of the bosons counted additively its
    verdict is set by the doublet count (the two doublets of the linear rung field pass $n_{g} = 1, 4$ and
    fail $3$) and fails for every content once the graviton is counted
    (\claimref{synthesis.light-ray-recurrence-test-verdict-on-generations-is-set-by-the-scalar-content}). By
    Leon's decision of 9 November it is recorded as a test, not a premise, so the generation number stays free
    under the stored premises; the value $78$ quoted in op.counted-mode-energy is a reading, not a stored
    result. The conclusion $3 \mid n_{g}$ has prior art by anomaly routes (J. Wang's framing-anomaly count;
    the mod-9 Dai-Freed anomaly of baryon triality of I. Garcia-Etxebarria and M. Montero).

    (9 November, second pass.) Two further leads on three generations are closed negatively
    (\claimref{synthesis.capacity-and-sakharov-readings-leave-the-generation-number-free}). The
    capacity lead (each massless helicity channel on a light ray registered by an array of its own, so
    $2n_{V} + n_{s} + 2\epsilon \le 16n_{g}$): pair currents of the light-ray arrays have helicity $0$ or
    $\pm 1$, never $\pm 2$, and only the helicity-zero ones are canonical, so the rule cannot be met for
    helicity $1$ or $2$ at any $n_{g}$; as arithmetic the inequality gives $n_{g} \ge 3$ only when twelve
    vectors, both doublets and the graviton are counted ($34$ against $32$). The induced-gravity lead (the
    vanishing of the quadratic Sakharov coefficient at three generations): the zero moves with the scalars'
    curvature coupling $\xi_{R}$ (a zero at every $n_{g}$), with the gauge parameter and with the graviton
    (counted by the stored helicity rule it sits at four generations), and the quartic coefficient of the same
    sum vanishes on the recorded content at $n_{g} = 1$. Neither rule is required by the stored results cited
    there; the independence is argued, with two of the twenty-four postulates of the joint cone audited (the
    slot-module premise and anomaly freedom). By Leon's decision joint J3 now records (version 3) that its
    identification of channels with current bosons of the arrays is not one array tower per helicity channel,
    so the capacity inequality is a reading and not a consequence of J3, and $n_{g}$ stays free. The one
    conjunction of the candidate rules that gives three is the recurrence test in the currents reading with
    asymptotic freedom of weak isospin, neither of which is a premise.

    (10 November.) Three further items. The number-current lead is closed: on four tower modes every mass term,
    Dirac or Majorana, is a pair term that commutes with the grading, and the one-window and two-window tests
    use only the count of arrays and the grading, so the verdict $3 \mid n_{g}$ is unchanged by Majorana terms
    (argued, from the stored statement of the test)
    (\claimref{synthesis.mass-terms-are-pair-terms-of-the-arrays-and-only-the-charge-separates-majorana-from-dirac}).
    The order-four element with one odd charge on all sixteen components is the pseudoscalar of the ten Majorana
    generators, the classical generator of the centre of $\Spin(10)$; the Majorana element breaks it to the
    grading, and no condition on the content is derived from it
    (\claimref{synthesis.order-four-elements-with-square-the-grading-and-the-majorana-element}; see
    op.order-four-anomaly-and-sixteen). Under clause (K1) of the Krein premise the gauge parameter is one
    (Leon's decision of 9 November), so the zeros of the induced quadratic coefficient obtained by moving the
    gauge parameter are not admissible; the conclusion that the induced-gravity lead leaves $n_{g}$ free is
    unchanged, the zero still moving with the scalars' curvature coupling and with the graviton
    (\claimref{synthesis.capacity-and-sakharov-readings-leave-the-generation-number-free}, version 2).
  attack:
    - >-
      Three generations: the number is free under the slot-module premise; find a premise or dynamics of the series
      that fixes it (for example the slot su(3) of the maximal composite acting on the generation labels as a family
      symmetry), or prove that none does by a two-model argument over the full joint cone of postulates (the stored
      independence audits only the slot-module premise and anomaly freedom). The light-ray recurrence test
      (9 November) gives $3 \mid n_{g}$ under J3's
      reading and is recorded as a test, not a premise; it does not choose three over six or nine
      (\claimref{synthesis.one-window-parity-recurrence-of-the-light-ray-sea-needs-twenty-four-arrays}). The capacity
      and induced-gravity leads are closed negatively (9 November, second pass,
      \claimref{synthesis.capacity-and-sakharov-readings-leave-the-generation-number-free}).
      The number-current lead is closed as well (10 November): the verdict of
      the recurrence test is unchanged by Majorana terms (argued).
    - "Spin and statistics beyond perturbation theory: derive Kuckert's modular P1CT symmetry (the modular conjugations of the wedge algebras acting on the local algebras as the wedge reflections) from a premise the series holds, or record it as one; the charged sectors localised in hypercones."
    - "The doublet count: decide whether the null-lift constraint is a hard constraint and the Higgs exactly the rung unit; on the branch with a level, whether the second doublet is needed at all, and whether a light multi-species composite would change n_h."
  success: >-
    A derivation of one structural input in the field theory, or an
    independence proof.
  entities: [synthesis.interacting-fields-of-causal-perturbation-theory-keep-the-spin-statistics-connection-at-even-ghost-number, synthesis.wedge-reflections-compose-to-the-two-pi-rotor-so-geometric-modular-conjugations-give-interacting-spin-statistics, synthesis.slot-module-makes-the-faces-separate-composites-and-leaves-the-generation-number-free, synthesis.one-doublet-field-is-pure-gauge-on-the-null-lift-locus-so-two-doublets-need-the-exact-constraint, field-theory.imported-standard-field-theory, synthesis.locality-of-the-attached-free-fields-fixes-their-statistics, synthesis.faces-of-one-slot-space-are-not-three-generations-under-one-gauge-group, synthesis.linear-rung-field-has-a-neutral-normal-pair-in-the-scalon-sum, synthesis.one-window-parity-recurrence-of-the-light-ray-sea-needs-twenty-four-arrays, synthesis.light-ray-recurrence-test-verdict-on-generations-is-set-by-the-scalar-content, synthesis.capacity-and-sakharov-readings-leave-the-generation-number-free, synthesis.mass-terms-are-pair-terms-of-the-arrays-and-only-the-charge-separates-majorana-from-dirac, synthesis.order-four-elements-with-square-the-grading-and-the-majorana-element]
  added: 2026-11-01

- id: op.curvature-coupling-across-subjects
  title: "The scalars' curvature coupling: one datum under three results, or three fields"
  area: quantum-fields
  kind: research
  difficulty: substantial
  status: reformulated
  source: "The capacity and induced-gravity result and the cross-subject review of 9 November; Leon's decision of 9 November to register the question; the curvature-coupling result accepted 10 November and Leon's decisions of 9 November (the gauge parameter fixed at one by clause K1 of the Krein premise; the tree-level value 0 as the stored reading for the rung doublets)"
  statement: >-
    The curvature coupling $\xi_{R}$ of a scalar field enters three stored results in three subjects: the
    induced quadratic (Sakharov) coefficient, $B = 16n_{g} - 48 + N_{S}(1 - 6\xi_{R})$ minimal-scalar units for
    twelve vectors in the Feynman gauge, $N_{S}$ real scalar components and $n_{g}$ generations; the fit of the
    primordial tilt on a Kasner approach, which needs $\xi_{R}$ in a narrow window near $1.5$; and the doublets
    of the rung field. Restated 10 November: these are three objects and not one datum. The attachment's
    helicity-zero module has $\xi_{R} = \tfrac16$, forced by its spectrum; the rung field's doublets have the
    tree-level value $\xi_{R} = 0$, the stored reading; the scalar of the tilt fit is no stored field. What
    remains: identify the scalar of the tilt fit among the series' fields, or show that no stored field can be
    it; and the doublets' coupling beyond tree level.
  why: >-
    Each use, read alone, treats $\xi_{R}$ as free. If it is one datum, the
    uses constrain each other and at least one of the stored readings (the
    cancellation at three generations, the fitted tilt, a positive induced
    Newton coupling) has to give way; if they are different fields, the
    store should say which scalar each result is about.
  known: >-
    Stored weights: one per Weyl field, $1 - 6\xi_{R}$ per real scalar and
    $\alpha - 5$ per gauge vector under the heat-kernel cut-off, $-4$ at the
    Gupta-Bleuler value $\alpha = 1$
    (\claimref{synthesis.series-content-induces-a-newton-coupling-only-through-an-unfixed-cut-off},
    \claimref{synthesis.krein-quartet-drops-from-the-induced-einstein-hilbert-coefficient-only-under-a-regulator-that-treats-it-alike}).
    With the eight real components of the two doublets
    (\claimref{synthesis.linear-rung-field-has-a-neutral-normal-pair-in-the-scalon-sum})
    the coefficient vanishes at $\xi_{R} = \tfrac16 + \tfrac{n_{g} - 3}{3}$:
    at three generations exactly at conformal coupling, at two for
    $\xi_{R} = -\tfrac16$, at four for $\xi_{R} = \tfrac12$
    (\claimref{synthesis.capacity-and-sakharov-readings-leave-the-generation-number-free}).
    The stored cancellation at three generations is stated for conformal
    scalars, a property of the attachment modules and not of the rung
    field's action
    (\claimref{synthesis.attachment-modules-give-sakharov-weights-cancelling-at-three-separate-generations}),
    and the stored matching of the induced coupling to Newton's constant
    needs $B > 0$. The red tilt on a Kasner approach is reached by a
    curvature-coupled scalar only for $\xi_{R} \in [1.5225, 1.5481]$, a
    fitted value
    (\claimref{synthesis.kasner-approach-coupled-modes-reach-measured-tilt-only-by-a-fitted-curvature-coupling});
    at tree level the stored actions give $\xi_{R} = 0$, or $-w/6$ from the
    mass-weight dictionary, and do not reach the window
    (\claimref{synthesis.tree-level-curvature-couplings-stay-blue-at-the-isotropic-kasner-point}).
    Arithmetic on the stored formulas, not a stored result: if the tilt's
    scalar were the doublets at the fitted coupling, $B$ at three generations
    would be about $-65$ to $-66$, and the zero of $B$ would sit between
    seven and eight generations, at no integer. No stored result identifies
    the scalar of the tilt fit with the rung field, and none derives
    $\xi_{R}$ for the rung field.

    (10 November.) The three appearances are three objects
    (\claimref{synthesis.no-single-curvature-coupling-serves-the-sakharov-zero-and-the-kasner-tilt}). The
    attachment's helicity-zero module has $\xi_{R} = \tfrac16$ forced by its spectrum on the three-sphere
    (classical; proved given the two stored spectra), so the cancellation at three generations is a property of
    the attachment modules and not of the content. The rung field's doublets have $\xi_{R} = 0$ at tree level,
    and by Leon's decision of 9 November that is the stored reading of their coupling, so on the content $B = 8$
    at gauge parameter one (now stated in
    \claimref{synthesis.attachment-modules-give-sakharov-weights-cancelling-at-three-separate-generations},
    version 4). The scalar of the tilt fit is no stored field. The gauge parameter is one: by Leon's decision it
    is fixed by clause (K1) of the Krein premise for every statement about $B$
    (\claimref{synthesis.krein-form-premise-indefinite-inner-product-for-gauge-fields}), and the zeros of $B$ in
    the gauge parameter are not admissible
    (\claimref{synthesis.capacity-and-sakharov-readings-leave-the-generation-number-free}, version 2). At gauge
    parameter one no single coupling of the doublets gives the Sakharov zero and the measured tilt: a vanishing
    coefficient with $n_{h}$ doublets gives the index $3 - \sqrt{1 + 4(n_{g} - 3)/n_{h}}$, which meets the
    three-sigma window at no integer $n_{g}$ for $n_{h} \le 13$, and over the tilt window the coefficient is
    negative, which excludes the matching to Newton's constant. Outside the premise, with the gauge parameter
    free under the heat-kernel cut-off, the zero and the tilt are met together at $\alpha = \tfrac13 +
    4\xi_{R}$, between $6.42$ and $6.53$; this is recorded as the counter-statement. The two figures given above
    as arithmetic not yet stored are confirmed on review: at three generations $B$ lies between $-66.31$ and
    $-65.08$ over the tilt window, and the zero of $B$ sits at $7.07$ to $7.14$ generations, at no integer. That
    the three stored statements are about different fields is a reading of their texts (argued).
  attack:
    - >-
      Answered in part (10 November;
      \claimref{synthesis.no-single-curvature-coupling-serves-the-sakharov-zero-and-the-kasner-tilt}): the three
      uses are three objects, and at gauge parameter one the reading of them as one coupling of the doublets is
      excluded. What remains of the item: identify the curvature-coupled scalar of the Kasner tilt fit (its
      weights and its place before the descent) among the series' fields, or show that no stored field can be
      it.
    - >-
      Done (10 November): the induced coefficient over the tilt window on the stored content is between $-66.31$
      and $-65.08$ at gauge parameter one; with the gauge parameter free under the heat-kernel cut-off the zero
      and the tilt are met together at a gauge parameter between $6.42$ and $6.53$, a case outside the Krein
      premise. The stored readings that survive: the cancellation at three generations as a property of the
      attachment modules, and $B = 8$ on the content.
    - >-
      Answered in part (10 November): the conformal coupling is forced on the attachment's module only; the
      tree-level value $0$ is the stored reading for the rung field's doublets; the gauge is fixed at parameter
      one by clause (K1). What remains: the doublets' coupling beyond tree level and its running (the one-loop
      form, a multiple of the departure from the conformal value, is cited from memory and not derived).
  success: >-
    An identification, from stored premises, of the scalar of the tilt fit, or a proof that no stored field can
    be it; or a derivation of the curvature coupling of the rung field's doublets beyond tree level.
  entities:
    - synthesis.series-content-induces-a-newton-coupling-only-through-an-unfixed-cut-off
    - synthesis.krein-quartet-drops-from-the-induced-einstein-hilbert-coefficient-only-under-a-regulator-that-treats-it-alike
    - synthesis.attachment-modules-give-sakharov-weights-cancelling-at-three-separate-generations
    - synthesis.capacity-and-sakharov-readings-leave-the-generation-number-free
    - synthesis.kasner-approach-coupled-modes-reach-measured-tilt-only-by-a-fitted-curvature-coupling
    - synthesis.tree-level-curvature-couplings-stay-blue-at-the-isotropic-kasner-point
    - synthesis.linear-rung-field-has-a-neutral-normal-pair-in-the-scalon-sum
    - synthesis.no-single-curvature-coupling-serves-the-sakharov-zero-and-the-kasner-tilt
    - synthesis.krein-form-premise-indefinite-inner-product-for-gauge-fields
  added: "2026-11-09"

- id: op.deposit-state-is-hadamard
  title: Is the descent's deposited state Hadamard, and does it carry to Weyl-curved fields
  area: quantum-fields
  kind: research
  difficulty: frontier
  status: open
  source: "The field-theory runs of 1 November: the gravitational side and the quantum side both need a Hadamard state on fields with nonzero Weyl curvature, and the descent's deposit is the series' only state-selecting mechanism; the deposit-state results and Leon's decisions of 1 November (the Hadamard deposit premise adopted, the radiation-type descent a stated hypothesis, the imports); the Hadamard scaling results and Leon's decisions of 2 November ((HS) restated as a statement about the field); the Hadamard scaling-bound results and Leon's decisions of 2 November ((HS) retired to a theorem); the spin-product and thermality results and Leon's decisions of 2 November (notes on (HD) and on (N$_{+}$))"
  statement: >-
    The field theory on a gravitational field needs a state: a Hadamard state on
    fields with nonzero Weyl curvature is the one datum needed by the renormalised
    stress tensor, the local form of (N$_{+}$) (with
    \claimref{synthesis.hadamard-scaling-limit-premise}), spin-statistics on a
    gravitational field and induced gravity beyond conformally flat fields
    (\claimref{synthesis.attachment-transport-is-flat-only-where-weyl-vanishes}).
    The descent deposits a state (\claimref{synthesis.quasi-free-deposit-is-vacuum-plus-shot-noise},
    \claimref{synthesis.frozen-point-geometry-reads-descent-as-vacuum}). Decide
    whether the deposited state is Hadamard on the descent's surface, and
    whether the propagation of the Hadamard form
    (\claimref{synthesis.imported-propagation-of-hadamard-form}) carries it to
    every later field, Weyl-curved regions and collapse holes included; or show
    where the chain breaks. Since 1 November the Hadamard property of the
    deposit on a Cauchy collar of the descent is the adopted premise (HD)
    (\claimref{synthesis.hadamard-deposit-premise}); the problem is now to
    derive it, that is, to find what in the series selects the deposit's
    occupation profile over an admissible reference vacuum, or to show that
    the deposit is not Hadamard.
  why: >-
    If it holds, the gravitational and quantum sides' common missing datum is
    supplied by a series object, the premise "the series' states are Hadamard"
    becomes a derived statement, and the primordial spectrum becomes the
    infrared data of the same state.
  known: >-
    The quasi-free deposit is the vacuum plus shot noise; a deposit set by the frozen point's
    geometry reads observed modes as inside its horizon and gives the vacuum's spectrum; a
    finite-range deposit cannot seed the CMB
    (\claimref{synthesis.finite-range-descent-deposit-cannot-seed-cmb}); the collapsing hole's flux
    comes from the ground state on the ingoing sheet
    (\claimref{synthesis.collapsing-hole-flux-from-ground-state-on-the-ingoing-sheet}). The chain,
    step by step (results of 1 November, at their reviewed strength). Step (1), the deposit on a
    collar. For the massless Dirac field, on a descended field of Robertson-Walker form with smooth
    scale factor (a stated hypothesis, as for a descent of radiation type), a homogeneous deposit
    diagonal in the conformal vacuum's quasi-particle modes (no pair coherence) is Hadamard exactly
    when every moment of its occupation profile is finite, the standard flat criterion carried by
    conformal covariance; the thermal deposit is Hadamard, the tracial state (occupation one half
    everywhere) is not, and the number and energy spread of the quanta, the data of the stored
    shot-noise bound, do not decide it
    (\claimref{synthesis.deposit-over-the-conformal-vacuum-is-hadamard-exactly-when-every-occupation-moment-is-finite}).
    For the massive Dirac field, at an instant where $ma' \neq 0$ the instantaneous vacuum is not
    Hadamard, nor is any deposit diagonal over it, and a state adiabatic of infinite order before a
    descent across which the $n$-th derivative of $M = ma$ jumps has $|\beta_{k}| = |\Delta
    M^{(n)}|/(2k)^{n+1}$ after it and is not Hadamard, given Hollands' theorem that adiabatic states
    of infinite order are Hadamard (now the imported Fact
    \claimref{synthesis.imported-dirac-hadamard-form-propagates-and-adiabatic-states-are-hadamard});
    no massive analogue of the moment criterion is claimed
    (\claimref{synthesis.massive-dirac-instantaneous-vacuum-and-non-smooth-descents-are-not-hadamard}).
    For a scalar field, bounded-band Bogoliubov data over any homogeneous Hadamard reference are
    Hadamard
    (\claimref{synthesis.hadamard-condition-leaves-the-deposit-spectrum-free-on-bounded-bands}). The
    descent's conditional expectation is the identity on its range, so it neither changes nor
    selects the state (argued). Step (2), the Cauchy surface and propagation. Under the tameness
    hypothesis, at an aligned tame corank-one wall whose radical is the conormal the physical side
    is, in its proper time, a flat half-space whose slices are Cauchy surfaces, so the propagation
    of the Hadamard form holds from any collar; smoothness at the wall selects no bulk state; with
    the radical tangent the wall is a curvature singularity; in cosmic time only the
    radiation-dominated power law has a tame conformal bracket
    (\claimref{synthesis.radical-normal-tame-wall-is-a-regular-initial-surface-whose-smoothness-selects-no-state}).
    On the Kasner branch the four-dimensional Kasner field is Weyl-flat only at the Milne and
    isotropic points, so near the wall the attachment supplies no reference state there
    (\claimref{synthesis.kasner-field-is-weyl-flat-only-at-the-milne-and-isotropic-points}). The
    propagation of the Hadamard form is imported for the scalar field
    (\claimref{synthesis.imported-propagation-of-hadamard-form}) and now for the Dirac field
    (\claimref{synthesis.imported-dirac-hadamard-form-propagates-and-adiabatic-states-are-hadamard}).
    Step (3), (N$_{+}$), the stress tensor and collapse. On a globally hyperbolic Weyl-flat region
    every quasi-free Hadamard state of the massless Dirac field has the local form of (N$_{+}$), at
    the leading order at which local Rindler horizons are defined, with no scaling-limit premise; on
    a Robertson-Walker field the conformal vacuum is the ground state of the physical affine
    translations on every null generator only on de Sitter and flat fields
    (\claimref{synthesis.weyl-flat-fields-need-no-scaling-limit-premise-and-robertson-walker-generators-see-the-schwarzian});
    where the Weyl curvature is nonzero, and for massive fields, the local form follows by (HS),
    since 2 November a statement about the restricted Hadamard parametrix, not about the state, and
    now a theorem (\claimref{synthesis.hadamard-scaling-limit-premise}; marked, 2 November, later):
    the bulk scaling limit is a theorem
    (\claimref{synthesis.hadamard-dirac-states-scale-to-the-flat-massless-vacuum-at-every-point-of-a-gravitational-field}),
    and on the generators the field strength cancels from the leading null singularity
    (\claimref{synthesis.field-strength-cancels-from-the-leading-null-singularity-of-hadamard-dirac-states-on-null-hypersurfaces}),
    so the state enters the local form only through (HD) and the propagation of the Hadamard form.
    (Marked, 2 November, later.) (HS) is now a theorem
    (\claimref{synthesis.hadamard-scaling-limit-premise}, version 4): the remainder bound it posed
    is proved for the epsilon-regularised restriction
    (\claimref{synthesis.restricted-dirac-hadamard-parametrix-on-a-null-hypersurface-is-the-null-vacuum-plus-a-bounded-kernel}),
    the flux contraction of the Dirac current gives the restriction of every state to the generators
    with no characteristic Cauchy problem
    (\claimref{synthesis.dirac-states-restrict-to-null-hypersurfaces-through-the-flux-contraction-and-are-thin-layer-limits-under-the-generator-car}),
    and the causal propagator gives the generator anticommutation relations on every geodesic null
    hypersurface
    (\claimref{synthesis.dirac-causal-propagator-between-nearby-null-leaves-tends-to-the-generator-car-on-every-geodesic-null-hypersurface});
    so every gauge-invariant quasi-free Hadamard Dirac state of any mass has the null vacuum as its
    generator scaling limit at every point of every local Rindler horizon, whatever the field
    strength, and the local form of (N$_{+}$) now rests on (HD) and the propagation of the Hadamard
    form only (given the radiation-type descent). The ground-state clause of (N$_{+}$) is not
    derived (an equivalent modular form is recorded below) and (Loc) is still open. The renormalised
    stress tensor of Hadamard Dirac states is imported
    (\claimref{synthesis.imported-renormalised-stress-tensor-of-hadamard-dirac-states}). The
    collapse result's short-distance condition follows for a propagated Hadamard state given (HS) at
    the horizon point (argued). Step (4), the infrared: the spectrum is the deposit's infrared
    datum, free on bounded bands (op.descent-state-and-spectrum). The premise (adopted, Leon's
    decision of 1 November): (HD), the deposited state is Hadamard on a Cauchy collar of the
    descent, for the Dirac field and the scalar fields; the occupation profile over an admissible
    reference vacuum (the conformal vacuum for massless fields; an adiabatic state of infinite order
    with $M = ma$ smooth for massive ones) stays free data. With the propagation Facts and (HS) it
    gives Hadamard states on every later field up to any Cauchy horizon, the local form of (N$_{+}$)
    at every horizon (for every mass, (HS) being a theorem), the collapse result's state and the
    renormalised Dirac stress tensor; it gives neither which state, nor the ground-state clause, nor
    the spectrum (\claimref{synthesis.hadamard-deposit-premise}). None of the results above states
    (HD) as a hypothesis, so none has an assumes edge to it. The descent's normal form: the
    radiation-type descent (conformally a radical-normal tame wall) is a stated hypothesis of the
    results that need it, not a postulate; under it the collar is Weyl-flat, the conformal vacuum is
    an admissible reference and $M = ma$ is smooth at the origin. (P1) and (P2) remain the
    alternative, Kasner branch, on which the state carried across the wall must itself be Hadamard
    after it. The single missing datum is the deposit's occupation profile over an admissible
    reference vacuum on a Cauchy collar: (HD) fixes only its ultraviolet tail (for a diagonal
    massless Dirac deposit, every occupation moment finite; for massive fields, in addition, an
    adiabatic reference with $M = ma$ smooth), while its band data and two scales are free. (Marked,
    2 November 2026.) A selection of the deposit by the Dirac field's own spin product is ruled out
    for massless fields: the Fewster-Lang weighted spin-product state on a collar, the finite-time
    form of the fermionic projector state, is odd under chirality for the massless field and so
    Hadamard on no open set of any collar on which its operator is injective, torsion included, with
    occupation one half over the conformal vacuum on Robertson-Walker collars for every weight; for
    massive fields it is Hadamard only with a smooth time weight
    (\claimref{synthesis.spin-product-state-of-the-massless-dirac-field-is-odd-under-chirality-and-never-hadamard};
    Fact \claimref{synthesis.imported-fewster-lang-spin-product-states-of-the-dirac-field}; note on
    (HD)). The ground-state clause of (N$_{+}$) has an equivalent form without a temperature: for
    the fermionic modes of a generator the state is the null vacuum exactly when its restriction to
    the future half beyond each point of a set unbounded below is KMS, at some period, for the boost
    about that point, two points already forcing the period $2\pi$
    (\claimref{synthesis.thermality-of-every-future-half-generator-fixes-the-period-and-the-null-ground-state});
    this is the generator form of geometric modular action, available on Minkowski null planes and,
    argued, on de Sitter horizons, not on the eternal hole; it is recorded on (N$_{+}$) as an
    equivalent form of the clause, not as a premise.

    (7 November; argued, from a survey of the store.) Five obstructions to selecting the occupation
    profile. (O1) A selection that makes no undetermined distinction gives the tracial state: real
    states fill only the real capacity, with occupation one half
    (\claimref{synthesis.incidence-vacua-thermofield-real-capacity}); lifting the deposit off one half
    needs the orientation datum that (N$_{+}$) assumes. (O2) Modular descent at the wall's pair deposits
    a trace: the one generator the wall opens is the ladder pair's boost, a gauge generator
    (\claimref{dark-energy.sheaf-papers-wall-soldering-variables}), and no ladder partner is canonical
    (\claimref{sheaf.no-equivariant-value-wall}). (O3) Every finite-moment bound in the store
    (mode-entropy counts, the area law, the cell density, the shot-noise bound, local quasi-equivalence)
    excludes the trace but not a power-law tail. (O4) For massless fields conformal invariance reduces
    the premise to the inherited state, which the Kasner field carries through only at the Milne and
    isotropic points
    (\claimref{synthesis.kasner-field-is-weyl-flat-only-at-the-milne-and-isotropic-points}). (O5) The
    quasi-free states invariant under the conformal group are the constant-occupation family, and the
    Hadamard ones among them are the vacuum alone, so a hot deposit is never stabiliser-invariant and
    \claimref{synthesis.frozen-point-geometry-reads-descent-as-vacuum}, which assumes the Hadamard
    property, cannot supply it. The premise is also the carrier of (N$_{+}$)'s orientation datum on the
    fields it reaches (op.r-premises-external, 7 November), so deriving it would source that datum.
  attack:
    - "Select the profile from the series' structures: a principle of the series that fixes the deposit's occupation profile over the reference vacuum on the collar (for example a deposited I-state at the descent temperature, Hadamard for the massless Dirac field), so that (HD) becomes derived rather than adopted; the Dirac spin product is ruled out as the selector for massless fields."
    - "Dirac propagation into the horizon results: with the Dirac propagation now imported, carry the propagated deposit to the generators of the collapse result's ingoing sheet through its s-wave reduction, and state a massive reference on a collar of a radiation origin (where M = ma vanishes linearly in conformal time and is smooth)."
    - "The Kasner branch: decide whether a state carried by (P2) across a Weyl-curved Kasner wall can be Hadamard on a collar after the descent, and what reference vacuum it is measured against there."
    - "The ground-state clause of (N+): no Hadamard condition gives it, and on Robertson-Walker generators the conformal vacuum meets it only on de Sitter and flat fields; find the global datum (such as stationarity at the edge) that the deposit would have to carry; on generators each of whose points is the edge of a Killing wedge the clause is equivalent to geometric modular action, which a modular-covariance premise would supply, while the eternal hole is not reached that way."
    - >-
      The Riemannian far side of the radical-normal wall
      (\claimref{synthesis.radical-normal-tame-wall-is-a-regular-initial-surface-whose-smoothness-selects-no-state}),
      continued through the wall's smooth coordinate $t$ ($\tau = 2\sqrt t$): a mode analytic in $t$
      continues with its even part to $\cosh k\tau_E$ and its odd part to $\pm B\sinh k\tau_E$, $B$ the
      unit bivector of the mode's phase plane and the sign the branch of $\sqrt t$ (computed for the
      massless mode to order twelve), so requiring boundedness on the far side selects the conformal
      vacuum for one branch and the filled sea for the other. Decide the Dirac case (weight $t^{-3/4}$);
      kill condition: the bounded far-side Euclidean Dirac solutions, continued, are not a positive-energy
      subspace for either branch. It gives the vacuum, not a temperature.
    - >-
      A finite deposit over the attachment's flag vacuum: the tower's floors are conformal-energy cut-offs
      (\claimref{field-theory.twistor-attachment}), a deposit on finitely many modes of a floor differs
      from the vacuum by a finite-rank smooth kernel and is Hadamard, as in the bounded-band result
      (\claimref{synthesis.hadamard-condition-leaves-the-deposit-spectrum-free-on-bounded-bands}). It
      needs a scope decision: whether the finiteness declaration of P2
      (\claimref{dark-matter.p2-indifference}) applies per window to field modes; that window bound is the
      ultraviolet end op.descent-state-and-spectrum asks for.
    - >-
      A maximum-entropy or KMS deposit for the collar's conformal-time flow, as the quasi-free clause of
      (Q) is maximum entropy at fixed marginals
      (\claimref{synthesis.q-splits-maximum-entropy-affine-weights}): any finite set of moment constraints
      with a positive leading power gives an exponential tail and every moment finite, but the principle
      needs a new collar premise naming the flow, since the wall's own pair boost is gauge.
  success: >-
    A derivation of (HD) from the series' structure, that is, a selection of
    the deposit's occupation profile over an admissible reference vacuum on a
    Cauchy collar, with the consequences for (N$_{+}$) and the stress tensor;
    or a proof that the deposit is not Hadamard, which would refute (HD) and
    locate the point where the chain fails.
