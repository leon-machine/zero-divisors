- id: op.order-four-anomaly-and-sixteen
  title: "An order-four symmetry of the slot module and sixteen components per generation"
  area: standard-model
  kind: research
  difficulty: frontier
  status: reformulated
  source: "The cross-subject review of 9 November (the Klein twist of the modular-conjugation results against the neutral-singlet bit); Leon's decision of 9 November to register the question; the order-four and mass-term results accepted 10 November and Leon's decision of 9 November (restate around the pseudoscalar of the ten Majoranas; the modulo-16 statement not imported)"
  statement: >-
    Restated 10 November. The order-four element of the slot module
    (\claimref{standard-model.slot-module-hypothesis}) whose square is the grading and which acts with one odd
    charge on all sixteen components is the pseudoscalar of the ten Majorana generators, $\omega = -I(-1)^{N}$,
    the classical generator of the centre of $\Spin(10)$; the Klein twist of the modular-conjugation results is
    not a candidate. In the stored chain $\omega$ is at no stage an unbroken symmetry that is not a gauge
    transformation, because the Majorana element breaks it to the grading. What stays open is posed only on a
    reading without the Majorana term, where $\omega$ modulo the Standard Model group is unbroken: does
    consistency of the fermion content on walls with cross-section $\mathbb{RP}^{5}$ then force sixteen Weyl
    components per generation, the neutral singlet included, and exclude fifteen?
  why: >-
    The neutral-singlet bit, sixteen components per generation against
    fifteen, is not decided by the gauge quantum numbers, CPT, anomaly
    freedom, the generation clause or the light-ray count
    (op.hypothesis-s). A global anomaly of an order-four symmetry would be
    a condition of a different kind, and it would tie the standard-model
    content to the wall theory, two subjects that share almost no edge.
  known: >-
    Stored: the twist by the unit $I_{4}$ that enters the geometric modular
    conjugations is an order-four element whose square is the grading
    (\claimref{synthesis.wedge-reflections-compose-to-the-two-pi-rotor-so-geometric-modular-conjugations-give-interacting-spin-statistics},
    \claimref{synthesis.geometric-modular-conjugations-on-a-generator-give-the-null-ground-state}),
    and the slot Majoranas of the slot-module premise are Klein-twisted. The
    bit is decided only by a gauge stage that leaves $\uu(5)$
    (\claimref{synthesis.neutral-singlet-bit-decided-by-gauge-algebra-leaving-u5}),
    and the light-ray count has sixteen arrays per generation for either
    singlet choice, a fifteen-component generation leaving half a registered
    unit (\claimref{synthesis.slot-module-light-ray-arrays-are-weyl-components}).
    On a real projective wall with tautological dying line the rung count is
    $n + 1$, the mod-2 height
    (\claimref{synthesis.wall-rung-count-is-height-of-dying-line-class}).
    From the literature, cited from memory and not in the store: a
    $\mathbb{Z}_{4}$ symmetry whose square is fermion parity has an anomaly
    valued modulo $16$ on Weyl fields of odd charge, the bordism group of
    five-manifolds with that structure being $\mathbb{Z}_{16}$, generated by
    $\mathbb{RP}^{5}$ (Garcia-Etxebarria and Montero; Hsieh; Tachikawa and
    Yonekura). The store has no entity on bordism groups, the eta invariant
    or an index theorem of this kind. Argued, not computed in the store: the
    fixed-point contribution of the one nontrivial deck element on
    $\mathbb{RP}^{5}$ is $\tfrac12 \cdot 2^{-3} = \tfrac{1}{16}$ per Weyl
    field, which is where the sixteen would come from; and the lens space
    $L^{5}(4)$ is not the relevant wall, since the rotor lift of the quarter
    turn in three planes has fourth power $-1$, an order-eight structure. No
    stored result says that the store's order-four element acts on the slot
    module with odd charge on all sixteen components, or that the descent
    preserves it.

    (10 November.) Restated around the pseudoscalar, by Leon's decision of 9 November
    (\claimref{synthesis.order-four-elements-with-square-the-grading-and-the-majorana-element}). The Klein twist
    is not a candidate: it is a polynomial in the grading, exists for every content and, for two or more modes,
    assigns no charge to the generators (proved). The element with one odd charge on all sixteen components is
    the pseudoscalar of the ten Majorana generators, $\omega = \gamma_{1}\cdots\gamma_{10} = -I(-1)^{N}$,
    $\omega^{2} = -1$: it acts by $-I$ on the sixteen, commutes with the gauge algebra of every stage of the
    chain and lies in the Pati-Salam group (proved). It is the classical generator of the centre of $\Spin(10)$,
    the $\Z_{4}$ inside $U(1)_{X}$ with $X = 5(B - L) - 4Y$; that identification is prior art. The first two
    attack items are answered in the negative (argued, on proved algebra): every mass form on the sixteen
    anticommutes with $\omega$; Dirac terms keep it only modulo the Standard Model group; the Majorana element
    is invariant under that group, so nothing compensates and it breaks $\omega$ to the grading. So in the
    stored chain there is no stage at which $\omega$ is an unbroken symmetry that is not a gauge transformation.
    The modulo-16 statement of the literature is not imported (Leon's decision), and no stored result derives a
    condition on the content from $\omega$. As arithmetic only: fifteen against sixteen components is separated
    by parity alone, the signed count of an order-four element that commutes with the Standard Model algebra
    being odd on fifteen components for every choice of signs. The question stays open only on a reading without
    the Majorana term, where $\omega$ modulo the Standard Model group is unbroken and is not a gauge
    transformation of the Standard Model stage; the stored premise is that the term is realised. The same
    structure in the mode language of the towers, where the charge that separates the Majorana from the Dirac
    term is the mode-level image of $B - L$:
    \claimref{synthesis.mass-terms-are-pair-terms-of-the-arrays-and-only-the-charge-separates-majorana-from-dirac}.
  attack:
    - >-
      Answered in the negative (10 November;
      \claimref{synthesis.order-four-elements-with-square-the-grading-and-the-majorana-element}): the order-four
      element of the modular conjugations, the Klein twist, assigns no charge to the generators and exists for
      every content; the element with odd charge on all sixteen components is the pseudoscalar $\omega$ of the
      ten Majorana generators, which commutes with the chain's gauge algebra.
    - >-
      Answered in the negative (10 November, argued): the Majorana element breaks $\omega$ to the grading, and
      Dirac terms keep it only modulo the Standard Model group, so no stage of the stored chain has it as an
      unbroken symmetry that is not a gauge transformation.
    - >-
      The anomaly itself, on a reading without the Majorana term only. The modulo-16 statement is not imported
      (Leon's decision of 9 November). Derive the fixed-point count on $\mathbb{RP}^{5}$ in the store and state
      what a wall with cross-section $\mathbb{RP}^{5}$ requires of the fermion content, or show that a reading
      without the Majorana term is excluded by a stored premise.
  success: >-
    On a reading without the Majorana term, a stored statement that the anomaly of $\omega$ on $\mathbb{RP}^{5}$
    walls vanishes exactly for sixteen components per generation, or a proof that it does not constrain the
    content, or a proof that the reading is excluded. With the Majorana term the question is answered in the
    negative (argued).
  entities:
    - standard-model.slot-module-hypothesis
    - synthesis.neutral-singlet-bit-decided-by-gauge-algebra-leaving-u5
    - synthesis.slot-module-light-ray-arrays-are-weyl-components
    - synthesis.wedge-reflections-compose-to-the-two-pi-rotor-so-geometric-modular-conjugations-give-interacting-spin-statistics
    - synthesis.geometric-modular-conjugations-on-a-generator-give-the-null-ground-state
    - synthesis.wall-rung-count-is-height-of-dying-line-class
    - synthesis.order-four-elements-with-square-the-grading-and-the-majorana-element
    - synthesis.mass-terms-are-pair-terms-of-the-arrays-and-only-the-charge-separates-majorana-from-dirac
    - standard-model.majorana-element
  added: "2026-11-09"

- id: op.non-gaussian-completion
  title: 'The non-Gaussian completion: the 207 from caused structure'
  area: generations
  kind: research
  difficulty: frontier
  status: reformulated
  source: 'T13, successor problem (1), the registered open problem; restated 26 October; Leon''s decision of 31 October on the reading; results and Leon''s decision of 1 November on the mass dictionary'
  statement: >-
    Produce $m_\mu/m_e \approx 207$ from caused structure, preserving the skeleton, introducing no second free
    number, and under the relabelling-signature refutation condition. Neither non-Gaussianity at fixed second
    moments nor a second face-space structure acting by covariance can do it; the question is which rule
    selects the non-Gaussian frozen vacuum, the state that alone fixes the split. Under the mass-squared
    reading of the face mass form, which the store takes as primary, on the span of face words that rule must
    fix the pair-number moments, $\langle D^{2}\rangle$ against $\langle D\rangle$, and the population ratio
    of the two directions of the source's plane.
  why: >-
    It is the family programme's terminal open item: the split, the angle and the depth are one open problem
    in three forms, which the Gaussian vacuum treats as inputs, and the Koide relation stays a measurement
    until it is solved.
  known: >-
    \claimref{families.one-open-problem-three-forms} states it;
    \claimref{families.classification-displaced-gaussian-class-solved-level} supplies the refutation condition
    and \claimref{families.skeleton-rank-one-plus-ordering-shift} the skeleton to preserve. By
    \claimref{families.order-operations-matter-programme} it is the second step, acting on whatever two-term
    structure the mass mechanism supplies. For every state of the six bosonic face modes the mass form is $H =
    \mathbb{1} + W^{\dagger}W$, so every family splitting lies in the excess
    (\claimref{synthesis.face-mass-form-unit-plus-gram}). Any state with the skeleton's second moments has $H
    \ge \cosh^{2}r\,\mathbb{1}$: cumulants only raise masses, and reaching $207$ at the Koide depth would need
    the connected Gram matrix's top eigenvalue about $7{,}900$ times the Gaussian one
    (\claimref{synthesis.cumulants-at-fixed-second-moments-keep-the-floor}). The form is covariant, so any
    state invariant under the stabiliser of its one source has an exactly degenerate light pair at every order
    of cumulants (\claimref{synthesis.light-pair-split-needs-broken-source-stabiliser}). Both candidate
    structures are now decided. Every $S_{3}$-equivariant real structure breaks the coherent source's
    stabiliser to $\mathbb{Z}_{2}$, forcing exactly one eigenvector of the mass form (the reflection of the
    Koide vector through the democratic axis; at the floor, so the lowest, in every state built from the
    source, its conjugate and the invariant quartic word, not in general) and leaving a five-parameter block
    that the state alone fixes; the channel phase is invisible to it; and a cubic family word forces nothing
    (\claimref{synthesis.real-structure-breaks-source-stabiliser-to-z2}). So the $207$ cannot come from the
    real structure or the cubic family word acting by covariance: a symmetry structure can permit a split but
    not fix its ratio, and the ratio is set by the state. The problem is restated from "which second
    face-space structure" to "which rule selects the non-Gaussian frozen vacuum"; the store holds no such
    rule, and the problem stays open. The ordering is settled and the target located: on the span of face-word
    monomials, which holds the Gaussian class and the source-built completions, the mass form is the floor $1
    + \langle\hat{N}\rangle/4$ plus a positive weighted face density; in every state built from the source,
    its conjugate and $\hat{V}$ the forced eigenvector sits at the floor, the least eigenvalue, and a word in
    that direction is what can lift it. Under the mass-squared reading the lightest mass squared is fixed by
    the mean pair number alone, and the split is a population ratio of the selected state: the measured masses
    need $g_{\mu}/g_{\tau} \approx 3.536 \times 10^{-3}$, and a state of one pair number would need $D \approx
    6.07 \times 10^{6}$ (arithmetic, not checked; a dictionary, not a prediction)
    (\claimref{synthesis.pair-singlet-mass-form-is-floor-plus-face-density}). The reading: the store takes the
    eigenvalues of the face mass form as squared masses as primary (Leon, 31 October; note in
    \claimref{families.skeleton-rank-one-plus-ordering-shift}). In the alternative, labelled reading, the
    projected coherent vector as the vector of square-root masses, a circulant, the measured $m_{\mu}/m_{e}$
    at exact Koide fixes the channel phase to $\delta_{*} \in (0.22222204589, 0.22222204830)$, which is not
    $\tfrac29$ (\claimref{synthesis.imported-brannen-charged-lepton-phase}), not a rational of denominator
    below $630131$ and, on its relabelling orbit, not a rational multiple of $\pi$ of denominator at most
    $4208$ (all within three standard deviations of $m_{\mu}$), so the channel phase is no symmetry angle of
    order up to $4208$ (\claimref{synthesis.koide-channel-phase-is-no-symmetry-angle}); that reading conflicts
    with the charged-lepton texture $c(\J + \delta_{c}E)$ of the neutrino paper, which is not a circulant.
    Results of 1 November. Under the mass-squared reading every state on the span of face words, pure or
    mixed, needs weight at pair numbers $D \ge 6{,}065{,}574$ at the pole masses (about $6.4$ million at
    common-scale running masses, first order in $\alpha$, a floating-point estimate)
    (\claimref{synthesis.mass-squared-reading-needs-millions-of-face-pairs}). The mass dictionary (Leon, 1
    November, provisional): the face mass form gives pole masses (note in
    \claimref{families.skeleton-rank-one-plus-ordering-shift}), so exact Koide at pole masses is a premise of
    that reading. The stored phase target $\delta_{*}$, the exclusion of $\tfrac29$ and the denominator bounds
    are pole-mass statements under that dictionary; at common-scale running masses the ratio target is about
    $210.6$ to $210.9$ and the phase target lies in $(0.22254, 0.22258)$, and a rule giving exact Koide at a
    common scale would need a cancellation of the logarithmic QED term of Sumino's kind
    (\claimref{synthesis.koide-channel-phase-target-depends-on-mass-definition}, with
    \claimref{synthesis.imported-one-loop-qed-pole-mass-relation}). Argued, not filed: maximum entropy at
    charges invariant under the source's stabiliser selects a stabiliser-invariant state, so $m_{\mu} = m_{e}$
    by \claimref{synthesis.light-pair-split-needs-broken-source-stabiliser}, and a split needs a
    stabiliser-breaking charge with at least one free multiplier; modular fixed points fix the circulant form,
    not $\delta$; and the descent's deposit as the selection rule is obstructed, since a deposit-selected face
    vacuum must depend only on local data uniform at fixed local temperature
    (\claimref{synthesis.adiabatic-deposit-modulation-is-a-time-shift}) and must produce a pair number of
    order $6 \times 10^{6}$, which no stored descent quantity supplies.
  attack:
    - >-
      Find a selection principle for the frozen vacuum (a dynamics of the freezing) that fixes a
      $\mathbb{Z}_{2}$-invariant non-Gaussian state with no fitted number, and compute its pair-number moments
      and the population ratio $g_{\mu}/g_{\tau}$ of the source's plane; it must put weight at pair numbers of
      order $(m_{\tau}/m_{e})^{2}/2$, about $6 \times 10^{6}$, from structure, and a maximum-entropy rule
      needs a charge that breaks the source's stabiliser, which brings a free multiplier (argued).
    - >-
      Work after, not before, the two-term structure of op.pair-sector-current, as the order of operations
      requires.
    - >-
      In the alternative circulant reading a rule must supply the channel phase $\delta_{*}$, a pole-mass
      target under the provisional dictionary, which is no small rational and no symmetry angle of order up to
      $4208$; the circulant is excluded as the charged-lepton matrix except on the complex $P_{12}$-breaking
      branch of the covariant completion
      (\claimref{synthesis.circulant-charged-leptons-excluded-with-real-neutrino-sectors}), so pursue that
      reading only there.
    - >-
      If the mass dictionary is revised from pole masses (the face mass form fixed above the lepton
      thresholds), restate the targets (ratio about $210.7$, pair-number threshold about $6.4$ million) and
      say what cancels the logarithmic QED term that exact Koide would then need.
  success: >-
    The 207 derived with no fitted number, passing the relabelling-signature condition; a construction that
    needs a second free number does not count.
  entities:
    - families.one-open-problem-three-forms
    - families.skeleton-rank-one-plus-ordering-shift
    - synthesis.face-mass-form-unit-plus-gram
    - synthesis.real-structure-breaks-source-stabiliser-to-z2
    - synthesis.pair-singlet-mass-form-is-floor-plus-face-density
    - synthesis.koide-channel-phase-is-no-symmetry-angle
    - synthesis.mass-squared-reading-needs-millions-of-face-pairs
    - synthesis.koide-channel-phase-target-depends-on-mass-definition
  added: '2026-10-22'

- id: op.second-order-breaking
  title: 'The second-order breaking and the mixing angles'
  area: generations
  kind: research
  difficulty: substantial
  status: partial
  source: 'T13, successor problem (3); T15, successor problems (1) and (2); seed/SYNTHESIS_GAPS.md D; results of 31 October; results and Leon''s decisions of 1 November'
  statement: >-
    Compute the second-order breaking $S_3 \to S_2 \to 1$: its free phase $\delta = 0.222$ (which encodes
    $m_\mu/m_e$ in the square-root-mass circulant reading), the CKM numbers, the three PMNS angles, the lift
    of the two light neutrino masses, and what fixes $\alpha$ (deciding Premise (H)).
  why: >-
    All three lepton mixing angles are second-order effects here and depend on the same breaking as the CKM
    numbers; the large angles are the most demanding test of that breaking.
  known: >-
    At leading order there is no heavy-heavy mixing and the light-plane mixing is undetermined
    (\claimref{neutrino.mixing-none-leading-order}). At the $S_3 \to S_2$ direction near-maximal $\theta_{23}$
    is excluded on the perturbative branch ($|U_{\tau 3}|^2 > 0.76$) and reached only past the peak of
    $m_2/m_3$ with the Dirac neutrino breaking opposite in sign to the charged lepton's, $|U_{\tau 3}|^2 \in
    (0.50, 0.55)$ (\claimref{synthesis.theta23-at-s3-s2-direction}); that root uses one of two sign choices,
    so it is weak evidence, and it lies where the lemma's remainders dominate, outside the lemma's licence: it
    is not evidence at this order. Five results narrow the breaking. At the $S_{3} \to S_{2}$ direction a
    one-type second stage obeys a solar sum rule, $\Delta < 21.6^{\circ}$ when $m_{1}/m_{2} \le 0.01$ (Premise
    (H)), excluding the measured solar angle at leading order; the data need a lopsided
    symmetric-plus-antisymmetric second stage (\claimref{synthesis.solar-angle-light-plane-sum-rule}).
    Exchange-odd second stages are twins of their symmetric partners at all orders, so only the relative
    weight of the two types within a sector is observable
    (\claimref{synthesis.one-type-second-stages-are-twins}). Without a $120$ no real texture makes both second
    stages symmetric, so the sum rule and the measured $\theta_{12}$ force $m_{1}/m_{2} > 0.0874$,
    contradicting (H): (H) needs a $120$, which leaves $M_{\nu}$ fixed by the charged fermions only up to the
    $120$'s neutrino coefficient (\claimref{synthesis.no-120-excludes-hierarchical-second-stage}). The channel
    phase is invisible to every axially covariant completion, so $\delta = 0.222$ can matter only through
    family-basis structure such as a cubic family word
    (\claimref{synthesis.channel-phase-invisible-to-axially-covariant-completions}). Couplings that respect
    the residual $S_{2}$, quark and lepton, share the odd eigenvector $(1, -1, 0)$ in every mass matrix, so
    one row and one column of each mixing matrix are trivial; with that state the lightest in both sectors of
    a pair, as the stored textures make it for the leptons, $V_{us} = V_{ub} = V_{cd} = V_{td} = 0$ and
    $\theta_{12} = \theta_{13} = 0$. So a second stage must break $S_{2}$ in the charged-fermion couplings,
    and the single residual-$S_{2}$ $120$ cannot supply it: its family form is fixed only at the $S_{2}$
    stage; with the solar sum rule the second stage must be $S_{2}$-odd and lopsided, at the order of Lemma
    \claimref{neutrino.breaking-relation} and under Premise (H); an $S_{2}$-odd Majorana sector with
    $S_{2}$-invariant Dirac couplings lifts no charged square
    (\claimref{synthesis.residual-s2-decouples-first-family-from-ckm-and-pmns}). The series' own structures do
    not supply the stage. With the circulant shift of the square-root-mass reading included, the family
    structures carry a single $S_{2}$-odd line, the sign representation, on which the channel phase sits;
    without that shift their $S_{2}$-odd part is zero. At the breaking lemma's order, under Premise (H) and
    with a real neutrino coefficient, no stage linear in these structures reaches the measured solar angle,
    the sum rule extending to complex one-type and Hermitian charged-lepton stages; complex neutrino
    coefficients were there only explored numerically, and are now decided for one-type stages (below)
    (\claimref{synthesis.series-family-structures-give-no-lopsided-second-stage}). So, if the second stage is
    hierarchical as (H) assumes, the stage the data require is not among the series' existing structures. Two
    charged-lepton structures in the store are an unreconciled pair: the families paper's Koide
    parametrisation, read as a circulant of square-root masses whose channel phase is $\delta = 0.222$
    (\claimref{synthesis.koide-channel-phase-is-no-symmetry-angle}), and the neutrino paper's texture $c(\J +
    \delta_{c}E)$ at the $S_{3} \to S_{2}$ direction (\claimref{synthesis.theta23-at-s3-s2-direction}), which
    is not a circulant; the store takes the mass-squared reading of the face mass form as primary (note in
    \claimref{families.skeleton-rank-one-plus-ordering-shift}). Results of 1 November. (a) One-type stages are
    excluded for complex neutrino coefficients too: every light-plane block with $|x| = |y|$ reduces by a
    diagonal unitary to the symmetric one, a phase raises the neutrino tilt at most by the factor $(1 +
    \sqrt{\rho})/(1 - \sqrt{\rho})$, and the solar angle stays below $23.3^{\circ}$ under (H) at the lemma's
    order, against the three-sigma data (\claimref{synthesis.complex-neutrino-stages-keep-the-solar-sum-rule},
    with \claimref{synthesis.imported-takagi-factorisation} and
    \claimref{synthesis.imported-nufit-6-oscillation-parameter-ranges}). The 10 couplings on $c$ and $c^{*}$
    give exactly such stages, so the 10-only $\su(2)_{R}$-covariant completion is excluded as the second stage
    under (H) at that order; lopsided complex stages, and odd $126$ couplings (a $P_{12}$-odd $f$, which also
    puts an odd part into $M_{R} = v_{R}f$), are not covered. (b) Read as the charged-lepton matrix in the
    textures' family basis, the Koide circulant is excluded at every placement for every $P_{12}$-invariant
    neutrino sector, real or complex, and for a real neutrino sector with the tau (the stored placement) or
    the muon on the democratic line at every order; with the electron there and a real $P_{12}$-breaking
    sector it gives the $\mu$-$\tau$ reflection pattern
    (\claimref{synthesis.imported-harrison-scott-mu-tau-reflection}); on the complex $P_{12}$-breaking branch,
    which the covariant completion gives generically, it is undecided
    (\claimref{synthesis.circulant-charged-leptons-excluded-with-real-neutrino-sectors}). So the
    reconciliation of the two charged-lepton structures stays open only on that branch. (c) Cabibbo: in
    one-type quark stages each light plane obeys the Gatto-Sartori-Tonin relation of the Fritzsch texture and
    $|V_{us}|$ is the Fritzsch-Xing formula (\claimref{synthesis.imported-fritzsch-texture-cabibbo-formula});
    with the lattice ratios (\claimref{synthesis.imported-flag-2024-light-quark-mass-ratios}) real one-type
    quark stages give no Cabibbo angle, and the measured $|V_{us}|$ needs an up-down phase with $|\cos\phi| <
    \tfrac12$, within $30^{\circ}$ of a quarter turn, selected by the data (one free number for one
    observable), not derived
    (\claimref{synthesis.cabibbo-from-one-type-quark-stages-selects-near-quarter-turn-phase}). The 10-only
    covariant completion gives one-type quark stages, with the phase set by couplings independent in the two
    sectors.
  attack:
    - >-
      Go beyond the breaking lemma's order: the root past the peak of $m_{2}/m_{3}$, where the lemma's
      remainders dominate and $\alpha/M_{3} \approx 1.9 \times 10^{-3}$, is outside the lemma's licence, so
      $|U_{\tau 3}|^{2}$ there, and $\theta_{12}$ and $\theta_{13}$, need the breaking computed beyond that
      order before they count as evidence.
    - >-
      With a second stage from outside the series' existing structures (none linear in them reaches the solar
      angle under (H), now also for complex neutrino coefficients of one type in modulus), carrying
      $S_{2}$-odd, lopsided charged-fermion couplings (a $120$ with a symmetric odd part, odd $126$ couplings,
      or lopsided complex stages), fit it once and compute all three PMNS angles and the CKM numbers without
      refitting; count the free numbers, since a fit is not a derivation.
    - >-
      Decide whether the Koide circulant can be the charged-lepton matrix on the complex $P_{12}$-breaking
      branch of the $\su(2)_{R}$-covariant completion, the only branch on which it is not excluded
      (\claimref{synthesis.circulant-charged-leptons-excluded-with-real-neutrino-sectors}); elsewhere the
      second stage acts on the texture $c(\J + \delta_{c}E)$.
    - >-
      Decide the solar-angle bound for lopsided complex neutrino stages ($|x| \ne |y|$) and for odd $126$
      couplings, which the one-type result does not cover.
    - >-
      Find what fixes the up-down phase $\phi$ of one-type quark stages ($|\cos\phi| < \tfrac12$ is needed),
      or count it as a free number of the breaking.
  success: >-
    All three PMNS angles and the CKM numbers from one breaking without refitting; a breaking that cannot
    place $|U_{\tau 3}|^2$ in the measured window on an admissible root refutes the structure at that
    direction.
  entities:
