- id: op.forcing-half-beyond-diagonal
  title: The forcing half beyond the diagonal Kasner class
  area: dark-energy
  kind: research
  difficulty: substantial
  status: partial
  source: "T10, successor problem (1); the interior results of 26 and 31 October"
  statement: >-
    The field equations supply the completion's wall data in the residue
    sense for the diagonal Kasner class with $\Lambda$ and variable exponents.
    For the non-diagonal class, where the frame rotates as the wall is
    approached, the curvature assumption of the forcing statement is now a
    condition on the coframe; prove the forcing statement on that class
    (existence and the momentum constraints), and place matter other than a
    massless scalar.
  why: >-
    It is the dynamical half of the sheaf paper's connection-level matching:
    whether Einstein's equations, and not only the completion's algebra, force
    the weights at a generic singularity.
  known: >-
    \claimref{dark-energy.forcing-half-schwarzschild-wall-residue-sense} fixes
    the residues of the connection's simple pole at the Schwarzschild wall;
    $\Lambda$ does not change the residue
    (\claimref{dark-energy.cosmological-constant-does-not-change-residue});
    variable exponents give pointwise corrections with a logarithm
    (\claimref{dark-energy.variable-exponents-residue-pointwise-corrections-are}).
    For the diagonal Kasner ansatz the momentum constraints characterise the
    admissible exponent fields
    (\claimref{synthesis.diagonal-kasner-momentum-constraint}). In a shearing
    coframe the connection's pole is simple if and only if the shear rate
    weighted by $\tau^{p_{l} - p_{m}}$ is bounded, and its residue is the
    weights' Kasner boost if and only if that weighted rate vanishes; assuming
    subleading slice curvature, the leading field equations then put the
    weights on the Kasner circle
    (\claimref{synthesis.nondiagonal-kasner-residue-weighted-shear}). That
    assumption is now a condition on the coframe alone (proved, 26 October):
    on the open Kasner arc $\tau^{2}R^{(3)} = -\tfrac12 h_{1}^{2}\tau^{4p_{1}}
    + O(\tau^{\delta})$, with $h_{1}$ the helicity of the negative-weight
    covector, so the curvature hypothesis holds exactly when
    $\tau^{2p_{1}}h_{1} \to 0$ (for a coframe independent of $\tau$, when
    $\theta^{1}\wedge d\theta^{1} = 0$, the Fournodavlos-Luk ansatz); it is
    necessary for any such approach, and where $h_{1} \neq 0$ in the limit no
    field obeying the field equations has a Kasner-like approach with these
    weights; in the homogeneous model such a wall is a Bianchi II bounce
    obeying the BKL law
    (\claimref{synthesis.kasner-curvature-wall-is-negative-weight-helicity}).
    The residue bivector squares to $\sum_{i}p_{i}^{2}$, a unit boost only on
    the vacuum Kasner circle; with a massless scalar of log-rate $q$ its norm
    squared is $1 - 8\pi G q^{2} < 1$
    (\claimref{synthesis.unit-boost-residue-needs-nonpositive-exponent}). The
    matter item is answered for the massless scalar, by neither exclusion nor
    non-unit wall data: every diagonal Einstein-scalar Kasner wall is the
    Einstein-frame reduction of a five-dimensional vacuum Kasner wall, the
    reduction is a bijection of the five-dimensional Kasner sphere onto the
    scalar disk, and the residue completed by the scalar's slot, $B_{w} +
    c\,e_{0}e_{4}$, is a unit boost of $\Cl(1,4)$ exactly when the wall
    equations hold
    (\claimref{synthesis.scalar-kasner-wall-is-reduced-five-dimensional-vacuum-wall},
    proved; the reduction itself is textbook). On the part of the scalar disk
    where every exponent lies in $(0,1)$ the helicity condition is vacuous
    (quiescence). The matter item is answered in the homogeneous diagonal
    class for an aligned Maxwell field and a perfect fluid at rest (proved, 31
    October): in harmonic time each is a potential on the logarithmic scales,
    $\alpha'' = -G^{-1}dV$ with $C = V$, the Maxwell stress being $T(a) =
    -\tfrac12 FaF$
    (\claimref{synthesis.imported-maxwell-stress-spacetime-algebra}); an
    aligned Maxwell field is a wall on the hyperplane of the curvature wall of
    its axis, active exactly on the axis of the negative weight, and reflects
    the weights by the BKL law; a fluid with $0 \le w < 1$ is subleading on
    the whole Kasner circle and never reflects; stiff matter is a constant
    potential that puts the weights on the disk, $B_{w}^{2} = 1 - 2V/S^{2}$,
    as the massless scalar does. So among these sources only stiff matter
    moves the residue off the unit boosts, and an aligned Maxwell field needs
    neither a larger Clifford algebra nor non-unit wall data
    (\claimref{synthesis.kasner-wall-matter-maxwell-bounces-stiff-moves-residue}).
    The minisuperspace and billiard picture is classical (Misner; Damour,
    Henneaux and Nicolai 2003, cited from memory); the store-specific content
    is the residue reading. Not covered: fluids with $w > 1$, misaligned
    Maxwell fields (a Poynting term leaves the diagonal class), the
    dilaton-coupled Kaluza-Klein vector of the five-dimensional reduction (its
    wall form is shifted by the scalar's rate), and inhomogeneous matter
    walls.
  attack:
    - >-
      Supply existence for the class where the helicity condition holds,
      importing the Fournodavlos-Luk existence theorem as a Fact, and analyse
      the non-diagonal momentum constraints and spatial components, which can
      only add conditions to
      \claimref{synthesis.kasner-curvature-wall-is-negative-weight-helicity}(iii).
    - >-
      Place the matter not yet covered by
      \claimref{synthesis.kasner-wall-matter-maxwell-bounces-stiff-moves-residue}:
      a misaligned Maxwell field, the dilaton-coupled Kaluza-Klein vector of
      the five-dimensional reduction, fluids with $w > 1$ and inhomogeneous
      matter walls; decide for each whether it leaves the residue a unit
      boost, reflects the weights, or needs wall data with a non-unit residue.
  success: >-
    The admissible exponent fields characterised by the constraints, and a
    residue-sense forcing statement for the non-diagonal class or a
    counterexample to it.
  entities:
    - dark-energy.forcing-half-schwarzschild-wall-residue-sense
    - synthesis.diagonal-kasner-momentum-constraint
    - synthesis.nondiagonal-kasner-residue-weighted-shear
    - synthesis.kasner-curvature-wall-is-negative-weight-helicity
    - synthesis.kasner-wall-matter-maxwell-bounces-stiff-moves-residue
    - synthesis.scalar-kasner-wall-is-reduced-five-dimensional-vacuum-wall
    - synthesis.unit-boost-residue-needs-nonpositive-exponent
    - sheaf.weights-are-forced-are-kasner-exponents
  added: "2026-10-22"

