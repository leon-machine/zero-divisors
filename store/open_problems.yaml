- id: op.kerr-ring
  title: The Kerr ring, its weighted blow-up and its count
  area: interior
  kind: research
  difficulty: substantial
  status: partial
  source: "T06, successor problem (3); T04, scope (higher codimension); T08, successor problem (2); T07, successor problem (3); T05, Rem 7.33(d); T10, successor problem (4); the interior results of 26 and 31 October"
  statement: >-
    Extend the wall theory to the codimension-two ring of Kerr and prove or
    refute Conjecture \claimref{interior.duality-monodromy-fibration-over-ring}:
    the exceptional structure over the ring is a duality-monodromy fibration
    whose holonomy connects the sheets of the maximal extension, with the
    winding number three of the Kerr scale as an invariant. Then repeat the
    boundary-mode count over that structure and state the rotating analogue of
    the I-state continuum.
  why: >-
    Every result of the series on the singularity, the temperature and the
    count is proved for Schwarzschild; Kerr is the generic astrophysical hole
    and its entropy's known dependence on spin is an external test of the
    count that the Schwarzschild case cannot provide.
  known: >-
    The Kerr curvature scale is $\mathfrak M = -M\chi^{-3}$ with $\chi$ the
    Walker-Penrose Killing-spinor scalar, so the duality monodromy is three
    times the spinor's winding
    (\claimref{interior.complex-scale-inverse-cube-killing-spinor}). T04's
    preliminary computation finds the mass divergence concentrating as a
    rank-one null pulse along the ring generator, so fixed-power weights fail
    and variable-order weights with a focal double cover appear forced
    (\claimref{note.sheaf.setting-scope-successor-problems}); the Kerr
    composite itself is open. T07 records that superradiance leaves no global
    KMS state at fixed angular velocity for all modes, and T05's discharge of
    hypothesis (iii) treats the sphere directions as inert, which holds for
    Schwarzschild by symmetry only. On the double cover branched along the
    ring, with $z = \sqrt{w}$ and $w$ a complex normal coordinate of the ring,
    the duality phase of the curvature scale winds by the integer $-3$, and
    downstairs the holonomy is $-1$, equal to the deck transformation
    exchanging $r > 0$ and $r < 0$, so the monodromy does connect the two
    sheets (\claimref{synthesis.kerr-ring-double-cover-data}). At the level of
    the cometric, the Kerr-Schild pulse is continuous on the double cover with
    the forced null-frame weights $(\tfrac12, -\tfrac12, 0, 0)$, while
    downstairs no fixed or direction-dependent order keeps it
    (\claimref{synthesis.kerr-ring-blow-up-forced-cover-fixed-order}). The
    connection's weighted limit is now computed (proved, 31 October): the
    rotation-gauge field of the Kerr gauge field is exactly linear in the
    potential; in the forced-weight frame every component is at most of order
    $\rho^{-2}$, so normalisation by the transverse distance $d =
    \rho^{2}/(2a)$ is forced; and on the cover the normalised field has a
    limit on the exceptional torus, zero along $k$ and along the angular
    direction, the weights' boost $-\tfrac14 F_K \wedge F_N$ along the normal
    direction, and along $F_N$ a null rotation about the principal null
    direction $k_0$ with complex coefficient $\tfrac12\rho^{3}\mathfrak M =
    -\tfrac{M}{2}e^{-3I\psi}$. The limiting values on tangential directions
    span the abelian plane $\mathfrak n$ of null rotations about $k_0$, a
    complex line under the pseudoscalar on which the duality rotations act as
    a circle; with the normal direction they span the solvable, not nilpotent,
    algebra $\mathfrak n + \R\,F_K \wedge F_N$; the limit section has degree
    $-3$ relative to any frame continuous on the cover up to the ring, and is
    odd under the deck map. The transport holonomy of small loops linking the
    ring tends to the identity, so a connection between the sheets is carried
    by the limiting data (the deck map acts by $-1$ on the limit section, the
    adjoint action of the rotor of the plane transverse to the principal null
    direction), not by transport round the ring
    (\claimref{synthesis.kerr-ring-connection-limit-null-rotation-winding-three};
    the conjecture records this in a note). The bundle in the sense of T4's
    Prop 6.1 and the count are not addressed by that result. Two readings,
    argued and not filed: the winding three is $s + 1$ for the spin-two field
    strength of a point source shifted by $Ia$, so it is kinematic and shared
    with the linearised field (on the same cover a Kerr-Newman Maxwell field
    would wind by two); and the null rotations annihilate the light-ray
    component along $k_0$ (checked as algebra in $\Cl(1,3)$), so a count on
    that component would see only the weights' boost and not the winding. The
    counting rule read literally ((C1) at the Planck-curvature locus of the
    complex scale, $\nu$ per Planck cell, the outer modular period as epoch)
    gives, for $a \ge 2(2M)^{2/3}$, a count of order $M^{-1/3}$ times
    $A_{+}/4$, against one for Schwarzschild
    (\claimref{synthesis.kerr-ring-count-misses-area-law}, with the imported
    Kerr Fact \claimref{synthesis.imported-kerr-surface-gravity-entropy}).
    That half of the success clause is met in the negative for the literal
    reading: some ingredient of the count must carry spin dependence, and the
    local-horizon premise records this as a tension on its universality
    clause. No new route was found on 26 October. Two argued readings bear on
    the problem. The ring lies beyond the inner (Cauchy) horizon, and on the
    charged Vaidya model the transport reaches that horizon uniquely only for
    a finite blue-shifted flux
    (\claimref{synthesis.charged-vaidya-cauchy-horizon-tractor-threshold}); by
    the analogue for Kerr fed by an ingoing tail, under Price-law tails the
    region holding the ring is reached only modulo a nilpotent one-parameter
    subgroup, so a count placed on the ring inherits that ambiguity (argued).
    And by the extendibility literature recorded in
    op.cauchy-horizon-transport (a perturbed Kerr Cauchy horizon is known to
    extend only with a continuous metric, that is a continuous gauge field
    $\hb$), the ring's region is not determined by data, so a ring invariant
    (the fibration, the winding three) is a statement about exact Kerr's
    maximal extension rather than about generic rotating holes, and a count
    meant for generic holes should be placed before the Cauchy horizon
    (argued).
  attack:
    - >-
      Decide whether the limiting values of
      \claimref{synthesis.kerr-ring-connection-limit-null-rotation-winding-three}
      form a bundle of exceptional algebras over the ring in the sense of T4's
      Prop 6.1, with structure group containing the duality circle, and
      whether the deck action on the limit section is the sheet connection the
      conjecture asserts; or restate the conjecture with that fibre
      ($\mathfrak n$ on tangential directions) and that deck action.
    - >-
      Find the spin-dependent ingredient the count lacks: test whether placing
      the count on the horizon's modular data for the co-rotating Killing
      flow, before the Cauchy horizon, rather than on the Planck-curvature
      locus, restores $A_{+}/4$, or whether (C1) must be restated for rotating
      holes; a count on the light-ray component along the principal null
      direction does not see the winding.
    - >-
      Formulate the rotating state statement for the horizon modes at the
      co-rotating Killing flow, starting from
      \claimref{hawking.i-state-continuum}, and identify which channels fail.
  success: >-
    A proof or refutation of the fibration conjecture, and a ring count whose
    mass and spin dependence matches or contradicts the Kerr entropy; a
    mismatch would bear on the counting rule that the boundary-mode prediction
    rests on.
  entities:
    - interior.duality-monodromy-fibration-over-ring
    - interior.complex-scale-inverse-cube-killing-spinor
    - synthesis.kerr-ring-double-cover-data
    - synthesis.kerr-ring-blow-up-forced-cover-fixed-order
    - synthesis.kerr-ring-connection-limit-null-rotation-winding-three
    - synthesis.kerr-ring-count-misses-area-law
    - synthesis.charged-vaidya-cauchy-horizon-tractor-threshold
    - hawking.i-state-continuum
  added: "2026-10-22"

- id: op.cauchy-horizon-transport
  title: The quantitative transport theorem at the Cauchy horizon
  area: interior
  kind: research
  difficulty: substantial
  status: partial
  source: "T06, successor problem (1); T17, open direction 3; the interior results of 26 and 31 October"
  statement: >-
    Establish or refute integrability of the tractor connection along causal
    curves crossing the perturbed Cauchy horizon, so that the reading of that
    horizon becomes a statement about the completion itself rather than about
    the imported literature. In vacuum this is the question whether the
    perturbed Kerr Cauchy horizon admits a continuation with Levi-Civita
    transport along crossing curves, at the $L^{1}$ threshold.
  why: >-
    T06 ranks it the most urgent of its successor problems: it decides whether
    the completion's transport survives the one degeneration inside charged
    and rotating holes that is not a spacelike singularity.
  known: >-
    Read through the imported Cauchy-horizon results, the perturbed Kerr
    Cauchy horizon is a type-N degeneration with survival ordered by
    derivative level: point-level structure extends, connection-level
    structure generically fails (proved in spherical symmetry, expected for
    Kerr), and the divergence sits in the nilpotent slots
    (\claimref{interior.filtration-cauchy-horizon-read-literature}). Along a
    causal geodesic with continuous Levi-Civita transport (transport by the
    rotation-gauge field $\Omega$, whose components are the literature's
    Christoffel symbols) crossing a hypersurface where the Schouten divergence
    is a null rank-one piece along a parallel covector, with finite Tipler
    integral and no surface layer, tractor transport exists after a change of
    splitting and is defined exactly modulo a one-parameter subgroup of the
    nilradical, diverging in that slot; the threshold is $L^{1}$ in the
    Schouten tensor, not $L^{2}$ in the Christoffel symbols
    (\claimref{synthesis.tractor-transport-weak-null-crossing}). In the
    pure-radiation case the threshold is sharp: for a Schouten component $S$
    of fixed sign the transport is unique if and only if $S \in L^{1}$, and
    otherwise the middle slot's null component is lost
    (\claimref{synthesis.crossing-transport-tipler-threshold-sharp}).
    Plane-wave gravitational fields with vanishing Weyl part meet every
    hypothesis with Christoffel symbols that are not square-integrable, and
    there the ambiguity is the strength of a null shell at the crossing
    (\claimref{synthesis.plane-wave-weak-null-crossing-null-shell-ambiguity}).
    An exact black-hole Cauchy horizon now meets the approach-side hypotheses:
    on the charged Vaidya gravitational field (with or without $\Lambda$,
    under a stated region-II hypothesis automatic for $\Lambda = 0$) fed by an
    ingoing null-dust tail, every outgoing radial null ray of region II
    reaches the Cauchy horizon at finite affine parameter with a parallel null
    conormal, the Schouten divergence is rank-one null, the Tipler-type
    integral is comparable to the accreted mass, and tractor transport has a
    unique limit at the horizon exactly when the blue-shifted flux $\int
    m'(v)\,e^{\kappa_{-}v}\,dv$ is finite; inverse-power tails give the
    divergence in the nilpotent slot, and exponential tails give uniqueness
    exactly when $\beta = \alpha/\kappa_{-} > \tfrac12$, the class of the
    $H^{1}$ threshold of the strong cosmic censorship literature
    (\claimref{synthesis.charged-vaidya-cauchy-horizon-tractor-threshold},
    proved; continuation across, outgoing flux and mass inflation,
    scalar-field horizons and Kerr are not covered). The Kerr line of attack
    is reframed (argued): in vacuum clause (4) of
    \claimref{synthesis.tractor-transport-weak-null-crossing} reduces tractor
    transport to Levi-Civita transport, so the divergence is entirely Weyl,
    which the tractor connection does not see, and for perturbed Kerr the
    problem is the Levi-Civita extendibility question itself, not a
    higher-rank Schouten divergence. The $L^{1}$ threshold matches the optimal
    extendibility class of weak null singularities: in spherical symmetry
    Dafermos's continuous extensions have Christoffel symbols in
    $L^{1}_{\mathrm{loc}}$ (literature, cited from memory), and no spherically
    symmetric continuous extension with Christoffel symbols in
    $L^{s}_{\mathrm{loc}}$, $s > 1$, exists for the Reissner-Nordstrom-Vaidya
    field and for small generic spherical Einstein-Maxwell-scalar
    perturbations of subextremal Reissner-Nordstrom (Cameron and Sbierski,
    arXiv:2609.05167, abstract checked on 26 October). For perturbed Kerr only
    a continuous extension is known (Dafermos and Luk, literature), so in
    vacuum the problem is equivalent to the $L^{1}$ form of strong cosmic
    censorship, open in the literature. Two findings of 31 October, not filed.
    (a) Where the ambiguity lies (computed, exact, in $\Cl(2,4)$ acting on
    itself by left multiplication, eight copies of the real twistor module):
    for $P = n_{O}n$, with $n_{O}$ the crossing point's null tractor and $n$
    the null conormal, $P^{2} = 0$ and the image of left multiplication by $P$
    is one complex line per copy, exactly the intersection of the images of
    $n_{O}$ and of $n$; it lies in the image of every point of the light ray
    through the crossing point along $n$ and of no point off it. So at a
    crossing where the $L^{1}$ condition fails the lost datum is a multiple of
    the twistor of the crossed horizon generator itself (the conormal of a
    null hypersurface is its generator), not of the crossing curve, and
    incidence with that generator does not see it; identifying the stored
    nilradical slot with the blade $n_{O}n$ at the crossing point is a
    dictionary step (argued). (b) In the homogeneous vacuum class the Taub
    point of the Kasner circle is reached by Taub-NUT exactly at its Cauchy
    horizon, where the Hubble-normalised rotation-gauge field converges to a
    one-dimensional complex boost
    (\claimref{synthesis.taub-nut-cauchy-horizon-is-taub-point-with-complex-residue};
    the horizon and its extension,
    \claimref{synthesis.imported-taub-nut-field-and-misner-extension}), so the
    weighted-limit language sees that horizon as the generated algebra
    dropping to one dimension; for vacuum Bianchi IX the dichotomy
    $\Lambda^{2}W$ (curvature blow-up) against one dimension (a Taub-NUT
    Cauchy horizon) would follow from Ringstrom's theorems (argued, cited from
    memory).
  attack:
    - >-
      Prove that the spherically symmetric Einstein-Maxwell-scalar Cauchy
      horizon with Price-law tails satisfies the hypotheses of
      \claimref{synthesis.tractor-transport-weak-null-crossing} (a rank-one
      null Schouten divergence, integrable remaining components, no surface
      layer), importing the decay estimates and Dafermos's
      $L^{1}_{\mathrm{loc}}$-Christoffel extension as Facts, which would also
      discharge the continuous Levi-Civita hypothesis along almost every
      crossing curve in spherical symmetry.
    - >-
      For perturbed Kerr, decide whether a continuation with Christoffel
      symbols in $L^{1}_{\mathrm{loc}}$ along crossing causal curves exists
      (the $L^{1}$ form of strong cosmic censorship); by the vacuum reduction
      this is the whole tractor question there.
  success: >-
    A theorem stating, for a named class of perturbations, whether tractor
    transport along crossing causal curves is integrable, with the slot in
    which it fails if it does.
  entities:
    - interior.filtration-cauchy-horizon-read-literature
    - interior.weighted-limit-theorem
