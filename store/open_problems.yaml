- id: op.pre-descent-theory
  title: 'The pre-descent theory'
  area: dark-matter
  kind: research
  difficulty: frontier
  status: partial
  source: 'T14, successor problem (2); the descent results and maintainer decisions of 26 October; the findings of 31 October; the results and Leon''s decisions of 1 November, including the register of the asymmetry'
  statement: >-
    Supply P1's residue together with the two entries the count depends on: the descent's reheating
    temperature, of which the temperature floor is a function, and the energy with which the descent deposits
    each tower's charge, which sets the temperature above the floor.
  why: >-
    The mirror's temperature (and so the dark-radiation stance), the floors and the odd towers' relic
    densities all wait on these numbers; the framework's dating places the descent at the origin, so this is
    the theory of the first freezing.
  known: >-
    The stored asymmetry is a charge, not a number, and the deposit energy sets the temperature above the
    floor (\claimref{dark-matter.stored-asymmetry-charge-not-number}); P1 is the single frozen point
    (\claimref{dark-matter.p1-single-frozen-point}). Under Premise (R) the mirror's gravitational floor is
    below $1.5 \times 10^{-5}$, so its temperature measures only the deposit per unit charge, $\xi^{4} =
    \tfrac43 Y_{B}\varepsilon$, and the reheating temperature drops out; a helium mirror needs $0.70 \le
    \varepsilon \le 1.4 \times 10^{3}$ (\claimref{synthesis.mirror-temperature-measures-deposit-under-r}). A
    representative untuned Pati-Salam fit under (EW) puts the lightest heavy neutrino below $7.3 \times
    10^{8}$ GeV, so under (R) the descent reheats below the intermediate scale
    (\claimref{synthesis.untuned-fit-caps-lightest-heavy-neutrino}). Perturbative Pati-Salam couplings,
    Premise (R) and the seeding origin of the odd towers' remainder cannot all hold
    (\claimref{synthesis.seeding-remainder-excludes-perturbative-pati-salam}). Decision (26 October), on the
    first attack line: the seeding origin is given up; (R) and the perturbative Pati-Salam branch are kept, so
    the surviving window for the reheating temperature is $1$ MeV (the nucleosynthesis floor, $1.8$ MeV in its
    strict form) to $7.3 \times 10^{8}$ GeV, with $\varepsilon$ free in $0.70$ to $1.4 \times 10^{3}$ for a
    helium mirror. An independent reason supports that choice: on the Pati-Salam chain, causally formed
    monopoles exceed the MACRO flux limit for every formation temperature above $0.48\,v_{R} = 2.0 \times
    10^{10}$ GeV, so the seeding origin, which needs $T_{d} > 1.36 \times 10^{12}$ GeV, fails on its own
    unless the transition is cold ($T_{c} < 0.48\,v_{R}$), the symmetry is not restored at high temperature,
    or a temporary breaking of electromagnetism removes the monopoles, whether or not (R) and perturbative
    couplings hold (\claimref{synthesis.pati-salam-monopoles-bound-descent-history}, proved given its
    literature inputs, now imported: \claimref{synthesis.imported-macro-monopole-flux-limit},
    \claimref{synthesis.imported-kibble-preskill-causal-monopole-estimate}). Reformulation (argued, 26
    October): this problem and op.descent-state-and-spectrum are two faces of one missing object, the state
    the descent deposits, whose charge and energy per charge per tower are this problem's entries and whose
    occupation numbers per mode are the spectrum. Two argued remarks bound the second entry: the deposit per
    unit charge cannot fall below the rest energy of the lightest carrier of that charge,
    $\varepsilon\,T_{\mathrm{desc}} \ge m_{\mathrm{carrier}}$ (for mirror nucleons $T_{\mathrm{desc}} \ge
    0.67$ MeV at $\varepsilon = 1.4 \times 10^{3}$, weaker than nucleosynthesis); and a deposit that is the
    I-state of P1's one clock gives every tower the same temperature, which the record excludes, so the
    deposit is not that state, as a cold mirror already requires. Neither the reheating temperature nor the
    deposit energy is computed. Findings of 31 October (argued, not filed). A Pauli floor: a charge density
    carried by fermion modes of occupation at most one costs at least the energy of a degenerate Fermi sea,
    $\varepsilon\,T_{\mathrm{desc}} \ge \tfrac34 p_{F}$, which gives $\varepsilon \gtrsim 2 \times 10^{-3}$,
    weaker than the helium mirror's $0.70$; and a quasi-free charge face carries no isocurvature beyond shot
    noise (with \claimref{synthesis.quasi-free-deposit-is-vacuum-plus-shot-noise}). The chain's
    $\mathbb{Z}_{2}$ strings (\claimref{synthesis.pati-salam-chain-defects-cannot-source-spectrum}) are an
    observational handle on the deposit rather than on $T_{\mathrm{desc}}$: under (R) they exist only if
    deposited, and a deposit whose Pati-Salam orientation is uncorrelated beyond the descent's Hubble length
    would leave a scaling network with $G\mu$ between about $2 \times 10^{-17}$ and $1.5 \times 10^{-15}$,
    near the reach of LISA (of order $10^{-17}$, cited from memory), while an aligned deposit leaves none.
    This is recorded as a note, not a prediction, until the deposit's correlation is decided; it is the same
    correlation question as the monopole clause (v) of
    \claimref{synthesis.pati-salam-monopoles-bound-descent-history}. With the spectrum's carrier forced out of
    the dense quasi-free class (op.descent-state-and-spectrum), the charge face of the deposit (this problem)
    and its spectrum face need not come from one mechanism. Results of 1 November. Under the charge reading
    and the mirror's deposit law, the deposit per unit charge $\varepsilon$ and the charge per unit entropy
    must be uniform across space up to the allowed isocurvature: a modulation of $\varepsilon$ alone gives the
    photons and the charge carriers no curvature perturbation of their own (a pure mirror-radiation
    isocurvature mode), and one of the reheating temperature at fixed charge gives the charge carriers an
    isocurvature of minus three times $\zeta$, whose share of the large-scale temperature variance exceeds
    twenty times the Planck bound (\claimref{synthesis.adiabatic-deposit-modulation-is-a-time-shift}, with
    \claimref{synthesis.imported-planck-2018-isocurvature-and-isotropy-bounds}). So the charge face of the
    deposit cannot carry the spectrum, and only a local time shift of the one descent is adiabatic. A
    thermal-holographic spectrum at the area entropy would need a temperature at exit of about $7.4 \times
    10^{13}$ GeV, outside the window
    (\claimref{synthesis.holographic-thermal-fluctuations-fall-short-in-the-descent-window}). A candidate rule
    for $\varepsilon$, the mean energy per quantum of the deposited gas in units of $T_{\mathrm{desc}}$, gives
    $\varepsilon = 7\pi^{4}/(180\zeta(3)) \approx 3.15$ for a three-dimensional Fermi-Dirac gas, or
    $\pi^{2}/(12\ln 2) \approx 1.19$ per light ray for the per-generator chiral I-state; both lie inside the
    helium window. It is listed as a candidate and not adopted: it is one reading among several, and the
    window does not test it. Neither $T_{\mathrm{desc}}$ nor $\varepsilon$ is computed. The window of $1$ MeV
    to $7.3 \times 10^{8}$ GeV and $\varepsilon$ in $0.70$ to $1.4 \times 10^{3}$ stand.
    Register (Leon's decision of 1 November): the asymmetry $\epsilon$ of the stored charge $Q = \epsilon N$,
    held until then as a flagged stance, is now a registered free input of the series
    (\claimref{synthesis.matter-asymmetry-registered-free-input}), as $N$ is
    (\claimref{synthesis.number-n-registered-free-input}); the deposit per unit charge $\varepsilon$, this
    problem's second entry, is a different number and stays open and unregistered.
  attack:
    - >-
      With the seeding origin given up, compute the reheating temperature inside the window $1$ MeV to $7.3
      \times 10^{8}$ GeV from the descent itself, or a narrower window from the series' premises.
    - >-
      Compute the deposit per unit charge $\varepsilon$ from the descent; by
      \claimref{synthesis.mirror-temperature-measures-deposit-under-r} it is the one number the mirror's
      temperature measures, and it is the charge face of the deposited state whose mode face is
      op.descent-state-and-spectrum.
    - >-
      Decide the correlation of the deposit's Pati-Salam orientation, on which the monopole clause and the
      $\mathbb{Z}_{2}$ strings both turn; an uncorrelated deposit would have a gravitational-wave signature.
    - >-
      Test candidate rules for $\varepsilon$ (such as the mean energy per deposited quantum, about $3.15$, or
      $1.19$ per light ray) against an independent observable rather than the helium window alone; any rule
      must make $\varepsilon$ and the charge per unit entropy uniform across space up to the allowed
      isocurvature.
  success: >-
    A computed reheating temperature and deposit energy, or a consistent window for them derived from the
    series' premises.
  entities:
    - dark-matter.stored-asymmetry-charge-not-number
    - dark-matter.p1-single-frozen-point
    - synthesis.mirror-temperature-measures-deposit-under-r
    - synthesis.untuned-fit-caps-lightest-heavy-neutrino
    - synthesis.seeding-remainder-excludes-perturbative-pati-salam
    - synthesis.pati-salam-monopoles-bound-descent-history
    - synthesis.pati-salam-chain-defects-cannot-source-spectrum
    - synthesis.adiabatic-deposit-modulation-is-a-time-shift
  added: '2026-10-22'

- id: op.descent-state-and-spectrum
  title: 'The state of the descent and the primordial spectrum'
  area: programme
  kind: research
  difficulty: frontier
  status: reformulated
  source: 'T07, successor problem (5); T16, successor problem (5); T17, open directions 5 and 10; maintainer decisions of 23 and 26 October; the results of 31 October; the results and Leon''s decisions of 1 November, including the premise question answered for the coupling and the pre-descent Kasner stage postulated; the deposit-state results and Leon''s decision of 1 November recording the spectrum as the deposit''s infrared datum'
  statement: >-
    As stored, the series has no mechanism for the measured primordial spectrum. With the descent at the
    origin and no inflationary stage, no mode at or below the pivot scale leaves the Hubble length after the
    descent; a passive deposit needs correlations over one comoving length, about $9.5 \times 10^{-6}$ of the
    present Hubble radius, which the frozen point's geometry supplies, but a deposit set by the frozen point
    reads the observed modes as inside its horizon and gives the vacuum's spectrum. Find the descent's
    deposited occupation numbers $n_{k}$, or a source acting after the descent, that give the measured
    amplitude and index, or show that the series cannot supply them.
  why: >-
    It is the programme item the synthesis paper assigns to the capstone itself; it would give the series an
    observable at the origin, where its dating places the descent, and without it the dating has no account of
    the earliest correlations.
  known: >-
    The finite-range bound: a deposit whose correlations have range $R$ gives $\Delta^{2}(k) \le
    \tfrac{2}{3\pi}\langle\zeta^{2}\rangle(kR)^{3}$; the pivot lay outside the descent's Hubble length by more
    than $2 \times 10^{5}$ (at $1$ MeV) to $3 \times 10^{20}$ (at $10^{12}$ GeV) and never leaves it after
    entering, so a passive deposit with $\langle\zeta^{2}\rangle \le 1$ needs correlations over more than
    $460$ to $6.8 \times 10^{17}$ Hubble lengths of the descent, which is one comoving length, about $9.5
    \times 10^{-6}$ of the present Hubble radius, at every reheating temperature; a deposit of finite range at
    the Hubble or thermal length gives $n_{s} - 1 \to 3$; active sources after the descent are not covered,
    and their acoustic peaks disfavour them as a dominant source
    (\claimref{synthesis.finite-range-descent-deposit-cannot-seed-cmb}). Attack line 1 is closed (proved, 26
    October, under hypothesis (F), the reading that the late de Sitter stage of the observed $\Lambda$ is the
    frozen point's own field, which the dating takes as primary): a deposit correlated by the frozen point's
    stabiliser has range $|x_{d}|$, about $4.3$ present Hubble radii, beyond the requirement by more than $4.4
    \times 10^{5}$ at every reheating temperature, but every observed mode has $k|x_{d}| > 2.7$ (about $960$
    at the pivot), inside the frozen point's horizon at the descent, so every stabiliser-invariant Hadamard
    state of a field of the series reads as the vacuum there: $n_{s} - 1 = 2$ exactly for the conformal
    weight, and within $3 \times 10^{-6}$ of $2$ at the pivot for every field of the unitary series at leading
    adiabatic order, more than $480$ standard deviations from the measured value
    (\claimref{synthesis.frozen-point-geometry-reads-descent-as-vacuum}, with
    \claimref{synthesis.imported-de-sitter-invariant-hadamard-state-unique}). In the second reading of the
    join, the frozen phase ending at the descent with the scale factor continuous, the modes are inside by
    more than $7 \times 10^{9}$ and the conclusion is the same (\claimref{standard-model.dating-descent}). On
    the descent slice a correlator homogeneous of degree $-2\Delta$ gives $n_{s} - 1 = 2\Delta$: finite range
    gives $3$, the frozen point's invariant class $2$, and the measured index is a slice correlator growing
    with separation (degree $+0.0351$), further from the vacuum than scale invariance, so any mechanism must
    produce long-range order above the vacuum's, not merely long range. Stationary excitations do not reopen
    the route: members of the half-KMS family cool enough not to resolve the observed modes read as the
    vacuum, and hotter ones are thermal deposits of finite range (argued). What is left is the descent's
    deposited occupation numbers: against the vacuum's $\Delta^{2} \propto k^{2}$, the measured spectrum needs
    $n_{k} \propto k^{n_{s} - 3}$ on observed scales, and nothing in the series fixes $n_{k}$. Earlier results
    fix what the descent cannot be: under (L$_E$) occupations are conserved, so the I-state must be deposited,
    not relaxed to (\claimref{synthesis.quadratic-flows-cannot-thermalise-descent}); a sudden start gives a
    feature, not a tilt (\claimref{synthesis.sudden-descent-feature-not-tilt}); a cold mirror needs a
    non-equilibrium descent (\claimref{synthesis.cold-mirror-needs-non-equilibrium-descent}). The charge and
    energy per charge of the same deposited state are the entries of op.pre-descent-theory. Results of 31
    October. (i) A quasi-free deposit on the fermionic boundary-mode algebra is its vacuum plus shot noise,
    whatever its correlation range or partner placement; for the I-state, or any quasi-free deposit with at
    least one thermal species' number of quanta at thermal energies (energy spread $c_{k} \le 1.31$), the shot
    term at the pivot is below $10^{-77}$, while a sparse or energetically broad deposit is bounded only by
    $(3c_{k}k^{3}/2\pi^{2}\bar n)^{1/2}$, and the record does not fix its number of quanta since such a
    deposit would not conserve entropy; the bound is on the fermion modes' contribution to the contrast of the
    total density (\claimref{synthesis.quasi-free-deposit-is-vacuum-plus-shot-noise}). So attack lines 1 and 2
    are closed for dense quasi-free deposits, whatever the placement of partners. (ii) Attack line 3 is closed
    for the stored chain's defects: the Pati-Salam chain has topologically stable $\mathbb{Z}_{2}$ strings
    besides its monopoles, but under Premise (R), unless the chain's restoration temperature is below
    $0.0176\,v_{R}$, neither forms after the descent, and a deposited string network has $G\mu < 1.5 \times
    10^{-15}$ and supplies less than $10^{-16}$ of the CMB temperature power at $\ell = 10$, an active source
    and not a primordial spectrum (\claimref{synthesis.pati-salam-chain-defects-cannot-source-spectrum}).
    (iii) The one geometry in the store in which modes leave the Hubble length, a Kasner approach to a wall,
    gives a massless minimally coupled spectator scalar, within an epoch, an exited spectrum of index between
    2 and 3, tending to 3, with the leading power $k^{3}$ of a finite-range deposit enhanced by a squared
    logarithm (so not of finite range): no red tilt
    (\claimref{synthesis.kasner-approach-gives-horizon-exit-and-index-three}); fields with a dilaton or
    modulus coupling (the hidden direction's Kaluza-Klein fields among them) and the conversion of a spectator
    spectrum into the curvature perturbation are not covered. The open part is therefore: sparse or
    energetically broad quasi-free deposits; non-quasi-free deposits (classical mixtures, non-Gaussian
    entangled states such as the families sector's frozen vacuum of bosonic face modes, if it were deposited);
    and bosonic fields with occupations far above one. Results of 1 November. (iv) The conversion step is
    closed for Gaussian fields: a local conversion of a Gaussian field into the curvature perturbation, as in
    the curvaton and modulated-reheating mechanisms
    (\claimref{synthesis.imported-curvaton-and-modulated-reheating-coefficients}), cannot lower the field's
    index (the classical Hermite-rank result,
    \claimref{synthesis.imported-mehler-formula-hermite-rank-and-power-law-spectra}), so under (F) any field
    of the series read on the descent slice through the frozen point's invariant state gives an index of $2$
    up to corrections of order $(k|x_{d}|)^{-2}$ on observed scales
    (\claimref{synthesis.local-conversion-cannot-redden-a-gaussian-spectator}). (v) On a Kasner approach whose
    hidden direction moves, a scalar whose action carries the hidden scale to the power $\lambda$ with
    $|\lambda - 1| \le 2$, which covers every scalar the stored content supplies, is blue: at every Kasner
    point at least one observed axis has index at least $1$, and with equal observed exponents every axis
    does; the towers' u(3) vector zero modes are blue too
    (\claimref{synthesis.kasner-hidden-scale-coupled-scalars-stay-blue}). The gravitational field's
    off-diagonal modes and curvature-coupled scalars are red only anisotropically, with indices spreading by
    at least $4$ between axes against a statistically isotropic record
    (\claimref{synthesis.imported-planck-2018-isocurvature-and-isotropy-bounds}), or, with equal observed
    exponents, through a curvature coupling $\xi_{R} \in [1.5225, 1.5481]$ fitted to the measured tilt; the
    Kaluza-Klein vector's field strength is blue, index at least $1$
    (\claimref{synthesis.kasner-approach-coupled-modes-reach-measured-tilt-only-by-a-fitted-curvature-coupling}).
    (vi) By Wands' duality (\claimref{synthesis.imported-wands-duality-of-perturbation-spectra}) the stored
    Kasner index $3$ sits at the self-dual point, the stiff fluid; the contraction dual to the measured tilt
    needs $w = -0.0029$, which nothing stored supplies; an ekpyrotic contraction needs $w > 1$, and the stored
    walls stop at $w = 1$ (argued). (vii) Thermal fluctuations with an area-law heat capacity, converted as in
    string-gas cosmology (\claimref{synthesis.imported-string-gas-thermal-spectrum-and-conversion}), give
    $n_{s} = 1$ exactly at fixed temperature, eight standard deviations from the measured index, and with a
    heat capacity at most the area entropy their amplitude falls short by about ten orders or more at any
    temperature of the window under Premise (R), or at the frozen point's horizon temperature under (F)
    (\claimref{synthesis.holographic-thermal-fluctuations-fall-short-in-the-descent-window}). Conformal cyclic
    cosmology and the no-boundary state reduce to stored results (argued). (viii) Under the charge reading and
    the mirror's deposit law, a classical modulation of the deposit is adiabatic only along a local time shift
    of the one descent (\claimref{synthesis.adiabatic-deposit-modulation-is-a-time-shift}): a modulated
    deposit can carry the spectrum only as a field of delays of the one descent, which still meets the
    finite-range bound, and a Gaussian delay field read through the frozen point has index about $2$. So the
    classical-modulation escape is closed for Gaussian modulators. The open part is therefore: a red or
    non-Gaussian modulator; the amplitude; sparse or energetically broad quasi-free deposits; bosonic fields
    with occupations far above one; and the couplings the store does not fix (below). Premise question,
    answered for the coupling (results and Leon's decisions of 1 November). Write $\xi_{R}$ for the curvature
    coupling, to keep it apart from the D-term level $\xi$ of the weak scale
    (\claimref{synthesis.rung-unit-second-free-number}). At tree level no curvature coupling the series fixes
    reaches the window: the stored actions give $\xi_{R} = 0$, and the mass-weight dictionary read off the
    Einstein region with the frozen point in its stored form gives $\xi_{R} = -w/6$ with the transport's
    Thomas operator or $\xi_{R} = 0$ with the field-space connection. Which connection builds the Thomas
    operator off Einstein regions is left unrecorded by decision; neither reading reaches the window. The
    twelve values the series fixes (the largest $\tfrac12$) give an index of at least $3 - \sqrt{3}$ at the
    isotropic disk point, the only Kasner point the store fixes at which a coupling acts, and at least $3 -
    \sqrt{7}$ with the stored hidden-scale weights; the window needs a real weight below $-9$, outside both
    unitary series, and the own-scale reading, which drops the field-space premise, reaches it only for a
    principal-series scalar with $m^{2}/H^{2}$ between $18.27$ and $18.58$, which no stored field has
    (\claimref{synthesis.tree-level-curvature-couplings-stay-blue-at-the-isotropic-kasner-point}). Couplings
    the store does not fix remain open: loop-level couplings (a coupling of an interacting scalar runs, and
    the stored zero is not stable under renormalisation), and a periodic Wilson-line term $R\,V(W)$ of the
    holonomy, gauge invariant where a local $A_{y}^{2}R$ is not, which with the hidden-scale weight would need
    an effective coupling of about $0.856$ to $0.882$. The tilt-matching coupling $\xi_{R} \in [1.5225,
    1.5481]$ is a free parameter of the series, not adopted. On the Kasner data: modes of every Bessel order
    leave the Hubble length only while an approach contracts toward its wall, the expanding branch fixes no
    state at its wall, and every stored Kasner wall except the flat Milne points is a curvature singularity;
    so, with the descent at the origin and the descended phase expanding from it (argued), a Kasner source
    needs a contracting metric stage before the descent and a rule carrying its state into the descended phase
    (\claimref{synthesis.kasner-exit-needs-a-contracting-metric-stage-and-a-wall-matching}). By Leon's
    decision of 1 November both are postulated, (P1)
    (\claimref{synthesis.pre-descent-contracting-kasner-stage-premise}) and (P2)
    (\claimref{synthesis.pre-descent-state-carried-into-descended-phase-premise}), with their tension with the
    dating's pre-metric reading (\claimref{standard-model.dating-descent}, a conjecture) recorded and not
    resolved. They fix no Kasner exponents, and they still do not supply the tilt: granting both, the
    tree-level couplings above stay blue. They were not adopted in order to obtain a spectrum, and the series
    records no mechanism for the measured spectrum, no mechanism for its amplitude or its index. The spectrum
    as the deposit's infrared datum (results and Leon's decision of 1 November). Relative to any homogeneous
    Hadamard reference state of a scalar field on a spatially flat Robertson-Walker field, the Hadamard condition
    leaves the amplitude and the index of the spectrum free on every bounded band of scales: pure squeezed states
    reach every positive ratio to the reference spectrum there, at the price $n_{k} \ge (\sqrt{\rho_{k}} -
    1/\sqrt{\rho_{k}})^{2}/4$; for the conformally coupled field a Hadamard state allows a power-law ratio on no
    band unbounded toward short scales (its energy moments are finite), and a homogeneous dilatation-invariant
    Hadamard state is the vacuum; for slice fields of nonzero mean a red or scale-invariant law on no band
    reaching $k = 0$ (the infrared divergence of Ford and Parker,
    \claimref{synthesis.imported-ford-parker-infrared-divergence}), while a blue law may reach it
    (\claimref{synthesis.hadamard-condition-leaves-the-deposit-spectrum-free-on-bounded-bands}). Under the
    adopted premise that the deposit is Hadamard on a Cauchy collar of the descent
    (\claimref{synthesis.hadamard-deposit-premise}) the spectrum is therefore recorded as the deposit's infrared
    datum: band data (amplitude, index and shape on the observed band) plus two scales, $k_{\mathrm{IR}}$ and
    $k_{\mathrm{UV}}$, between which a red band must lie, neither fixed by the Hadamard condition. That
    $k_{\mathrm{UV}} \sim 1/\tau$ for a descent smooth on a time $\tau$ is argued, not proved; a sudden or kinked
    descent has no such end and is not Hadamard
    (\claimref{synthesis.massive-dirac-instantaneous-vacuum-and-non-smooth-descents-are-not-hadamard}). The
    fermionic deposit cannot carry the spectrum (occupations at most one, and the shot term below $10^{-77}$ at the
    pivot for a thermal-density deposit), so band data that carry it would have to be bosonic. This locates the
    spectrum among the deposit's free data; it is not a mechanism, and the series still records no mechanism for
    the measured spectrum.
  attack:
    - >-
      Test whether a red or non-Gaussian modulator of the deposit can carry an occupation law $n_{k} \propto
      k^{n_{s} - 3}$ on observed scales, compatible with the descent's one-way conditional expectation and
      with the mirror's cold deposit from the same event: the modulation must be a field of local delays of
      the one descent (\claimref{synthesis.adiabatic-deposit-modulation-is-a-time-shift}), and a Gaussian
      modulator read through the frozen point's invariant state is excluded
      (\claimref{synthesis.local-conversion-cannot-redden-a-gaussian-spectator}); a non-Gaussian deposited
      state, or a state other than the frozen point's, is what remains. Compute the amplitude for any
      candidate.
    - >-
      Decide whether any deposited quanta are bosonic fields outside the CAR algebra, with occupations far
      above one (the Higgs, the families sector's face modes). The coupled Kasner modes are decided: blue at
      tree level for every coupling the series fixes, red only anisotropically or through the free
      tilt-matching coupling $\xi_{R}$; the pre-descent Kasner stage is postulated as (P1) and (P2) and
      supplies no tilt. Decide whether a loop-level coupling or the Wilson-line term $R\,V(W)$ is fixed by the
      series, without fixing either in order to supply a spectrum.
    - >-
      Bound sparse or energetically broad quasi-free deposits: say what fixes their number of quanta when the
      deposit does not conserve entropy, and whether the record excludes them.
    - >-
      The infrared datum: find what in the series fixes the band data and the two ends $k_{\mathrm{IR}}$ and
      $k_{\mathrm{UV}}$ of a Hadamard deposit (the descent's duration as the candidate ultraviolet end), without
      fixing them in order to supply a spectrum.
  success: >-
    A mechanism in the series for the measured amplitude and index, with a computed $n_{s}$ to set against the
    measured value; or a proof that the series cannot fix the deposited occupation numbers and that no
    post-descent source of the series can supply the spectrum, settling the problem negatively.
