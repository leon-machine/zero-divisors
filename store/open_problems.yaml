- id: op.island-dictionary
  title: Islands and eviction, one mechanism or two
  area: entropy
  kind: research
  difficulty: substantial
  status: partial
  source: "T05, Rem 11.2 and its conclusion; the Renyi-2 comparison and the replica-wormhole Fact, 26 October; the Catalan result, 31 October; the mode-split, parity-sector and finite-average results accepted 10 November and Leon's decisions of 9 November (the split in the algebra, the parity sector as the random-state column, the retirement of the mean-purity import)"
  statement: >-
    In the quantum-extremal-surface derivations the falling branch of the Page
    curve comes from an interior island computed by the exterior semiclassical
    theory; here the correction is carried by the ascended boundary modes.
    Decide whether these are two descriptions of one mechanism or different
    claims.
  why: >-
    T05 calls it the sharpest open question the chain faces: if the two are
    one mechanism the series' account of information return is the island
    result in other variables; if not, they make different predictions.
  known: >-
    The dictionary: island to partner modes, extremal-surface area term to
    stretched-singularity capacity, saddle exchange to the crossing of the two
    counts (\claimref{note.singularity.island-dictionary-one-dissonance}); the
    eviction theorem
    (\claimref{singularity.eviction-window-thermal-product-radiation-entropy})
    converts the tension into a programme. The two falling branches agree at
    leading order and differ below it: in von Neumann entropy the eviction
    branch sits below capacity by zero at zero weight and by an amount linear
    in the window when the weights are bounded away from zero, the
    Page-typical branch by about half a nat at the crossing
    (\claimref{synthesis.eviction-deficit-against-page-deficit}). The island
    computation reproduces the Page-typical branch: in the
    end-of-the-world-brane model the radiation's purity is the disconnected
    saddle plus the replica wormhole, $1/k + Z_{2}/Z_{1}^{2}$, and the planar
    microcanonical sum gives Page's spectrum (Fact
    \claimref{synthesis.imported-replica-wormhole-two-saddle-purity}, checked
    against the source). Renyi-2 (26 October): at zero weight the eviction
    radiation purity is exactly $\max(2^{-j}, 2^{-n})$ after $j$ quanta with
    capacity bound $n\ln 2$, against the two-saddle value $2^{-j} + 2^{-n}$
    (the replica-wormhole purity on the reading $e^{S_{0}} = 2^{n}$, an
    identification, not derived) and the Haar average
    $(2^{j} + 2^{n})/(2^{j + n} + 1)$ (derived at these dimensions, which are powers of two, as a finite average:
    \claimref{synthesis.quarter-turn-rotors-of-the-even-subalgebra-form-a-state-design-of-order-three}, clause (v); for general dimensions the classical value of Lubkin
    is the $n = 2$ case of Fact \claimref{synthesis.imported-haar-moments-of-random-pure-state}); so term by term the
    rising branch is the disconnected saddle and the falling branch the
    replica wormhole, and eviction keeps the dominant saddle where the replica
    computation adds both, exactly $\ln 2$ of Renyi-2 entropy above it at the
    crossing; at every weight the eviction falling branch is the window's
    thermal entropy with no correction
    (\claimref{synthesis.eviction-keeps-one-replica-saddle}). Every Renyi
    index (31 October): at zero weight and at the crossing, eviction's
    radiation Renyi-$n$ entropy exceeds the planar replica (and Haar-average)
    value by $\ln C_{n}/(n - 1)$, with $C_{n}$ the Catalan number counting the
    non-crossing replica saddles, of which eviction keeps one; the family is
    $\ln 2$ at $n = 2$, rises to $\ln 4$, and continues to the stored half nat
    at $n \to 1$, a consistency check
    (\claimref{synthesis.eviction-keeps-one-of-catalan-many-replica-saddles}).
    The comparison at nonzero weight remains open. Argued: the energy
    fluctuation of a counted unit at (Q) version 3 (about $1.596$, against $0$
    at zero weight) plays the role of the eviction radiation's capacity of
    entanglement, which replica-wormhole computations find peaked at the Page
    time; the magnitudes are not compared.

    (10 November.) The split in the algebra. By Leon's decision of 9 November the tensor product of the eviction
    comparisons is replaced by the split inside the Clifford algebra of the modes: a subsystem is the
    sub-Clifford algebra of its modes, reduction is the projection onto its blades, and the relation to the
    tensor product is the Klein twist of the stored commuting copies. For even states the two splits give the
    same reduced states, and every eviction-side statement is unchanged
    (\claimref{synthesis.mode-split-of-the-clifford-algebra-and-its-klein-twist-to-the-tensor-product}). The
    random-state column is now the parity sector, in which the even states lie, with the value for an abstract
    tensor product kept beside it: mean purity $(m + n)/(mn + 2)$ against $(m + n)/(mn + 1)$; at every Renyi
    index a permutation of genus $g$ carries the weight $4^{g}$, with the Catalan limit and the gap $\ln
    C_{n}/(n - 1)$ unchanged; the sector mean entropy exceeds Page's value by a rational amount between
    $1/(2mn)$ and $1/(2mn) + 1/(2n^{2})$, and is the two-block case of a published formula for random states on
    a direct sum of tensor products (Bianchi, Hackl, Kieburg, Rigol and Vidmar), rederived here from Page's
    Fact. The leading term of every eviction comparison is unchanged: $\ln 2$ in Renyi-2 at the crossing, the
    term below it becoming $\ln(1 + 2m^{-2})$ in place of $\ln(1 + m^{-2})$, and half a nat in von Neumann
    entropy; the stored lower bound $(m - 1)/(2n)$ on the Page deficit holds on a sector for $m \ge 4$ and fails
    at $m = 2$, and the deficit theorem now states the sector bounds (version 4 of
    \claimref{synthesis.eviction-keeps-one-replica-saddle} and of
    \claimref{synthesis.eviction-keeps-one-of-catalan-many-replica-saddles}; version 5 of
    \claimref{synthesis.eviction-deficit-against-page-deficit}). The finite quarter-turn averages: the group
    generated by the quarter turns about the blades of square $-1$ of an even subalgebra whose pseudoscalar has
    square $-1$ averages every state to the moments of every invariant measure to order three and no further, a
    state design of order exactly three, so the Haar moments to order three are derived at dimensions that are
    powers of two
    (\claimref{synthesis.quarter-turn-rotors-of-the-even-subalgebra-form-a-state-design-of-order-three});
    averages over the stabiliser-family states agree with the Haar values at orders two and three and exceed
    them at order four, with crossing coefficients $2, 5, 16, 67$ against the Catalan numbers, and their mean
    entropy is not Page's
    (\claimref{synthesis.finite-normaliser-averages-leave-the-haar-moments-at-order-four-and-on-a-parity-sector}).
    So the imported mean-purity Fact is retired in favour of the derived second moment (at powers of two; for
    general dimensions the classical value is the $n = 2$ case of the all-moment Fact), while the all-moment
    import and Page's average stay. The comparison at nonzero weight is not touched and remains open.
  attack:
    - >-
      Compute the Renyi comparison at nonzero weight: the island side needs
      the canonical $Z_{n}/Z_{1}^{n}$ of the series' modes at (Q) version 3's
      weights (a weighted overlap rule for the replica saddles, imported as a
      Fact, and a premise fixing the weights of the capacity slots), and the
      eviction side an eviction theorem for windows of whole arrays.
    - >-
      Compute the radiation's entropy in a model where both are available (a
      two-dimensional dilaton black hole) with the boundary modes in place of
      the island, and compare the subleading terms, including windows with
      mixed weights.
    - >-
      Identify which quantity of the eviction theorem would play the role of
      the generalised entropy's area term at the extremum (on the evidence so
      far, the window's thermal entropy).
  success: >-
    A map carrying the eviction mechanism to the island computation, term by
    term, or a quantity on which they differ.
  entities:
    - synthesis.eviction-keeps-one-of-catalan-many-replica-saddles
    - synthesis.eviction-keeps-one-replica-saddle
    - synthesis.imported-replica-wormhole-two-saddle-purity
    - note.singularity.island-dictionary-one-dissonance
    - singularity.eviction-window-thermal-product-radiation-entropy
    - synthesis.eviction-deficit-against-page-deficit
    - singularity.imported-page-average-entropy-subsystem
    - synthesis.quarter-turn-rotors-of-the-even-subalgebra-form-a-state-design-of-order-three
    - synthesis.mode-split-of-the-clifford-algebra-and-its-klein-twist-to-the-tensor-product
    - synthesis.finite-normaliser-averages-leave-the-haar-moments-at-order-four-and-on-a-parity-sector
    - synthesis.imported-haar-moments-of-random-pure-state
