- id: op.r-premises-external
  title: "(N+): derive local normality at the edge, or a stationarity-free (N+)"
  area: thermality
  kind: research
  difficulty: substantial
  status: reformulated
  source: "T05, Prop 7.25 and Rem 7.33(a); T07, successor problem (1) and Rem 3.9; T17, open direction 5; BUILD_REPORT, the de Sitter temperature (21 October); the null ground-state premise, 23 October; the edge-scaling and attachment results, 26 October; the local-normality result and Leon's decision, 31 October; the closed-generator and generator Hadamard results and Leon's decisions, 1 November; the flat-null-plane restriction result and the Hadamard scaling-limit premise, 1 November; the Hadamard deposit premise and the deposit-state results, 1 November; the Hadamard scaling results and Leon's decisions of 2 November ((HS) restated as a statement about the field); the Hadamard scaling-bound results and Leon's decisions of 2 November ((HS) retired to a theorem); the field-level and net-level modular-conjugation results and Leon's decisions, 6 November"
  statement: >-
    The continuum restatements of (R) for the eternal hole and of
    (R$_{\Lambda}$), with the joint KMS part of (Q), follow from one premise
    with no temperature in it, (N$_{+}$): on the continuum of a horizon's
    null generators the state is a gauge-invariant quasi-free ground state for
    the affine null translations
    (\claimref{synthesis.n-plus-null-ground-state}). Within stationary
    gauge-invariant quasi-free states (N$_{+}$) is equivalent to local
    normality to the null vacuum at the bifurcation surface, the
    generator-algebra analogue of Haag's local normality. Derive local
    normality at the edge from a principle of the series with no thermal
    input, or give a form of (N$_{+}$) free of stationarity.
  why: >-
    Every temperature, the quarter in $S = A/4$, the modular period $8\pi M$
    and the de Sitter result hold given (R) or (R$_{\Lambda}$), and now given
    (N$_{+}$) on the continuum; deriving (N$_{+}$) would turn the thermal
    chain into a derivation.
  known: >-
    Under (N$_{+}$) the state is the filled sea of every generator, and its
    restriction to either side of the edge is the continuum I-state at
    rapidity period $2\pi$ for the boost future-directed there; the stored
    point-spectrum wordings of (R) and (R$_{\Lambda}$) are its
    discretisations
    (\claimref{synthesis.positive-null-energy-gives-r-premises}). On every
    horizon in the scope the boost is the anticommutator-preserving scaling of
    a generator about its edge, so a stationary gauge-invariant quasi-free
    state is its own scaling limit there and satisfies (N$_{+}$) exactly when
    it is locally the null vacuum at the edge; stationary states thermal on
    each half at any period are locally the null vacuum at every other point,
    so no condition at points off the edge gives (N$_{+}$) or (R)
    (\claimref{synthesis.stationary-horizon-state-is-its-own-edge-scaling-limit}).
    Local normality (31 October): the weight-$\tfrac12$ scaling preserves the
    Hilbert-Schmidt norm of a kernel shrunk onto a point, so a stationary
    gauge-invariant quasi-free state locally normal to the null vacuum on the
    algebra of an interval of the generator containing the edge (by
    Powers-Stormer, a square-integrable difference of kernels there) is the
    null vacuum of (N$_{+}$), positivity included, while every other
    stationary such state, the half-thermal products at every period and the
    Hawking period included, is locally disjoint from it at the edge; the
    condition is the same in every regular parameter
    (\claimref{synthesis.local-normality-at-the-edge-gives-the-null-ground-state}).
    It is the analogue, for the CAR algebra of an interval of one generator,
    of the local normality principle of algebraic quantum field theory (Fact
    \claimref{synthesis.imported-haag-local-normality}); the scaling-limit
    route to the horizon temperature goes back to Haag, Narnhofer and Stein.
    (N$_{+}$) remains the premise, with local normality at the edge its
    equivalent form within that class. Without stationarity (1 November):
    a state KMS for the affine translations at any temperature satisfies the
    local Hilbert-Schmidt condition, and the generator analogue of the
    microlocal (Hadamard) condition, at every point and is not a ground state
    (proved,
    \claimref{synthesis.microlocal-condition-on-a-generator-gives-the-local-null-ground-state}(iii)(a),
    (iv)), so no pointwise condition of these kinds selects the ground state.
    On the generator closed by the Moebius covariance of the chiral vacuum,
    which the twistor attachment's conformal rotors realise on null lines of
    Minkowski space, the Hilbert-Schmidt form of local normality on every
    interval, the arcs through the point at infinity included, is a globally
    square-integrable kernel difference; for pure states it is global
    quasi-equivalence with the null vacuum, the folium form of (N$_{+}$), in
    which the affine translations are positive, and it gives (N$_{+}$) itself
    only with translation or boost stationarity. The affine-KMS states fail
    normality at one far end (clause (v)); the slope-jump counter-model, the
    vacuum of a regular parameter whose affine slopes differ at the two ends,
    is the null vacuum on each far end separately and locally the vacuum at
    every finite point, has every affine map implementable, and is disjoint
    from the null vacuum, so implementability of the affine group alone does
    not fix the folium (clause (vi);
    \claimref{synthesis.normality-on-the-closed-generator-gives-the-vacuum-folium-not-the-ground-state}).
    The two conditions are complementary, and neither, nor both together,
    gives the ground-state clause without stationarity. So the
    stationarity-free form found is at the level of the folium, and its
    principle is imported (Fact
    \claimref{synthesis.imported-haag-local-normality}); the ground-state
    clause still needs stationarity. Outside routes (argued): the Kay-Wald
    uniqueness theorem (Fact
    \claimref{synthesis.imported-kay-wald-uniqueness-and-no-go}) renames the
    stationary case, its mechanism on the generator algebra being the
    stored theorem's clause (iv); half-sided modular inclusions give positive
    null translations only from KMS data for the boost about two cuts, which
    is thermal input; the averaged null energy condition fails on the
    horizon of a hole formed by collapse in its physical state. With
    $\Lambda > 0$ the eternal hole of case (a) is an idealisation: Kay and
    Wald give a no-go result for stationary Hadamard states on
    Schwarzschild-de Sitter (scope note on
    \claimref{synthesis.n-plus-null-ground-state}), and on the eternal hole
    the Moebius closing is only the abstract covariance of the generator
    algebra. That the series' states satisfy the Hadamard (microlocal)
    condition on horizon generators is recorded as an open premise, not a
    postulate; (marked, 1 November) for the local form of (N$_{+}$) at every
    point of every local Rindler horizon it is reduced to the series' states
    being gauge-invariant quasi-free Hadamard states, by the flat-field
    restriction result (\claimref{synthesis.bulk-hadamard-states-restrict-to-the-generator-condition-on-flat-null-planes}) and, where the
    field strength is nonzero, (HS)
    (\claimref{synthesis.hadamard-scaling-limit-premise}), then an adopted premise and now a
    theorem; this does not touch the ground-state
    clause. (Marked, 2 November.) (HS) is now a statement about the field,
    not states: its bulk clause is a theorem
    (\claimref{synthesis.hadamard-dirac-states-scale-to-the-flat-massless-vacuum-at-every-point-of-a-gravitational-field}),
    and its generator clause is restated as a remainder bound on the Dirac
    Hadamard parametrix restricted to horizon generators, from which, with
    the cancellation of the field strength from the leading null singularity
    (\claimref{synthesis.field-strength-cancels-from-the-leading-null-singularity-of-hadamard-dirac-states-on-null-hypersurfaces}),
    the local form follows for every gauge-invariant quasi-free Hadamard
    state (argued); the state enters only through its being Hadamard. (Marked, 2 November, later.) (HS) is now a theorem
    (\claimref{synthesis.hadamard-scaling-limit-premise}, version 4): the remainder bound it
    posed is proved for the epsilon-regularised restriction
    (\claimref{synthesis.restricted-dirac-hadamard-parametrix-on-a-null-hypersurface-is-the-null-vacuum-plus-a-bounded-kernel}),
    the flux contraction of the Dirac current gives the restriction of every
    state to the generators with no characteristic Cauchy problem
    (\claimref{synthesis.dirac-states-restrict-to-null-hypersurfaces-through-the-flux-contraction-and-are-thin-layer-limits-under-the-generator-car}),
    and the causal propagator gives the generator anticommutation relations
    on every geodesic null hypersurface
    (\claimref{synthesis.dirac-causal-propagator-between-nearby-null-leaves-tends-to-the-generator-car-on-every-geodesic-null-hypersurface});
    so every gauge-invariant quasi-free Hadamard Dirac state of any mass has
    the null vacuum as its generator scaling limit at every point of every
    local Rindler horizon, whatever the field strength, and the local form
    of (N$_{+}$) now rests on (HD) and the propagation of the Hadamard form
    only (given the radiation-type descent). The ground-state clause of
    (N$_{+}$) and (Loc) are still open. (Marked, deposit state, 1 November.) That the series' states are
    Hadamard is now supplied, for this use, by the adopted Hadamard deposit
    premise (HD) (\claimref{synthesis.hadamard-deposit-premise}) with the
    propagation of the Hadamard form for the scalar and the Dirac field
    (\claimref{synthesis.imported-propagation-of-hadamard-form},
    \claimref{synthesis.imported-dirac-hadamard-form-propagates-and-adiabatic-states-are-hadamard}),
    given the radiation-type descent (a stated hypothesis; on the Kasner
    branch, given that the state carried across the wall is Hadamard after
    it); on Weyl-flat regions the local form of (N$_{+}$) then needs no
    further premise for the massless Dirac field
    (\claimref{synthesis.weyl-flat-fields-need-no-scaling-limit-premise-and-robertson-walker-generators-see-the-schwarzian}),
    and elsewhere it follows by the theorem (HS). The ground-state clause is still not reached.
    The twistor
    attachment's Fock vacuum satisfies the positivity and invariance clause on
    the Minkowski local horizons and, for conformally invariant fields, on de
    Sitter horizons, so there (N$_{+}$) is the choice of that vacuum
    (\claimref{synthesis.attachment-conformal-energy-is-generated-by-z}); on
    the eternal hole the conformal route to the positivity is closed
    (\claimref{synthesis.schwarzschild-horizon-translations-are-no-conformal-symmetry}).
    For holes formed by collapse the premise's short-distance form on the
    ingoing sheet gives the Hawking state
    (\claimref{synthesis.collapsing-hole-flux-from-ground-state-on-the-ingoing-sheet}).
    The transport principle makes no statement at the bifurcation surface
    (\claimref{singularity.why-calibration-cannot-be-internal}).
    (Marked, 6 November.) Field-level geometric modular action: within
    gauge-invariant quasi-free states on one generator, the condition that
    the modular conjugation of the algebra beyond each cut act on the
    fields as the twisted charge-conjugating reflection about the cut,
    with a sign $\eta$, at a set of cuts whose differences generate a
    dense subgroup of $\R$, gives (N$_{+}$) for $\eta = -1$ and its time
    reverse for $\eta = +1$, with no stationarity, temperature or modular
    group assumed: twisted Haag duality at one cut forces purity, the
    reflections give stationarity and charge symmetry, and the
    natural-cone positivity is a Loewner condition whose boundary values
    are the occupation numbers; two commensurable cuts, or the positivity
    without purity, do not suffice, and the converse (the null vacuum
    satisfies the condition) is imported
    (\claimref{synthesis.geometric-modular-conjugations-on-a-generator-give-the-null-ground-state}).
    It is the first stationarity-free form that reaches the ground-state
    clause, and it is recorded on (N$_{+}$) as an equivalent form within
    that class, as the KMS form
    (\claimref{synthesis.thermality-of-every-future-half-generator-fixes-the-period-and-the-null-ground-state})
    was, not as a premise: its principle is not one the series adopts, and
    against the KMS form it trades the modular group for the class
    assumption. Net-level routes are closed: every local gauge transform
    of the null vacuum, among them the translation-invariant Fermi seas
    $\chi(P < \kappa)$ (pure, generator-Hadamard, locally normal, not
    ground states for the field translations), has the vacuum's local
    algebras and modular objects, so no condition on the net and the
    vector (geometric modular action in the Buchholz-Summers form, modular
    stability, twisted duality, a positive implementer of the net
    translations) implies the ground-state clause; complex conjugation of
    the Majorana algebra gives the filled positive-energy sea, with the
    same net-level data and the conjugate field-level phase
    (\claimref{synthesis.modular-data-on-a-generator-fix-neither-the-translation-lift-nor-the-sign-of-i}).
    Any derivation must supply two data: the lift of the affine
    translations to the fields, which (N$_{+}$) now names as parallel
    transport along the generator, excluding the Fermi seas; and the
    orientation of the imaginary unit relative to time (the null vacuum
    versus the filled sea), the sign $\eta$ of the field-level form, which
    the series does not fix and (N$_{+}$) assumes. For scalar $\kappa$ the
    Fermi seas are ground states on the gauge-invariant observables, so
    the clause must stay posed on the field algebra.

    (7 November; argued, from a survey of the store.) On every field that the Hadamard deposit premise
    (\claimref{synthesis.hadamard-deposit-premise}) and the propagation Facts reach, the orientation
    datum is carried by that premise: field-level geometric modular action of either sign gives the null
    vacuum or the filled positive-energy sea
    (\claimref{synthesis.geometric-modular-conjugations-on-a-generator-give-the-null-ground-state}); the
    filled sea differs from the null vacuum by the kernel of the sign of the null momentum, which is not
    Hilbert-Schmidt on any interval, so it is locally disjoint from the vacuum at every point, while
    every Hadamard Dirac state has the null vacuum as its generator scaling limit
    (\claimref{synthesis.hadamard-scaling-limit-premise}). So field-level modular action at dense cuts,
    of either sign, together with the Hadamard deposit premise gives (N$_{+}$) on those fields; the
    eternal hole and eternal de Sitter, which no descent reaches, keep the datum. This reduction
    rests on no postulate: the Hadamard results inherited (N$_{+}$) and seventeen other postulates
    only through citations of algebraic and analytic clauses, which now stand as their own results
    (\claimref{synthesis.canonical-part-of-a-spinor-on-a-null-plane},
    \claimref{synthesis.null-vacuum-on-a-horizon-generator},
    \claimref{synthesis.null-vacuum-singularity-under-reparametrisation-and-dilation},
    \claimref{synthesis.stationary-generator-states-and-the-edge-scaling}), and
    \claimref{synthesis.hadamard-scaling-limit-premise} now holds given nothing. With the field
    theory's unit $I_4$ (\claimref{synthesis.massless-frequency-sign-relative-to-i4-is-not-the-chirality}): on the modes of each future null momentum $k$,
    with boost bivector $B$, $L_B = 1$ and $L_J = -L_{I_4}$ for $J = -I_4B$, so every mode's helicity is
    locked to its frequency sign; every map commuting with the Lorentz rotors is $I_4$-linear; and among
    the discrete maps of the massless field the frequency sign flips exactly under reversal of spatial
    orientation. Hestenes' charge conjugation flips the chirality and not the frequency sign, and a CP
    map flips the frequency sign and not the chirality. So the datum is not the chirality of
    massless even spinors (identifying that chirality with the doublets' handedness would be a further
    assumption), and no CP-invariant interaction can fix it.

    (7 November, bosons; argued, with the flip computed for $N = 1, 2, 3$.) On a tower level the unit of the
    Hermitian boson fields is the kernel bivector $J$, the only even unit of the commutant of transport, and its
    sign is the orientation datum, now shared by fermions and bosons
    (\claimref{synthesis.kernel-bivector-is-the-unit-of-hermitian-boson-fields-on-the-tower}(vi)). Bosonic
    positivity adds no datum: the reflection that reverses $J$ is inner, $\operatorname{Ad}(\Gamma g)$ with $g$ a
    unit kernel vector, so it fixes every fermion operator and every state on them, and maps the $J$-dynamics to
    the time-reversed one; positive boson energy selects the null vacuum given the orientation and its conjugate,
    the filled sea, given the other, so it is the fermionic ground-state clause read on pairs. The automorphisms
    fixing transport and parity act on the even unit as $O(2)$ (rotations about $J$ and half-turns reversing it), so
    the fermion data fix the boson unit up to its sign and nothing more. For the photon's null data the sign of the
    relations is fixed by positive null energy whatever the orientation of the unit
    (\claimref{synthesis.null-plane-photon-data-and-the-pair-currents-of-the-generators}). The orientation of the
    unit relative to time stays the one datum (N$_{+}$) assumes.
  attack:
    - >-
      The remaining target (6 November): derive field-level geometric
      modular action of the half-line modular conjugations, or the
      ground-state clause directly, from a principle of the series,
      together with the orientation datum (the sign $\eta$, the
      orientation of $i$ relative to time), which no net-level condition
      supplies; the net-level modular routes (geometric modular action
      in the Buchholz-Summers form, modular stability, twisted duality,
      positive net translations) are closed
      (\claimref{synthesis.modular-data-on-a-generator-fix-neither-the-translation-lift-nor-the-sign-of-i}).
      The series' wedge-reflection result, where modular P$_{1}$CT
      symmetry is a premise of the same kind
      (\claimref{synthesis.wedge-reflections-compose-to-the-two-pi-rotor-so-geometric-modular-conjugations-give-interacting-spin-statistics}),
      is a place to look for the field-level form.
    - >-
      Find a principle stated in the series' algebra that gives local
      normality at the bifurcation surface: for example the frozen point or
      the completion locus read as the edge, where the transport principle is
      silent, or an implementability condition for the boost on the
      generators' algebra.
    - >-
      The folium form: derive local normality on every interval of the
      Moebius-closed generator, the arcs through the point at infinity
      included, from a principle of the series, or prove that none can and
      record it as a permanent import; the ground-state clause then needs a
      separate global datum, since no condition on the folium selects the
      vacuum among its normal excitations.
    - >-
      The open premise: derive that the series' states satisfy the generator
      analogue of the Hadamard condition on horizon generators (shared with
      op.derive-loc-and-r-loc), for example through a restriction of bulk
      Hadamard states to the generator algebra and the propagation of the
      Hadamard form from one Cauchy surface.
    - >-
      The spectrum-condition restatement of
      \claimref{note.singularity.cost-r-dictionary}, which T05 assigns to the
      twistor paper T09, posed at the edge of the continuum mode space.
    - >-
      Look for the orientation datum in the descent's flag (\claimref{dark-matter.premise-flag-as-datum}):
      on the Witt flags adapted to the conformal energy $Z$, the energy sign of a flag's vacuum and the
      stored family bit flip together on each pair of conjugate flags, so read as the energy sign of the
      flag's vacuum the datum is the stored flag bit up to the descent's kinematic sign on the four-space
      orthogonal to $Z$, as \claimref{one-relation.arrow-frequency-are-one-bit-level} states (\claimref{synthesis.z-adapted-witt-flags-energy-sign-follows-the-flag-bit}); what remains is to show that the generators' modes inherit the descent's flag.
    - >-
      A module-level image of field-level modular action: the Wick-rotated boost continued to rapidity
      $\pi$ is the wedge reflection, unitary for the twistor form exactly at the tube points it fixes
      (\claimref{synthesis.wick-rotated-boost-selects-observer-tube-point}); lifted through the Penrose
      transform it could replace the imported converse, but it is blind to the sign and reaches Minkowski
      and de Sitter only.
  success: >-
    A theorem deriving local normality at the edge, or a stationarity-free
    form of (N$_{+}$), from a principle of the series with no thermal input;
    or a proof that no principle expressible in the series' algebra can, which
    would record (N$_{+}$) as a permanent import. The stationarity-free folium
    form now stated does not meet this: its principle is imported, and it
    does not give the ground-state clause.
    (6 November) The field-level modular form
    (\claimref{synthesis.geometric-modular-conjugations-on-a-generator-give-the-null-ground-state})
    does not meet it either: it is an equivalent form of (N$_{+}$) within
    gauge-invariant quasi-free states, its principle is not one the series
    adopts, its converse is imported and its sign $\eta = -1$ is assumed.
    What is asked now is a derivation of field-level geometric modular
    action, or of the ground-state clause, from a principle of the series,
    with the orientation datum; a no-go would have to reach beyond
    net-level principles, which are already excluded
    (\claimref{synthesis.modular-data-on-a-generator-fix-neither-the-translation-lift-nor-the-sign-of-i}).
  entities:
    - synthesis.n-plus-null-ground-state
    - synthesis.local-normality-at-the-edge-gives-the-null-ground-state
    - synthesis.normality-on-the-closed-generator-gives-the-vacuum-folium-not-the-ground-state
    - synthesis.microlocal-condition-on-a-generator-gives-the-local-null-ground-state
    - synthesis.imported-haag-local-normality
    - synthesis.stationary-horizon-state-is-its-own-edge-scaling-limit
    - synthesis.geometric-modular-conjugations-on-a-generator-give-the-null-ground-state
    - synthesis.modular-data-on-a-generator-fix-neither-the-translation-lift-nor-the-sign-of-i
