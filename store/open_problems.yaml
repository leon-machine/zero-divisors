- id: op.thickness-deposit-rule
  title: "The thickness: a rule for the descent's deposit"
  area: dark-matter
  kind: research
  difficulty: substantial
  status: partial
  source: "T14, successor problem (7); the dark-matter results and maintainer decisions of 26 October; the findings of 31 October; the 9 November results and Leon's decisions"
  statement: >-
    The unit-ball rule turns on R3, one cell radius of the unseen direction on
    one side, and R2 and R3 are deposit clauses, set at the descent. Find a
    rule for the descent's deposit that fixes that cell radius at the
    deposit epoch: the one rule P2 licenses, equal filling per rung on the
    shared wall, gives every share one and the ratio $5.000$, so the rule
    needs democracy in each tower's own cells (R2 and R3 together), with a
    reason for equal filling.
  why: >-
    The dark-to-baryon ratio $(11\pi + 16)/3\pi = 5.364$ is a fit, not a
    prediction, until the thickness is derived; and the self-interacting
    fraction at composite strength fails the Bullet Cluster and cluster shapes
    whatever becomes of the total.
  known: >-
    The two standard reductions give $3\pi/8$ and $\pi/4$
    (\claimref{dark-matter.two-reductions}); gravity cannot measure the
    quantity (\claimref{dark-matter.thickness-not-gravitational-quantity});
    the contact mechanism returns the value on clauses chosen with it known
    and does not compose across two nestings
    (\claimref{note.dark-matter.scope-mechanism}). The rule was found by
    solving for the observed value, one of fourteen equally simple candidates
    (\claimref{dark-matter.status-rule}). P2 is scoped to labels, not states
    (\claimref{dark-matter.p2-indifference}); a deposit principle of one
    quantum per cell of each tower's own coframe is off by more than twenty
    standard deviations at every normalisation (unfiled checks). The epoch
    question is answered (proved, 26 October): for the three-dimensional
    towers R2 and R3 hold at every epoch, but for the five-dimensional towers
    they hold at more than one epoch only if the hidden direction co-expands;
    with a static hidden direction a standing R3 would give that matter an
    effective equation of state $w = -\tfrac14$ (read from the dilution
    exponent), and as deposit clauses they give dust for every expansion rate
    of the hidden direction
    (\claimref{synthesis.unit-ball-clauses-hold-at-one-epoch-unless-hidden-direction-co-expands}).
    By decision (26 October) R2 and R3 are deposit clauses, so the thickness
    is a property of the deposit, set at $T_{\mathrm{desc}}$, and with a
    static hidden direction today's counted thickness is the deposit-epoch
    cell radius, below $2.4 \times 10^{-10}$ m for a descent above $1$ MeV.
    The third attack line is answered by costing: with one spinor ideal the
    emptiness of residues 0 and 4 that the fit needs (about $6.16$ with
    residue 4 populated) is equivalent to the pairing reading of mass in
    dimensions $2 \bmod 4$
    (\claimref{synthesis.reversion-pairing-vanishes-residues-zero-four}), and
    in the lowest-causal window residue 4 is also emptied by the anomaly of a
    single ideal under the reading (G6) that a tower's own gauge fields live
    on its full space
    (\claimref{synthesis.residues-zero-four-real-chirality-anomaly}); the
    series adopts the single ideal with the pairing reading as a costed clause
    chosen knowing the fit needs it, and records (G6) as the general reading,
    not a postulate (decision of 26 October, recorded in
    \claimref{dark-matter.status-rule}). Findings of 31 October (argued, not
    filed). R2's common length is our baryon spacing: under R1 and the charge
    reading of the asymmetry
    (\claimref{dark-matter.stored-asymmetry-charge-not-number}), R2 and R3
    require each populated odd tower, which carries no asymmetry, to hold a
    symmetric count equal to $\epsilon$ times the common count up to the ball
    factor. A rule democratic in any count common to the towers gives share
    one ($5.000$) or $1/\epsilon$, and a rule with later annihilation needs a
    survival fraction equal to $\epsilon$, which needs the coupling rule the
    store proves absent: deriving the thickness means deriving $\epsilon$'s
    value inside a sector that cannot carry it, the coincidence problem of
    asymmetric dark matter carried over to the towers. No premise moving
    $\epsilon$ into non-oriented towers is adopted, and $5.364$ remains a fit.
    A count of topological defects cannot give the three-dimensional towers'
    $8/3$: with no Higgs field supplied for the odd towers they carry no
    conserved point charge (the five-dimensional towers carry the instanton
    number of $\pi_{3}(SU(3))$, but with a size modulus and no scale; homotopy
    groups from memory). The thickness is observable through evaporation,
    though gravity cannot see it: under the interface premise a populated
    five-dimensional tower sets a burst break $E_{b} \propto 1/L_{f}$, with
    $L_{f}$ at least the counted thickness and equal to it when the matter
    fills the fifth direction
    (\claimref{synthesis.five-dimensional-tower-kaluza-klein-channels-steepen-burst}(iv)),
    and black-hole lifetimes exclude an open fifth direction when a massless
    five-dimensional species exists
    (\claimref{dark-matter.thickness-not-gravitational-quantity}, note).

    (9 November.) Attack item 1 is done on the orbit reading of licensing. With separate thicknesses $\lambda$
    and $\mu$ for the five- and three-dimensional towers every premise of the unit-ball relation other than R3
    holds and $T(\lambda, \mu) = 1 + 8/3\mu + 16\lambda/3\pi$ takes every value above $1$, so the thickness is
    independent of the other premises. P2 as stored licenses no filling rule; on its orbit reading (a rule may
    equate fillings only within one orbit of the symmetries of the deposited structure, as in equal filling of
    common objects) every licensed rule gives each odd tower the share $1$ or $1/\epsilon$, while R3's
    five-dimensional share is $8/3\pi < 1$, so no licensed rule gives R3
    (\claimref{synthesis.no-rule-p2-licenses-gives-the-thickness-of-r3}). The licensed rules do not miss the
    observed total: with the charge branch for all four odd towers $T = 1 + 4/\epsilon$, which reaches $5.364$
    at $\epsilon \approx 0.917$, $\epsilon$ being free initial data of the descent; so the fit moves from R3
    to the asymmetry $\epsilon$ rather than being removed, and $5.364$ remains a fit. The five-dimensional
    towers' window is the relation's other recorded input
    (\claimref{synthesis.bott-shifted-model-leaves-the-odd-towers-dimension-free}).

    (10 November.) The coefficient table of the dark towers
    (\claimref{synthesis.field-strength-heat-kernel-coefficients-of-the-dark-towers-fix-no-scale-ratio}) gives
    no confinement scale and no correlation length for an odd tower, so it does not decide the candidate of
    attack item 2, the deposit's own correlation length; op.dark-tower-running, registered partly for such a
    scale, is settled in the negative.
  attack:
    - >-
      Done on the orbit reading of licensing (9 November;
      \claimref{synthesis.no-rule-p2-licenses-gives-the-thickness-of-r3}): no
      rule P2 licenses gives R3's shares, and a licensed rule reaches the
      observed total only with $\epsilon \approx 0.917$ fitted. What
      remains is a reason other than the observed ratio for that value of
      $\epsilon$ (the asymmetric-dark-matter coincidence carried over to the
      towers), or a notion of licensing beyond the orbit reading; the
      defect-count route is closed for the three-dimensional towers.
    - >-
      Under the deposit reading, ask whether anything at $T_{\mathrm{desc}}$
      fixes one cell radius of the hidden direction: the deposit's own
      correlation length, as for defects formed by a causal process, is the
      natural candidate; it must be found without the observed ratio.
    - >-
      For the three-dimensional towers, derive the sheets' displacement from
      the towers' own dynamics
      (\claimref{dark-matter.reduced-response-gravity-needs-supporting-stress}).
    - >-
      Use evaporation as the measurement: with the coefficient $B$ of
      \claimref{synthesis.five-dimensional-tower-kaluza-klein-channels-steepen-burst}
      computed, a burst break or crossover would fix $L_{f}$ independently of
      the dark-to-baryon ratio.
  success: >-
    R3 derived from a deposit rule, turning $5.364$ into a prediction; or a
    proof that no rule P2 licenses gives it, leaving the ratio a fit.
  entities:
    - dark-matter.unit-ball-rule
    - dark-matter.r3-one-cell-per-unshared-direction
    - dark-matter.r2-one-quantum-per-unit-ball
    - dark-matter.thickness-not-gravitational-quantity
    - dark-matter.status-rule
    - dark-matter.stored-asymmetry-charge-not-number
    - synthesis.unit-ball-clauses-hold-at-one-epoch-unless-hidden-direction-co-expands
    - synthesis.five-dimensional-tower-kaluza-klein-channels-steepen-burst
    - synthesis.no-rule-p2-licenses-gives-the-thickness-of-r3
    - synthesis.field-strength-heat-kernel-coefficients-of-the-dark-towers-fix-no-scale-ratio
  added: "2026-10-22"

- id: op.odd-towers
  title: "The odd towers: content, coupling rule and burst dimming"
  area: dark-matter
  kind: research
  difficulty: substantial
  status: partial
  source: "T14, successor problems (1), (3) and (4); synthesis.gauge-algebra-by-tower (22 October); the dark-matter results and maintainer decisions of 26 October; the results of 31 October; the 9 November results and Leon's decisions"
  statement: >-
    Establish the odd-dimensional Fock ideals, their mass formulas and gauge
    algebras; derive the coupling rule relating an odd tower's dimensionful
    coupling to this tower's at the ceiling; and supply the odd towers'
    emission coefficient, the one number the burst spectrum still needs.
  why: >-
    The coupling rule alone stands between the population count and a
    computed contribution from the odd towers to the dark-matter remainder,
    and the burst dimming factor needs the odd towers' degrees of freedom.
  known: >-
    The parity theorem and the seeding floor are T14's
    (\claimref{dark-matter.flag-bit-exists-exactly-tower-dimension}); the
    unit-ball rule constrains the odd towers' densities per unit of our volume
    without supplying the coupling
    (\claimref{dark-matter.population-count-one-share-half-percent}). The
    population of the four odd towers is an observation-level inference
    (\claimref{dark-matter.which-towers-are-populated}). The gauge algebras
    follow from one rule under H1, H2 and U: $\so(2) \oplus \so(2)$ in the
    three-dimensional towers and $\uu(3)$ in the five-dimensional ones
    (\claimref{synthesis.gauge-algebra-by-tower}). No rule relating an odd
    tower's coupling to ours follows from the series' premises
    (\claimref{dark-matter.no-coupling-rule-odd-towers-follows}); any rule of
    the form $g_{D}^{2} \sim g_{4}^{2}L^{4-D}$ needs a shared length, and the
    series offers at least four (the Planck length, the de Sitter radius,
    $1/T_{\mathrm{desc}}$, the rung height) with no datum to choose, so a
    look-elsewhere of at least four precedes any number (argued). As a
    consistency check (argued): the five-dimensional coupling is infrared
    free, so those towers' massive quanta are single constituents, matching
    mass at one, and the three-dimensional abelian algebra is log-confining,
    so those quanta are neutral composites, matching mass at two. The
    gravitational-seeding origin of the remainder is given up by decision (26
    October): under Premise (R) it needs $M_{3} > 1.36 \times 10^{12}$ GeV,
    beyond the perturbative Pati-Salam cap
    (\claimref{synthesis.seeding-remainder-excludes-perturbative-pati-salam}),
    and on the Pati-Salam chain it fails on its own by monopole overproduction
    unless the transition is cold, the symmetry is not restored at high
    temperature, or a temporary breaking of electromagnetism removes the
    monopoles
    (\claimref{synthesis.pati-salam-monopoles-bound-descent-history}, proved
    given its literature inputs). The burst is now a spectrum (proved, 26
    October): the visible burst of a hole's last $\tau$ is the standard burst
    of its last $D\tau$ divided by $D$, $D = (2 + g + o)/(1 + g)$ the ratio of
    total emission to that of this tower plus gravitons; the primary
    high-energy tail dims by $D$, the energy in a fixed final window by
    $D^{2/3}$ and the temperature at fixed time to the end by $D^{1/3}$; $D
    \ge 2$ if and only if the odd towers emit at least as much as gravity
    (\claimref{synthesis.dimmed-burst-time-rescaled-copy},
    \claimref{pred.dimmed-evaporation-bursts}). The odd towers enter only
    through their emission coefficient $o$. That coefficient is not constant
    when a five-dimensional tower is populated (proved under the interface
    premise, 31 October): its Kaluza-Klein levels are emission channels of the
    shared exterior, so the mass-loss law is $-M^{2}\,dM/dt = A(M) + B/M$ with
    $B$ proportional to the extent $L_{f}$ of the fifth direction; below the
    crossover mass $M_{\times} = B/A$ the remaining lifetime is $M^{4}/(4B)$,
    no constant $D$ makes the burst a time-rescaled copy, and the
    time-integrated primary tail steepens from $E^{-3}$ to $E^{-4}$ above a
    break $E_{b} \propto 1/L_{f}$
    (\claimref{synthesis.five-dimensional-tower-kaluza-klein-channels-steepen-burst});
    the time-rescaled copy and the prediction now carry that scope. Argued,
    not filed: with a massless five-dimensional species an open fifth
    direction would make every hole's emission infinite, so the direction is
    bounded for the fields
    (\claimref{dark-matter.thickness-not-gravitational-quantity}, note); the
    three-dimensional towers' radiation channels are closed below their gap
    and above it only sheets meeting the horizon radiate, so their share of
    $o$ is a history variable of the hole rather than a tower count; with a
    static hidden direction the break sits near $\pi/L_{f} \approx 8 \times
    10^{-3}\,T_{\mathrm{desc}}$, so the burst spectrum would date the descent
    (numbers from inputs cited from memory). In odd dimension the centre is
    spanned by $1$ and the pseudoscalar (\claimref{primer.centre}), so the
    algebra is a sum of two simple algebras or a complex one
    (\claimref{std-algebra.complexification}); its Fock ideals are minimal
    left ideals of the simple factors
    (\claimref{obj.std-algebra.minimal-left-ideal}).

    (9 November.) Attack item 1 was already answered in the store, at proved level: the constituent's field in
    each tower, $\R$ in the three-dimensional towers and $\HH$ in the five-dimensional ones
    (\claimref{dark-tower-matter.constituents-field}); mass begins at two constituents in dimension three and
    at one in dimension five (\claimref{dark-tower-matter.where-mass-begins}); and the three- and
    five-dimensional towers' content (\claimref{dark-tower-matter.three-dimensional-content},
    \claimref{dark-tower-matter.five-dimensional-content}). The item is marked done. Those results are stated
    at the representatives P3 gives; the five-dimensional towers' dimension is not fixed by the descent's
    other premises, while Premise U fixes the three-dimensional ones
    (\claimref{synthesis.bott-shifted-model-leaves-the-odd-towers-dimension-free}).

    (10 November.) The field-strength heat-kernel coefficients of the stored spin-trace rule on the odd towers'
    content are tabulated ($\tfrac23$ per abelian factor in dimension three; $-\tfrac{55}{6}$ for colour and
    $\tfrac{32}{9}$ for the abelian factor in dimension five under (S)); they are running coefficients in four
    dimensions only, and they decide neither the coupling rule of attack item 2 nor a scale for the emission
    coefficient of item 3
    (\claimref{synthesis.field-strength-heat-kernel-coefficients-of-the-dark-towers-fix-no-scale-ratio};
    op.dark-tower-running is settled on that record).
  attack:
    - >-
      Done (marked 9 November): the Fock ideals, fields, mass onset and
      content of the odd towers' representatives (dimensions three and five
      under P3) are proved
      (\claimref{dark-tower-matter.constituents-field},
      \claimref{dark-tower-matter.where-mass-begins},
      \claimref{dark-tower-matter.three-dimensional-content},
      \claimref{dark-tower-matter.five-dimensional-content}) and agree with
      the gauge algebras already obtained.
    - >-
      Name the premise the coupling rule needs and cost it, including the
      choice of shared length, since by
      \claimref{dark-matter.no-coupling-rule-odd-towers-follows} none of the
      present premises supplies it.
    - >-
      Compute $o$: for the five-dimensional towers the coefficient $B$ of
      \claimref{synthesis.five-dimensional-tower-kaluza-klein-channels-steepen-burst}
      from their full light content and the exterior's greybody factors, which
      turns the crossover mass and the break energy into numbers for a given
      $L_{f}$; for the three-dimensional towers the emission through sheets
      that meet the horizon.
  success: >-
    The odd towers' content at proved level, a derived coupling rule, and a
    computed dimming factor $D$ for the burst spectrum.
  entities:
