- id: op.pair-sector-current
  title: The coupling of the rung vector to the pair-sector current
  area: standard-model
  kind: research
  difficulty: substantial
  status: partial
  source: T12, successor problems (3) and (8); T13, successor problem (6); T11, successor problem (3); T17, open direction
    10; the 9 November results and Leon's decisions; the mass-term
    and order-four results accepted 10 November
  statement: 'The Georgi-Jarlskog term is one grade-five element whose three factors are all present in the series, yet
    neither the family structure, nor the frozen point and its lifts, nor the bracket and its composites reach it. Derive
    the coupling of the rung vector to the pair-sector $\mathfrak u(1)$ current that would, or, on the registered Pati-Salam
    route, the antisymmetric coupling of the grade-three direction between the second and third families. On the Majorana
    route the open number is now located: it is the weight a dynamics gives to the $(15,1,1)$ part of the square $TT^{\dagger}$
    of the Majorana element relative to the rung vector''s $10$ term; given that part, the factor $3$ follows from the structure.'
  why: It is the two-term structure the no-go theorems say comes first; the family breaking acts on it second, so the CKM
    numbers, the light masses and the weight assignments (of order $10^{38}$ in Hubble units, the hierarchy problem restated)
    all wait on it.
  known: 'The frozen point and its lifts span an eight-dimensional algebra that fails to reach the $126$ (\claimref{standard-model.no-go-frozen-point-lifts-do});
    adding the bracket gives thirty-two dimensions and still not (\claimref{standard-model.bracket-composite-lands}); the
    family structure is closed in the negative (\claimref{families.imported-tree-relations-family-no-go}). The grade-three
    direction and its required family coupling are \claimref{standard-model.grade-three-georgi-jarlskog-direction} and \claimref{standard-model.fits-record-level}.
    The form of the coupling is derived; its strength is not. Under (S) the Majorana element''s moment map is $X/8$; its
    Pati-Salam pair component is the $B - L$ current, and the rung vector times its two components gives the Georgi-Jarlskog
    $126$ form together with the grade-three form with equal moduli, while the unsplit moment map gives only the $10$ relation
    (\claimref{synthesis.georgi-jarlskog-majorana-moment-map}). The Georgi-Jarlskog composite already appears at second
    order in a vev along the Majorana element, as part of $TT^{\dagger}$, with its coefficient not fixed (\claimref{synthesis.georgi-jarlskog-square-of-majorana-element}).
    If the Majorana sector is $S_{3}$-invariant the $126$ is family-blind on the light plane, while the residual $S_{2}$
    of the breaking direction allows exactly one $120$ family matrix, coupling the second and third families (\claimref{synthesis.residual-s2-fixes-120-family-form}).
    Neither result fixes the $126$ coefficient relative to the $10$. Three constraints from the run of 24 October. Couplings
    that respect the residual $S_{2}$, the single $120$ among them, share the eigenvector $(1, -1, 0)$ in every mass matrix,
    so they give no Cabibbo angle; the $120$''s family form is fixed only at the $S_{2}$ stage, and the second stage must
    break $S_{2}$ in the charged-fermion couplings (\claimref{synthesis.residual-s2-decouples-first-family-from-ckm-and-pmns}).
    At two loops every Dirac-type Yukawa, the $10$ and the $120$ included, shifts the three Pati-Salam couplings equally
    and moves neither $M_{I}$ nor $M_{U}$, so the gauge running cannot probe the $10$ or $120$ strengths (\claimref{synthesis.two-loop-running-cannot-fix-majorana-coupling}).
    The Majorana scaling $f \mapsto \lambda f$, $w \mapsto w/\lambda$ keeps $w_{d}f$ fixed and so does not free the $126$
    coefficient (argued, not filed); no proof that the coefficient is independent of the stored structure was found then (see 9 November). The
    degree-four part $G_{4}$ of $TT^{\dagger}$ splits into Pati-Salam parts: the pair-only part $P_{4} = \tfrac{3}{32}(B
    - L)(-1)^{N_{P}}$ in the $(15,1,1)$, the pair-rung part $X_{4} = 8\mu_{R}\mu_{P}$ in the $(15,1,3)$ and the rung-only
    part $-\chi/32$, a singlet. On the sixteen the rung vector times $P_{4}$ is exactly $-\tfrac{3}{32}$ times the Georgi-Jarlskog
    operator, with no $10$ and no $120$ component, because pair elements of degree two and four are traceless on each Pati-Salam
    quartet; so given the $(15,1,1)$ part the factor $3$ is structural, not fitted. No weighting internal to the square
    fixes its coefficient: the symmetric forms of the three parts cancel, and $w_{4}G_{4}$ has no symmetric form at all
    (\claimref{synthesis.georgi-jarlskog-is-rung-vector-times-pair-part-of-majorana-square}; the stored statement that the
    unsplit square gives the $10$ relation is corrected to multiple zero, \claimref{synthesis.georgi-jarlskog-square-of-majorana-element}(iv)).
    The Dirac-neutrino entries hold on the halving $(-1)^{N}$ that the Pati-Salam stage forces (\claimref{synthesis.neutral-singlet-bit-decided-by-gauge-algebra-leaving-u5}).

    (9 November.) The $126$ weight is free on the stored relations (proved): operator functions of the
    Majorana element give the down-type rung vector only the $10$; the $(15,1,1)$ weight $b/a$ sets
    $m_{\mu}/m_{s}$ as $(32a + 3b)/(32a - b)$ and is $w_{d}f$ against $v_{d}Y$; the scaling $w_{d} \mapsto \mu
    w_{d}$ fixes every stored relation ((EW), the Majorana scale, Hypothesis (U) in its eigenvalue reading,
    the chain) and moves $\mathrm{Sym}(M_{d} - M_{e})$ by $\mu$, with models giving the factors $3$, $2$ and
    $37/19$ (\claimref{synthesis.georgi-jarlskog-weight-free-on-the-stored-relations}). So the third attack
    item is done, and the second family''s factor $3$ is an input of the record. Unlike the Majorana scaling
    $f \mapsto \lambda f$, $w \mapsto w/\lambda$ above, the scaling of $w_{d}$ alone moves $w_{d}f$.
    The weight is registered as a free input of the series by Leon''s decision of 9 November
    (\claimref{synthesis.down-type-126-weight-registered-free-input}).

    (10 November.) Mass terms in the mode language
    (\claimref{synthesis.mass-terms-are-pair-terms-of-the-arrays-and-only-the-charge-separates-majorana-from-dirac}).
    On four tower modes, two arrays, every mass term is a pair term. Among the charges of the block the Majorana
    (self) term differs from the Dirac (cross) term by its charge $2$ under the number that is opposite on the
    two arrays, the mode-level image of $[B - L, T] = -2T$, and by rank (the self term alone gives mass to two
    of the four modes, the cross term to all four); an automorphism of the mode algebra turns the block into
    number-conserving hopping, so the difference is a choice of charge and not a property of the block. The
    bilinear block has the seesaw quadratic exactly, with one-quantum energies $\sqrt{K^{2} + x^{2}}$, $x^{2} -
    Mx - m^{2} = 0$, for every $K$. The stored pairing gap is not identified with the Majorana scale: an
    explicit mass term has vanishing compression on the fixed-charge sectors of the gap theorem, whose clause
    (iii) concerns the mean-field mass of the paired array. Premise (M) is untouched: nothing here produces the
    Majorana term or its scale. Seen from the sixteen components, the Majorana element is odd under the
    pseudoscalar of the ten Majorana generators, with no compensation by the Standard Model group
    (\claimref{synthesis.order-four-elements-with-square-the-grading-and-the-majorana-element}).'
  attack:
  - Fix the weight of the $(15,1,1)$ projection of $TT^{\dagger}$ relative to the rung vector's $10$ term from one potential
    along the Majorana element, or from Pati-Salam invariance allowing one coupling per component (argued, not checked);
    no weighting internal to the square does it, since the symmetric forms of its three degree-four parts cancel.
  - On the Pati-Salam route, derive the strength of the $120$ coupling from a second stage of the breaking that is $S_{2}$-odd
    in the charged-fermion couplings (op.second-order-breaking); the residual-$S_{2}$ $120$ alone cannot supply the Cabibbo
    angle.
  - >-
    Done (9 November; \claimref{synthesis.georgi-jarlskog-weight-free-on-the-stored-relations}): the $126$ weight
    is free on the stored relations, so the second family's factor $3$ is an input of the record; a dynamics fixing it
    (the first two items) would add a relation.
  success: A derived coupling producing the $126$ coefficient relative to the $10$, or a no-go showing the series' structures
    cannot, which would make the second family's factor $3$ an input.
  entities:
  - synthesis.georgi-jarlskog-is-rung-vector-times-pair-part-of-majorana-square
  - synthesis.georgi-jarlskog-square-of-majorana-element
  - synthesis.georgi-jarlskog-majorana-moment-map
  - standard-model.grade-three-georgi-jarlskog-direction
  - standard-model.no-go-frozen-point-lifts-do
  - synthesis.residual-s2-fixes-120-family-form
  - synthesis.residual-s2-decouples-first-family-from-ckm-and-pmns
  - standard-model.majorana-element
  - synthesis.georgi-jarlskog-weight-free-on-the-stored-relations
  - synthesis.mass-terms-are-pair-terms-of-the-arrays-and-only-the-charge-separates-majorana-from-dirac
  - synthesis.order-four-elements-with-square-the-grading-and-the-majorana-element
