# ---------------------------------------------------------------- walls

- id: op.wall-class-invariant
  title: The torsion-sensitive invariant of tame walls of dimension four and more
  area: walls
  kind: research
  difficulty: substantial
  status: reformulated
  source: "T04, Conj 7.2 (the wall class); T01, Conj 7.9; seed/SYNTHESIS_GAPS.md, examined and not pursued; the wall results of 26 and 31 October; the lens-space test case settled 31 October; the 9 November results and Leon's decisions; the lens-space cohomology result, the imported Atiyah-Hirzebruch filtration and Leon's decisions of 9 November (second pass); the lens-wall rung-count results accepted 10 November (three rungs, the definite side of the L^5(4) walls, the cup-one computation), the imported Steenrod Fact and the tameness edges, by Leon's decisions of 9 November"
  statement: >-
    The invariant of tame walls is $W(\Sigma) = (w(\Sigma), w_{1}(\mathcal
    L))$, and the number $k(\Sigma)$ of adjoined hyperbolic planes (rungs) a
    completion needs satisfies $\mathrm{ht}(w_{1}\mathcal L) \le k(\Sigma) \le
    e(\mathcal L)$. The test case is settled: on the lens space $L(4,1)$ two
    rungs suffice when the physical side is indefinite and three are needed
    when it is definite. Decide the rung count for tame walls of dimension at
    least four: whether $k(\Sigma) = \mathrm{ht}(w_{1}\mathcal L)$ when the
    physical side is indefinite, and which integral datum decides it when the
    side is definite, now that the stable-range step of the lens-space proof
    no longer applies.
  why: >-
    It would turn "a completion never removes degeneracy, it relocates it"
    from a pattern seen in the tame corank-one case into a theorem with a
    measuring class and an exact price in rungs, the cohomological form of the
    series' founding claim.
  known: >-
    The coarse half is proved: on a connected manifold with a tame
    signature-change wall and two nonempty sides, every completion standard
    outside a neighbourhood of the wall degenerates somewhere
    (\claimref{sheaf.conservation-degeneracy-absolute-form}); the one-sided
    completion and shadow wall prove the pattern for tame corank-one
    degenerations (\claimref{sheaf.one-sided-completion}). Clause (a) of
    \claimref{sheaf.wall-class} cannot characterise a torsion-sensitive class
    in either reading: under the strict reading the clock mismatch $2 \in
    \mathbb{Z}_{8}$ obstructs every tame two-sided wall whatever the torsion,
    and if the exterior model may change signature nothing obstructs. With one
    rung, a completion restricting to $G$ along the wall exists if and only if
    $w_{1}(\mathcal L) = 0$
    (\claimref{synthesis.wall-class-one-rung-obstruction}); if the dying line
    extends over the physical side, the twisted wall induction transfers
    $w_{1}$ unchanged to every shadow wall
    (\claimref{synthesis.twisted-wall-induction-conserves-dying-line-class}).
    With $k$ rungs (proved, under the tameness hypotheses): a completion needs
    $w_{1}(\mathcal L)^{j} = 0$ for every $j \ge k$, so $k(\Sigma) \ge
    \mathrm{ht}(w_{1}\mathcal L)$, the least $j$ with $w_{1}(\mathcal L)^{j} =
    0$; if $\mathcal L$ is a subbundle of a trivial bundle of rank $k$ over
    the wall, $k$ rungs suffice with the twist confined to the collar, so
    $k(\Sigma) \le e(\mathcal L) \le \dim\Sigma + 1$; the store's torus wall
    needs exactly two, and a projective wall with tautological dying line
    needs $n + 1$
    (\claimref{synthesis.wall-rung-count-is-height-of-dying-line-class}, with
    the classical inputs
    \claimref{synthesis.imported-whitney-product-formula-and-projective-space}
    and
    \claimref{synthesis.imported-line-bundles-classified-and-cellular-approximation}).
    Clause (c) is answered in the sense proved there: the jump of the Clifford
    sheaf across the wall depends on $\mathcal L$ only through $\mathcal L
    \oplus \mathcal L$, which is trivial on the torus wall, so the sheaf-level
    Clifford class does not see the dying line that obstructs one rung there
    and $W(\Sigma)$ strictly refines it; that the class sees exactly
    $w_{1}(\mathcal L)^{2}$ in general is the Donovan-Karoubi remark, cited
    from memory and not proved beyond the torus wall. Clauses (a) to (c) are
    thus answered in these senses. Read against the founding pattern (argued):
    the class is carried to every shadow wall, but its obstructive force is
    absorbed by $\mathrm{ht}(w_{1}\mathcal L)$ to $e(\mathcal L)$ rungs, while
    the clock part $2 \in \mathbb{Z}_{8}$ is never absorbed. The test case is
    settled (proved, 31 October, given the Stiefel connectivity and
    Grassmannian classification imported as
    \claimref{synthesis.imported-stiefel-connectivity-and-grassmannian-classification}):
    on a tame wall with cross-section $L(4,1)$ and twisted dying line in four
    dimensions, where $\mathrm{ht}(x) = 2$ and $\mathcal L \oplus \mathcal L$
    is not trivial, two rungs suffice when the physical side is indefinite
    (the mod-2 lower bound is attained; the completion borrows one physical
    negative direction into the rungs through the adjoint frame of the
    half-turn rotor) and three are needed when it is definite; a three-torus
    wall with the same mod-2 data and a definite side needs two, so with a
    definite side the rung count is not a function of the mod-2 data and is
    decided by whether $\mathcal L \oplus \mathcal L$ is trivial, classically
    by the integral Bockstein $\beta x$ (cited from memory)
    (\claimref{synthesis.lens-space-wall-rung-count-sees-the-integral-twist}).
    Argued, not filed: for every tame wall with $\dim\Sigma \le 3$ (bundles of
    rank at least three over three-complexes classified by $(w_{1}, w_{2})$,
    from memory) $k(\Sigma) = \mathrm{ht}(x)$ except on a definite side with
    $x^{2} = 0 \neq \beta x$, where $k(\Sigma) = 3$; and the Clifford jump
    $\Cl(\mathcal L \otimes \R^{0,2})$ is read at the level of isomorphism
    classes on definite sides and of graded Morita classes on indefinite ones
    (Donovan and Karoubi, from memory). On walls of dimension at least four
    the stable-range step needs $\max(P, Q) \ge \dim\Sigma + 1$ and can fail,
    which leaves room for $\mathrm{ht}(x) < k(\Sigma) < e(\mathcal L)$ on
    indefinite sides. The rungs are hyperbolic planes
    (\claimref{obj.std-algebra.hyperbolic-plane}), and the mod 8 entry of the
    graded Brauer class is the index $p - q \bmod 8$ of the real Clifford
    classification (\claimref{std-algebra.periodicity}).

    (9 November.) Attack item 1 is answered in the negative on lens-space walls, given classical facts on lens
    spaces that are cited from memory and are not in the store (the integral and mod-2 cohomology rings of
    $L^{2n+1}(4)$ and its tangent bundle, the spin class $q_{1}$ with $2q_{1} = p_{1}$, the complex K-ring
    with its lambda-operations, and $Sq^{1}$ on classes that lift to $\mathbb{Z}_{4}$), which both results
    state as explicit hypotheses. Two rungs force $\mathcal L \oplus \mathcal L$ to be stably trivial on every
    side, and a definite side needs exactly $e(\mathcal L)$ rungs; on $L^{2m+1}(4)$, $m \ge 2$, the spin class
    $q_{1} = 2y^{2}$ of $\mathcal L \oplus \mathcal L$ is nonzero, so these walls need at least three rungs
    with any physical signature, the store's physical type $(1, 2m+1)$ included, although $\mathrm{ht}(x) =
    2$: on indefinite sides $k(\Sigma) > \mathrm{ht}(w_{1}\mathcal L)$ from dimension five, where complex
    K-theory is still blind; only the necessity of stable triviality is proved
    (\claimref{synthesis.two-rungs-need-the-doubled-dying-line-stably-trivial}). A $k$-rung completion forces
    $2^{k-1}(1 - \xi) = 0$ in the K-theory of the wall, $\xi$ the complexified dying line, on every side; on
    $L^{2n+1}(4)$ this gives $k(\Sigma) \ge 1 + \lfloor n/2 \rfloor$, so the excess of the rung count over the
    mod-2 height is unbounded (\claimref{synthesis.lens-space-walls-need-more-rungs-than-the-mod-two-height}).
    Neither result gives the exact rung count of these walls, which lies between these lower bounds and
    $e(\mathcal L)$, nor shows that $W(\Sigma)$, $\beta x$ and the signature leave it undetermined. By Leon's
    decision of 9 November the lens-space inputs are to be derived in the store, not imported; until then both
    results keep them as hypotheses, flagged at every level.

    (9 November, second pass.) Most of the lens-space inputs are now derived in the store, on a stated
    background of cellular cohomology and obstruction theory: from the equivariant cell structure of the sphere
    under the quarter turn and an explicit diagonal approximation, the integral and mod-2 cohomology rings of
    $L^{2n+1}(4)$ with $x^{2} = 0$ computed directly, the integral Bockstein $\beta x = 2y$, the vanishing of the
    Bockstein of $\mathbb{Z}_{2} \to \mathbb{Z}_{4} \to \mathbb{Z}_{2}$, the Euler classes $\pm y$ and $\pm 2y$
    of the quarter-turn and half-turn plane bundles and the stable tangent class $T\Sigma \oplus \R \cong
    (n+1)\eta$; and, given the Atiyah-Hirzebruch filtration of complex K-theory, which by Leon's decision is
    imported as one general Fact (\claimref{synthesis.imported-atiyah-hirzebruch-filtration-of-complex-k-theory}, cited from
    memory), the K-ring $\Z[\chi]/(\chi^{4} - 1, (\chi - 1)^{n+1})$, with the order of $1 - \chi^{2}$ equal to
    $2^{\lfloor (n+1)/2 \rfloor}$ for $n \le 14$ (computed)
    (\claimref{synthesis.cohomology-of-the-quarter-turn-lens-spaces-from-the-equivariant-cell-structure}).
    Not derived: the spin class $q_{1}$ (by decision not imported) and the lambda-operations of K-theory. Both
    lens-space wall results now cite that theorem (version 2 of each): the two-rung result is conditional on
    $q_{1}$ alone among the classical inputs, and the K-theory result on the lambda-operations, its use of
    $Sq^{1}$ being replaced by the direct $x^{2} = 0$. A search for a wall on which the rung count is not
    determined found none (argued, not filed): among lens spaces, their products with tori and projectivised
    flat bundles, every pair with the same $x$, $\beta x$, $(\beta x)^{2}$ and $q_{1}$ and different bounds on
    $k$ is separated by a cup power of a class $a$ with $2a = \beta x$; for instance $L^{31}(4)$ against
    $L^{7}(4) \times T^{24}$, with $k \ge 8$ against $k \le 6$ by the stored bounds, is separated by $a^{4}$,
    since classes pulled back from the smaller lens space keep $y^{4} = 0$. Conjectured on the lens family
    only: $k$ depends on $(\Sigma, x)$ through the height of $a$ (there the order of $1 - \chi^{2}$ is a
    function of $\mathrm{ht}(y) = n + 1$). So as numerical data ($\mathrm{ht}(x)$, the order of $\beta x$,
    $(\beta x)^{2}$) the stored results already show that $k$ is not determined, while no counterexample to
    determination by the integral ring data is in sight; the success clause is sharpened accordingly (Leon's
    decision). On a definite side the exact count is an equivariant index (argued from the stored clauses
    $k = e(\mathcal L)$ and the subbundle criterion): a line subbundle of the trivial bundle of rank $k$ is a
    $\mathbb{Z}_{2}$-equivariant map from the double cover of the wall defined by $x$ to $S^{k-1}$ with the
    antipodal action, so $k$ is one plus the least $j$ for which such a map to $S^{j}$ exists.

    (10 November.) Three rungs fail on every side of the quarter-turn lens walls from dimension five. A
    three-rung completion gives a plane bundle $N$ with $w_{1}(N) = x$, and where $H^{2}(\Sigma; \Z^{x}) = 0$ it
    forces $\mathcal L \oplus \mathcal L$ to be stably trivial, as two rungs do; on $L^{2n+1}(4)$ the twisted
    group vanishes (computed in the stored cell model, on the stored cellular background extended by local
    coefficients, an extension stated there and not stored) and the doubled line is not stably trivial, by the
    stored K-ring for $n \ge 3$ and, in dimension five, given the spin class $q_{1}$. So $k(\Sigma) \ge 4$ for
    $n \ge 2$ with any physical signature, the physical types $(1, 2n+1)$ included
    (\claimref{synthesis.three-rungs-do-not-complete-the-quarter-turn-lens-walls-on-any-side}). On the
    $L^{5}(4)$ walls an explicit map into five components that is odd under the quarter turn, written in
    $\Cl(6,0)$, gives $e(\mathcal L) \le 5$, so $4 \le k \le 5$ on every side (the lower bound given $q_{1}$);
    blocks of such maps give $e(\mathcal L) \le \lceil 3(n+1)/2 \rceil$ on $L^{2n+1}(4)$
    (\claimref{synthesis.definite-side-rung-count-on-the-quarter-turn-lens-wall-of-dimension-five}). On the
    definite side of the $L^{5}(4)$ walls $k = 5$: there is no four-component map odd under the quarter turn, by
    an exact cup-one computation in the stored cell model (on the sphere bundle whose sections are the odd maps,
    the cup-one square of the fibre class is the pull-back of the top class $xu^{2}$, which no section allows),
    given Steenrod's theorem that the cup-one square is a natural operation, imported as one Fact by Leon's
    decision of 9 November
    (\claimref{synthesis.imported-steenrod-cup-one-square-is-a-natural-cohomology-operation}, cited from memory,
    primary texts not read), and the stated cellular backgrounds
    (\claimref{synthesis.no-quarter-turn-odd-map-from-the-five-sphere-to-four-components}). The definite-side
    result keeps a second route to the same lower bound, through Steenrod squares, Chern classes and Thom
    spaces, conditional on those and not stored; nothing rests on it. On $L^{7}(4)$: $4 \le k \le 6$ on every
    side and $5 \le k \le 6$ on the definite side; the value $6$ there is prior art (Stolz 1989, the level of
    real projective spaces), known here from secondary sources only, not derived and not imported. The
    equivariant-index attack item is done as a reduction (proved): on a definite side $k$ is the least number of
    components of a map of the sphere that changes sign under the quarter turn. The same computation for the
    group of order eight finds no obstruction, and from the orders four and eight only it is conjectured that
    the secondary obstruction to four rungs on general walls is $x \cup \rho(a)^{2}$ for a class $a$ with $2a =
    \beta x$, $\rho$ the reduction modulo $2$. These bounds replace the stored window $3 \le k \le 6$ on
    $L^{5}(4)$ and $L^{7}(4)$. Both new rung-count results carry the tameness premise as an assumes edge (Leon's
    decision of 9 November).
  attack:
    - >-
      Answered in the negative (9 November) on lens-space walls, given the
      spin class $q_{1}$ or the lambda-operations of K-theory, the
      cohomology rings and the K-ring being now stored
      (\claimref{synthesis.cohomology-of-the-quarter-turn-lens-spaces-from-the-equivariant-cell-structure}):
      $k(\Sigma) > \mathrm{ht}(w_{1}\mathcal L)$ on indefinite sides from
      dimension five
      (\claimref{synthesis.two-rungs-need-the-doubled-dying-line-stably-trivial}),
      with unbounded excess
      (\claimref{synthesis.lens-space-walls-need-more-rungs-than-the-mod-two-height}).
      What remains of the item is the exact rung count on such walls,
      between those lower bounds and $e(\mathcal L)$, and the ring datum
      that decides it: $k$ as a function of the ring data of a class $a$
      with $2a = \beta x$ (conjectured on the lens family: through the
      height of $a$), or a pair of walls with isomorphic data and different
      $k$. (10 November: on the quarter-turn lens walls the lower bound is
      four from dimension five, in dimension five given $q_{1}$,
      \claimref{synthesis.three-rungs-do-not-complete-the-quarter-turn-lens-walls-on-any-side}.)
    - >-
      File the table for $\dim\Sigma \le 3$: import the classification of
      bundles of rank at least three over three-complexes by $(w_{1}, w_{2})$
      as a Fact and prove $k(\Sigma) = \mathrm{ht}(x)$ except on definite
      sides with $x^{2} = 0 \neq \beta x$, where $k(\Sigma) = 3$. The
      item needs that classification as a Fact; Leon decided on 9 November
      that the lens-space inputs are derived in the store rather than
      imported, and an import here would need a decision of the same kind.
    - >-
      Prove the general form of clause (c): that the graded Brauer class of
      the Clifford sheaf's jump is $(-2 \bmod 8, 0, w_{1}(\mathcal L)^{2})$,
      importing Donovan and Karoubi's description as a Fact.
    - >-
      Derive what remains of the lens-space inputs (restated 9 November,
      second pass): the spin class $q_{1}$ generating
      $H^{4}(B\mathrm{Spin}; \mathbb{Z})$, natural and stable, with
      $2q_{1} = p_{1}$ and $p_{1} = e^{2}$ for oriented plane bundles (not
      imported, by Leon's decision; the two-rung result is conditional on
      it), and the lambda-operations of complex K-theory (the K-theory
      result is conditional on them). The cohomology rings, the Bockstein,
      the stable tangent class and, given the imported Atiyah-Hirzebruch
      filtration, the K-ring are derived
      (\claimref{synthesis.cohomology-of-the-quarter-turn-lens-spaces-from-the-equivariant-cell-structure});
      the cellular background of that derivation (cellular cohomology, the
      comparison theorem, obstruction classes) stays a stated hypothesis.
    - >-
      Done as a reduction (10 November): on a definite side the exact rung count is the least number of
      components of a map of the sphere that changes sign under the quarter turn (proved,
      \claimref{synthesis.definite-side-rung-count-on-the-quarter-turn-lens-wall-of-dimension-five}, clause
      (1)), and on the $L^{5}(4)$ walls it is $5$ (the explicit five-component map; no four-component map, given
      the imported Steenrod Fact,
      \claimref{synthesis.no-quarter-turn-odd-map-from-the-five-sphere-to-four-components}). What remains: the
      indefinite sides of the $L^{5}(4)$ walls, where $k$ is $4$ or $5$ (whether four rungs suffice is an
      unstable question about a bundle of rank three, which $w_{1}$ does not fix); the $L^{7}(4)$ walls, $4 \le
      k \le 6$, on the definite side $5$ or $6$ ($6$ by Stolz 1989 as prior art, not derived), where a
      computation in the stored cell model needs a cup-two product; the conjectured secondary obstruction $x
      \cup \rho(a)^{2}$ for $2a = \beta x$ on general walls; and the rung count as a function of the ring data
      in general.
  success: >-
    The exact rung count $k(\Sigma)$ of every tame wall of dimension at least
    four as a function of the ring data of the wall: the integral cohomology
    ring with $x = w_{1}(\mathcal L)$ and, where $x^{2} = 0$, a class $a$
    with $2a = \beta x$ (defined up to 2-torsion), together with the
    physical side's signature; or a pair of walls with isomorphic data and
    different $k$.
