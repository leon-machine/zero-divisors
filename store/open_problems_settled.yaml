- id: op.derive-gravitational-action
  title: Derive the field space of the gravitational action, the connections preserving the frozen point, from transport
  area: einstein
  kind: research
  difficulty: frontier
  status: settled
  source: "Leon's decision of 31 October, settling op.scale-selection-principle given the imported MacDowell-Mansouri action and matter coupling; the gravitational-action results of 31 October and Leon's decisions on them (import (b) reworded to the field space, the Euler exclusion kept in normalisation form, Lambda fixed by the frozen point); settled as negative by Leon's decision of 1 November, after the field-space results of 1 November: the field space is an independent premise"
  statement: >-
    The store reaches Einstein's equations with $\Lambda$ from the
    MacDowell-Mansouri functional in the series' frozen-point form,
    $S \sim Q(I)^{-1}\int\epsilon(I, V, F, F)$, varied over the connections
    of the $\Cl(2,4)$ gauge field that preserve the frozen point $I$, with the
    imported Einstein-Cartan matter coupling
    (\claimref{synthesis.macdowell-mansouri-principle-fixes-the-trace-free-part}).
    What carries Einstein's equations is that field space, not the
    integrand: on the series' own transport, the normal tractor connection of
    a torsion-free field, the same integrand is a quarter of the Weyl square,
    whose field equations are the Bach equations
    (\claimref{synthesis.frozen-point-integrand-on-tractor-transport-is-weyl-squared}).
    Derive the field space (connections preserving $I$, with no inverse frame)
    from transport or from the series' objects (the frozen point, the
    canonical tractor, the $\Cl(2,4)$ tractor gauge field), and with it the
    action and the matter coupling; or show that no principle on them gives
    it, which would record the action as a permanent import.
  why: >-
    As it stands Einstein's equations enter this route through a variational
    premise: the series supplies the integrand $\epsilon(I, X, F, F)$, the
    prefactor $1/Q(I) = 3/\Lambda$ and the field-space datum $I$, and the
    action is transport-convenient, not transport-essential. A derivation of
    the field space would give the field equations, and with them the
    infinity-vacuum incidence, from the series rather than by adoption. It
    has to fit the Clausius route, whose (Loc) excludes the Euler term that
    the action's Wald entropy carries; that exclusion is now recorded as a
    normalisation, so the two routes agree on every entropy change.
  known: >-
    Settled as negative (Leon, 1 November): the field space is an
    independent premise, recorded as Premise (FS)
    (\claimref{synthesis.field-space-premise-parallel-frozen-point}): the
    varied gravitational connection, a $\Cl(2,4)$ gauge field with
    nondegenerate soldering, admits a parallel tractor $I$ with
    $\ip{X}{I} = 1$ (the physical scale), a holonomy reduction to the
    stabiliser of $I$ (Fact
    \claimref{synthesis.imported-holonomy-reductions-of-cartan-geometries}).
    The gravitational action is the imported functional (Fact
    \claimref{dark-energy.imported-macdowell-mansouri-theorem-stelle-west})
    in the series' frozen-point form plus (FS); it is transport-convenient,
    not transport-essential. No route derives (FS); each result below is a
    premise exchange, a negative result or a comparison, and none presupposes
    the Einstein condition. Results of 31 October: the functional's frame
    equation is $E(a) = 2(\mathcal{G}(a) + \Lambda a)I$, rank ten with kernel
    the Weyl part, and with the imported matter coupling its on-shell Schouten
    tensor is the stored derivative of the scale tractor
    (\claimref{synthesis.macdowell-mansouri-principle-fixes-the-trace-free-part});
    among densities of the tractor gauge field that are polynomial, use no
    inverse frame, depend on the connection only through its field strength
    and are gauge invariant, with the connection reduced by $I$ and the
    canonical tractor added, the combined spacetime and internal parity
    selects $\epsilon(I, X, F, F)$ up to normalisation, the Euler term in
    fixed ratio, and without that parity uniqueness is equivalent to a
    torsion-free coupling; the no-inverse-frame hypothesis forces the
    reduction only for slots that are functions of $(\hb, \Omega)$
    (\claimref{synthesis.curvature-only-tractor-actions-are-macdowell-mansouri},
    clause (vi) as reworded); on transport the frozen-point integrand is
    $\ip{X}{I}\,\tfrac14 W_{abcd}W^{abcd}$ for every torsion-free field,
    conformal gravity with the Bach equations
    (\claimref{synthesis.frozen-point-integrand-on-tractor-transport-is-weyl-squared});
    in BF form with breaking on the Lorentz block the functional is flat
    transport broken on the blade $I \wedge X = \nInf \wedge \nO$, agreeing
    with the stored functional only in vacuum, with $\alpha N^{2}$ a
    convention
    (\claimref{synthesis.frozen-point-action-is-bf-transport-broken-by-the-blade-i-wedge-x});
    the Stelle-West norm is no local output within constant couplings, and
    $\Lambda = 3Q(I)$ stays fixed by the frozen point, the registered input
    $N$ (\claimref{synthesis.stelle-west-norm-is-no-local-output}); inverting
    the Clausius route with the metric as varied field gives
    Einstein-Hilbert with $G = 1/(4\eta)$ and a fixed $\Lambda$, the coupled
    system being variational exactly when the heat tensor is the Hilbert
    stress (\claimref{synthesis.inverse-problem-for-the-clausius-route});
    the Euler part of a patch's Wald entropy is one topological constant per
    patch, removed by the normalisation (Z)
    (\claimref{synthesis.euler-entropy-of-a-horizon-patch-is-an-edge-term});
    the frozen-point density is the reduction of the five-dimensional
    Chern-Simons form with a fixed radion, a relocation, not a derivation
    (\claimref{synthesis.macdowell-mansouri-is-the-frozen-point-reduction-of-five-dimensional-chern-simons});
    the induced-gravity route through the spectral action is negative (no
    stored result). Results of 1 November, the four equivalent readings of
    (FS) and the closed routes. Assembly: a $\Cl(2,4)$ gauge field built from
    $(\hb, \Omega)$ and no further field (T), covariant under the group of
    gauge theory gravity, soldered, and either polynomial with no inverse
    frame (P) or of order zero (O), is
    $\Omega - \nInf \wedge \hb^{-1} + \rho\,\nO \wedge \hb^{-1}$ with $\rho$
    constant, preserving $\nInf + \rho\nO$ for every field; the series'
    transport satisfies (T) and violates (P) and (O), in the special-conformal
    slot only, and meets the family exactly on Einstein fields; (T) is
    needed, and under the parabolic group the reduction is a gauge choice
    (\claimref{synthesis.inverse-frame-free-tractor-gauge-field-preserves-a-frozen-point}).
    The slot: on torsion-free fields the integrand sees only the Lorentz
    block; varying the whole special-conformal slot returns the Schouten slot
    of the normal tractor connection and the Weyl square (the
    Kaku-Townsend-van Nieuwenhuizen elimination, proved in the series), and
    Einstein's equations with $\Lambda = 6\rho$ come out exactly when the
    symmetric part of the slot is frozen at $\rho\,\id$, $\rho \neq 0$;
    freeing the trace leaves $\tfrac14 E_{4} - \tfrac{1}{24}R^{2}$, freeing the
    trace-free part adds $\tfrac12|\Ric_{0}|^{2}$; the dilation and the
    antisymmetric slot are inert, and every row satisfies (P)
    (\claimref{synthesis.frozen-point-integrand-gives-einstein-only-with-the-symmetric-slot-frozen}).
    Gauge theory gravity: the connections preserving a constant tractor are
    exactly GTG's pairs, and on them the $\Omega$-equation is the torsion
    equation, so the independence of $\hb$ and $\Omega$ decides only the
    torsion (spin) equation and the frozen slot $\rho\,\hb^{-1}$ carries
    Einstein's equations; "field space = GTG's gauge principle" fails in its
    strong form
    (\claimref{synthesis.frozen-point-field-space-is-the-gtg-pair-and-its-omega-equation-is-the-torsion-equation}).
    Higgs reading: the stored Stelle-West family, and any curvature-independent
    slot potential, keeps the frozen slot stationary only on Einstein fields
    or on one line of couplings where the frozen value is the Euler form; a
    polynomial stiffness penalty interpolates from conformal gravity to the
    frozen-point functional, finite stiffness adding a Weyl square of
    relative size $3/(4\mu\Lambda)$, and a multiplier imposing $DI = 0$ is
    the premise itself: (FS) is the infinitely stiff frozen point
    (\claimref{synthesis.frozen-point-reduces-the-connection-only-when-infinitely-stiff}).
    Duality: the duality complex structure acts only on the Lorentz algebra,
    shared by every field space, and every chirality of the integrand
    returns the Schouten slot; Plebanski and Ashtekar take the first-order
    field space as input
    (\claimref{synthesis.duality-complex-structure-does-not-reach-the-frozen-point}).
    Matter regions: in the physical scale the frozen point is parallel for a
    soldered connection exactly when the slot is $\tfrac{\Lambda}{6}\id$ with
    no dilation; on shell for the frozen-point functional with the imported
    matter coupling the series' transport differs by
    $4\pi G(T - \tfrac{\tau}{3}g)$; the scale clause is needed; sections of
    every norm exist, so topology selects nothing; adopting (FS) implies the
    registration condition of the $w = -1$ prediction, the converse holding
    only on its kinematic reading
    (\claimref{synthesis.parallel-frozen-point-on-matter-regions-is-the-field-space-premise}).
    Recorded with the settlement: clause (iii) of the registration result now
    names the connection preserving $I$ and the physical scale and assumes
    (FS) (\claimref{dark-energy.vacuum-region-registration-condition}); on
    the reduced field space $\Lambda$ is a constant parameter and $w = -1$ is
    the $\Lambda$CDM equation of state, so a confirmed $w = -1$ is not
    independent evidence for (FS), while $w \neq -1$ would refute it and
    $\Lambda$CDM (\claimref{pred.dark-energy-w-minus-one}). The matter
    coupling's spin part is the Einstein-Cartan choice already made by the
    definition of a gravitational field (first-order $\Omega$, vanishing
    torsion a field equation for spinless matter;
    \claimref{obj.synthesis.gtg-flat-spacetime-gauge-fields}, note), and its
    energy part the identification of the heat tensor with the Hilbert
    stress; the exclusion of the Euler term from horizon entropy stays the
    normalisation (Z) (\claimref{synthesis.c-loc-local-horizon-premise}).
    Every normalisation met (Newton's constant, $\alpha$, the Chern-Simons
    level times the reduced length) is free; none is related to $N$.
  attack:
    - >-
      Settled as negative (1 November): the field space is the independent
      Premise (FS), and the gravitational action is the imported functional
      plus (FS), transport-convenient, not transport-essential. No successor
      problem is opened. A future derivation of (FS) from the series'
      structure, or a refutation of it (a confirmed $w \neq -1$, a confirmed
      departure from Einstein's equations with constant $\Lambda$ where the
      action applies, or a derivation that the gravitational connection has
      no parallel tractor of unit pairing with $X$ off the Einstein region),
      would reopen it.
  success: >-
    A derivation from transport or the series' objects of the field space of
    connections preserving $I$, which with the curvature-only classification
    under combined parity gives the frozen-point MacDowell-Mansouri functional,
    together with the spin part of the matter coupling; or a proof that no
    principle on them gives the field space, which would record the
    gravitational action as a permanent import.
  entities:
