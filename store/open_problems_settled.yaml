  - synthesis.clausius-route-newton-constant-is-residue
  - synthesis.black-hole-data-do-not-fix-field-equations
  - synthesis.einstein-condition-is-infinity-vacuum-incidence
  - synthesis.boundary-mode-first-law-of-entanglement
  - scrambling.epoch-modular-period-two-unknowns-become
  - hawking.i-state
  - synthesis.kerr-ring-count-misses-area-law
