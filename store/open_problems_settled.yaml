- id: op.henneaux-teitelboim-promotion
  title: "The promotion decision: what kind of number N is"
  area: dark-energy
  kind: research
  difficulty: substantial
  status: settled
  source: "T10, successor problem (5); T12, successor problem (5); T17, open direction 8; maintainer decision of 23 October"
  statement: >-
    Under the action as written $\Lambda$ is fixed before variation, so
    $N = M_P\sqrt{3/\Lambda}$ is a parameter of the laws, not initial data.
    Decide whether to adopt the Henneaux-Teitelboim promotion, which makes the
    Stelle-West norm the value of a Lagrange-multiplier field with $d\Lambda = 0$
    as an equation of motion; if adopted, recompute the Goldstone count with
    the norm mode and its conjugate time, and name the measure over $\Lambda$.
  why: >-
    It decides whether "why this $\Lambda$" is a question within one theory at
    all, whether the dating of the descent and the initial-data readings stand,
    and whether the descent measure is a measure within a theory or over
    theories.
  known: >-
    \claimref{dark-energy.under-action-written-norm-parameter-laws} proves $N$
    is (P) for the action as written and exhibits exactly one non-gauge norm
    mode when $\Lambda$ may vary, which needs an equation the action does not
    supply. The ascent constrains the frozen point only through its norm, so
    neither sign nor size of $\Lambda$ is produced by it. Under the promotion
    the norm mode becomes that reduction's one global pair $(\Lambda, \tau)$
    with no local mode, the Goldstone count stays nine against nine, $N$
    becomes initial data, and the only measure the promotion names, the
    Liouville density per unit $\tau$, is flat in whichever function of the
    norm is promoted (\claimref{synthesis.promoted-norm-one-global-pair}). For
    the frozen-point action the Euclidean action of an Einstein instanton is
    $I_{\mathrm{EH}} + \tfrac{\chi}{2}\pi N^{2} \ge 0$, and the time conjugate
    to the norm advances by the Weyl-squared integral in vacuum, so it stands
    still on de Sitter space, and by the Euler-density excess
    $E - 8\Lambda^{2}/3$ with matter, so it runs on every FLRW cosmology with
    dust or radiation; it is not monotone (for dust it changes sign at
    $8\pi G\rho = \Lambda$), so it is a record of the history and not a time
    ordering it; with a no-boundary weight the action favours no small
    $\Lambda$ (\claimref{synthesis.promoted-norm-weyl-clock-flat-weight}). On
    the Clausius route alone $\Lambda$ is an integration constant and $N$ is
    initial data with no promotion; the route's solution set is the promoted
    one, what the promotion adds over it is the conjugate time and the
    Liouville density, and the action as written supplies the law
    $\Lambda = \Lambda_{0}$ that restores (P); once $N$ is initial data, $v/H$
    and $v/M_{P}$ cannot both be parameters of the laws
    (\claimref{synthesis.einstein-route-makes-n-initial-data}). Settled by the
    maintainer decision of 23 October: the promotion is adopted, with $v/H$
    kept as the law. $N$ is initial data, dated to the origin; $v/M_{P}$ is
    initial data with $Gv^{2}N^{2} = (v/H)^{2}$ a law; the recomputed count is
    nine against nine with the one global pair; the measure named is the flat
    Liouville density, and a normalisable measure over $\Lambda$ would need a
    further number; the conjugate time is the Euler-density excess, a record
    of the history; and the smallness of $\Lambda$ is declared outside the
    series. The consequences are carried into
    \claimref{programme.n-parameter-of-the-laws},
    \claimref{standard-model.dating-descent} and
    \claimref{synthesis.rung-unit-second-free-number}.
    Note (1 November): the branch is reversed for the weak scale. The stored
    D-term action, read under the promotion, has the level $\xi$ (strictly
    $\xi G$) as a constant, so $v/M_{P}$ is the law and $v/H$ is initial data;
    $Gv^{2}N^{2} = (v/H)^{2}$ is an identity, not a law
    (\claimref{synthesis.constant-d-term-level-fixes-weak-scale-against-planck-under-promotion});
    the premise is restated accordingly.
  attack:
