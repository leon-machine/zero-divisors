    orientation is initial data, using as its last premise that the
    alternatives kinematic, dynamical and initial-data are exhaustive. T10
    proves they are not: a conserved quantity that is neither kinematic,
    dynamical nor initial data is a parameter of the laws. Remove the
    dependence or restate the conclusion.
