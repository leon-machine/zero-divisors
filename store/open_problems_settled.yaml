- id: op.scale-selection-principle
  title: A dynamical principle for the whole gauge field that fixes the trace-free part
  area: einstein
  kind: research
  difficulty: frontier
  status: settled
  source: "Run target ein.infinity-vacuum-incidence, reformulated by the maintainer decision of 23 October; restated by Leon's decision of 26 October after the scale-action no-go; settled by Leon's decision of 31 October, given the imported MacDowell-Mansouri action and matter coupling"
  statement: >-
    The Einstein condition reads, in the store, as the own-ray incidence of
    the infinity vacua
    (\claimref{synthesis.einstein-condition-is-infinity-vacuum-incidence}),
    which holds exactly when the scale tractor is parallel
    (\claimref{synthesis.infinity-vacuum-incidence-is-a-property-of-the-scale}).
    The positive structure's symmetry and the natural actions of the scale
    alone do not select the almost-Einstein scale. Find a dynamical principle
    for the whole gauge field $\hb$, not for the scale within a fixed
    conformal class, whose field equations fix the trace-free part of the
    curvature, so that the incidence, and with matter the field equations,
    follow from it rather than being a rewriting of them; or show that no
    principle on the series' objects does.
  why: >-
    This is the route that would read general relativity and quantum theory
    as two readings of one relation, with no thermodynamics. It stopped at the
    choice of scale within the conformal class, and the scale-only principles
    are excluded, so the remaining route was a principle for the whole field;
    the trace-free part is exactly what the curvature-independence of (Loc)
    selects on the Clausius route.
  known: >-
    Point vacua stay point vacua along their own light rays in every
    gravitational field; infinity vacua do exactly when the derived metric is
    Einstein. By the almost-Einstein characterisation the incidence holds
    exactly when the scale tractor $I' = I_{g} + \tfrac{J}{4}X$ is parallel,
    and with matter $\nabla_{a}I' = 4\pi G\,(0, T^{\circ}_{ab},
    \tfrac{1}{12}\nabla_{a}\tau)$, a rewriting of the field equations
    (\claimref{synthesis.infinity-vacuum-incidence-is-a-property-of-the-scale}).
    A stress tensor read linearly and covariantly off the vacua's first-order
    classes is a relabelling of the curvature or pure trace
    (\claimref{synthesis.vacuum-field-stress-tensor-is-einstein-tensor-or-trace}).
    The no-go for scale-only principles (26 October): the symmetry of the
    positive Hermitian structure fixes no scale tractor, the Einstein-Hilbert
    action restricted to the conformal class has the single Yamabe equation,
    and the tractor Dirichlet functional gives stationary scales that are not
    parallel
    (\claimref{synthesis.positive-structure-and-natural-scale-actions-do-not-select-the-almost-einstein-scale}).
    Settled (31 October), given an imported action principle: the
    MacDowell-Mansouri functional (Fact
    \claimref{dark-energy.imported-macdowell-mansouri-theorem-stelle-west}),
    in the series' frozen-point form $S \sim Q(I)^{-1}\int\epsilon(I, V, F, F)$
    (\claimref{dark-energy.frozen-point-makes-stelle-west-vector}), varies the
    whole field $(\hb, \Omega)$; its frame equation is
    $E(a) = 2(\mathcal{G}(a) + \Lambda a)I$, rank ten on the curvature with
    kernel the Weyl part, so it fixes the trace-free part, and its restriction
    to pure dilations is the single Yamabe trace of the scale-only no-go; with
    the imported Einstein-Cartan matter coupling (Fact
    \claimref{synthesis.imported-einstein-cartan-matter-coupling}) and an
    independently given stress tensor its on-shell Schouten tensor is
    $\tfrac{\Lambda}{6}g - 4\pi G(T - \tfrac{\tau}{3}g)$, the stored derivative
    of the scale tractor, and in vacuum the scale tractor is parallel: the
    infinity-vacuum incidence is its vacuum case
    (\claimref{synthesis.macdowell-mansouri-principle-fixes-the-trace-free-part}).
    The answer is transport-absent: adopting the functional adopts Einstein's
    equations as a variational premise, and the series contributes only the
    frozen-point presentation (prefactor $1/Q(I) = 3/\Lambda$). It agrees with
    the Clausius route on the field equations and differs on the entropy, since
    its Wald entropy carries the Euler term that (Loc) excludes. Deriving the
    functional from transport or the series' objects is
    op.derive-gravitational-action.
  attack:
    - >-
      Settled given the imported action. Successor: op.derive-gravitational-action.
  success: >-
    A stated dynamical principle for the whole gauge field, not a rewording of
    the parallel-tractor condition, whose field equations fix the trace-free
    part and give the matter law with an independently given stress tensor;
    or a proof that no principle on the series' objects does.
