- id: op.collapsing-hole-state
  title: A thermal condition for holes formed by collapse
  area: thermality
  kind: research
  difficulty: substantial
  status: settled
  source: "The null ground-state premise (N+) and its scope, 23 October; settled by the collapse results of 26 October (Leon's decision)"
  statement: >-
    Premise (N$_{+}$) (\claimref{synthesis.n-plus-null-ground-state}) covers
    the eternal (Kruskal) hole: it is a Hartle-Hawking-type regularity
    condition on the whole generator of the extended solution. A hole formed
    by collapse has horizon generators with no $u < 0$ half, and its physical
    state is not a ground state for the null translations on the horizon.
    State and justify an Unruh-type condition for such holes, on the outgoing
    (Kruskal $U$) direction near the horizon, and derive from it the Hawking
    flux at temperature $\kappa/2\pi$ on the series' continuum mode space.
  why: >-
    Astrophysical holes form by collapse. Without such a condition the
    series' Hawking temperature for them rests on (R) as a separate premise,
    and (N$_{+}$) does not replace it there.
  known: >-
    Settled (26 October), at the level the problem asks, on the per-light-ray
    chiral carrier. The condition is (N$_{+}$) itself, in its short-distance
    form, posed on the ingoing sheet through each point of the future
    horizon, whose generator has both halves (the missing past half of the
    horizon is never used); it is part of the scope of (N$_{+}$), not a new
    premise. With the outgoing sector reduced to one chiral CAR field per
    light ray (the postulate J3,
    \claimref{hawking.joint-j3-s-wave-reduction}), the Kruskal function
    $U = -e^{-\kappa t}(s - 1)e^{s^{2}/2 + s}$ of the Painlev\'e-Gullstrand
    gauge is a regular parameter on that generator, dilated at rate $\kappa$
    by the symmetry, so the late-time limit is exactly the scaling limit, and
    for every state whose generator kernel is the ground-state singularity
    plus a remainder bounded near the horizon point (a class the same in every
    regular parameter for the weight-$\tfrac12$ kernel) the late-time state of
    the near-horizon exterior outgoing modes is the continuum I-state at
    $\beta = 2\pi/\kappa$; the condition is sufficient, not necessary (every
    finite-rank change of the symbol has the same limit), and the
    Boulware-type state is outside the class
    (\claimref{synthesis.collapsing-hole-flux-from-ground-state-on-the-ingoing-sheet}).
    In the collapse of a null shell the vacuum before the collapse is in the
    class, its outgoing flux is exactly $-\tfrac{1}{24\pi}\{v, u\}$ at every
    retarded time, tending to the chiral flux $\kappa^{2}/48\pi$ at
    $\kappa/2\pi$, and among states KMS for the Killing translations at late
    times only $T = \kappa/2\pi$ has finite null energy across the future
    horizon
    (\claimref{synthesis.collapse-in-vacuum-regular-at-future-horizon-selects-hawking-temperature}).
    Hawking's flux at infinity follows from the near-horizon state under
    Premise (I) with the greybody passage
    (\claimref{hawking.premise-i-interface-identification}). Not covered:
    the greybody factors themselves, collapse geometries other than the
    spherical null shell, and the propagation of short-distance regularity
    from the collapse region in general, which stays a literature citation
    (Fulling-Sweeny-Wald 1978, Fredenhagen-Haag 1990, cited from memory).
  attack:
    - >-
      Settled. Follow-ups: import the propagation of short-distance
      regularity (Fulling, Sweeny and Wald; Fredenhagen and Haag) as a Fact
      after checking the sources, if a general collapse geometry is wanted;
      treat the greybody factors and non-spherical collapse.
  success: >-
    A stated condition for collapsing holes, with the Hawking flux at
    $\kappa/2\pi$ derived from it on the continuum carrier, or a proof that
    no condition of ground-state type can give it.
