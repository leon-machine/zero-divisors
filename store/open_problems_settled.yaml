- id: op.majorana-scale
  title: Deriving the Majorana scale and the intermediate scale
  area: neutrinos
  kind: research
  difficulty: substantial
  status: settled
  source: "T15, successor problems (3) and (4); T12, successor problem (7); seed/CONTRADICTIONS_VALUES.md M4; maintainer decisions of 23 October; settled by Leon's close-out answer of 26 October"
  statement: >-
    The Majorana scale along the heavy direction, the $126$ Yukawa coupling
    there or equivalently the $126$ doublet admixture $w_{u}$, is registered
    as an input of the laws beside $N$ and $v/H$, fixed in value by $m_{3}$
    (\claimref{synthesis.majorana-scale-free-input}). What remains is a
    derivation: obtain the scale from the series' own dynamics rather than
    from the observed $m_{3}$, which would refute that premise, and say
    whether the same derivation fixes the triplet vev and so predicts
    $\sin^2\theta_W$.
  why: >-
    It discharges Premise (M), decides Premise (R) of T15, turns the
    agreement with the dark-matter paper's rung scale from a construction into
    a check, and settles the scale of the degenerate pair whose decays the
    non-thermal injection needs.
  known: >-
    The Majorana element is the $(10,1,3)$
    (\claimref{standard-model.majorana-element}); on the chain with the
    $(15,2,2)$, $M_I = 1.9 \times 10^{10}$ GeV is fixed by $\sin^2\theta_W$
    (\claimref{standard-model.chain}). Under the imported Clebsch structure,
    $M_{R} = (v_{R}/4w_{u})\,\mathrm{Sym}(M_{u} - M_{\nu})$, and under (EW)
    $(M_{R})_{33} = m_{t}v_{R}/4w_{u}$
    (\claimref{synthesis.majorana-scale-is-126-doublet-vev}). Every stored
    relation is invariant under $f \mapsto \lambda f$,
    $w_{u,d} \mapsto w_{u,d}/\lambda$ except the light masses, so the scale
    is fixed only by the observed $m_{3}$, between $m_{t}v_{R}/(4v)$ and
    $4\pi v_{R}$; on this route one vev sets $M_{I}$ through the gauge
    coupling and $M_{R}$ through $f$, and neither $N$ nor $v/H$ enters
    (\claimref{synthesis.majorana-scale-free-on-pati-salam-route}). The three
    lines of attack are closed on the store's content. (1) The store holds no
    Pati-Salam potential, and the series' only potential, the join's mass
    functional, gives $\Lambda$-suppressed scales. (2) At two loops every
    Dirac-type Yukawa shifts the three Pati-Salam couplings equally and moves
    only $\alpha_{U}$; the Majorana coupling alone moves $M_{I}$ and $M_{U}$,
    and the running stays a nonsingular system for $(\alpha_{U}, M_{I},
    M_{U})$ at every value of it, so the three measured gauge couplings alone
    fix the scales as functions of $f$ and never $f$ itself; a supplied
    $M_{I}$ would fix $\mathrm{Tr}\,ff^{\dagger}$ only to about $0.4$ per
    standard deviation of $\alpha_{s}$
    (\claimref{synthesis.two-loop-running-cannot-fix-majorana-coupling}; the
    extension from the linear system to the full two-loop system is argued).
    (3) The Majorana element is a null five-blade of nonzero $B - L$ weight:
    the Clifford norm of the frozen-point kind vanishes on it and on the whole
    self-dual $126$, and every invariant polynomial, holomorphic or of the
    real form, vanishes on it and its orbit; only the Fock norm, which needs
    the Hermitian structure, survives, so no condition of the frozen-point
    kind fixes the scale
    (\claimref{synthesis.majorana-element-is-null-blade-no-frozen-point-condition}).
    The Majorana scale is a datum of the sesquilinear kind, like $v/H$, not
    of the bilinear kind that fixes $\Lambda$ through the frozen point
    (argued reading). Settled in the negative (Leon, 26 October): no relation
    the series can supply fixes the scale, and the premise
    \claimref{synthesis.majorana-scale-free-input} stands. A derivation would
    need what the store does not hold: a Pati-Salam potential, a dynamics for
    the Hermitian structure's scale, or an independently supplied $M_{I}$ or
    $M_{U}$ (for example from proton decay), which would fix the coupling
    only loosely.
  attack:
    - >-
      Derive the $126$ doublet admixture $w_{u}$ from a potential at $M_{I}$;
      the store holds no Pati-Salam potential, and the series' only potential,
      the join's mass functional, gives $\Lambda$-suppressed scales.
    - >-
      Compute the two-loop gauge running with Yukawa terms on the chain and
      test whether, with the measured weak angle, it fixes $f$ along the heavy
      direction to useful precision. (Done: it does not.)
    - >-
      Test whether any invariant condition of the frozen-point kind can fix
      the vev of the Majorana element, which lies in a complex representation.
      (Done: none can.)
  success: >-
    The Majorana scale (equivalently $f_{33}$ or $w_{u}$) derived from the
    series' structure with no observed mass as input, consistent with the
    seesaw masses, refuting the premise that it is an input; or a proof that
    no relation the series can supply fixes it.
