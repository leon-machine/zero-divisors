- id: op.operator-join
  title: The operator join, its ordering constants, and neighbouring zero modes
  area: mass
  kind: research
  difficulty: substantial
  status: settled
  source: "T11, successor problems (1) and (4); maintainer decision of 23 October; settled by Leon's close-out answer of 26 October"
  statement: >-
    The condensation equation's seed has zero expectation on every state of
    definite constituent helicities, so a nonzero seed on the quantum massless
    locus needs zero modes of the operator join in two neighbouring helicity
    sectors. Decide whether $\hat m^{2}$ has zero modes in two joint
    eigenspaces of $(\hat h_{11}, \hat h_{22})$ whose eigenvalues differ by
    $\hbar(1,1)$ (constituent helicities each differing by $\tfrac12$) on the
    positive-energy modules, and if so whether the seed connects them.
  why: >-
    The join $m^2 = 2|B_\Lambda|^2 + \tfrac{\Lambda}{3}C$ is classical; its
    quantum form is where mass terms acquire their ordering corrections, and
    the seed question connects the mass mechanism to the families paper's
    condensation programme.
  known: >-
    The ordering constants are computed: in Jordan-symmetrised palatial
    ordering $\hat m^{2} = \sum_{i<l}\{\hat B^{il}, \hat B^{il\dagger}\} +
    \tfrac{\Lambda}{3}\hat C_{N} - \tfrac{N\Lambda}{3}\hbar^{2}$, one central
    constant, with no term linear in the bracket
    (\claimref{synthesis.operator-join-ordering-constants},
    \claimref{synthesis.operator-join-casimir-shifts}), so the seed does not
    arise from the constants. The seed has zero expectation on every state of
    definite constituent helicities, so a massless state with nonzero seed
    needs zero modes of $\hat m^{2}$ in two neighbouring sectors
    (\claimref{synthesis.operator-join-seed-has-no-diagonal-matrix-elements}).
    On the positive-energy modules the store's conjugation is the Hilbert
    adjoint, with energies $|s| + 1 + n$
    (\claimref{synthesis.attachment-conformal-energy-is-generated-by-z}).
    There the join is
    $2\hat B^{\dagger}\hat B + \tfrac{\Lambda}{3}\hbar^{2}(s_{1} + s_{2} +
    j(j+1) - 2)$ on each isotype, and for $\Lambda \ge 0$ its band raising
    the oscillator number by four is the product of the two creation brackets,
    so it has no eigenvector of finite energy content in any sector; the
    polynomial realisation's constant zero mode has no counterpart
    (\claimref{synthesis.operator-join-positive-energy-no-finite-energy-zero-modes}).
    For $\Lambda > 0$ the bracket and its conjugate span a unitary
    $\mathfrak{su}(1,1)$ at the Fock scale matched to the frozen point, the
    join is
    $\tfrac{\Lambda}{3}\hbar^{2}(K_{0}^{2} - C_{\mathfrak{su}(1,1)} + j(j+1)
    - 2)$, and, modulo the decomposition of $D^{+} \otimes D^{-}$
    (\claimref{synthesis.imported-sl2r-discrete-series-tensor-product},
    cited from memory), its point spectrum lies in
    $[\tfrac{\Lambda}{3}\hbar^{2}, \infty)$ with the bound attained, so the
    join has no normalisable zero mode in any helicity sector
    (\claimref{synthesis.operator-join-point-spectrum-on-positive-energy-modules}).
    Zero lies in the continuous spectrum only in the blocks $(K_{0}, j) =
    (0, 0), (\pm 1, 0), (\pm\tfrac12, \tfrac12)$, as generalised (scattering)
    states. For $\Lambda < 0$ the answer differs: at the Fock scale matched to
    the frozen point ($\lambda s^{4} = -1$) the join preserves the oscillator
    number and has zero modes of finite energy content (three at oscillator
    number two, internal spin $1$, in the sectors
    $(s_{1}, s_{2}) = (\tfrac12, -\tfrac12), (-\tfrac12, \tfrac12), (0, 0)$);
    the series takes $\Lambda > 0$, so this does not bear on the seed. The
    bracket's stored quantum numbers are $(1,1)$ with $Y = +1$
    (\claimref{families.imported-face-valued-bracket-quantum-numbers}), so a
    bracket condensate would be hypercharged and, being a weak singlet,
    electrically charged (argued). Settled in the negative on the
    positive-energy modules for $\Lambda > 0$ (Leon, 26 October): the join
    has no normalisable zero mode there, so the seed must come from outside
    the join. It passes to the families paper's condensation programme,
    which must supply a carrier outside the join and account for the
    bracket's hypercharge. Whether the seed's matrix elements between
    generalised massless states mean anything is a different question, not
    opened.
  attack:
    - >-
      Compute the zero modes of $\hat m^{2}$ sector by sector on the
      positive-energy modules of the twistor attachment, and evaluate the
      source term of \claimref{families.source-term-linear-tilt-mass-functional}
      between neighbouring ones. (Done: none are normalisable for
      $\Lambda > 0$.)
    - >-
      Extend the polynomial computation to higher bidegrees, and decide
      whether the polynomial and positive-energy realisations have the same
      zero modes. (Done: they do not.)
    - >-
      If no neighbouring zero modes exist, pass the seed to the families
      paper's condensation programme, stating there that it must also account
      for the bracket's hypercharge. (Done by this settlement.)
  success: >-
    Zero modes of the join in two neighbouring helicity sectors with a nonzero
    seed between them, or a proof that none exist on the positive-energy
    modules, settling that the seed must come from outside the join.
  entities:
