- id: op.derive-c-loc
  title: Derive the local-horizon premise, or prove the conditional derivation of Einstein's equations
  area: einstein
  kind: research
  difficulty: frontier
  status: settled
  source: Maintainer decision of 22 October (the local-horizon premise); the Einstein-route results of 22 October
  statement: Premise (C$_{\mathrm{loc}}$) (\claimref{synthesis.c-loc-local-horizon-premise}) places the boundary-mode
    count, the series' horizon temperature and its modular flow on local non-Killing horizons and small causal diamonds.
    Either derive it from the series' structure, or take it as given and write the conditional derivation of Einstein's
    equations from it and Jacobson's 1995 Clausius argument (the imported Fact synthesis.imported-jacobson-clausius-1995),
    and prove that derivation in the store.
  why: 'Without it the series has Einstein''s condition restated, not derived: every Einstein-route result in the
    store names a count, temperature or modular flow on local horizons as the missing step, and the black-hole data
    alone cannot separate Einstein''s theory from its Ricci-polynomial extensions.'
  known: 'The Einstein condition is the standard null-cone form translated into vacuum language, infinity vacua
    unexcited along their own light rays, a translation and not a derivation (\claimref{synthesis.einstein-condition-is-infinity-vacuum-incidence}).
    On Jacobson''s Clausius route the epoch count returns Newton''s constant only through the area-law condition
    that already fixes the registered $\nu$, a consistency, and the store places counts only on Killing horizons
    (\claimref{synthesis.clausius-route-newton-constant-is-residue}). Black-hole thermodynamic data hold unchanged
    in every Ricci-polynomial extension of Einstein''s theory (\claimref{synthesis.black-hole-data-do-not-fix-field-equations}).
    The boundary-mode algebra gives the first law of entanglement on its own windows but not the small-ball state,
    area density or diamond flow that Jacobson''s 2016 step needs (\claimref{synthesis.boundary-mode-first-law-of-entanglement}).
    Settled by its first alternative: Theorem \claimref{synthesis.einstein-equations-from-c-loc-and-clausius} proves
    Einstein''s equations with $\Lambda$ an integration constant and $G_{\mathrm{cl}} = 1/(4\eta)$ from (C$_{\mathrm{loc}}$),
    the Clausius relation and named geometric hypotheses. Analysis of the premise''s version 1: its modular-flow
    clause is its temperature clause on the whole mode algebra and its geometric reading contradicts a point-spectrum
    mode set (\claimref{synthesis.local-boost-temperature-is-local-regularity}, \claimref{synthesis.c-loc-modular-clause-moves-no-nested-patch});
    the entropy clause is one universal constant, $1/4$ with no count, exactly when the density ignores curvature
    and matter at the point (\claimref{synthesis.c-loc-entropy-clause-curvature-independent-density}); horizon and
    cutoff placements must be one mode set (\claimref{synthesis.c-loc-is-a-second-placement-of-the-count}). The
    premise was restated as (Loc) and (R$_{\mathrm{loc}}$) (version 2). Deriving those two clauses is op.derive-loc-and-r-loc.'
  attack:
  - 'Write the conditional derivation: from (C$_{\mathrm{loc}}$)(i) and (ii) and the Clausius relation for matter
    flux, follow Jacobson''s argument to $G_{ab} + \Lambda g_{ab} = (2\pi/\eta)T_{ab}$ and file it as a proved claim
    that assumes the premise and uses the imported Fact.'
  - 'Derive clause (ii) on small diamonds from the selected state: test whether the restriction of the series''
    state to the modes of a small diamond is KMS for the diamond''s conformal Killing flow at leading order, starting
    from the Hislop-Longo clause the store imports for conformal fields.'
  - Test the universality of $\eta$ that clause (i) asserts against the literal count for spinning holes (\claimref{synthesis.kerr-ring-count-misses-area-law}),
    which misses the area law.
  success: A proved claim deriving Einstein's equations with $\Lambda$ an integration constant under (C$_{\mathrm{loc}}$),
    or a derivation of (C$_{\mathrm{loc}}$) itself; or a result meeting the premise's refutation condition.
  entities:
