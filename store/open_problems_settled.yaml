- id: op.which-boost-flow-is-time
  title: Which boost flow is a window's physical time evolution
  area: thermality
  kind: consistency
  difficulty: substantial
  status: settled
  source: "seed/CONTRADICTIONS_STRUCTURE.md H2 (resolved by naming, not settled); note.decisions.two-boost-flows; conventions.md, known limit 4; findings of 23 October on the continuum carrier; the one-unitary-group result and the restated chaos-bound sentence, 26 October; the value factor at Killing horizons, settled by Leon's decision of 31 October"
  statement: >-
    The series uses two flows with one generator $K = \sigma/2$: the real
    rotor flow $\exp(\lambda\sigma/2)$, which rescales the modes, and the
    phase flow $a_j \mapsto e^{-i\omega_j t}a_j$, related by $\lambda = it$.
    Decide which is the physical time evolution of a window in the one
    Schwarzschild time both papers use, and restate the spreading law and the
    chaos-bound comparison on that basis.
  why: >-
    The KMS analysis, the I-state and the temperature use the phase flow; the
    clock inventory and the scrambling law, with $t_* = \kappa^{-1}\ln N$, use
    the rotor flow. The chaos-bound statement compares the rotor flow's growth
    rate with the phase flow's temperature, so it needs both to be the same
    evolution read two ways.
  known: >-
    Settled. On the windows only the phase flow is a $*$-automorphism, so it
    is their time evolution and the rotor flow its KMS-strip continuation
    (\claimref{synthesis.phase-flow-is-time-rotor-flow-kms-continuation}).
    On the continuum of a horizon's generators the boost time evolution is
    one unitary dilation group: on a horizon's null plane the canonical
    component of the spinor field is $\Lambda(m)\psi$, the covariant boost
    acts on it as the product of the rotor on values and the transport of the
    affine parameter, neither of which preserves the anticommutator alone, and
    the product is the unitary dilation, weight $\tfrac12$ forced; it is the
    phase flow on Mellin modes, and continued to imaginary rapidity it is the
    Euclidean rotor times a rotation of the affine parameter; in real time the
    anticommutators of linear elements stay bounded, so the real-time Lyapunov
    exponent of this quasi-free dynamics is $0$
    (\claimref{synthesis.boost-evolution-on-generators-is-one-unitary-group}).
    The value factor at Killing horizons (31 October): at every Killing
    horizon with nonzero surface gravity, off its bifurcation surface,
    whatever the field strength and with or without rotation, the Killing
    bivector is $-\kappa\,k\wedge m + k\wedge\omega$, so relative to frames
    parallel along the generators the Killing flow acts on the canonical
    light-ray component by the generator-plane boost with weight
    $e^{-\kappa t/2}$, the rotation one-form reaching only the constrained
    component; the boost time evolution there is the same unitary dilation
    group with no further helicity phase, derived rather than argued
    (\claimref{synthesis.killing-horizon-value-factor-is-the-generator-boost}).
    The spreading law and the chaos-bound comparison are restated on that
    basis: the boost group's support-dilation rate equals its KMS rate,
    $\kappa\beta = 2\pi$ under (N$_{+}$), the real-time Lyapunov exponent is
    $0$, so the bound is met, not saturated, and $t_{*} = \kappa^{-1}\ln N$
    counts $\ln N$ units of rapidity
    (\claimref{scrambling.spreading-law-chaos-bound-saturated}). Within the
    stationary class the equality $\kappa\beta = 2\pi$ is the edge condition
    (\claimref{synthesis.stationary-horizon-state-is-its-own-edge-scaling-limit}).
    Every dynamics the locality premise admits is number-diagonal, with no
    exponential growth
    (\claimref{synthesis.number-diagonal-dynamics-spreads-nothing}). Not
    covered: chaotic (non-quadratic) dynamics of the windows, degenerate
    (extremal) horizons, and the bifurcation surface itself.
