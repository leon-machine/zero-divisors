- id: op.bivector-exponential-spin
  title: The exponential of a general bivector lies in Spin
  area: standard-algebra
  kind: research
  difficulty: tractable
  status: settled
  source: grounding pass 2026-10-26
  statement: 'Prove in the core that for every bivector $B \in \Cl^{2}(V, Q)$, not only those with scalar square, $e^{B}$
    is a rotor: $e^{B}\widetilde{e^{B}} = 1$ and $e^{B} x e^{-B} \in V$ for every vector $x$, with the exponential defined
    by its power series; and state when a rotor is an exponential.'
  why: \claimref{correspondence.spin-representation} needs $e^{B} \in \mathrm{Spin}$ for a general bivector of the conformal
    algebra, and the core states the exponential only for bivectors whose square is a scalar (\claimref{std-algebra.bivector-exponential}).
  known: 'Bivectors close under the commutator product and act skew-adjointly on vectors by it (\claimref{std-algebra.bivector-lie-algebra});
    for a bivector with $B^{2} \in \R$ the exponential is given in closed form (\claimref{std-algebra.bivector-exponential});
    rotors double-cover the rotations (\claimref{std-algebra.spin-double-cover}). Settled (Leon, 31 October) by \claimref{std-algebra.bivector-exponential-in-spin}:
    for every bivector, over $\R$ or $\C$ and for every form, $e^{B}$ is even, $(e^{B})^{\sim} = e^{-B}$ and $e^{B}xe^{-B}
    = e^{\operatorname{ad}_{B}}x$ is a vector, the map an isometry; for a nondegenerate real form $e^{B}$ is a rotor in
    $\Spin^{+}$; for a degenerate form it need not be a versor ($e^{f_{1}f_{2}}$ in $\Cl(0,0,2)$); and in $\Cl(1,3)$ every
    rotor is $\pm e^{B}$, the non-exponentials being exactly $-(1 + N)$ with $N$ a nonzero null bivector. When a rotor is
    an exponential is answered beyond the Lorentzian case in one direction: for $\min(p, q) \ge 2$ some rotor is not $\pm
    e^{B}$ (\claimref{std-algebra.rotors-beyond-exponentials}); the converse for $\min(p, q) \le 1$ is cited from memory
    there and not claimed. What remains outside the store: the group-level step of \claimref{correspondence.spin-representation}
    over $\C$ (every $e^{B}$ a versor of $\Spin(V_{\C})$, and $\Spin(V_{\C})$ generated by exponentials) needs the Cartan-Dieudonne
    theorem over $\C$ or the connectedness of $\Spin_{6}(\C)$, neither imported (declined 31 October), so that result cites
    the complex algebra but not this theorem.'
  attack:
  - Show that $t \mapsto e^{tB} x e^{-tB}$ solves $\dot y = [B, y]$, which preserves $V$, so the conjugate of a vector stays
    a vector; and that $\widetilde{e^{B}} = e^{-B}$ since reversion negates bivectors.
  - For the exact check, use a nilpotent or commuting decomposition of $B$ so the series terminates or splits into closed
    forms.
  success: A core theorem with an exact check covering non-simple bivectors, cited by the spin representation result.
  entities:
  - std-algebra.bivector-exponential
  - std-algebra.bivector-lie-algebra
  - std-algebra.spin-double-cover
  - correspondence.spin-representation
  added: '2026-10-27'
