- id: op.mirror-reversal-at-tower-top
  title: Does the top of the tower distinguish r from -r
  area: tower
  kind: research
  difficulty: tractable
  status: settled
  source: "seed/SYNTHESIS_GAPS.md B2 (the open remainder of q.tower.odd-charge)"
  statement: >-
    The pair $(\varinjlim T_k, B_\infty)$, the tower's limit with its plane
    algebra, determines the even ground algebra $\Cl^0(p,q)$ and so the
    residue up to $r \mapsto -r$. Decide whether the pair, as an inclusion and
    not only through its commutant, also distinguishes $r$ from $-r$.
  why: >-
    The reversal is exactly the orbit along which P2 equates towers; whether
    the limit itself separates this tower from its mirror bears on whether
    "which of 2, 6 is visible" is indexical, as P2 declares, or recorded in
    the algebra.
  known: >-
    The bare limit forgets the residue entirely: every tower's limit is the
    same CAR algebra (\claimref{synthesis.tower-limit-forgets-residue}, which
    settles \claimref{q.tower.odd-charge}). The relative commutant of the
    planes is exactly $\Cl^0(p,q)$, which fixes $n$, the parity of $r$, $r$
    mod 4 for $n$ even, and the class $\{r, -r\}$, and no more, since
    $\Cl^0(p,q) \cong \Cl^0(q,p)$
    (\claimref{synthesis.plane-commutant-even-ground}). As an inclusion the
    pair does not distinguish $r$ from $-r$: an explicit pair isomorphism
    $L_{p,q} \to L_{q,p}$ sends each ground generator $x_{i}$ to $y_{i}e_{1}$
    and re-pairs the planes, shifting every floor by one, so tower-top pairs
    are classified by $n$ and $\pm r \bmod 8$
    (\claimref{synthesis.tower-top-pair-forgets-reversal}); that isomorphism
    meets the success clause. Over $\R$ the sign of $r$ lives in the grading:
    the plane algebra's own grading recovers the odd ground part, and
    isomorphisms that respect it, keep the individual planes, or fix the
    ground under a phase clock with no zero mode separate $r$ from $-r$ for $r
    \not\equiv 0, 4 \pmod 8$, though not over $\C$
    (\claimref{synthesis.plane-grading-records-residue-sign}). Rule 2's
    $\nu^{2}$ is recorded at the top: for $r \equiv 1 \pmod 4$ the two
    repairs' residues $r \pm 1$ are never congruent up to sign modulo $8$. So
    the reversal along which P2 equates towers is invisible to the ungraded
    pair, as P2's indexical reading needs, and visible only to a grading or a
    framing by the planes.
  attack:
    - >-
      Settled. One consequence to carry: a phase clock with no zero mode (for
      instance weights $\kappa(k + \tfrac12)$, one of the two offsets of
      op.array-offset) fixes the ground and so records the sign of $r$;
      whether the descent's clock has a zero mode bears on P2's indexical
      reading.
  success: >-
    An invariant of the pair that separates $(p,q)$ from $(q,p)$, or an
    isomorphism of pairs carrying one to the other.
  entities:
    - synthesis.plane-commutant-even-ground
    - synthesis.tower-limit-forgets-residue
    - synthesis.tower-top-pair-forgets-reversal
    - synthesis.plane-grading-records-residue-sign
    - q.tower.odd-charge
    - tower.commuting-copies
    - dark-matter.p2-indifference
  added: "2026-10-22"

