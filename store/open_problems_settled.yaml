- id: op.collar-kms-extension
  title: "6 pi at the exceptional set: is the collar state KMS for the global holonomy flow"
  area: thermality
  kind: research
  difficulty: substantial
  status: settled
  source: "T05, Prop 13.2(ii) and its conclusion (open, stated as such); BUILD_REPORT, the de Sitter temperature (21 October); the collar result of 23 October; closed as premise-dependent by Leon's decision of 26 October"
  statement: >-
    Under (R$_{\mathrm{loc}}$), equivalently the local form of (N$_{+}$) at
    each collar point, the Hubble-normalised inverse temperature of the
    collar's modes is $6\pi(1 - \tfrac45 r + \cdots)$, tending to $6\pi$ at
    the exceptional set, with no extension of the horizon's state. Decide the
    one remaining question: whether the collar's state is also KMS for the
    global $t$-line holonomy flow, which is what the choice between the
    slice-product algebra (C) and the completion-locus hypothesis (E)
    decides.
  why: >-
    The local value $6\pi$ is settled under the adopted premise; a KMS state
    of the global holonomy flow would make it a temperature of the collar as
    a whole, to set beside the horizon's and the cosmological horizon's
    $2\pi$, rather than a limit of local values.
  known: >-
    Settled as premise-dependent (26 October); no premise is adopted. At a
    collar point the $t$-boost is the unit boost of the local Rindler
    horizons generated by $e_{0} \pm e_{1}$, and (R$_{\mathrm{loc}}$) fixes the
    modes at rapidity period $2\pi$ on every slice, Killing-time period
    $4\pi r^{2}$, Hubble-normalised $6\pi\sqrt{1 - r}/S(r)$
    (\claimref{synthesis.collar-temperature-fixed-locally-by-r-loc}). Under
    (C), independent slice atoms, the collar state is KMS for no single-rate
    holonomy flow: the Killing periods differ from slice to slice, so the
    state is KMS for the Killing-time flow at no common period
    (\claimref{synthesis.collar-kms-extension-three-flows}), and a slice
    product of states KMS at slice-dependent periods is KMS only for the
    product flow that runs every slice at unit rapidity rate, which is a
    holonomy flow only on the reparametrisation that (E) asserts (argued,
    elementary). Under (E) every slice's holonomy flow is a reparametrisation
    of one flow and the collar state is KMS for it, at the (R$_{\mathrm{loc}}$)
    period on each slice
    (\claimref{synthesis.collar-kms-extension-completion-locus}). Both
    readings are consistent with (R$_{\mathrm{loc}}$) and with every adopted
    premise ((C$_{\mathrm{loc}}$) version 3 and the local form of (N$_{+}$)
    included), and they answer the question oppositely, so the present
    premises do not decide it (argued). On the per-light-ray carrier that
    (C$_{\mathrm{loc}}$) version 3 adopts the question is ill-posed (argued):
    the generators of the collar's local horizons are the radial null rays of
    the $(\tau, t)$ plane, which cross the slices, the $t$-line holonomy maps
    rays to rays rather than acting as a dilation on one ray, neither (C) nor
    (E) is the mode set there, and the local form of (N$_{+}$) makes each
    ray's state the null vacuum, KMS at rapidity period $2\pi$ for the
    dilation about each of its points, with no global flow needed. The local
    form cannot be posed at the exceptional set itself, where the curvature
    diverges, so $6\pi$ there is a limit of local values.
  attack:
    - >-
      Settled as premise-dependent. A follow-up only if a premise is adopted:
      (E) is the one reading under which the collar has a global temperature.
  success: >-
    A proof that the collar's state is, or is not, KMS for the global
    holonomy flow, with the choice between (C) and (E) decided.
