- id: op.array-offset
  title: "The offset of the boundary-mode array: kappa k or kappa (k + 1/2)"
  area: entropy
  kind: research
  difficulty: substantial
  status: settled
  source: "Maintainer decision of 22 October (the boundary-mode array offset); premise (Q); maintainer decision of 23 October (array offset)"
  statement: >-
    Premise (Q)'s weight clause is an affine law with two free data, the sea
    offset and the slope. Decide the offset of the boundary-mode array's
    weights: $\kappa k$, with a zero-weight mode, or $\kappa(k + \tfrac12)$,
    with the sea level between sites.
  why: >-
    The offset decides the array's entropy at the Hawking temperature, and
    with it how many arrays make one registered boundary mode's $\ln 2$ and
    whether the residue problem is read with a zero-weight mode.
  known: >-
    Given (P) and (R), the quasi-free clause of (Q) is the maximum-entropy
    rule and its weight clause an affine law with two free data, the offset
    and the slope $\beta c = 2\pi$
    (\claimref{synthesis.q-splits-maximum-entropy-affine-weights}). With
    weights $\kappa(k + \tfrac12)$ the s-wave array carries exactly
    $\tfrac12\ln 2$ at the Hawking temperature, given the classical
    theta-function identities, and the Killing flow at one modular period is
    the parity automorphism; with $\kappa k$ it carries $\ln 2 + \varepsilon$
    (\claimref{synthesis.half-integer-weight-array-carries-half-ln2}). The
    offset is not derived: every non-circular stored datum is blind to it.
    The Euclidean-period sign $R_{2\pi} = -1$
    (\claimref{state-selection.where-fermi-dirac-comes}) holds in a KMS state
    at either offset, since it is the antiperiodicity of odd correlators in
    imaginary time, while the offset is the sign of the real-time recurrence
    at one period; the Planck clause, particle-hole symmetry and the
    one-tower structure are offset-blind as well. Structurally the offset is
    the spin structure of the array's recurrence circle: at $\beta c = 2\pi$
    the recurrence and KMS periods are equal, $d = 0$ is the periodic and
    $d = c/2$ the antiperiodic choice, and for spinor-valued fields
    regularity of the Euclidean section admits only the antiperiodic one
    (argued; the spin-structure fact is standard, cited from memory). Settled
    by decision (23 October): Premise (Q) version 3 adopts $\kappa(k +
    \tfrac12)$ as a consequence of reading the boundary modes as the field
    theory's spinor fields on the horizon's light rays, of boost weight
    $\tfrac12$, in the state that (N$_{+}$) selects
    (\claimref{singularity.q-joint-quasi-freeness-s-wave},
    \claimref{synthesis.positive-null-energy-gives-r-premises}); a field of
    weight $\tfrac12$ changes sign under a full Euclidean turn. The reading
    is the decision; the offset is not derived from it without identifying
    the real-time recurrence at one period with that sign. Consequences: no
    zero-weight mode; one array carries $\tfrac12\ln 2$, two arrays carry one
    registered mode's $\ln 2$ under entropy matching; one array is one
    oscillator tower, one helicity channel, at either offset
    (\claimref{synthesis.array-ln2-is-zero-mode-doublet-one-tower}), so one
    registered mode is two arrays and two helicity channels. The results
    computed at $\kappa k$ (the residue value $0.3470$, the zero-mode charge
    doublet, the one-channel count) refer to (Q) version 2 and carry notes.
  attack:
