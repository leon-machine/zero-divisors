- id: op.radical-quotient
  title: The radical ideal and the quotient algebra of a degenerate space
  area: standard-algebra
  kind: research
  difficulty: tractable
  status: settled
  source: grounding pass 2026-10-26
  statement: For a degenerate real quadratic space with radical $\operatorname{rad} V$ of dimension $r$, prove in the core
    that the two-sided ideal $J$ of $\Cl(V, Q)$ generated by $\operatorname{rad} V$ satisfies $J^{r+1} = 0$ and that $\Cl(V,
    Q)/J \cong \Cl(V/\operatorname{rad} V, \bar Q)$.
  why: \claimref{sheaf.degeneration-sheaf} uses both facts at the wall, and the nilpotent ideal is the starting point of
    the completion (\claimref{conformal.nilpotent-ideal-becomes-unit-ideal}); the core has the radical and the blade basis
    for degenerate forms but not this structure theorem.
  known: 'The radical is defined in the core (\claimref{obj.std-algebra.radical}), and the blade basis holds for degenerate
    forms (\claimref{std-algebra.blade-basis}). \claimref{conformal.nilpotent-ideal-becomes-unit-ideal} states the nilpotency
    index for $\Cl(p,q,r)$ in the programme. Settled (Leon, 31 October) by \claimref{std-algebra.radical-ideal-and-quotient}:
    for every real quadratic space with radical of dimension $r$ the ideal $J$ generated by the radical is spanned by the
    blades with a radical factor, $\dim J = 2^{n} - 2^{n-r}$, its nilpotency index is exactly $r + 1$, the projection $V
    \to V/\operatorname{rad} V$ extends to a surjection with kernel exactly $J$, so $\Cl(V, Q)/J \cong \Cl(V/\operatorname{rad}
    V, \bar Q)$ and $\Cl(V, Q) = \Cl(U) \oplus J$, and $J$ is the largest nilpotent one-sided ideal and the radical of the
    scalar-part form, with an exact check over every diagonal signature with $r \ge 1$ and $n \le 5$ and three non-diagonal
    degenerate forms. \claimref{sheaf.degeneration-sheaf}(2) and \claimref{conformal.nilpotent-ideal-becomes-unit-ideal}
    now cite it.'
  attack:
  - 'Choose a basis adapted to $V = U \perp \operatorname{rad} V$ and use the blade basis: $J$ is spanned by the blades
    containing a radical generator, and the quotient map is the extension of $V \to V/\operatorname{rad} V$ given by the
    universal property.'
  success: A core theorem with an exact check over every signature with $n \le 5$, cited by the sheaf and completion results.
  entities:
  - obj.std-algebra.radical
  - std-algebra.blade-basis
  - sheaf.degeneration-sheaf
  - conformal.nilpotent-ideal-becomes-unit-ideal
