- id: op.boundary-mode-provenance
  title: Where the boundary modes come from, and the premises that place them
  area: entropy
  kind: consistency
  difficulty: tractable
  status: settled
  source: "seed/CONTRADICTIONS_VALUES.md M12; seed/CONTRADICTIONS_STRUCTURE.md M7"
  statement: >-
    T05 places the boundary modes on the stretched singularity under
    postulates (C1) and (C2), but T08's restated count, its area-law test,
    the integer-holographic corollary, the density prediction and the no-echo
    prediction use the same placement with neither postulate in their past
    cones. Separately, T07 grounds the modes' countability in rungs of the
    tower, while T05, T03 and T04 say the physical closure has one ascent, one
    ladder pair per point, aggregated over s-wave channels.
  why: >-
    The prediction's holds_given shows only (IC), so a reader trusting it does
    not see the placement premises it needs; and the provenance clash bears on
    what the counted modes are, which the residue problem has to decide.
  known: >-
    T05's count holds under (C1) and (C2)
    (\claimref{singularity.stretched-singularity-count}). T08's count now
    takes its placement from T05's count, of which it is the leading order,
    and no longer cites the Witt-index capacity Fact, which counts pairs per
    rung and places nothing; so (C1) and (C2) are in the holds_given of the
    count, the area-law test, the integer-holographic form and the density
    prediction, and (C1) in that of the no-echo prediction
    (\claimref{scrambling.mode-count},
    \claimref{obj.scrambling.stretched-singularity}). Earlier text here said
    that T08 counted with empty holds_given; that was true before these
    corrections. The provenance is now one: the boundary modes are the ladder
    pairs of the blown-up singular boundary, one per point, aggregated over
    s-wave channels, with the tower as the model of their algebra only;
    particle-hole conjugation below the level makes the array a mode set with
    frequencies $\kappa|k|$ and the zero mode in its trace state
    (\claimref{synthesis.s-wave-array-is-a-boundary-mode-set}), and the
    definition of the boundary-mode algebra states that provenance
    (\claimref{obj.hawking.boundary-mode-algebra-windows-boost-dynamics}). T05
    cites the tower limit for structure only
    (\claimref{singularity.bosonisation-bridge-s-wave-sector}), and T03 needs
    no second rung on the physical side
    (\claimref{tower.answers-iteration-question}). The success clause is met.
  attack:
    - >-
      Settled. Housekeeping only: confirm that the no-echo prediction needs
      (C1) alone, and remove the paper's rung-count reading of countability
      from any level that still repeats it.
  success: >-
    The placement premises visible in the holds_given of every result that
    uses the placement, and one stated provenance for the boundary modes.
  entities:
    - singularity.c1-curvature-cutoff
    - singularity.c2-cell-density
    - scrambling.mode-count
    - obj.scrambling.stretched-singularity
    - scrambling.no-echo-prediction-registered
    - obj.hawking.boundary-mode-algebra-windows-boost-dynamics
    - synthesis.s-wave-array-is-a-boundary-mode-set
