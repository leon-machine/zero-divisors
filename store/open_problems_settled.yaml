- id: op.frozen-point-rational-datum
  title: "The frozen point's rational datum: H or Lambda"
  area: dark-energy
  kind: research
  difficulty: moderate
  status: settled
  source: "Leon's decisions of 8 November (the datum H, then the convention route); the frozen-point datum result, 8 November; The square-class checks of the scalars session, 7 November (30 exact checks); the foundation postulates F1 to F4 and the division result, 7 November, which place the series' scalars in Q before the completion F4"
  statement: >-
    Over $\Q$, $Q(I_{\Lambda}) = \Lambda/3$, so statements that normalise by it,
    use the static boost's null eigen-directions, or name an algebra type built on
    it hold only when $\Lambda/3$ is a rational square (for $SO(1,4)$ as a group
    over $\Q$, more). Decide the series' rational datum, $H$ with
    $\Lambda = 3H^{2}$ or $\Lambda$ itself, and restate the affected results.
  why: >-
    The foundation postulates put the series' scalars in $\Q$ until the
    completion (\claimref{synthesis.continuum-completion-premise}); a result
    that needs $\sqrt{\Lambda/3}$ then holds only for special $\Lambda$ unless
    the datum is $H$. Over $\R$ nothing changes.
  known: >-
    Affected (exact checks, 7 November):
    \claimref{odd-extensions.exceptional-algebra-residue-completion-both-sides}(i)
    ($\Cl(1,3) \perp \langle 1/3 \rangle \cong \Cl(2,3)$ fails over $\Q$:
    the two centres are the quadratic fields of discriminants $-3$ and $-4$);
    \claimref{synthesis.cosmological-horizon-completed-pair} (no rational null
    directions unless $\Lambda/3$ is a square; $\Lambda = 7/3$ gives no rational
    point on the bifurcation sphere);
    \claimref{synthesis.de-sitter-static-boost-frozen-point}(iii) (unit boost,
    null eigen-directions and $R_{h}$ need $H$);
    \claimref{synthesis.mirror-extensions-causal-convention}(v) and
    \claimref{odd-extensions.two-towers-one-curved-universe}(i) (the doubling
    and complexification read needs $\Lambda/3$ a square);
    \claimref{dark-matter.imported-frozen-point-de-sitter-radius} and related
    labels ($SO(1,4)$); \claimref{synthesis.operator-join-point-spectrum-on-positive-energy-modules}
    (rational $H$ and the unitary pair form together need $\Q(\sqrt{2})$).
    Safe: the transport spine with $\pm 1$ generators, and the type criteria
    stated for $\pm 1$ forms. Leon's decision (8 November): results stay stated over
    $\R$; on a rational reading the datum is $H$, $\Lambda = 3\varepsilon H^{2}$, by a
    convention, with no stored statement rewritten.
  attack:
    - >-
      Prove exactly which frozen-point statements need $H$ in the field, sweep
      the store for every statement that depends on the square class of
      $\Lambda/3$, and restate each with $H$ as the datum.
  success: >-
    A proof of exactly which frozen-point constructions need the square root of
    Lambda/3 in the base field, a list of the stored results affected on a rational
    reading, and a decision on the datum.
