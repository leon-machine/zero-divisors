- id: op.t12-n-after-the-count
  title: "T12's observations on N now that the count is done"
  area: dark-energy
  kind: consistency
  difficulty: tractable
  status: settled
  source: "note.synthesis.what-n-is-counted (22 October); seed/CONTRADICTIONS_VALUES.md M9 and M10; seed/CONTRADICTIONS_STRUCTURE.md M2"
  statement: >-
    T12's observation that the de Sitter entropy is of order $N^2$ is now a
    performed count, $S_\Lambda = \pi N^2$, and under T08's counting rule
    about $\pi N^2/\ln 2 \approx 4.8 \times 10^{122}$ modes, of which $N$ is
    the square root up to $\sqrt{\pi/\ln 2}$. Correct the observations that
    make $N$ itself the number of the universe's boundary modes or put that
    space at order $10^{60}$, and T12's "of order $10^{60}$" for $N$, which is
    about $1.0 \times 10^{61}$.
  why: >-
    Two refutations (10 and 11) are carried by these observations, and
    "why the boundary mode space is so small, of order $10^{60}$" is the
    question \claimref{standard-model.why-large} inverts largeness into; with
    the count it is about $10^{122}$.
  known: >-
    \claimref{synthesis.de-sitter-entropy-pi-n-squared} (exact, from the
    imported Gibbons-Hawking area law) and
    \claimref{synthesis.de-sitter-mode-count} (conditional on the counting
    rule); the corrections are recorded in
    \claimref{note.synthesis.what-n-is-counted} and conventions.md known limit
    5. They are now applied to \claimref{standard-model.why-large},
    \claimref{standard-model.largeness-number-universes-boundary-modes},
    \claimref{standard-model.what},
    \claimref{standard-model.one-number-explain} and the frozen-point
    dictionary, which give $N \approx 1.0 \times 10^{61}$ and the horizon mode
    space $\pi N^{2}/\ln 2 \approx 4.8 \times 10^{122}$; the old figures
    survive only in recorded source text. Exactly, $G\Lambda = 3N^{-2}$,
    $(H/M_{P})^{2} = N^{-2}$ and the weight's Casimir is $(m/M_{P})^{2}N^{2}$,
    while $\operatorname{Im} w = (m/M_{P})N$ holds only to relative order
    $H^{2}/m^{2}$
    (\claimref{synthesis.smallness-monomials-exact-hierarchy-casimir}). The
    refuters of \claimref{refuted.the-number-n-is-a-coincidence-dirac} and
    \claimref{refuted.the-number-n-is-a-mystery-of-largeness} are conjectured
    observations, and both refutations now state at every level that they hold
    at observation level only; the status label stays refuted, a maintainer
    choice. The success clause is met.
  attack:
    - >-
      Settled. Optional: give refutations 10 and 11 an observation-level
      status label if the schema gains one.
  success: >-
    Every T12 entity stating the size of $N$ or of the mode space agrees with
    the count, and the strength of refutations 10 and 11 matches their
    refuters.
