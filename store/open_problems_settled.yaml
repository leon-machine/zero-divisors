- id: op.rule-2-sign
  title: What selects the sign of the adjoined generator
  area: completion
  kind: research
  difficulty: frontier
  status: settled
  source: "T17, open direction 7; T17 Rule 2 note, what has been exercised"
  statement: >-
    The Rule 2 repair of a split extension fuses its two ideals by one more
    generator whose square the fused algebra forgets: $\Cl(2,4)$ (a boost,
    $\nu^2 = +1$) or $\Cl(1,5)$ (a rotation, $\nu^2 = -1$). Find a physical
    system, or principle, in which the fused direction and its sign are forced
    dynamically rather than by the representation theory of the fermions.
  why: >-
    The series' choice of $\Cl(2,4)$, and so of the conformal completion
    every later paper uses, rests on T01's vector-level minimality argument
    alone; a dynamical selection would ground the root choice.
  known: >-
    The kinematic exercise is delivered: of the two one-dimensional extensions
    of an even-dimensional algebra exactly one obstructs, its ideals are
    copies of the base, and the opposite-sign repair is the Rule 1 ascent
    (\claimref{rule2.where-obstruction-sits-commuting-square}); the
    five-dimensional Kaluza-Klein algebra and planar fermions are physical
    instances. The bit is read, not decided
    (\claimref{note.rule2.forgotten-bit-read},
    \claimref{rule2.imported-rule-2-matrix-units-forgotten}): the geometry
    tells the two repairs apart by whether the adjoined plane carries a null
    vector. Relative to the split extension, the fused directions of either
    repair form a plane on which the square is Lorentzian with the Rule 2
    matrix units as null lines, so no principle on the fused algebra and the
    extension alone fixes $\nu^{2}$
    (\claimref{synthesis.rule-2-fusing-plane-lorentzian}). A physical
    requirement does. With the imported classification of invariant cones
    (\claimref{synthesis.imported-invariant-cone-classification}), the
    spectrum condition (a generator bounded below, nontrivial on the identity
    component) can hold for $\mathfrak{so}(2,4)$ and $\mathfrak{so}(4,2)$,
    whose maximal compact subalgebra has a central rotation, and fails for
    $\mathfrak{so}(1,5)$ and $\mathfrak{so}(3,3)$; so positive energy selects
    the opposite-sign repair, the Rule 1 ascent with $\nu^{2} = +1$, and
    returns $\Cl(2,4)$ for our tower in either signature convention
    (\claimref{synthesis.positive-energy-selects-rule-2-sign}). The success
    clause is met. Conditions: one imported theorem; the selection is a
    condition on the spin group built from a chosen vector slot, not on the
    abstract fused algebra, and it is not derived from equations of motion.
    The root choice now rests on the spectrum condition rather than on
    minimality alone.
  attack:
    - >-
      Settled. One follow-up: prove that the conformal energy of the twistor
      attachment is generated by the central rotation $Z = e_{0}\nu$, an
      identification the selection argues but does not need.
  success: >-
    A principle that fixes $\nu^2$ from a physical requirement and returns
    $\Cl(2,4)$ for our tower, or a demonstration that no dynamical principle
    available to the series can, which would leave the root choice a
    declared minimality postulate.
  entities:
    - rule2.where-obstruction-sits-commuting-square
    - rule2.imported-rule-2-matrix-units-forgotten
    - note.rule2.forgotten-bit-read
    - synthesis.positive-energy-selects-rule-2-sign
    - synthesis.rule-2-fusing-plane-lorentzian
    - synthesis.imported-invariant-cone-classification
    - note.rule2.setting-what-has-been-exercised-what
  added: "2026-10-22"

