- id: op.horizon-entropy-functional
  title: Is horizon entropy exactly the boundary-mode count, or the Wald functional
  area: entropy
  kind: consistency
  difficulty: substantial
  status: settled
  source: "Maintainer decision of 22 October (horizon entropy and the Euler term); the Einstein-route results of 22 October; maintainer decision of 23 October (horizon entropy functional)"
  statement: >-
    Decide whether horizon entropy is exactly the boundary-mode count. If it
    is, the Euler term of the series' MacDowell-Mansouri action, which under
    the Wald functional shifts the entropy of a spherical horizon by
    $-3\pi/(\Lambda G)$, must be excluded from the entropy functional; if the
    Wald functional is the entropy, the count must carry that topological
    shift, and the zero-mass and Nariai normalisations must be revisited.
  why: >-
    The two readings give different de Sitter and Schwarzschild-de Sitter
    entropies and different nucleation rates, and a local-horizon premise for
    the Einstein route needs to know which entropy it places on small
    horizons.
  known: >-
    Assuming Wald entropy, the Euler term shifts every horizon's entropy by
    $-3\pi\chi/(2\Lambda G)$: invisible to every first law or Clausius
    relation between closed cuts of one topology, it zeroes the de Sitter
    entropy, makes Schwarzschild-de Sitter horizons negative and quadruples
    the Nariai nucleation exponent
    (\claimref{synthesis.euler-term-horizon-entropy-shift}). On closed
    horizons, Clausius on the Schwarzschild-de Sitter family with the series'
    temperatures, zero entropy at zero mass and continuity at the Nariai
    merger forces the additive constants to vanish, and nonnegativity alone
    excludes a negative constant shift, so the Euler contribution must be
    removed (\claimref{synthesis.sds-clausius-fixes-area-constant}, (v)). On
    open patches, with the entropy of a patch a functional of the cut: the
    Euler (Jacobson-Myers) entropy changes at first order in the patch's
    affine extent, one order before heat and area, so the Clausius relation
    imposed on every open patch admits it only where trace-free Ricci and
    Weyl curvature vanish, and within the series' entropy family forces the
    curvature-independent area density
    (\claimref{synthesis.euler-entropy-first-order-rate-on-local-patches});
    on radial local horizons of every Schwarzschild-de Sitter hole the Wald
    density, $-3/(4\Lambda)$ times the Cartan curvature of the edge plane,
    changes as $-3M/(2\Lambda r^{3})$ with no area change and no matter flux,
    up outward and down inward, so no entropy-production reading rescues it
    (\claimref{synthesis.series-wald-entropy-changes-without-flux-on-local-horizons}).
    The open-patch change is a divergence on the cut and cancels on closed
    cuts, so the failure is of the Clausius relation on open patches, as the
    Einstein route imposes it. Settled by decision (23 October), on these
    results: horizon entropy is the count and area term, $S = A/4$, the
    Einstein-Cartan part of the action alone; the Euler term stays in the action, where it is topological,
    and is excluded from horizon entropy on local and on closed horizons.
    Consequences: the de Sitter entropy is $\pi N^{2}$
    (\claimref{synthesis.de-sitter-entropy-pi-n-squared}), and the Nariai
    nucleation exponent is $-1$ in units of $\pi/(\Lambda G)$, the
    Einstein-Hilbert value. Whether the series' count reproduces $A/4$ off
    the Schwarzschild family is a separate question: read literally, the
    cutoff count does not
    (\claimref{synthesis.cutoff-count-is-not-a-local-density-on-sds}).
  attack:
    - >-
      Settled. One follow-up, outside this problem: compare a boundary-mode
      count of the de Sitter horizon, placed on the horizon with a density
      fixed by flat data, with $\pi N^{2}$.
  success: >-
    A decision, recorded as a premise or proved, on whether the entropy
    functional is the count (with the Euler term excluded) or the Wald
    functional, with its consequences for the de Sitter entropy and the
    local-horizon premise.
