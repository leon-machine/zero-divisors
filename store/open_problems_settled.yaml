- id: op.many-twistor-grip
  title: The grip for many twistors
  area: mass
  kind: research
  difficulty: tractable
  status: settled
  source: "T11, successor problem (5)"
  statement: >-
    For $N$ constituents the grip $P = M(I_\Lambda)$ is defined verbatim and
    $\langle P, P\rangle = p\cdot p + 2\lambda(p\cdot k - d^2) + \lambda^2 k\cdot k$.
    Prove the component formulas $p\cdot p = 2\sum_{i<l}|\langle\pi^i\pi^l\rangle|^2$,
    $k\cdot k = 2\sum_{i<l}|[\omega^i\omega^l]|^2$,
    $p\cdot k = \sum_{i,l}|t_{il}|^2$, $d = \mathrm{Im}\,\mathrm{tr}\,t$,
    compare with $2\sum_{i<l}|B^{il}_\Lambda|^2$, and identify the remainder as
    an internal $\mathfrak u(N)$ invariant.
  why: >-
    T11 states the formulas extend but does not prove or script them beyond
    $N = 2$; the remainder's identification is the counting the Standard-Model
    paper's content derivation needs.
  known: >-
    The two-twistor case is \claimref{mass.exact-join}, whose proof writes the
    component formulas as sums over $i, l$. Settled. The join for $N$
    conformal spinors is proved with an exact check: $m^{2} =
    2\sum_{i<l}|B^{il}_{\Lambda}|^{2}$ plus the $U(N)$-invariant remainder
    $\tfrac{\Lambda}{3}\bigl(\tfrac12\tr h^{2} - \tfrac14(\tr h)^{2}\bigr)$,
    nonnegative (\claimref{synthesis.many-twistor-join}). With the stored
    join, three independent conformal spinors are massive for $\Lambda > 0$,
    and at $\Lambda = 0$ massless three-constituent composites exist exactly
    when all $\pi^{i}$ are proportional
    (\claimref{synthesis.three-twistor-composites-massive}).
  attack:
    - >-
      Script the identities for $N = 3$ in exact arithmetic with GA.py, then
      prove the general case by the bilinearity of the sums.
    - >-
      Decompose the remainder under $U(N)$ acting on the constituent index.
  success: >-
    A proved $N$-twistor join with the remainder named as a $\mathfrak u(N)$
    invariant, with an exact check.
  entities:
    - mass.exact-join
    - synthesis.many-twistor-join
    - synthesis.three-twistor-composites-massive
    - rungs.mass-bracket-frozen-points-grip-slot
    - note.mass.setting-successor-problems
  added: "2026-10-22"

