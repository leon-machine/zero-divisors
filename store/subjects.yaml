  programme: transport-papers
- id: tower
  title: The tower and quantum capacity
  side: car
  about: "iterated completion, odd and even extensions, ladder pairs, the CAR limit, the Witt index as capacity"
  programme: transport-papers
- id: descent
  title: Descent, parity and states
  side: car
  about: "the descent map and its lift, parity superselection, modular theory, KMS states, entanglement under descent"
  programme: transport-papers
- id: quantum-fields
  title: Quantum fields in one algebra
