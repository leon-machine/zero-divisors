# Subject areas: the map's columns, left to right, and the default sections of
# generated documents.  Every entity names one subject in its `subject` field.
# Reorder, rename or add subjects here; ids are stable, titles are free.
# Sides: metric = geometry and gravity; algebra = the algebra; car = the quantum
# side; matter = matter and cosmology; synthesis = the programme as a whole.
# Programme: the research programme the subject belongs to (store/config.yaml
# `programmes`; docs/PROGRAMMES.md). A subject holds entities of one programme.
- id: einstein
  title: Einstein's equations in the completion
  side: metric
  about: "the vacuum field equations read upstairs; tractors, parallel scale, curvature spectra"
  programme: transport-papers
- id: interior
  title: Inside the black hole
  side: metric
  about: "interior geometry, Kasner form, weighted limits, Kerr and the Cauchy horizon"
  programme: transport-papers
- id: walls
  title: Degenerate metrics and walls
  side: metric
  about: "sheaves of Clifford algebras over degenerating metrics, tameness, one-sided completion, collars and residues"
  programme: transport-papers
- id: singularity
  title: The singularity
  side: metric
  about: "where the gravitational gauge field fails to invert, and the diagnosis of that failure"
  programme: transport-papers
- id: conformal-spacetime
  title: Spacetime in the conformal completion
  side: metric
  about: "spacetime inside the completed algebra: the incidence chart, null lines, the conformal model of points, the spinor dictionary"
  programme: transport-papers
- id: zero-divisors
