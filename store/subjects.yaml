# Standard physics, imported once (programme `standard`): textbook results and
# measured quantities that the programmes cite through uses edges.
- id: standard-quantities
  title: Measured and defined constants
  side: matter
  about: "measured and defined constants: masses, couplings, the Planck scale, cosmological parameters, with value, uncertainty, units and source (the quantity entities)"
  programme: standard
- id: standard-gr
  title: General relativity, textbook results
  side: metric
  about: "general relativity and gauge theory gravity as found in the textbooks and the literature: field equations, exact solutions, horizons, surface gravity"
  programme: standard
- id: standard-qft
  title: Quantum field theory, textbook results
  side: car
