- id: orientation-datum-is-doublet-handedness
  title: Is the (N+) orientation datum the handedness of the weak doublets, with the field's unit I4?
  programme: Transport Papers
  registered: '2026-11-07'
  question: 'With the field theory''s unit I4 (the emergent-scalar reading: the unit is a pseudoscalar, so its sign is an
    orientation), is the orientation datum of (N+) (null vacuum against filled sea) the same bit as the handedness of the
    doublets?'
  kill_conditions:
  - 'K1 Some discrete kinematic symmetry of the massless field (psi(x) -> a psi(Lambda^{-1} x) b, a and b blades, Lambda
    one of 1, P, T, PT) flips the frequency sign relative to I4 and not the doublet handedness, or the reverse.'
  run: '2026-11-07'
  outcome: killed
  summary: 'K1 triggered (exact, 55 checks): Hestenes charge conjugation psi -> psi sigma1 flips the chirality and not the
    frequency sign; a CP map flips the frequency sign and not the chirality. What holds: on the modes of each future null
    momentum, L_B = 1 and L_J = -L_I4 (I4 B = J), so helicity is locked to the frequency sign; L_I4 = -Gamma R_{I sigma3};
    every map commuting with the Lorentz rotors is I4-linear; the frequency sign flips exactly under reversal of spatial orientation.
    So the datum is odd under P and under CP, not the chirality of massless even spinors (identifying that chirality with the
    doublets'' handedness is a further assumption), and no CP-invariant interaction fixes it; it belongs with the CP-odd data,
    and on the Z-adapted Witt flags it is the descent''s flag bit up to a kinematic sign.'
