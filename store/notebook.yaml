  question: 'For the three open problems whose premises carry the most of the graph (op.hypothesis-s, op.r-premises-external,
    op.deposit-state-is-hadamard), do results in other subjects supply a premise, a technique, an obstruction or an independence
    argument?'
  kill_conditions:
