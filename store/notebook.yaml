- id: rh-mass-line
  title: The mass line and the critical line
  programme: Riemann hypothesis
  registered: '2026-09-29'
  question: T11 puts every mass above 3H/2 on Re w = -3/2. Is there a non-trivial bridge to the Riemann hypothesis, either
    through a transport or ascent step that fixes the real part (Route A) or through a concrete operator forced by the series
    whose spectral or scattering determinant is built from xi(s) (Route B)?
  kill_conditions:
  - 'K1 Circularity: the argument assumes reality or self-adjointness of an operator whose spectrum is the zeros (Hilbert-Polya
    restated).'
  - 'K2 Proves too much: the argument uses only the functional-equation symmetry s -> 1-s plus complex conjugation; it must
    fail for the Davenport-Heilbronn function.'
  - 'K3 Prior art: the operator reduces to a known construction (Lax-Phillips / Pavlov-Faddeev, Bost-Connes, primon gas, Berry-Keating,
    Connes, de Bruijn-Newman).'
  - 'K4 Imported arithmetic: primes, log p or an arithmetic lattice are inserted by hand rather than forced by the series.'
  - 'K5 Transport does no work: the zero-divisor locus of the relevant object is a place where zeta has no zero.'
  run: '2026-09-29'
  outcome: killed
  summary: Both routes were killed; all five kill conditions triggered. The pin to Re w = -3/2 is reality of the Casimir plus
    Vieta, which is the standard unitarity mechanism and is imported. The de Sitter series fall on the T1 trichotomy, but
    the transport principle is inert on the principal series, and its one square-zero point maps to s = 1/2, where zeta(1/2)
    = -1.46035... is not zero. Filed transport-absent, with the trichotomy table kept as a remark for T11 or G01.
  sources:
  - TP_Papers_Suite/preregistration_RH_mass_line.md
  - TP_Papers_Suite/RH_mass_line_findings.md
- id: rh-near-susy
  title: An odd operator that nearly commutes with H
  programme: Riemann hypothesis
  registered: '2026-09-29'
  question: In the fermionic primon gas, is there an odd operator Q that commutes, or nearly commutes, with H strongly enough
    to control the index 1/zeta below Re b = 1, and does the series supply such a Q?
  kill_conditions:
  - 'K1 Circular: Q is built from the Moebius signs themselves; any bound on it is a bound on the Mertens function restated.'
  - 'K3 Prior art: the graded-trace (Witten-index) reading of mu is Spector (1990); any equivalence found is filed as a reformulation.'
  - 'K5 Series-native operators inert: if every odd operator the series supplies (gamma_p, their l^2 combinations, finitely
    supported odd CAR elements) is stuck at sigma >= 1, the route is killed.'
  - 'K6 Superselection: if the series'' descent or univalence rule annihilates every odd operator, record that Q is declared
    unphysical (not by itself a kill).'
  run: '2026-09-29'
  outcome: killed
  summary: 'K1, K3, K5 and K6 all triggered and the success condition was not met; filed transport-absent. Exact supersymmetry
    is impossible because H has simple spectrum by unique factorisation, and every odd operator the series supplies is stuck
    at s = 1 by the Hagedorn divergence of the modes it leaves untouched. The result kept is an equivalence: RH holds if and
    only if some parity-reversing pairing has [e^{-sH}, Q] trace class for every s > 1/2, attained by a pairing built from
    the Moebius signs, and treated as a reformulation in the line of Spector.'
