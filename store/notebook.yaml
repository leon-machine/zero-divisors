    through t, are not a positive-energy subspace for either branch of sqrt t.'
  - 'Finite deposit (deposit): the attachment floor read on a flat collar does not bound the comoving momentum.'
  - 'Hadamard carries the sign ((N+)): a gauge-invariant quasi-free state with field-level modular action of the opposite sign
    at dense cuts is locally normal to the null vacuum at some point.'
  - 'Fock clause ((S)): a stored result needs a slot module that is not a Fock module over its one-slot space.'
