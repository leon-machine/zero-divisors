  summary: 'No premise is derived. Found: the Hadamard chain inherited (N+), (S) and sixteen other postulates only through
    citations of algebraic clauses (clause split on 7 November); given that, the Hadamard deposit premise carries the orientation
    datum of (N+) on every field it reaches, the eternal hole and eternal de Sitter excepted; the three problems each need
    a bit that every structure blind to it cannot fix (the null vacuum against the filled sea, occupation one half, the neutral
    singlet); on the Witt flags adapted to the conformal energy the energy sign of a flag''s vacuum and the stored flag bit
    flip together on each conjugate pair, so the (N+) datum, read there, is the flag bit up to the descent''s kinematic sign
    (the survey''s first reading, that they are independent bits, was corrected at review); leads: the branch of sqrt t at the radical-normal wall selects the conformal vacuum or the filled sea
    (screened for the massless mode), a finite deposit is Hadamard if the finiteness of P2 applies per window to field modes,
    and for (S) a Fock clause forces one doublet and clause (f) is a Klein convention. Obstructions to deriving the deposit
    premise from indifference, the wall pair, entropy counts or symmetry are recorded on the problem. Flag: the stored CPT
    conjugation fixes every conformal generator and is antilinear, so it reverses the energy.'
