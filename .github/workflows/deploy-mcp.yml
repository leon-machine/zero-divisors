name: deploy-mcp
# Builds the MCP server's image from the repository's Dockerfile and deploys it, with its
# Worker, to Cloudflare Containers at mcp.zerodivisors.org (deploy/mcp, docs/HOSTING.md).
# Runs when a release is published, so the endpoint serves what was archived, and by hand
# (Actions > deploy-mcp > Run workflow). Needs two repository secrets: CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID. Pull requests never run it, so their code never sees the secrets.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-mcp
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # the release's tag when a release triggers it; the chosen branch when run by hand
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy the Worker and the container
        working-directory: deploy/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy
      - name: Check the endpoint answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 20 https://mcp.zerodivisors.org/health | grep -q ok; then echo "health: ok"; exit 0; fi
            sleep 10
          done
          echo "the endpoint did not answer /health within 5 minutes" >&2; exit 1
