name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml jsonschema
      # The toolkit, the governance settings and the accepted lock come from the
      # base branch, so a pull request cannot change the rules it is judged by.
      - name: Trusted toolkit and rules from the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          mkdir -p /tmp/base
          git archive "origin/${{ github.base_ref }}" tp lib tests | tar -x -C /tmp/base
          git show "origin/${{ github.base_ref }}:store/config.yaml" > /tmp/base/config.yaml
          git show "origin/${{ github.base_ref }}:store/.tp-lock.json" > /tmp/base/lock.json || echo '{}' > /tmp/base/lock.json
          # accepted review records: a pull request may add reviews, never change or remove one (E138)
          git show "origin/${{ github.base_ref }}:store/.tp-reviews-lock.json" > /tmp/base/reviews-lock.json || echo '{}' > /tmp/base/reviews-lock.json
          git archive "origin/${{ github.base_ref }}" store/orcid_keys | tar -x -C /tmp/base || true
          cp /tmp/base/config.yaml store/config.yaml
          cp /tmp/base/lock.json store/.tp-lock.json
          cp /tmp/base/reviews-lock.json store/.tp-reviews-lock.json
          # ORCID's keys come from the base branch too: a pull request cannot add a key of its own
          if [ -d /tmp/base/store/orcid_keys ]; then rm -rf store/orcid_keys && cp -r /tmp/base/store/orcid_keys store/; fi
          rm -rf tp lib && cp -r /tmp/base/tp /tmp/base/lib .
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Validate the store, layers 1-3, 5 and 6
        env:
          # the pull request's author; layer 6 maps it through governance.github_logins
          TP_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: python -m tp check --store store --layers 1,2,3,5,6 --keep-going
      # The ORCID iD of a person the pull request credits must belong to whoever opened it: the
      # public ORCID record lists their GitHub account (tp/orcid_link.py). It reads ORCID's public
      # API, so it runs here, outside the validator and the sealed container.
      - name: ORCID records link the pull request's account
        if: github.event_name == 'pull_request'
        env:
          TP_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python -m tp.orcid_link --store store --author "$TP_AUTHOR"
      # Layer 4 runs contributed check.py files and the series verify scripts (legacy/). It
      # always runs in full here: the layer-4 cache (store/.tp-layer4.json) comes from the
      # branch under test and is not trusted. It runs
      # in a container with no network, the repository mounted read-only and a
      # throwaway temporary folder, so a hostile check can neither reach out nor
      # change the tree. Each check runs in Python's isolated mode (-I), which ignores
      # PYTHONPATH, so the dependencies are also mounted as the interpreter's own
      # site-packages, where isolated mode still looks.
      - name: Evidence (layer 4) in an isolated container
        run: |
          pip install --quiet --target .ci-deps pyyaml jsonschema numpy scipy   # five legacy verify scripts use numpy/scipy
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,size=512m --tmpfs /cache:rw,size=256m \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/lab/.ci-deps \
            -v "$PWD/.ci-deps":/usr/local/lib/python3.11/site-packages:ro \
            -v "$PWD":/lab:ro -w /lab python:3.11-slim \
            python -m tp check --store store --layers 4 --keep-going --cache-dir /cache --full
      - name: Build
        run: python -m tp build --store store --no-mutants --layers 1-3
      - uses: actions/upload-artifact@v5
        with:
          name: build
          path: build/
