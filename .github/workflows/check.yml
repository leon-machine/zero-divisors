name: check
on:
  pull_request:
  push:
    branches: [main]
  # Actions > check > Run workflow: a full rerun of every machine check, ignoring the cache
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml jsonschema
      # The toolkit, the governance settings and the accepted lock come from the
      # base branch, so a pull request cannot change the rules it is judged by.
      - name: Trusted toolkit and rules from the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          mkdir -p /tmp/base
          git archive "origin/${{ github.base_ref }}" tp lib tests | tar -x -C /tmp/base
          git show "origin/${{ github.base_ref }}:store/config.yaml" > /tmp/base/config.yaml
          git show "origin/${{ github.base_ref }}:store/.tp-lock.json" > /tmp/base/lock.json || echo '{}' > /tmp/base/lock.json
          # accepted review records: a pull request may add reviews, never change or remove one (E138)
          git show "origin/${{ github.base_ref }}:store/.tp-reviews-lock.json" > /tmp/base/reviews-lock.json || echo '{}' > /tmp/base/reviews-lock.json
          git archive "origin/${{ github.base_ref }}" store/orcid_keys | tar -x -C /tmp/base || true
          cp /tmp/base/config.yaml store/config.yaml
          cp /tmp/base/lock.json store/.tp-lock.json
          cp /tmp/base/reviews-lock.json store/.tp-reviews-lock.json
          # ORCID's keys come from the base branch too: a pull request cannot add a key of its own
          if [ -d /tmp/base/store/orcid_keys ]; then rm -rf store/orcid_keys && cp -r /tmp/base/store/orcid_keys store/; fi
          # the repository owner's own pull requests keep their own toolkit, so a change to the
          # toolkit is tested in its own run; anyone else's runs with the base branch's (and the
          # guard workflow refuses their changes to tp/ and lib/ in any case)
          if [ "${{ github.event.pull_request.author_association }}" != "OWNER" ]; then
            rm -rf tp lib && cp -r /tmp/base/tp /tmp/base/lib .
          fi
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Validate the store, layers 1-3, 5 and 6
        env:
          # the pull request's author; layer 6 maps it through governance.github_logins
          TP_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: python -m tp check --store store --layers 1,2,3,5,6 --keep-going
      # The ORCID iD of a person the pull request credits must belong to whoever opened it: the
      # public ORCID record lists their GitHub account (tp/orcid_link.py). It reads ORCID's public
      # API, so it runs here, outside the validator and the sealed container.
      - name: ORCID records link the pull request's account
        if: github.event_name == 'pull_request'
        env:
          TP_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python -m tp.orcid_link --store store --author "$TP_AUTHOR"
      # Layer 4 runs contributed check.py files and the series verify scripts (legacy/) in a
      # container with no network, the repository mounted read-only and a throwaway temporary
      # folder, so a hostile check can neither reach out nor change the tree. Each check runs
      # in Python's isolated mode (-I), which ignores PYTHONPATH, so the dependencies are also
      # mounted as the interpreter's own site-packages, where isolated mode still looks.
      #
      # Results are reused only from runs on main. Each record is keyed by everything its
      # outcome depends on (the check, the result and its premises, the lib modules, the
      # toolkit, the Python version), so only what a pull request changes runs again. The
      # cache comes from GitHub's cache, saved by the run on main after each merge. A cache
      # saved in a pull request is visible only to that pull request, so a pull request
      # cannot plant results for main or for anyone else. The record committed in the
      # repository (store/.tp-layer4.json) is not used here. On pull requests the mutation
      # test (each check rerun with its numbers altered, to show it can fail) runs only for
      # results the pull request adds or changes; runs on main and manual runs test them all.
      # Each check run has 180 seconds (TP_CHECK_TIMEOUT overrides). A manual run (Run workflow) or a
      # run with no cache yet reruns everything.
      - name: Layer-4 results from main's last run
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/l4
          key: layer4-main-${{ github.sha }}
          restore-keys: layer4-main-
      - name: Evidence (layer 4) in an isolated container
        env:
          TP_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # on pull requests, only new and changed results are mutation-tested (TP_MUTANTS)
          TP_MUTANTS: ${{ github.event_name == 'pull_request' && 'changed' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/l4/scripts"
          [ -f "$RUNNER_TEMP/l4/layer4.json" ] || echo '{}' > "$RUNNER_TEMP/l4/layer4.json"
          pip install --quiet --target .ci-deps pyyaml jsonschema numpy scipy   # five legacy verify scripts use numpy/scipy
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,size=512m \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/lab/.ci-deps \
            -e TP_L4_CACHE=/cache/layer4.json \
            ${TP_FULL:+-e TP_FULL=1} ${TP_MUTANTS:+-e TP_MUTANTS=$TP_MUTANTS} \
            -v "$PWD/.ci-deps":/usr/local/lib/python3.11/site-packages:ro \
            -v "$RUNNER_TEMP/l4":/cache:rw \
            -v "$PWD":/lab:ro -w /lab python:3.11-slim \
            python -m tp check --store store --layers 4 --keep-going --cache-dir /cache/scripts
      - name: Keep layer-4 results for later runs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/l4
          key: layer4-main-${{ github.sha }}
      - name: Build
        run: python -m tp build --store store --no-mutants --layers 1-3
      - uses: actions/upload-artifact@v5
        with:
          name: build
          path: build/
